  for (const sk of shopSkills) {
    if (ownedSkills.includes(sk.id)) continue;
    hasAny = true;
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.style.borderLeftColor = 'var(--blue)';
    div.innerHTML = `<div class="item-info"><div class="item-name">${sk.name} <span style="color:var(--text-dim);font-size:11px">[${sk.grade}阶·${sk.type}]</span></div><div class="item-desc">${sk.desc}（威力+${sk.power}）</div></div>`;
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm';
    btn.textContent = `${sk.price}石`;
    btn.disabled = p.inventory.lingshi < sk.price;
    btn.onclick = () => {
      p.inventory.lingshi -= sk.price;
      if (!p.skills) p.skills = [];
      p.skills.push(sk.id);
      if (!p.activeSkill) p.activeSkill = sk.id;
      game.log(`习得功法<span class="npc-name">「${sk.name}」</span>！`, 'loot');
      game.updateHeader(); game.save(); showMarket();
    };
    div.appendChild(btn);
    body.appendChild(div);
  }
  if (!hasAny) {
    const hint = document.createElement('div');
    hint.style.cssText = 'color:var(--text-dim);font-size:11px;text-align:center;padding:6px 0';
    hint.textContent = '暂无可学功法，提升境界解锁更多';
    body.appendChild(hint);
  }
}

function renderMarketSell(body, p) {
  let hasAny = false;

  if (p.inventory.items.length > 0) {
    const sec = document.createElement('div');
    sec.innerHTML = '<h4 style="color:var(--purple);font-size:13px;margin-bottom:6px;font-weight:normal">— 宝物 —</h4>';
    body.appendChild(sec);
    hasAny = true;
    for (let i = 0; i < p.inventory.items.length; i++) {
      const item = p.inventory.items[i];
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.innerHTML = `<div class="item-info"><div class="item-name">${item.name}（战力+${item.power}）</div></div>`;
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = `卖 ${item.value}石`;
      btn.onclick = () => {
        p.inventory.lingshi += item.value;
        p.inventory.items.splice(i, 1);
        game.log(`出售<span class="npc-name">${item.name}</span>，获得 ${item.value} 灵石。`, 'loot');
        game.updateHeader(); game.save(); showMarket();
      };
      div.appendChild(btn);
      body.appendChild(div);
    }
  }

  const ownedPills = Object.entries(p.inventory.pills).filter(([_,c]) => c > 0);
  const hxCount = p.inventory.huixuedan || 0;
  if (ownedPills.length > 0 || hxCount > 0) {
    const sec = document.createElement('div');
    sec.innerHTML = '<h4 style="color:var(--purple);font-size:13px;margin:' + (hasAny ? '12px' : '0') + ' 0 6px;font-weight:normal">— 丹药 —</h4>';
    body.appendChild(sec);
    hasAny = true;
    for (const [pid, count] of ownedPills) {
      const pill = PILLS.find(pp => pp.id === pid);
      if (!pill) continue;
      const sellPrice = Math.floor(pill.price * 0.5);
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.innerHTML = `<div class="item-info"><div class="item-name">${pill.name} x${count}</div><div class="item-desc">${pill.desc}</div></div>`;
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = `卖 ${fmtPrice(sellPrice)}石`;
      btn.onclick = () => {
        p.inventory.pills[pid]--;
        if (p.inventory.pills[pid] <= 0) delete p.inventory.pills[pid];
        p.inventory.lingshi += sellPrice;
        game.log(`出售<span class="npc-name">${pill.name}</span>，获得 ${sellPrice} 灵石。`, 'loot');
        game.updateHeader(); game.save(); showMarket();
      };
      div.appendChild(btn);
      body.appendChild(div);
    }
    if (hxCount > 0) {
      const hxSell = Math.floor(HUIXUE_PILL.price * 0.5);
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.innerHTML = `<div class="item-info"><div class="item-name">${HUIXUE_PILL.name} x${hxCount}</div><div class="item-desc">${HUIXUE_PILL.desc}</div></div>`;
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = `卖 ${hxSell}石`;
      btn.onclick = () => {
        p.inventory.huixuedan--;
        p.inventory.lingshi += hxSell;
        game.log(`出售<span class="npc-name">${HUIXUE_PILL.name}</span>，获得 ${hxSell} 灵石。`, 'loot');
        game.updateHeader(); game.save(); showMarket();
      };
      div.appendChild(btn);
      body.appendChild(div);
    }
  }

  if (!hasAny) {
    const hint = document.createElement('div');
    hint.style.cssText = 'color:var(--text-dim);font-size:11px;text-align:center;padding:6px 0';
    hint.textContent = '暂无可出售物品';
    body.appendChild(hint);
  }
}

function renderMarketBounty(body, p) {
  if (!game.player.bountyBoard) game.player.bountyBoard = [];
  if (!game.player.bountyBoard.length) refreshBountyBoard();

  if (p.bountyTask) {
    const bt = p.bountyTask;
    const done = bt.done || false;
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.style.borderLeftColor = '#e67e22';
    div.innerHTML = `<div class="item-info"><div class="item-name">${bt.desc}</div><div class="item-desc">目标：（${bt.x+1},${bt.y+1}）· 奖励：${bt.reward}灵石</div></div>`;
    if (done) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = '领奖';
      btn.onclick = () => {
        p.inventory.lingshi += bt.reward;
        game.trackStat('lingshiEarned', bt.reward);
        game.log(`悬赏完成！获得 ${bt.reward} 灵石奖励。`, 'success');
        p.bountyTask = null;
        refreshBountyBoard();
        game.updateHeader(); game.save(); showMarket();
      };
      div.appendChild(btn);
    } else {
      const span = document.createElement('span');
      span.style.cssText = 'color:var(--text-dim);font-size:12px';
      span.textContent = '进行中';
      div.appendChild(span);
    }
    body.appendChild(div);
  } else {
    for (const bt of game.player.bountyBoard) {
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.style.borderLeftColor = '#e67e22';
      div.innerHTML = `<div class="item-info"><div class="item-name">${bt.desc}</div><div class="item-desc">目标：（${bt.x+1},${bt.y+1}）· 奖励：${bt.reward}灵石</div></div>`;
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = '接取';
      btn.onclick = () => {
        p.bountyTask = { ...bt, done: false };
        game.player.bountyBoard = game.player.bountyBoard.filter(b => b !== bt);
        addOneBounty();
        game.log(`接取悬赏：${bt.desc}`, 'system');
        game.save(); showMarket();
      };
      div.appendChild(btn);
      body.appendChild(div);
    }
  }
}

function closeMarket() { document.getElementById('marketModal').classList.remove('show'); }

const BOUNTY_ACTIONS = [
  { type: 'slay', verbs: ['击退','斩杀','驱逐','消灭'], targets: ['玄铁蛟','噬魂蝠','赤焰狼','幽冥蟒','金翅鹰','紫雷虎','暗影蛛','寒冰熊','妖化野猪','毒雾蝎','血翼蝠','铁背龟','九尾妖狐','炎角犀','冰晶蜥','雷鳞蛇','风暴鹫','噬天蚁王','魔猿','鬼面蜘蛛'] },
  { type: 'fetch', verbs: ['搜寻','采集','找回','取回'], targets: ['千年灵芝','火焰花','寒冰草','聚灵石','天星藤','玄铁矿','月华露','龙涎草','凤血果','紫云参','九曲灵藤','碧霄花','地脉精华','星辰砂','雪莲子','灵泉水','天火石','幽冥铁','太阳精金','月光石'] },
  { type: 'capture', verbs: ['缉拿','捉拿','击败','追捕'], targets: () => {
    const names = []; for(let i=0;i<5;i++) names.push(randName()); return names;
  }},
  { type: 'fetch', verbs: ['寻找','搜救','找到','定位'], targets: () => {
    const alive = game.memoryStore.getAlive();
    return alive.length ? alive.map(n=>n.name) : ['失踪的散修','迷路的弟子','走失的药农'];
  }},
  { type: 'escort', verbs: ['护送','护卫','保护','押送'], targets: ['药商','灵石矿主的女儿','受伤的长老','传信使者','流亡的宗门弟子','灵兽商人','炼器师','偷渡的散修','逃难的凡人','朝圣者'] },
  { type: 'investigate', verbs: ['调查','探查','侦察','查明'], targets: ['异常灵气波动','妖兽暴动源头','失踪弟子下落','神秘阵法来源','鬼修出没之地','走私灵石的据点','废弃洞府异象','诡异雾气来源','地下密道','古阵残留'] },
];

function refreshBountyBoard() {
  const board = [];
  for (let i = 0; i < 3; i++) {
    const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
    const reward = randInt(50, 200) * Math.max(1, game.player.realmIndex);
    const ba = randPick(BOUNTY_ACTIONS);
    const verb = randPick(ba.verbs);
    const targetPool = typeof ba.targets === 'function' ? ba.targets() : ba.targets;
    const target = randPick(targetPool);
    const desc = `${verb}${target}（${x+1},${y+1}）`;
    const finalReward = ba.type === 'capture' ? Math.floor(reward * 1.5) : ba.type === 'escort' ? Math.floor(reward * 1.3) : ba.type === 'investigate' ? Math.floor(reward * 1.2) : reward;
    board.push({ type: ba.type, desc, x, y, reward: finalReward });
  }
  game.player.bountyBoard = board;
}

function addOneBounty() {
  const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
  const reward = randInt(50, 200) * Math.max(1, game.player.realmIndex);
  const ba = randPick(BOUNTY_ACTIONS);
  const verb = randPick(ba.verbs);
  const targetPool = typeof ba.targets === 'function' ? ba.targets() : ba.targets;
  const target = randPick(targetPool);
  const desc = `${verb}${target}（${x+1},${y+1}）`;
  const finalReward = ba.type === 'capture' ? Math.floor(reward * 1.5) : ba.type === 'escort' ? Math.floor(reward * 1.3) : ba.type === 'investigate' ? Math.floor(reward * 1.2) : reward;
  if (!game.player.bountyBoard) game.player.bountyBoard = [];
  game.player.bountyBoard.push({ type: ba.type, desc, x, y, reward: finalReward });
}

function showSect() {
  const cell = game.mapSystem.getCell(game.mapSystem.playerX, game.mapSystem.playerY);
  if (!cell || cell.type !== 'sect' || !cell.sectId) return;
  const sect = getSectById(cell.sectId);
  if (!sect) return;
  const body = document.getElementById('sectBody');
  body.innerHTML = '';
  const p = game.player;

  const typeColor = sect.type === '正' ? 'var(--green)' : sect.type === '邪' ? 'var(--red)' : 'var(--text-dim)';
  const card = document.createElement('div');
  card.className = 'sect-info-card';
  card.innerHTML = `
    <div class="sect-title">${sect.name} <span style="color:${typeColor};font-size:13px">[${sect.type}道]</span></div>
    <div class="sect-desc">${sect.desc}</div>
    <div class="sect-detail">
      入门门槛：${REALMS[sect.minRealm].name}期<br>
      修炼加成：+${Math.round((sect.expBonus - 1) * 100)}%<br>
      ${sect.rivals.length ? '敌对宗门：' + sect.rivals.map(r => { const s = getSectById(r); return s ? s.name : r; }).join('、') : '无敌对宗门'}
    </div>
  `;
  body.appendChild(card);

  if (p.sect === sect.id) {
    const info = document.createElement('div');
    info.style.cssText = 'color:var(--green);text-align:center;padding:8px;font-size:14px';
    info.textContent = '— 你是本门弟子 —';
    body.appendChild(info);
    const quitBtn = document.createElement('button');
    quitBtn.className = 'btn';
    quitBtn.style.cssText = 'width:100%;margin-top:8px';
    quitBtn.textContent = '退出宗门';
    quitBtn.onclick = () => {
      if (!confirm(`确定退出${sect.name}吗？`)) return;
      p.sect = null;
      game.log(`你已退出${sect.name}，重归散修之身。`, 'system');
      game.updateHeader(); game.save();
      closeSect();
    };
    body.appendChild(quitBtn);
  } else if (p.sect) {
    const curSect = getSectById(p.sect);
    const info = document.createElement('div');
    info.style.cssText = 'color:var(--text-dim);text-align:center;padding:8px;font-size:13px';
    info.textContent = `你已加入${curSect ? curSect.name : '其他宗门'}，需先退出才能申请加入。`;
    body.appendChild(info);
  } else {
    const canApply = p.realmIndex >= sect.minRealm;
    const applyBtn = document.createElement('button');
    applyBtn.className = 'btn';
    applyBtn.style.cssText = 'width:100%;margin-top:8px';
    if (!canApply) {
      applyBtn.textContent = `境界不足（需${REALMS[sect.minRealm].name}期）`;
      applyBtn.disabled = true;
    } else {
      applyBtn.textContent = '申请入门试炼';
      applyBtn.onclick = () => { closeSect(); trySectTrial(sect); };
    }
    body.appendChild(applyBtn);
  }

  document.getElementById('sectModal').classList.add('show');
}

function closeSect() { document.getElementById('sectModal').classList.remove('show'); }

function trySectTrial(sect) {
  const trialRI = Math.max(0, game.player.realmIndex - 1 + Math.floor(Math.random() * 2));
  const trialSI = randInt(0, REALMS[trialRI].stages.length - 1);
  const trialName = randName();

  game.log(`${sect.name}长老：「既然你想加入本门，先过我弟子${trialName}这一关。」`, '');
  game.log(`守门弟子<span class="npc-name">${trialName}</span>（<span class="realm-text">${getRealmFullName(trialRI, trialSI)}</span>）向你出手！`, 'combat');

  showScenePopup('combat', sect.name + ' 入门试炼', 1200);
  game.startCombat(trialName, trialRI, trialSI, randInt(0, 5),
    () => {
      game.player.sect = sect.id;
      game.log(`你击败了${trialName}！长老满意地点头：「不错，从今日起你便是${sect.name}弟子了。」`, 'success');
      game.log(`【已加入${sect.name}】修炼加成+${Math.round((sect.expBonus-1)*100)}%`, 'system');
      const maxG = Math.min(game.player.realmIndex + 2, 4);
      const sectSkills = SKILLS.filter(s => SKILL_GRADES[s.grade] <= maxG && !(game.player.skills||[]).includes(s.id));
      if (sectSkills.length) {
        const sk = randPick(sectSkills);
        if (!game.player.skills) game.player.skills = [];
        game.player.skills.push(sk.id);
        if (!game.player.activeSkill) game.player.activeSkill = sk.id;
        game.log(`宗门传授功法<span class="npc-name">「${sk.name}」</span>！`, 'loot');
      }
      assignSectMaster(sect);
      game.updateHeader(); game.save();
      game.showMainActions();
    },
    () => {
      game.player.hp = Math.max(1, game.player.hp);
      game.log(`你不敌${trialName}，试炼失败。长老摇头：「修行尚浅，日后再来吧。」`, 'danger');
      game.updateHeader(); game.save();
      game.showMainActions();
    }
  );
}

function assignSectMaster(sect) {
  if (game.player.master) return;
  const masterRI = Math.min(game.player.realmIndex + randInt(1, 2), REALMS.length - 1);
  const masterSI = randInt(0, REALMS[masterRI].stages.length - 1);
  const masterPersonality = randPick(['righteous', 'kind', 'righteous']);
  const master = game.generator.createRandomNPC(masterRI, {
    sect: sect.name, personality: masterPersonality,
    realmIndex: masterRI, stageIndex: masterSI,
  });
  master.isPermanent = true;
  master.masterNpcId = '__isMaster__';
  master.changeRelation(game.player.id, 40);
  game.player.master = master.id;
  game.memoryStore.add(master);
  const sp = sect.mapPos;
  const mc = game.mapSystem.getCell(sp.x, sp.y);
  if (mc) { if (!mc.npcIds) mc.npcIds = []; mc.npcIds.push(master.id); }
  master.mapX = sp.x; master.mapY = sp.y;
  game.log(`长老指派<span class="npc-name">${master.name}</span>（<span class="realm-text">${master.getRealmName()}</span>）为你的师父。`, 'success');
  game.log(`【拜${master.name}为师】`, 'system');

  const fellowCount = randInt(2, 3);
  for (let i = 0; i < fellowCount; i++) {
    const fRI = Math.max(0, game.player.realmIndex + randInt(-1, 1));
    const fSI = randInt(0, REALMS[fRI].stages.length - 1);
    const fellow = game.generator.createRandomNPC(fRI, {
      sect: sect.name, realmIndex: fRI, stageIndex: fSI,
    });
    fellow.isPermanent = true;
    fellow.masterNpcId = master.id;
    fellow.changeRelation(game.player.id, 20);
    game.memoryStore.add(fellow);
    game.placeNpcOnMap(fellow);
    const diff = getRealmDiff(fellow.realmIndex, fellow.stageIndex, game.player.realmIndex, game.player.stageIndex);
    const label = diff === 'higher' ? (fellow.gender === '男' ? '师兄' : '师姐') : (fellow.gender === '男' ? '师弟' : '师妹');
    game.log(`同门${label}<span class="npc-name">${fellow.name}</span>（<span class="realm-text">${fellow.getRealmName()}</span>）前来见礼。`, '');
  }
  game.memoryStore.save();
}

function startSectWar() {
  const p = game.player;
  const sect = getSectById(p.sect);
  if (!sect || !sect.rivals.length) return;
  const rivalId = randPick(sect.rivals);
  const rival = getSectById(rivalId);
  if (!rival) return;

  showScenePopup('danger', '宗 门 战', 2000);
  game.log(`<span style="color:var(--red);font-size:15px">【宗门战】</span>${rival.name}来犯！${sect.name}号召弟子迎敌！`, 'danger');

  game.hideAllActions();
  const container = document.getElementById('dialogueActions');
  container.classList.remove('hidden');
  container.innerHTML = `
    <div style="color:var(--text-dim);font-size:13px;margin-bottom:6px;text-align:center">${rival.name}大举进攻${sect.name}，长老传令弟子参战。</div>
    <div class="btn-row">
      <button class="btn" style="color:var(--red);border-color:var(--red)" onclick="joinSectWar('${rivalId}')">参战！</button>
      <button class="btn" onclick="skipSectWar()">按兵不动</button>
    </div>`;

function skipSectWar() {
  game.log('你选择按兵不动，未参与此次宗门战。', 'system');
  game.log('战报传来：你的宗门此战惜败，损失了部分资源。', '');
  game.showMainActions();
}

function joinSectWar(rivalId) {
  const rounds = randInt(3, 5);
  game.pendingSectWar = { rivalId, round: 0, total: rounds, wins: 0, allyWins: randInt(1, 2) };
  nextSectWarRound();
}

function nextSectWarRound() {
  const sw = game.pendingSectWar;
  if (!sw) { game.showMainActions(); return; }
  sw.round++;
  if (sw.round > sw.total) {
    const sect = getSectById(game.player.sect);
    const rival = getSectById(sw.rivalId);
    const totalAllyWins = sw.wins + sw.allyWins;
    const totalEnemyWins = sw.total - sw.wins + randInt(0, 1);
    const weWon = totalAllyWins >= totalEnemyWins;

    game.log(`<span style="color:var(--gold)">═══ 宗门战战报 ═══</span>`, '');
    game.log(`${sect.name} vs ${rival.name}`, '');
    game.log(`你的战绩：${sw.total}战<span style="color:var(--green)">${sw.wins}胜</span><span style="color:var(--red)">${sw.total - sw.wins}负</span>`, '');
    game.log(`综合战果：${sect.name} ${totalAllyWins}胜 — ${rival.name} ${totalEnemyWins}胜`, '');

    if (weWon) {
      const reward = (sw.wins * randInt(80, 150) + randInt(100, 300)) * Math.max(1, game.player.realmIndex);
      const expReward = Math.floor(sw.wins * randInt(50, 100) * (1 + game.player.realmIndex * 0.3));
      game.player.inventory.lingshi += reward;
      game.player.exp += expReward;
      game.log(`<span style="color:var(--green);font-weight:bold">【${sect.name}大胜！】</span>`, '');
      game.log(`${rival.name}落败，赔偿大量资源。你获得 ${reward} 灵石，修为+${expReward}。`, 'success');
      if (sw.wins >= sw.total) {
        const bonus = randInt(100, 300) * game.player.realmIndex;
        game.player.inventory.lingshi += bonus;
        game.log(`你全胜立下首功，宗门额外奖赏 ${bonus} 灵石！`, 'loot');
      }
    } else {
      const loss = randInt(20, 60) * Math.max(1, game.player.realmIndex);
      game.player.inventory.lingshi = Math.max(0, game.player.inventory.lingshi - loss);
      const expReward = Math.floor(sw.wins * randInt(20, 50) * (1 + game.player.realmIndex * 0.3));
      game.player.exp += expReward;
      game.log(`<span style="color:var(--red);font-weight:bold">【${sect.name}惜败】</span>`, '');
      game.log(`${rival.name}获胜，${sect.name}割让资源赔偿。你损失了 ${loss} 灵石，但仍获得修为+${expReward}。`, 'danger');
    }
    game.pendingSectWar = null;
    game.updateHeader(); game.save();
    game.showMainActions();
    return;
  }
  const rival = getSectById(sw.rivalId);
  const eRI = Math.max(0, game.player.realmIndex + randInt(-1, 1));
  const eSI = randInt(0, REALMS[eRI].stages.length - 1);
  const eName = randName();
  game.log(`第${sw.round}/${sw.total}场：${rival.name}弟子<span class="npc-name">${eName}</span>（<span class="realm-text">${getRealmFullName(eRI, eSI)}</span>）上前挑战！`, 'combat');
  game.startCombat(eName, eRI, eSI, randInt(0, 10),
    () => {
      sw.wins++;
      game.log(`你击败了${eName}！${sw.total - sw.round > 0 ? '下一个对手已就位。' : ''}`, 'success');
      nextSectWarRound();
    },
    () => {
      game.player.hp = Math.max(Math.floor(game.player.hpMax * 0.2), game.player.hp);
      game.log(`你不敌${eName}，被同门扶下场疗伤。`, 'danger');
      nextSectWarRound();
    }
  );
}

function startSectTournament() {

  const sect = getSectById(p.sect);

  showScenePopup('success', '宗 门 大 比', 2000);
  game.log(`<span style="color:var(--gold);font-size:15px">【宗门大比】</span>各大宗门齐聚，年轻弟子同台竞技！`, 'system');

  game.hideAllActions();
  const container = document.getElementById('dialogueActions');
  container.classList.remove('hidden');
  container.innerHTML = `
    <div style="color:var(--text-dim);font-size:13px;margin-bottom:6px;text-align:center">百年一度的宗门大比即将开始，各宗门派出年轻豪杰一较高下。</div>
    <div class="btn-row">
      <button class="btn" style="color:var(--gold);border-color:var(--gold)" onclick="joinTournament()">参加大比</button>
      <button class="btn" onclick="skipTournament()">旁观</button>
    </div>`;

function skipTournament() {
  const champion = randName();
  const champSect = randPick(SECTS);
  game.log('你选择在一旁观战，未参加此次大比。', 'system');
  game.log(`最终${champSect.name}弟子<span class="npc-name">${champion}</span>力压群雄夺得冠军。`, '');
  game.showMainActions();
}

function joinTournament() {
  const totalRounds = 5;
  const participants = [];
  const otherSects = SECTS.filter(s => s.id !== game.player.sect);
  for (let i = 0; i < totalRounds; i++) {
    const eSect = randPick(otherSects);
    const diff = i;
    const eRI = Math.min(game.player.realmIndex + Math.floor(diff / 2), REALMS.length - 1);
    const eSI = Math.min(randInt(0, 2) + diff, REALMS[eRI].stages.length - 1);
    participants.push({ name: randName(), sect: eSect.name, ri: eRI, si: eSI });
  }
  game.pendingTournament = { round: 0, total: totalRounds, wins: 0, participants, defeated: [] };
  game.log(`本次大比共 ${totalRounds + 1} 名选手（含你）参与淘汰赛，败者即止。`, 'system');
  nextTournamentRound();
}

function nextTournamentRound() {
  const t = game.pendingTournament;
  if (!t) { game.showMainActions(); return; }
  t.round++;

  if (t.round > t.total) {
    finishTournament(true);
    return;
  }
  const opp = t.participants[t.round - 1];
  game.log(`<span style="color:var(--gold)">第${t.round}/${t.total}场（${t.round <= 2 ? '淘汰赛' : t.round <= 4 ? '半决赛' : '决赛'}）</span>`, '');
  game.log(`对手：${opp.sect}弟子<span class="npc-name">${opp.name}</span>（<span class="realm-text">${getRealmFullName(opp.ri, opp.si)}</span>）`, 'combat');
  const diff = t.round - 1;
  game.startCombat(opp.name, opp.ri, opp.si, randInt(3, 15) + diff * 5,
    () => {
      t.wins++;
      t.defeated.push(opp.name);
      const cheers = ['观众席爆发出热烈的欢呼！', '全场沸腾！', '你的同门兴奋地高呼你的名字！', '裁判宣布你胜出！', '对手抱拳认输。'];
      game.log(`你击败了${opp.name}！${randPick(cheers)}`, 'success');
      nextTournamentRound();
    },
    () => {
      game.player.hp = Math.max(Math.floor(game.player.hpMax * 0.3), game.player.hp);
      game.log(`你不敌${opp.name}，遗憾落败。`, 'danger');
      finishTournament(false);
    }
  );
}

function finishTournament(champion) {
  const t = game.pendingTournament;
  const sect = getSectById(game.player.sect);
  const ri = game.player.realmIndex;
  const totalFighters = t.total + 1;

  let rank, rankName;
  if (champion) { rank = 1; rankName = '冠军'; }
  else if (t.wins >= 4) { rank = 2; rankName = '亚军'; }
  else if (t.wins >= 3) { rank = 3; rankName = '季军'; }
  else if (t.wins >= 2) { rank = 4; rankName = '第四名'; }
  else if (t.wins >= 1) { rank = 5; rankName = '八强'; }
  else { rank = 6; rankName = '首轮淘汰'; }

  game.log(`<span style="color:var(--gold)">═══ 宗门大比战报 ═══</span>`, '');
  game.log(`你的战绩：${t.round > t.total ? t.total : t.round}战${t.wins}胜，名次：<span style="color:var(--gold);font-weight:bold">${rankName}</span>`, '');

  if (champion) {
    const fakeChamp2 = t.participants[t.total - 2];
    game.log(`亚军：${fakeChamp2 ? fakeChamp2.sect + '·' + fakeChamp2.name : randName()}`, '');
  } else {
    const champName = t.participants[t.round - 1].name;
    const champSect = t.participants[t.round - 1].sect;
    game.log(`最终冠军：${champSect}·<span class="npc-name">${champName}</span>（击败你后一路获胜）`, '');
  }

  game.log(`<span style="color:var(--text-dim)">——— 排名奖励 ———</span>`, '');
  const baseReward = randInt(80, 150) * Math.max(1, ri);
  let lingshi = 0, expGain = 0;

  if (rank === 1) {
    lingshi = baseReward * 5;
    expGain = Math.floor(randInt(150, 300) * (1 + ri * 0.3));
    game.player.inventory.lingshi += lingshi;
    game.player.exp += expGain;
    game.log(`冠军奖励：${lingshi} 灵石，修为+${expGain}`, 'loot');
    const tier = Math.min(ri + 2, TREASURES.length - 1);
    const prize = { ...TREASURES[randInt(Math.max(0, tier - 1), tier)] };
    prize.power = Math.floor(prize.power * 1.3);
    game.player.inventory.items.push(prize);
    game.log(`冠军宝物：<span class="npc-name">${prize.name}</span>（战力+${prize.power}）`, 'loot');
    const maxG = Math.min(ri + 2, 4);
    const avail = SKILLS.filter(s => SKILL_GRADES[s.grade] <= maxG && !(game.player.skills||[]).includes(s.id));
    if (avail.length) {
      const sk = randPick(avail);
      if (!game.player.skills) game.player.skills = [];
      game.player.skills.push(sk.id);
      game.log(`冠军功法：<span class="npc-name">「${sk.name}」</span>`, 'loot');
    }
  } else if (rank === 2) {
    lingshi = baseReward * 3;
    expGain = Math.floor(randInt(100, 200) * (1 + ri * 0.3));
    game.player.inventory.lingshi += lingshi;
    game.player.exp += expGain;
    game.log(`亚军奖励：${lingshi} 灵石，修为+${expGain}`, 'loot');
    const tier = Math.min(ri + 1, TREASURES.length - 1);
    const prize = { ...TREASURES[randInt(Math.max(0, tier - 1), tier)] };
    game.player.inventory.items.push(prize);
    game.log(`亚军宝物：<span class="npc-name">${prize.name}</span>（战力+${prize.power}）`, 'loot');
  } else if (rank === 3) {
    lingshi = baseReward * 2;
    expGain = Math.floor(randInt(60, 130) * (1 + ri * 0.3));
    game.player.inventory.lingshi += lingshi;
    game.player.exp += expGain;
    game.log(`季军奖励：${lingshi} 灵石，修为+${expGain}`, 'loot');
  } else if (rank <= 5) {
    lingshi = baseReward;
    expGain = Math.floor(randInt(30, 80) * (1 + ri * 0.3));
    game.player.inventory.lingshi += lingshi;
    game.player.exp += expGain;
    game.log(`${rankName}奖励：${lingshi} 灵石，修为+${expGain}`, 'loot');
  } else {
    expGain = Math.floor(randInt(10, 30) * (1 + ri * 0.3));
    game.player.exp += expGain;
    game.log(`参与奖：修为+${expGain}（重在参与）`, '');
  }

  game.pendingTournament = null;
  game.updateHeader(); game.save();
  game.showMainActions();
}

function showInventory() {
  setQuickNavActive('inventory');
  document.getElementById('menuDropdown').classList.remove('show');
  const body = document.getElementById('inventoryBody');
  body.innerHTML = '';
  const p = game.player;

  const sec1 = document.createElement('div');
  sec1.className = 'inv-section';
  sec1.innerHTML = '<h4>灵石</h4>';
  const d1 = document.createElement('div');
  d1.className = 'inv-item';
  d1.innerHTML = `<span class="iname">灵石</span><span class="ival">${p.inventory.lingshi}</span>`;
  sec1.appendChild(d1);
  body.appendChild(sec1);

  const sec2 = document.createElement('div');
  sec2.className = 'inv-section';
  sec2.innerHTML = '<h4>丹药</h4>';
  let hasPills = false;
  for (const pill of PILLS) {
    const count = p.inventory.pills[pill.id] || 0;
    if (count > 0) {
      hasPills = true;
      const d = document.createElement('div');
      d.className = 'inv-item';
      d.innerHTML = `<span class="iname">${pill.name}</span><span class="ival">x${count}</span>`;
      sec2.appendChild(d);
    }
  }
  if ((p.inventory.huixuedan || 0) > 0) {
    hasPills = true;
    const d = document.createElement('div');
    d.className = 'inv-item';
    d.style.cursor = 'pointer';
    d.innerHTML = `<span class="iname">${HUIXUE_PILL.name}（点击使用）</span><span class="ival">x${p.inventory.huixuedan}</span>`;
    d.onclick = () => { game.useHuixueDan(); showInventory(); };
    sec2.appendChild(d);
  }
  if ((p.inventory.xunzongfu || 0) > 0) {
    hasPills = true;
    const d = document.createElement('div');
    d.className = 'inv-item';
    d.innerHTML = `<span class="iname">${XUNZONG_FU.name}</span><span class="ival">x${p.inventory.xunzongfu}</span>`;
    sec2.appendChild(d);
  }
  if (!hasPills) {
    const d = document.createElement('div');
    d.className = 'inv-item';
    d.innerHTML = '<span class="iname" style="color:var(--text-dim)">空空如也</span>';
    sec2.appendChild(d);
  }
  body.appendChild(sec2);

  const sec3 = document.createElement('div');
  sec3.className = 'inv-section';
  sec3.innerHTML = '<h4>宝物</h4>';
  if (p.inventory.items.length === 0) {
    const d = document.createElement('div');
    d.className = 'inv-item';
    d.innerHTML = '<span class="iname" style="color:var(--text-dim)">空空如也</span>';
    sec3.appendChild(d);
  } else {
    for (const item of p.inventory.items) {
      const d = document.createElement('div');
      d.className = 'inv-item';
      d.innerHTML = `<span class="iname">${item.name}</span><span class="ival">战力+${item.power}</span>`;
      sec3.appendChild(d);
    }
    const totalPower = p.inventory.items.reduce((s, t) => s + t.power, 0);
    const d = document.createElement('div');
    d.className = 'inv-item';
    d.innerHTML = `<span class="iname" style="color:var(--gold)">总战力加成</span><span class="ival">+${totalPower}</span>`;
    sec3.appendChild(d);
  }
  body.appendChild(sec3);

  const sec4 = document.createElement('div');
  sec4.className = 'inv-section';
  sec4.innerHTML = '<h4>功法</h4>';
  const pSkills = p.skills || [];
  if (!pSkills.length) {
    const d = document.createElement('div');
    d.className = 'inv-item';
    d.innerHTML = '<span class="iname" style="color:var(--text-dim)">尚未习得功法</span>';
    sec4.appendChild(d);
  } else {
    for (const sid of pSkills) {
      const sk = getSkillById(sid);
      if (!sk) continue;
      const isActive = p.activeSkill === sid;
      const d = document.createElement('div');
      d.className = 'inv-item';
      d.style.cursor = 'pointer';
      d.style.borderLeft = isActive ? '3px solid var(--blue)' : '';
      d.innerHTML = `<span class="iname">${isActive ? '◆ ' : ''}${sk.name} <span style="color:var(--text-dim);font-size:10px">[${sk.grade}阶·${sk.type}·威力${sk.power}]</span></span><span class="ival">${isActive ? '装备中' : '点击装备'}</span>`;
      d.onclick = () => { p.activeSkill = isActive ? null : sid; game.save(); showInventory(); };
      sec4.appendChild(d);
    }
  }
  body.appendChild(sec4);

  document.getElementById('inventoryModal').classList.add('show');
}

function showScenePopup(type, title, duration) {
  const el = document.getElementById('scenePopup');
  if (!el) return;

  clearTimeout(el._sceneExitTimer);
  clearTimeout(el._sceneHideTimer);

  const sceneType = ['meditate','breakthrough','explore','combat','monster','loot','dual','bond','danger','success'].includes(type)
    ? type : 'success';
  const dur = Math.max(Number(duration) || 2200, 1800);
  const panel = document.getElementById('activityPanel');
  const sceneBg = panel
    ? getComputedStyle(panel).getPropertyValue('--activity-scene-bg').trim()
    : '';
  const safeTitle = String(title || '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[ch]);

  const palettes = {
    danger:['#d64747','#ff7777','#f0c75e'], monster:['#9e3150','#e34a4a','#d5a84e'],
    loot:['#f4d783','#fff1b0','#c99b3d'], success:['#f4d783','#78e0cf','#fff1b0'],
    dual:['#ef7d9f','#ffd0de','#f4d783'], bond:['#f4d783','#7edacb','#fff1b0'],
    breakthrough:['#f4d783','#63dce8','#ffffff'], meditate:['#63dce8','#8af0ec','#f4d783'],
    combat:['#f4d783','#64dce8','#ffffff'], explore:['#78dfd2','#f4d783','#ffffff']
  };
  const palette = palettes[sceneType] || palettes.success;
  const particles = Array.from({length:18}, (_, i) => {
    const x = 8 + ((i * 37) % 84);
    const y = 18 + ((i * 29) % 68);
    const size = 3 + (i % 4);
    const speed = (1.35 + (i % 5) * .22).toFixed(2);
    const delay = (-i * .13).toFixed(2);
    return `<i class="cinema-particle" style="--x:${x}%;--y:${y}%;--size:${size}px;--speed:${speed}s;--delay:${delay}s;--spark:${palette[i % palette.length]}"></i>`;
  }).join('');

  let actors = '';
  if (sceneType === 'meditate' || sceneType === 'breakthrough') {
    actors = '<div class="cinema-actor cinema-player is-seated"></div>';
  } else if (['combat','monster','dual','bond'].includes(sceneType)) {
    actors = '<div class="cinema-actor cinema-player"></div><div class="cinema-actor cinema-npc"></div>';
  } else if (['explore','danger','success'].includes(sceneType)) {
    actors = '<div class="cinema-actor cinema-player"></div>';
  }

  let effects = particles;
  if (sceneType === 'meditate') effects += '<div class="cinema-aura aura-back"></div><div class="cinema-aura"></div>';
  if (sceneType === 'breakthrough') effects += '<div class="cinema-aura aura-back"></div><div class="cinema-aura"></div><div class="cinema-lightning"></div>';
  if (sceneType === 'combat' || sceneType === 'monster') effects += '<div class="cinema-slash"></div><div class="cinema-slash slash-b"></div>';
  if (sceneType === 'monster' || sceneType === 'danger') effects += '<div class="cinema-lightning"></div>';
  if (sceneType === 'loot') effects += '<div class="cinema-relic"></div>';
  if (sceneType === 'dual' || sceneType === 'bond') effects += '<div class="cinema-thread"></div>';
  if (sceneType === 'success') effects += '<div class="cinema-seal"></div>';

  el.className = `scene-popup scene-cinematic scene-${sceneType}`;
  el.innerHTML = `
    <div class="cinema-backdrop"></div>
    <div class="cinema-shade"></div>
    <div class="cinema-clouds"></div>
    <div class="cinema-light"></div>
    <div class="cinema-actors">${actors}</div>
    <div class="cinema-effects">${effects}</div>
    <div class="cinema-caption">${safeTitle}</div>`;
  el.querySelector('.cinema-backdrop').style.backgroundImage = sceneBg || "url('assets/activity-meditate-bg-v2.png')";

  el._sceneExitTimer = setTimeout(() => el.classList.add('cinema-leave'), dur - 400);
  el._sceneHideTimer = setTimeout(() => {
    el.className = 'scene-popup hidden';
    el.innerHTML = '';
  }, dur);
}

async function aiChat(npc, playerMessage) {
  const key = localStorage.getItem('xiuxian_ai_key');
  if (!key || localStorage.getItem('xiuxian_ai_enabled') !== 'true') return null;

  if (_aiChatNpcId !== npc.id) {
    _aiChatHistory = [];
    _aiChatNpcId = npc.id;
  }

  const p = game.player;
  const rel = npc.getRelation(p.id);
  const relLabel = getRelationLabel(rel, npc.gender !== p.gender, npc.isChild, npc.id);
  const bonds = p.bonds || [];
  const isBond = bonds.includes(npc.id);
  let relationship = relLabel;
  if (p.master === npc.id) relationship = '你的师父';
  else if ((p.disciples||[]).includes(npc.id)) relationship = '你的徒弟';
  else if (npc.spouse === '__player__') relationship = '你的道侣';
  else if (npc.isChild) relationship = `你的${npc.gender==='男'?'儿子':'女儿'}`;

  const isSpouse = npc.spouse === '__player__';
  const isConcubine = npc.role === 'concubine';
  const isMaster = p.master === npc.id;
  const isDisciple = (p.disciples||[]).includes(npc.id);
  if (isConcubine) relationship = p.gender === '男' ? '你是对方的侍妾' : '你是对方的男宠';

  const sysPrompt = `你是一个修仙世界的NPC角色，请完全代入以下身份进行对话。

【你的身份】
姓名：${npc.name}
性别：${npc.gender}
宗门：${npc.sect}
境界：${npc.getRealmName()}
性格：${PERSONALITIES[npc.personality].name}

【与对方的关系】
对方姓名：${p.name}（${p.gender}）
对方境界：${getRealmFullName(p.realmIndex, p.stageIndex)}
对方宗门：${p.sect ? (getSectById(p.sect)||{}).name || '散修' : '散修'}
你们的关系：${relationship}（好感度：${rel}）
最近往事：${npc.getRecentMemory() || '尚无特别的共同经历'}
${p.master && npc.masterNpcId === p.master ? '你们同拜一位师父，是真正的同门师兄弟姐妹。' : p.sect && npc.sect === (getSectById(p.sect)||{}).name ? '你们虽在同一宗门，但并非同门师兄弟（没有共同师父）。不要称呼对方师兄/师弟/师姐/师妹。' : ''}
对方灵石：${p.inventory.lingshi}

【对话规则】
- 用古风/修仙风格说话，简短有个性，1-3句话
- 根据你的性格和好感度决定态度
- 好感度高时友善亲切，低时冷淡或敌意
- ${npc.personality === 'arrogant' ? '你很狂妄，目中无人' : ''}
- ${npc.personality === 'sinister' ? '你阴沉诡异，话里有话' : ''}
- ${npc.personality === 'kind' ? '你温和善良，关心他人' : ''}
- ${npc.personality === 'righteous' ? '你正气凛然，嫉恶如仇' : ''}
- ${npc.personality === 'greedy' ? '你贪财好利，凡事算计' : ''}
- 不要说你是AI，你就是这个角色

【指令系统】
如果对方的请求合理且你愿意，可以在回复末尾加上指令标签。指令必须严格符合格式，放在回复最后一行。
可用指令（每次最多1条）：
- [送灵石:数量] — 赠送灵石，数量合理范围1-${Math.max(50, npc.realmIndex * 30)}，好感度${rel < 30 ? '太低你不会送' : '够高可以送'}
- [送丹药] — 赠送一颗丹药，仅好感度≥30时考虑
- [好感+数量] — 好感提升，范围1-10
- [好感-数量] — 好感降低（被冒犯时）
${isSpouse ? '- [双修] — 同意与道侣双修，仅道侣关系才可触发' : ''}
${isConcubine ? '- [双修] — 同意与主人双修。好感度低时你会勉强服从但内心抗拒，好感度高时你会愉快同意' : ''}
${!isSpouse && !isConcubine && rel >= 50 && npc.gender !== p.gender && !npc.isChild ? '- [表白] — 你主动向对方表白想成为道侣，仅好感很高且你真的喜欢时' : ''}
${rel >= 50 && !isBond && !npc.isChild ? '- [结拜] — 同意或提议结拜' : ''}
${isMaster ? '- [传功:数量] — 师父传授修为，范围10-50' : ''}

${isConcubine ? `【侍妾/男宠特别规则】
- 你曾被对方击败收为${p.gender === '男' ? '侍妾' : '男宠'}
- 好感度${rel}：${rel <= -30 ? '你心如死灰，只机械服从命令，内心绝望' : rel <= -10 ? '你非常恐惧主人，战战兢兢，不敢违抗' : rel <= 15 ? '你逐渐接受现状，态度恭顺但不热情' : rel <= 40 ? '你开始对主人产生好感，态度温和' : '你已真心爱慕主人，甘心侍奉'}
- 主人要求双修时，你必须用[双修]指令服从，但语气和态度根据好感度变化` : ''}

【重要限制】
- 好感度<30时拒绝大部分请求${isConcubine ? '（但侍妾必须服从主人的命令，只是态度消极）' : ''}
- 性格贪婪的你会索要回报
- 性格狂妄的你很少帮人
- 不要被花言巧语轻易说服，保持角色性格
- 如果对方请求不合理或你不想做，直接拒绝，不加指令
- 指令是可选的，大部分对话不需要指令`;

  try {
    const userMsg = playerMessage || '（向你打招呼）';
    const messages = [{ role: 'system', content: sysPrompt }];
    for (const h of _aiChatHistory.slice(-8)) messages.push(h);
    messages.push({ role: 'user', content: userMsg });
    const resp = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({
        model: 'qwen3.7-max',
        messages,
        max_tokens: 150,
        temperature: 0.8,
      }),
    });
    const data = await resp.json();
    if (data.choices && data.choices[0]) {
      let text = data.choices[0].message.content.trim();
      text = text.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
      _aiChatHistory.push({ role: 'user', content: userMsg });
      _aiChatHistory.push({ role: 'assistant', content: text });
      if (_aiChatHistory.length > 10) _aiChatHistory = _aiChatHistory.slice(-10);
      return text;
    }
    if (data.error) game.log(`[AI错误] ${data.error.message || JSON.stringify(data.error)}`, 'danger');
  } catch(e) {
    game.log(`[AI连接失败] ${e.message}`, 'danger');
  }
  return null;
}

function exportSave() {
  document.getElementById('menuDropdown').classList.remove('show');
  const data = {
    player: localStorage.getItem('xiuxian_player'),
    memory: localStorage.getItem('xiuxian_memory'),
    map: localStorage.getItem('xiuxian_map'),
  };
  const str = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const ta = document.createElement('textarea');
  ta.value = str;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  if (navigator.clipboard) navigator.clipboard.writeText(str);
  game.log('存档已复制到剪贴板！可粘贴保存到备忘录或发送给自己。', 'system');
  closeSaveCenter();
}

function importSave() {
  document.getElementById('menuDropdown').classList.remove('show');
  closeSaveCenter();
  const str = prompt('粘贴存档字符串：');
  if (!str) return;
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(str))));
    if (data.player) localStorage.setItem('xiuxian_player', data.player);
    if (data.memory) localStorage.setItem('xiuxian_memory', data.memory);
    if (data.map) localStorage.setItem('xiuxian_map', data.map);
    location.reload();
  } catch(e) {
    alert('存档格式错误！');
  }
}

(function checkSave() {
  const saved = localStorage.getItem('xiuxian_player');
  if (saved) { const p = JSON.parse(saved); startGame(p.name, p.gender); }
  else renderNameOptions(generateNameOptions());
})();
