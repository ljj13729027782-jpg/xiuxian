  const npcLower = getRealmDiff(npc.realmIndex, npc.stageIndex, game.player.realmIndex, game.player.stageIndex) === 'lower';
  if (!isMaster && !isDisciple && !game.player.master && npcHigher && rel >= 30 && !npc.isChild) btns += `<button class="btn btn-sm" style="border-color:var(--gold);color:var(--gold)" onclick="npcAction('${npcId}','apprentice')">拜师</button>`;
  if (!isMaster && !isDisciple && npcLower && rel >= 30 && !npc.isChild) btns += `<button class="btn btn-sm" style="border-color:var(--gold);color:var(--gold)" onclick="npcAction('${npcId}','recruit')">收徒</button>`;
  if (rel <= -30) btns += `<button class="btn btn-sm" style="border-color:var(--red);color:var(--red)" onclick="npcAction('${npcId}','hunt')">追杀</button>`;
  el.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${btns}</div>`;
}

function npcAction(npcId, action) {
  const npc = game.memoryStore.getById(npcId);
  if (!npc || !npc.isAlive) return;
  const p = game.player;

  if (action === 'locate') {
    if ((p.inventory.xunzongfu || 0) <= 0) {
      game.log('你没有寻踪符，无法定位。可在坊市购买或探索获得。', 'system');
      closeMemory(); return;
    }
    p.inventory.xunzongfu--;
    game.placeNpcOnMap(npc);
    npc.tempTurns = 3;
    let found = false;
    for (let y = 0; y < MAP_SIZE; y++)
      for (let x = 0; x < MAP_SIZE; x++)
        if ((game.mapSystem.grid[y][x].npcIds||[]).includes(npcId)) {
          game.log(`寻踪符燃起，你感应到${npc.name}在（${x+1},${y+1}）！（地图上停留3回合）`, 'system');
          found = true;
        }
    if (!found) game.log(`寻踪符失效，定位失败。`, 'system');
    game.mapSystem.save(); game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'askHelp') {
    if (npc.lastHelped) { game.log(`${npc.name}：「最近已经帮过你了，过段时间再来吧。」`, ''); closeMemory(); return; }
    const gift = Math.random() < 0.5;
    if (gift) {
      const amount = randInt(20, 60) * Math.max(1, npc.realmIndex);
      p.inventory.lingshi += amount;
      game.trackStat('lingshiEarned', amount);
      game.log(`${npc.name}慷慨赠你 ${amount} 灵石：「拿去用吧。」`, 'success');
    } else {
      const maxR = Math.min(npc.realmIndex + 1, 7);
      const avail = PILLS.filter(pp => pp.forRealm <= maxR);
      if (avail.length) {
        const dp = randPick(avail);
        p.inventory.pills[dp.id] = (p.inventory.pills[dp.id] || 0) + 1;
        game.log(`${npc.name}递给你一颗<span class="npc-name">${dp.name}</span>：「或许对你有用。」`, 'loot');
      } else {
        const amount = randInt(30, 80);
        p.inventory.lingshi += amount;
        game.log(`${npc.name}赠你 ${amount} 灵石。`, 'success');
      }
    }
    npc.lastHelped = true;
    game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'bond') {
    const rel = npc.getRelation(p.id);
    const acceptChance = Math.min(0.9, (rel - 30) / 60 + 0.3);
    if (Math.random() < acceptChance) {
      if (!p.bonds) p.bonds = [];
      p.bonds.push(npc.id);
      npc.changeRelation(p.id, 20);
      game.log(`${npc.name}欣然应允：「好！你我义结金兰，从此有福同享有难同当！」`, 'pink');
    } else {
      npc.changeRelation(p.id, -5);
      game.log(`${npc.name}婉拒了你：「承蒙厚爱，但在下觉得时机尚未成熟……」`, '');
    }
    game.memoryStore.save(); game.save();
    closeMemory();
  } else if (action === 'propose') {
    const rel = npc.getRelation(p.id);
    const acceptChance = Math.min(0.85, (rel - 40) / 50 + 0.2);
    if (Math.random() < acceptChance) {
      if (!p.bonds) p.bonds = [];
      p.bonds.push(npc.id);
      npc.changeRelation(p.id, 30);
      game.log(`${npc.name}双颊绯红：「你……你说的是真的吗？我……我愿意。」`, 'pink');
      game.log(`【${npc.name}成为你的道侣】`, 'pink');
    } else {
      npc.changeRelation(p.id, -3);
      game.log(`${npc.name}低头不语：「抱歉……我还没有做好准备。」`, '');
    }
    game.memoryStore.save(); game.save();
    closeMemory();
  } else if (action === 'dual') {
    showScenePopup('dual', '双 修', 2000);
    game.worldTick(1);
    if (game.isDead) { closeMemory(); return; }
    const baseExp = randInt(40, 100);
    const expGain = Math.floor(baseExp * (1 + p.realmIndex * 0.3));
    const hpGain = Math.floor(p.hpMax * 0.2);
    const lifeGain = randInt(2, 5);
    p.exp = Math.min(p.exp + expGain, REALMS[p.realmIndex].expPerStage);
    p.hp = Math.min(p.hpMax, p.hp + hpGain);
    p.lifeCurrent += lifeGain;
    npc.changeRelation(p.id, 15);
    const REMOTE_DUAL = [
      `你遥感${npc.name}的气息，二人虽相隔甚远，灵力却跨越空间交融。你仿佛听到${npc.name}在耳畔低语："想你了……"一股温暖涌遍全身。`,
      `你闭目凝神，与${npc.name}心意相通。对方的灵力如潮水般涌来，温柔而绵密。你感到${npc.name}的思念与爱意化作修为，令你境界大进。`,
      `冥冥之中，你与${npc.name}的神识交汇。${npc.name}的声音在脑海中响起："我在修炼时也总想着你……"阴阳灵力共振，你们的修为同时突破了一个小瓶颈。`,
    ];
    game.log(randPick(REMOTE_DUAL), 'pink');
    game.log(`修为+${expGain}，气血+${hpGain}，寿元+${lifeGain}。`, 'pink');
    game.memoryStore.save(); game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'sendGift') {
    const cost = randInt(30, 80) * Math.max(1, game.player.realmIndex);
    if (p.inventory.lingshi < cost) { game.log(`灵石不足（需${cost}）。`, 'system'); closeMemory(); return; }
    p.inventory.lingshi -= cost;
    npc.changeRelation(p.id, randInt(15, 25));
    game.log(`你向${npc.name}赠送了价值${cost}灵石的礼物，好感大增。`, 'success');
    game.memoryStore.save(); game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'teachSkill') {
    const pSkills = p.skills || [];
    if (!pSkills.length) { game.log('你尚未习得功法。', 'system'); closeMemory(); return; }
    closeMemory();
    game.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    let html = '<div style="color:var(--blue);font-size:13px;margin-bottom:6px">选择要传授的功法：</div>';
    for (const sid of pSkills) {
      const sk = getSkillById(sid);
      if (!sk) continue;
      html += `<button class="btn btn-reply" style="margin-bottom:4px;display:block;width:100%" onclick="game.doTeachSkill('${npcId}','${sid}')">${sk.name}（${sk.grade}阶·威力${sk.power}）</button>`;
    }
    html += `<button class="btn btn-reply" style="margin-top:4px;display:block;width:100%" onclick="game.showMainActions()">取消</button>`;
    container.innerHTML = html;
    game.inEncounter = true;
    return;
  } else if (action === 'apprentice') {
    const rel = npc.getRelation(p.id);
    const acceptChance = Math.min(0.8, (rel - 20) / 60 + 0.3);
    if (Math.random() < acceptChance) {
      p.master = npc.id;
      npc.changeRelation(p.id, 30);
      npc.masterNpcId = '__isMaster__';
      game.log(`你向${npc.name}行三跪九叩之礼。${npc.name}微笑颔首：「起来吧，从今往后你便是我的弟子。」`, 'success');
      game.log(`【拜${npc.name}为师】修炼时获得师父指点加成`, 'system');
      if (npc.sect && npc.sect !== '散修' && !p.sect) {
        const sectObj = getSectByName(npc.sect);
        if (sectObj) { p.sect = sectObj.id; game.log(`师父将你引入${npc.sect}门下。`, 'system'); }
      }
    } else {
      npc.changeRelation(p.id, -3);
      game.log(`${npc.name}摇了摇头：「你资质尚可，但缘分未到。日后再说吧。」`, '');
    }
    game.memoryStore.save(); game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'recruit') {
    const rel = npc.getRelation(p.id);
    const acceptChance = Math.min(0.85, (rel - 10) / 50 + 0.4);
    if (Math.random() < acceptChance) {
      if (!p.disciples) p.disciples = [];
      p.disciples.push(npc.id);
      npc.masterNpcId = '__player__';
      npc.changeRelation(p.id, 30);
      game.log(`${npc.name}恭敬地行了大礼：「多谢师父收留！弟子定当勤勉修行！」`, 'success');
      game.log(`【收${npc.name}为徒】`, 'system');
    } else {
      game.log(`${npc.name}犹豫了一下：「多谢前辈好意，但在下暂时不想拜师。」`, '');
    }
    game.memoryStore.save(); game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'hunt') {
    if ((p.inventory.xunzongfu || 0) <= 0) {
      game.log('你没有寻踪符，无法追踪仇人。可在坊市购买或探索获得。', 'system');
      closeMemory(); return;
    }
    p.inventory.xunzongfu--;
    game.placeNpcOnMap(npc);
    npc.tempTurns = 3;
    let found = false;
    for (let y = 0; y < MAP_SIZE; y++)
      for (let x = 0; x < MAP_SIZE; x++)
        if ((game.mapSystem.grid[y][x].npcIds||[]).includes(npcId)) {
          game.log(`寻踪符锁定仇人！${npc.name}在（${x+1},${y+1}）！前去了结恩怨吧！（3回合内有效）`, 'danger');
          found = true;
        }
    if (!found) game.log('寻踪符失效，定位失败。', 'system');
    game.mapSystem.save(); game.updateHeader(); game.save();
    closeMemory();
  }
}

function closeMemory() { document.getElementById('memoryModal').classList.remove('show'); }

function switchMemTab(tab) {
  document.getElementById('memoryBody').classList.toggle('hidden', tab !== 'list');
  document.getElementById('memoryGraph').classList.toggle('hidden', tab !== 'graph');
  document.getElementById('memTabList').style.borderColor = tab === 'list' ? 'var(--gold)' : '';
  document.getElementById('memTabGraph').style.borderColor = tab === 'graph' ? 'var(--gold)' : '';
  const modal = document.getElementById('memoryModal').querySelector('.modal');
  if (tab === 'graph') {
    modal.classList.add('graph-mode');
    requestAnimationFrame(() => { drawRelationGraph(); initGraphInteraction(); });
  } else {
    modal.classList.remove('graph-mode');
  }
}

const _graphState = { panX: 0, panY: 0, scale: 1, dragging: false, lastX: 0, lastY: 0, pinchDist: 0 };

function initGraphInteraction() {
  const vp = document.getElementById('memoryGraph');
  const canvas = document.getElementById('relationCanvas');
  const gs = _graphState;
  gs.scale = 0.6;
  gs.panX = (vp.clientWidth - canvas.width * gs.scale) / 2;
  gs.panY = (vp.clientHeight - canvas.height * gs.scale) / 2;
  applyGraphTransform();

  vp.onmousedown = (e) => { gs.dragging = true; gs.lastX = e.clientX; gs.lastY = e.clientY; };
  vp.onmousemove = (e) => { if (!gs.dragging) return; gs.panX += e.clientX - gs.lastX; gs.panY += e.clientY - gs.lastY; gs.lastX = e.clientX; gs.lastY = e.clientY; applyGraphTransform(); };
  vp.onmouseup = vp.onmouseleave = () => { gs.dragging = false; };

  vp.onwheel = (e) => { e.preventDefault(); const d = e.deltaY > 0 ? 0.9 : 1.1; gs.scale = Math.max(0.2, Math.min(3, gs.scale * d)); applyGraphTransform(); };

  vp.ontouchstart = (e) => {
    if (e.touches.length === 1) { gs.dragging = true; gs.lastX = e.touches[0].clientX; gs.lastY = e.touches[0].clientY; }
    else if (e.touches.length === 2) { gs.dragging = false; gs.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
  };
  vp.ontouchmove = (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && gs.dragging) { gs.panX += e.touches[0].clientX - gs.lastX; gs.panY += e.touches[0].clientY - gs.lastY; gs.lastX = e.touches[0].clientX; gs.lastY = e.touches[0].clientY; applyGraphTransform(); }
    else if (e.touches.length === 2) {
      const nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (gs.pinchDist > 0) { gs.scale = Math.max(0.2, Math.min(3, gs.scale * (nd / gs.pinchDist))); applyGraphTransform(); }
      gs.pinchDist = nd;
    }
  };
  vp.ontouchend = () => { gs.dragging = false; gs.pinchDist = 0; };
}

function applyGraphTransform() {
  const canvas = document.getElementById('relationCanvas');
  const gs = _graphState;
  canvas.style.transform = `translate(${gs.panX}px,${gs.panY}px) scale(${gs.scale})`;
}

function drawRelationGraph() {
  const canvas = document.getElementById('relationCanvas');
  const ctx = canvas.getContext('2d');
  const all = game.memoryStore.getAll().filter(n => n.isAlive || n.isPermanent);

  const p = game.player;
  const bonds = p.bonds || [], concubines = p.concubines || [], puppets = p.puppets || [];
  const usedIds = new Set();

  const masterNpc = p.master ? all.find(n => n.id === p.master) : null;
  const spouses = all.filter(n => n.spouse === '__player__');
  const concNpcs = all.filter(n => concubines.includes(n.id) && !spouses.find(s => s.id === n.id));
  const discipleNpcs = all.filter(n => (p.disciples || []).includes(n.id));
  const puppetNpcs = all.filter(n => puppets.includes(n.id));
  const bondNpcs = all.filter(n => bonds.includes(n.id) && !spouses.find(s => s.id === n.id)
    && !concubines.includes(n.id) && n.id !== p.master && !(p.disciples||[]).includes(n.id));

  if (masterNpc) usedIds.add(masterNpc.id);
  for (const s of spouses) usedIds.add(s.id);
  for (const c of concNpcs) usedIds.add(c.id);
  for (const d of discipleNpcs) usedIds.add(d.id);
  for (const pp of puppetNpcs) usedIds.add(pp.id);
  for (const b of bondNpcs) usedIds.add(b.id);

  const childrenOf = {};
  for (const n of all) {
    if (n.isChild || n.motherNpcId) {
      const parentId = n.motherNpcId || '__player__';
      if (!childrenOf[parentId]) childrenOf[parentId] = [];
      childrenOf[parentId].push(n);
      usedIds.add(n.id);
    }
  }

  const others = all.filter(n => !usedIds.has(n.id));
  const friends = others.filter(n => n.getRelation(p.id) >= 30);
  const enemies = others.filter(n => n.getRelation(p.id) <= -30);
  const neutrals = others.filter(n => { const r = n.getRelation(p.id); return r > -30 && r < 30; });

  const NR = 20, COLS = 4, CELL = 80;
  const nodes = [], edges = [], groupLabels = [];

  function mkNode(id, name, x, y, color, label, alive) {
    const n = { id, name, x, y, color: alive === false ? '#555' : color, r: id === 'player' ? 26 : NR, label: label || '', dead: alive === false };
    nodes.push(n); return n;
  }
  function mkEdge(a, b, color, label) { edges.push({ a, b, color, label: label || '' }); }

  const cx = 600, cy = 500;
  const pn = mkNode('player', p.name, cx, cy, '#d4a853', p.sect ? (getSectById(p.sect)||{}).name||'' : '', true);

  // === UPPER: master ===
  if (masterNpc) {
    const mn = mkNode(masterNpc.id, masterNpc.name, cx, cy - 130, '#d4a853', '师父', masterNpc.isAlive);
    mkEdge(pn, mn, '#d4a853', '师父');
  }

  // === RIGHT: spouses + concubines ===
  const familyList = [...spouses.map(s => ({ npc: s, type: 'spouse' })), ...concNpcs.map(c => ({ npc: c, type: 'conc' }))];
  for (let i = 0; i < familyList.length; i++) {
    const f = familyList[i];
    const fx = cx + 140 + i * 110;
    const fy = cy - 20 + i * 40;
    const label = f.type === 'spouse' ? '道侣' : (p.gender === '男' ? '侍妾' : '男宠');
    const color = f.type === 'spouse' ? '#e91e63' : '#e67e22';
    const fn = mkNode(f.npc.id, f.npc.name, fx, fy, color, label, f.npc.isAlive);
    mkEdge(pn, fn, color, label);
    const kids = childrenOf[f.npc.id] || [];
    for (let ki = 0; ki < kids.length; ki++) {
      const k = kids[ki];
      const kn = mkNode(k.id, k.name, fx + (ki - (kids.length - 1) / 2) * 70, fy + 80, '#e91e63', k.gender === '男' ? '子' : '女', k.isAlive);
      mkEdge(fn, kn, '#e91e63');
    }
  }
  const orphans = (childrenOf['__player__'] || []).filter(k => !nodes.find(n => n.id === k.id));
  for (let i = 0; i < orphans.length; i++) {
    const k = orphans[i];
    const kn = mkNode(k.id, k.name, cx + 140 + familyList.length * 110 + i * 70, cy + 60, '#e91e63', k.gender === '男' ? '子' : '女', k.isAlive);
    mkEdge(pn, kn, '#e91e63');
  }

  // === LEFT: bonds ===
  for (let i = 0; i < bondNpcs.length; i++) {
    const b = bondNpcs[i];
    const bn = mkNode(b.id, b.name, cx - 140 - i * 110, cy - 20 + i * 40, '#27ae60', '结拜', b.isAlive);
    mkEdge(pn, bn, '#27ae60', '结拜');
  }

  // === LOWER-LEFT: disciples ===
  for (let i = 0; i < discipleNpcs.length; i++) {
    const d = discipleNpcs[i];
    const dn = mkNode(d.id, d.name, cx - 100 - i * 90, cy + 130, '#d4a853', '徒弟', d.isAlive);
    mkEdge(pn, dn, '#d4a853', '徒弟');
  }

  // === LOWER-RIGHT: puppets ===
  for (let i = 0; i < puppetNpcs.length; i++) {
    const pp = puppetNpcs[i];
    const ppn = mkNode(pp.id, pp.name, cx + 100 + i * 90, cy + 130, '#9b59b6', '傀儡', pp.isAlive);
    mkEdge(pn, ppn, '#9b59b6', '傀儡');
  }

  // === OUTER: grid clusters for friends / enemies / neutrals ===
  function placeCluster(npcs, startX, startY, color, title, relFn) {
    if (!npcs.length) return;
    groupLabels.push({ text: title, x: startX, y: startY - 20, color: color });
    for (let i = 0; i < npcs.length; i++) {
      const col = i % COLS, row = Math.floor(i / COLS);
      const nx = startX + col * CELL;
      const ny = startY + row * CELL;
      const rel = relFn ? relFn(npcs[i]) : 0;
      const relStr = rel !== 0 ? `${rel >= 0 ? '+' : ''}${rel}` : '';
      const nn = mkNode(npcs[i].id, npcs[i].name, nx, ny, color, relStr, npcs[i].isAlive);
      mkEdge(pn, nn, color + '44');
    }
  }

  const innerBottom = cy + 130 + (discipleNpcs.length || puppetNpcs.length ? 80 : 0);
  const innerRight = cx + 140 + Math.max(familyList.length, 1) * 110 + 60;
  const innerLeft = cx - 140 - Math.max(bondNpcs.length, 0) * 110 - 60;
  const relFn = (n) => n.getRelation(p.id);

  placeCluster(friends, innerLeft - (friends.length > COLS ? COLS : friends.length) * CELL / 2, cy - 250, '#27ae60', '— 好友 —', relFn);
  placeCluster(enemies, innerRight, cy - 250, '#c0392b', '— 仇敌 —', relFn);
  placeCluster(neutrals, cx - (Math.min(neutrals.length, COLS)) * CELL / 2, innerBottom + 40, '#777', '— 泛泛之交 —', relFn);

  // === Compute canvas size ===
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of nodes) {
    minX = Math.min(minX, n.x - 60); maxX = Math.max(maxX, n.x + 60);
    minY = Math.min(minY, n.y - 60); maxY = Math.max(maxY, n.y + 60);
  }
  for (const gl of groupLabels) { minX = Math.min(minX, gl.x - 20); minY = Math.min(minY, gl.y - 10); }
  const pad = 40;
  const W = Math.max(800, maxX - minX + pad * 2);
  const H = Math.max(600, maxY - minY + pad * 2);
  const offX = -minX + pad, offY = -minY + pad;
  for (const n of nodes) { n.x += offX; n.y += offY; }
  for (const gl of groupLabels) { gl.x += offX; gl.y += offY; }
  canvas.width = W; canvas.height = H;
  ctx.clearRect(0, 0, W, H);

  // === Draw edges ===
  for (const e of edges) {
    ctx.beginPath();
    ctx.strokeStyle = e.color; ctx.lineWidth = 1.2;
    ctx.setLineDash([]);
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    ctx.moveTo(e.a.x + dx / dist * e.a.r, e.a.y + dy / dist * e.a.r);
    ctx.lineTo(e.b.x - dx / dist * e.b.r, e.b.y - dy / dist * e.b.r);
    ctx.stroke();
    if (e.label) {
      const mx = (e.a.x + e.b.x) / 2, my = (e.a.y + e.b.y) / 2;
      ctx.fillStyle = e.color; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(e.label, mx, my - 10);
    }
  }

  // === Draw group labels ===
  for (const gl of groupLabels) {
    ctx.fillStyle = gl.color; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(gl.text, gl.x + COLS * CELL / 2 - CELL / 2, gl.y);
  }

  // === Draw nodes ===
  for (const n of nodes) {
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = n.id === 'player' ? '#1a1510' : '#12121e';
    ctx.fill();
    ctx.strokeStyle = n.color; ctx.lineWidth = n.id === 'player' ? 3 : 2;
    ctx.stroke();

    if (n.id === 'player') {
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = '#d4a85344'; ctx.lineWidth = 1; ctx.stroke();
    }

    ctx.fillStyle = n.dead ? '#666' : n.color;
    ctx.font = `bold ${n.id === 'player' ? 14 : 11}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.name.length > 3 ? n.name.slice(0, 3) : n.name, n.x, n.y);

    if (n.label) {
      ctx.fillStyle = n.dead ? '#555' : '#9a8e7a';
      ctx.font = '10px sans-serif';
      ctx.fillText(n.label, n.x, n.y + n.r + 12);
    }

    if (n.dead) {
      ctx.strokeStyle = '#c0392b55'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(n.x - n.r, n.y); ctx.lineTo(n.x + n.r, n.y); ctx.stroke();
    }
  }

  const gs = _graphState;
  const vp = document.getElementById('memoryGraph');
  gs.panX = (vp.clientWidth - W * gs.scale) / 2;
  gs.panY = (vp.clientHeight - H * gs.scale) / 2;
  applyGraphTransform();
}

function showNpcHere() {
  const cell = game.mapSystem.getCell(game.mapSystem.playerX, game.mapSystem.playerY);
  if (!cell || !cell.npcIds || !cell.npcIds.length) return;
  const npcs = cell.npcIds.map(id => game.memoryStore.getById(id)).filter(n => n && n.isAlive);
  if (!npcs.length) return;
  if (npcs.length === 1) {
    talkToNpc(npcs[0]);
  } else {
    game.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    let html = '<div style="color:var(--text-dim);font-size:13px;margin-bottom:6px">此处有多人，选择交流对象：</div>';
    for (const npc of npcs) {
      html += `<button class="btn btn-reply" style="margin-bottom:6px;display:block;width:100%" onclick="talkToNpc(game.memoryStore.getById('${npc.id}'))">${npc.name}（${npc.sect}·${npc.getRealmName()}）</button>`;
    }
    container.innerHTML = html;
    game.inEncounter = true;
  }
}

function talkToNpc(npc) {
  if (!npc || !npc.isAlive) return;
  game.currentNPC = npc;
  const pName = PERSONALITIES[npc.personality].name;
  const rel = npc.getRelation(game.player.id);
  const relLabel = getRelationLabel(rel, npc.gender !== game.player.gender, npc.isChild, npc.id);
  game.log(`你上前与<span class="npc-name">${npc.name}</span>（${npc.gender}）搭话。`, '');
  game.log(`「${npc.sect}」· <span class="realm-text">${npc.getRealmName()}</span> · ${pName}（${relLabel}）`, '');
  const dialogue = game.dialogueEngine.getDialogue(npc, game.player);
  game.log(`<span class="npc-name">${npc.name}</span>：<span class="dialogue">"${dialogue}"</span>`);
  game.showDialogueOptions(npc);
}

// ===== 坊市 =====
let _marketTab = 'pill';

function fmtPrice(v) { return v >= 10000 ? (v/10000).toFixed(v%10000?1:0)+'万' : String(v); }

function showMarket(tab) {
  if (tab) _marketTab = tab;
  const body = document.getElementById('marketBody');
  body.innerHTML = '';
  const p = game.player;

  document.getElementById('marketLingshi').textContent = `灵石 ${p.inventory.lingshi}`;
  document.querySelectorAll('.market-tab').forEach(b => {
    b.style.borderColor = b.dataset.tab === _marketTab ? 'var(--gold)' : '';
  });

  if (_marketTab === 'pill') renderMarketPill(body, p);
  else if (_marketTab === 'skill') renderMarketSkill(body, p);
  else if (_marketTab === 'sell') renderMarketSell(body, p);
  else if (_marketTab === 'bounty') renderMarketBounty(body, p);

  document.getElementById('marketModal').classList.add('show');
}

function renderMarketPill(body, p) {
  const shopPills = PILLS.filter(pill => pill.forRealm <= p.realmIndex + 1);
  for (const pill of shopPills) {
    const div = document.createElement('div');
    div.className = 'shop-item';
    const owned = p.inventory.pills[pill.id] || 0;
    div.innerHTML = `<div class="item-info"><div class="item-name">${pill.name}${owned > 0 ? ` (已有${owned})` : ''}</div><div class="item-desc">${pill.desc}${pill.rarity >= 5 ? ' · 稀有' : ''}${pill.rarity >= 7 ? '!' : ''}</div></div>`;
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm';
    btn.textContent = `${fmtPrice(pill.price)}石`;
    btn.disabled = p.inventory.lingshi < pill.price;
    btn.onclick = () => {
      p.inventory.lingshi -= pill.price;
      p.inventory.pills[pill.id] = (p.inventory.pills[pill.id] || 0) + 1;
      game.log(`购买了<span class="npc-name">${pill.name}</span>，花费 ${pill.price} 灵石。`, 'loot');
      game.updateHeader(); game.save(); showMarket();
    };
    div.appendChild(btn);
    body.appendChild(div);
  }
  if (PILLS.length > shopPills.length) {
    const hint = document.createElement('div');
    hint.style.cssText = 'color:var(--text-dim);font-size:11px;text-align:center;padding:6px 0';
    hint.textContent = '更高阶丹药需提升境界后解锁';
    body.appendChild(hint);
  }

  const hxDiv = document.createElement('div');
  hxDiv.className = 'shop-item';
  const hxOwned = p.inventory.huixuedan || 0;
  hxDiv.innerHTML = `<div class="item-info"><div class="item-name">${HUIXUE_PILL.name}${hxOwned > 0 ? ` (已有${hxOwned})` : ''}</div><div class="item-desc">${HUIXUE_PILL.desc}</div></div>`;
  const hxBtn = document.createElement('button');
  hxBtn.className = 'btn btn-sm';
  hxBtn.textContent = `${HUIXUE_PILL.price}石`;
  hxBtn.disabled = p.inventory.lingshi < HUIXUE_PILL.price;
  hxBtn.onclick = () => {
    p.inventory.lingshi -= HUIXUE_PILL.price;
    p.inventory.huixuedan = (p.inventory.huixuedan || 0) + 1;
    game.log(`购买了<span class="npc-name">${HUIXUE_PILL.name}</span>，花费 ${HUIXUE_PILL.price} 灵石。`, 'loot');
    game.updateHeader(); game.save(); showMarket();
  };
  hxDiv.appendChild(hxBtn);
  body.appendChild(hxDiv);

  const xzDiv = document.createElement('div');
  xzDiv.className = 'shop-item';
  const xzOwned = p.inventory.xunzongfu || 0;
  xzDiv.innerHTML = `<div class="item-info"><div class="item-name">${XUNZONG_FU.name}${xzOwned > 0 ? ` (已有${xzOwned})` : ''}</div><div class="item-desc">${XUNZONG_FU.desc}</div></div>`;
  const xzBtn = document.createElement('button');
  xzBtn.className = 'btn btn-sm';
  xzBtn.textContent = `${XUNZONG_FU.price}石`;
  xzBtn.disabled = p.inventory.lingshi < XUNZONG_FU.price;
  xzBtn.onclick = () => {
    p.inventory.lingshi -= XUNZONG_FU.price;
    p.inventory.xunzongfu = (p.inventory.xunzongfu || 0) + 1;
    game.log(`购买了<span class="npc-name">${XUNZONG_FU.name}</span>，花费 ${XUNZONG_FU.price} 灵石。`, 'loot');
    game.updateHeader(); game.save(); showMarket();
  };
  xzDiv.appendChild(xzBtn);
  body.appendChild(xzDiv);

function renderMarketSkill(body, p) {
  const shopSkills = SKILLS.filter(s => s.price > 0 && s.minRealm <= p.realmIndex);
  const ownedSkills = p.skills || [];
  let hasAny = false;
  for (const sk of shopSkills) {
    if (ownedSkills.includes(sk.id)) continue;
    hasAny = true;
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.style.borderLeftColor = 'var(--blue)';
    div.innerHTML = `<div class="item-info"><div class="item-name">${sk.name} <span style="color:var(--text-dim);font-size:11px">[${sk.grade}阶·${sk.type}]</span></div><div class="item-desc">${sk.desc}（威力+${sk.power}）</div></div>`;
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm';
    btn.textContent = `${sk.price}石`;
    btn.disabled = p.inventory.lingshi < sk.price;
    btn.onclick = () => {
      p.inventory.lingshi -= sk.price;
      if (!p.skills) p.skills = [];
      p.skills.push(sk.id);
      if (!p.activeSkill) p.activeSkill = sk.id;
      game.log(`习得功法<span class="npc-name">「${sk.name}」</span>！`, 'loot');
      game.updateHeader(); game.save(); showMarket();
    };
    div.appendChild(btn);
    body.appendChild(div);
  }
  if (!hasAny) {
    const hint = document.createElement('div');
    hint.style.cssText = 'color:var(--text-dim);font-size:11px;text-align:center;padding:6px 0';
    hint.textContent = '暂无可学功法，提升境界解锁更多';
    body.appendChild(hint);
  }
}

function renderMarketSell(body, p) {
  let hasAny = false;

  if (p.inventory.items.length > 0) {
    const sec = document.createElement('div');
    sec.innerHTML = '<h4 style="color:var(--purple);font-size:13px;margin-bottom:6px;font-weight:normal">— 宝物 —</h4>';
    body.appendChild(sec);
    hasAny = true;
    for (let i = 0; i < p.inventory.items.length; i++) {
      const item = p.inventory.items[i];
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.innerHTML = `<div class="item-info"><div class="item-name">${item.name}（战力+${item.power}）</div></div>`;
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = `卖 ${item.value}石`;
      btn.onclick = () => {
        p.inventory.lingshi += item.value;
        p.inventory.items.splice(i, 1);
        game.log(`出售<span class="npc-name">${item.name}</span>，获得 ${item.value} 灵石。`, 'loot');
        game.updateHeader(); game.save(); showMarket();
      };
      div.appendChild(btn);
      body.appendChild(div);
    }
  }

  const ownedPills = Object.entries(p.inventory.pills).filter(([_,c]) => c > 0);
  const hxCount = p.inventory.huixuedan || 0;
  if (ownedPills.length > 0 || hxCount > 0) {
    const sec = document.createElement('div');
    sec.innerHTML = '<h4 style="color:var(--purple);font-size:13px;margin:' + (hasAny ? '12px' : '0') + ' 0 6px;font-weight:normal">— 丹药 —</h4>';
    body.appendChild(sec);
    hasAny = true;
    for (const [pid, count] of ownedPills) {
      const pill = PILLS.find(pp => pp.id === pid);
      if (!pill) continue;
      const sellPrice = Math.floor(pill.price * 0.5);
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.innerHTML = `<div class="item-info"><div class="item-name">${pill.name} x${count}</div><div class="item-desc">${pill.desc}</div></div>`;
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = `卖 ${fmtPrice(sellPrice)}石`;
      btn.onclick = () => {
        p.inventory.pills[pid]--;
        if (p.inventory.pills[pid] <= 0) delete p.inventory.pills[pid];
        p.inventory.lingshi += sellPrice;
        game.log(`出售<span class="npc-name">${pill.name}</span>，获得 ${sellPrice} 灵石。`, 'loot');
        game.updateHeader(); game.save(); showMarket();
      };
      div.appendChild(btn);
      body.appendChild(div);
    }
    if (hxCount > 0) {
      const hxSell = Math.floor(HUIXUE_PILL.price * 0.5);
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.innerHTML = `<div class="item-info"><div class="item-name">${HUIXUE_PILL.name} x${hxCount}</div><div class="item-desc">${HUIXUE_PILL.desc}</div></div>`;
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = `卖 ${hxSell}石`;
      btn.onclick = () => {
        p.inventory.huixuedan--;
        p.inventory.lingshi += hxSell;
        game.log(`出售<span class="npc-name">${HUIXUE_PILL.name}</span>，获得 ${hxSell} 灵石。`, 'loot');
        game.updateHeader(); game.save(); showMarket();
      };
      div.appendChild(btn);
      body.appendChild(div);
    }
  }

  if (!hasAny) {
    const hint = document.createElement('div');
    hint.style.cssText = 'color:var(--text-dim);font-size:11px;text-align:center;padding:6px 0';
    hint.textContent = '暂无可出售物品';
    body.appendChild(hint);
  }
}

function renderMarketBounty(body, p) {
  if (!game.player.bountyBoard) game.player.bountyBoard = [];
  if (!game.player.bountyBoard.length) refreshBountyBoard();

  if (p.bountyTask) {
    const bt = p.bountyTask;
    const done = bt.done || false;
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.style.borderLeftColor = '#e67e22';
    div.innerHTML = `<div class="item-info"><div class="item-name">${bt.desc}</div><div class="item-desc">目标：（${bt.x+1},${bt.y+1}）· 奖励：${bt.reward}灵石</div></div>`;
    if (done) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = '领奖';
      btn.onclick = () => {
        p.inventory.lingshi += bt.reward;
        game.trackStat('lingshiEarned', bt.reward);
        game.log(`悬赏完成！获得 ${bt.reward} 灵石奖励。`, 'success');
        p.bountyTask = null;
        refreshBountyBoard();
        game.updateHeader(); game.save(); showMarket();
      };
      div.appendChild(btn);
    } else {
      const span = document.createElement('span');
      span.style.cssText = 'color:var(--text-dim);font-size:12px';
      span.textContent = '进行中';
      div.appendChild(span);
    }
    body.appendChild(div);
  } else {
    for (const bt of game.player.bountyBoard) {
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.style.borderLeftColor = '#e67e22';
      div.innerHTML = `<div class="item-info"><div class="item-name">${bt.desc}</div><div class="item-desc">目标：（${bt.x+1},${bt.y+1}）· 奖励：${bt.reward}灵石</div></div>`;
      const btn = document.createElement('button');
      btn.className = 'btn btn-sm';
      btn.textContent = '接取';
      btn.onclick = () => {
        p.bountyTask = { ...bt, done: false };
        game.player.bountyBoard = game.player.bountyBoard.filter(b => b !== bt);
        addOneBounty();
        game.log(`接取悬赏：${bt.desc}`, 'system');
        game.save(); showMarket();
      };
      div.appendChild(btn);
      body.appendChild(div);
    }
  }
}

function closeMarket() { document.getElementById('marketModal').classList.remove('show'); }

const BOUNTY_ACTIONS = [
  { type: 'slay', verbs: ['击退','斩杀','驱逐','消灭'], targets: ['玄铁蛟','噬魂蝠','赤焰狼','幽冥蟒','金翅鹰','紫雷虎','暗影蛛','寒冰熊','妖化野猪','毒雾蝎'] },
  { type: 'fetch', verbs: ['搜寻','采集','找回','取回'], targets: ['千年灵芝','火焰花','寒冰草','聚灵石','天星藤','玄铁矿','月华露','龙涎草','凤血果','紫云参'] },
  { type: 'capture', verbs: ['缉拿','捉拿','击败','追捕'], targets: () => {
    const names = []; for(let i=0;i<5;i++) names.push(randName()); return names;
  }},
  { type: 'fetch', verbs: ['寻找','搜救','找到','定位'], targets: () => {
    const alive = game.memoryStore.getAlive();
    return alive.length ? alive.map(n=>n.name) : ['失踪的散修','迷路的弟子','走失的药农'];
  }},
];

function refreshBountyBoard() {
  const board = [];
  for (let i = 0; i < 3; i++) {
    const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
    const reward = randInt(50, 200) * Math.max(1, game.player.realmIndex);
    const ba = randPick(BOUNTY_ACTIONS);
    const verb = randPick(ba.verbs);
    const targetPool = typeof ba.targets === 'function' ? ba.targets() : ba.targets;
    const target = randPick(targetPool);
    const desc = `${verb}${target}（${x+1},${y+1}）`;
    const finalReward = ba.type === 'capture' ? Math.floor(reward * 1.5) : reward;
    board.push({ type: ba.type, desc, x, y, reward: finalReward });
  }
  game.player.bountyBoard = board;
}

function addOneBounty() {
  const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
  const reward = randInt(50, 200) * Math.max(1, game.player.realmIndex);
  const ba = randPick(BOUNTY_ACTIONS);
  const verb = randPick(ba.verbs);
  const targetPool = typeof ba.targets === 'function' ? ba.targets() : ba.targets;
  const target = randPick(targetPool);
  const desc = `${verb}${target}（${x+1},${y+1}）`;
  const finalReward = ba.type === 'capture' ? Math.floor(reward * 1.5) : reward;
  if (!game.player.bountyBoard) game.player.bountyBoard = [];
  game.player.bountyBoard.push({ type: ba.type, desc, x, y, reward: finalReward });
}

// ===== 宗门 =====
function showSect() {
  const cell = game.mapSystem.getCell(game.mapSystem.playerX, game.mapSystem.playerY);
  if (!cell || cell.type !== 'sect' || !cell.sectId) return;
  const sect = getSectById(cell.sectId);
  if (!sect) return;
  const body = document.getElementById('sectBody');
  body.innerHTML = '';
  const p = game.player;

  const typeColor = sect.type === '正' ? 'var(--green)' : sect.type === '邪' ? 'var(--red)' : 'var(--text-dim)';
  const card = document.createElement('div');
  card.className = 'sect-info-card';
  card.innerHTML = `
    <div class="sect-title">${sect.name} <span style="color:${typeColor};font-size:13px">[${sect.type}道]</span></div>
    <div class="sect-desc">${sect.desc}</div>
    <div class="sect-detail">
      入门门槛：${REALMS[sect.minRealm].name}期<br>
      修炼加成：+${Math.round((sect.expBonus - 1) * 100)}%<br>
      ${sect.rivals.length ? '敌对宗门：' + sect.rivals.map(r => { const s = getSectById(r); return s ? s.name : r; }).join('、') : '无敌对宗门'}
    </div>
  `;
  body.appendChild(card);

  if (p.sect === sect.id) {
    const info = document.createElement('div');
    info.style.cssText = 'color:var(--green);text-align:center;padding:8px;font-size:14px';
    info.textContent = '— 你是本门弟子 —';
    body.appendChild(info);
    const quitBtn = document.createElement('button');
    quitBtn.className = 'btn';
    quitBtn.style.cssText = 'width:100%;margin-top:8px';
    quitBtn.textContent = '退出宗门';
    quitBtn.onclick = () => {
      if (!confirm(`确定退出${sect.name}吗？`)) return;
      p.sect = null;
      game.log(`你已退出${sect.name}，重归散修之身。`, 'system');
      game.updateHeader(); game.save();
      closeSect();
    };
    body.appendChild(quitBtn);
  } else if (p.sect) {
    const curSect = getSectById(p.sect);
    const info = document.createElement('div');
    info.style.cssText = 'color:var(--text-dim);text-align:center;padding:8px;font-size:13px';
    info.textContent = `你已加入${curSect ? curSect.name : '其他宗门'}，需先退出才能申请加入。`;
    body.appendChild(info);
  } else {
    const canApply = p.realmIndex >= sect.minRealm;
    const applyBtn = document.createElement('button');
    applyBtn.className = 'btn';
    applyBtn.style.cssText = 'width:100%;margin-top:8px';
    if (!canApply) {
      applyBtn.textContent = `境界不足（需${REALMS[sect.minRealm].name}期）`;
      applyBtn.disabled = true;
    } else {
      applyBtn.textContent = '申请入门试炼';
      applyBtn.onclick = () => { closeSect(); trySectTrial(sect); };
    }
    body.appendChild(applyBtn);
  }

  document.getElementById('sectModal').classList.add('show');
}

function closeSect() { document.getElementById('sectModal').classList.remove('show'); }

function trySectTrial(sect) {
  const trialRI = Math.max(0, game.player.realmIndex - 1 + Math.floor(Math.random() * 2));
  const trialSI = randInt(0, REALMS[trialRI].stages.length - 1);
  const trialName = randName();
  const trialPower = game.combatEngine.calcPower(trialRI, trialSI, randInt(0, 5));
  const pPower = game.getPlayerCombatPower();

  game.log(`${sect.name}长老：「既然你想加入本门，先过我弟子${trialName}这一关。」`, '');
  game.log(`守门弟子<span class="npc-name">${trialName}</span>（<span class="realm-text">${getRealmFullName(trialRI, trialSI)}</span>）向你出手！`, 'combat');

  if (game.combatEngine.fight(pPower, trialPower)) {
    game.player.sect = sect.id;
    game.log(`你击败了${trialName}！长老满意地点头：「不错，从今日起你便是${sect.name}弟子了。」`, 'success');
    game.log(`【已加入${sect.name}】修炼加成+${Math.round((sect.expBonus-1)*100)}%`, 'system');
    const maxG = Math.min(game.player.realmIndex + 2, 4);
    const sectSkills = SKILLS.filter(s => SKILL_GRADES[s.grade] <= maxG && !(game.player.skills||[]).includes(s.id));
    if (sectSkills.length) {
      const sk = randPick(sectSkills);
      if (!game.player.skills) game.player.skills = [];
      game.player.skills.push(sk.id);
      if (!game.player.activeSkill) game.player.activeSkill = sk.id;
      game.log(`宗门传授功法<span class="npc-name">「${sk.name}」</span>！`, 'loot');
    }
  } else {
    const dmg = randInt(Math.floor(game.player.hpMax * 0.05), Math.floor(game.player.hpMax * 0.1));
    game.player.hp = Math.max(1, game.player.hp - dmg);
    game.log(`你不敌${trialName}，试炼失败。长老摇头：「修行尚浅，日后再来吧。」气血-${dmg}`, 'danger');
  }
  game.updateHeader(); game.save();
}

    const d = document.createElement('div');
    d.className = 'inv-item';
    d.innerHTML = '<span class="iname" style="color:var(--text-dim)">空空如也</span>';
    sec3.appendChild(d);
  } else {
    for (const item of p.inventory.items) {
      const d = document.createElement('div');
      d.className = 'inv-item';
      d.innerHTML = `<span class="iname">${item.name}</span><span class="ival">战力+${item.power}</span>`;
      sec3.appendChild(d);
    }
    const totalPower = p.inventory.items.reduce((s, t) => s + t.power, 0);
    const d = document.createElement('div');
    d.className = 'inv-item';
    d.innerHTML = `<span class="iname" style="color:var(--gold)">总战力加成</span><span class="ival">+${totalPower}</span>`;
    sec3.appendChild(d);
  }
  body.appendChild(sec3);

  const sec4 = document.createElement('div');
  sec4.className = 'inv-section';
  sec4.innerHTML = '<h4>功法</h4>';
  const pSkills = p.skills || [];
  if (!pSkills.length) {
    const d = document.createElement('div');
    d.className = 'inv-item';
    d.innerHTML = '<span class="iname" style="color:var(--text-dim)">尚未习得功法</span>';
    sec4.appendChild(d);
  } else {
    for (const sid of pSkills) {
      const sk = getSkillById(sid);
      if (!sk) continue;
      const isActive = p.activeSkill === sid;
      const d = document.createElement('div');
      d.className = 'inv-item';
      d.style.cursor = 'pointer';
      d.style.borderLeft = isActive ? '3px solid var(--blue)' : '';
      d.innerHTML = `<span class="iname">${isActive ? '◆ ' : ''}${sk.name} <span style="color:var(--text-dim);font-size:10px">[${sk.grade}阶·${sk.type}·威力${sk.power}]</span></span><span class="ival">${isActive ? '装备中' : '点击装备'}</span>`;
      d.onclick = () => { p.activeSkill = isActive ? null : sid; game.save(); showInventory(); };
      sec4.appendChild(d);
    }
  }
  body.appendChild(sec4);

  document.getElementById('inventoryModal').classList.add('show');
}
function closeInventory() { document.getElementById('inventoryModal').classList.remove('show'); }

function showScenePopup(type, title, duration) {
  const el = document.getElementById('scenePopup');
  const dur = duration || 1800;
  if (type === 'combat' || type === 'monster') {
    const leftArt = PIXEL_ART['combat_left'];
    const rightArt = type === 'combat' ? PIXEL_ART['combat_right'] : PIXEL_ART['monster_right'];
    function drawSprite(a) {
      const c = document.createElement('canvas');
      const sc = a.scale;
      c.width = a.w * sc; c.height = a.data.length * sc;
      const cx = c.getContext('2d');
      for (let y = 0; y < a.data.length; y++)
        for (let x = 0; x < a.data[y].length; x++) {
          const color = PIXEL_COLORS[a.data[y][x]];
          if (color) { cx.fillStyle = color; cx.fillRect(x*sc, y*sc, sc, sc); }
        }
      return c.toDataURL();
    }
    const leftImg = drawSprite(leftArt);
    const rightImg = drawSprite(rightArt);
    let sparkExtra = '<div style="position:absolute;inset:0;pointer-events:none"><div style="position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px;background:#fff;border-radius:50%;animation:clashSpark 1.2s ease-out infinite;box-shadow:0 0 20px #f1c40f,0 0 40px #e67e22"></div></div>';
    el.innerHTML = `<div class="scene-title">${title || ''}</div>
      <div class="scene-pixel" style="width:240px;height:140px;position:relative">
        <img src="${leftImg}" style="position:absolute;left:50%;top:50%;margin-left:-100px;margin-top:-54px;image-rendering:pixelated;animation:clashLeft 1.2s ease-in-out infinite">
        <img src="${rightImg}" style="position:absolute;left:50%;top:50%;margin-left:16px;margin-top:-54px;image-rendering:pixelated;animation:clashRight 1.2s ease-in-out infinite">
        ${sparkExtra}
      </div>`;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), dur);
    return;
  }

  const art = PIXEL_ART[type];
  if (!art) {
    el.innerHTML = `<div class="scene-title" style="${type==='danger'?'color:var(--red);font-size:20px':''}">${title}</div>`;
    el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), dur); return;
  }

  const canvas = document.createElement('canvas');
  const s = art.scale;
  canvas.width = art.w * s;
  canvas.height = art.data.length * s;
  canvas.style.imageRendering = 'pixelated';
  const ctx = canvas.getContext('2d');

  for (let y = 0; y < art.data.length; y++) {
    for (let x = 0; x < art.data[y].length; x++) {
      const ch = art.data[y][x];
      const color = PIXEL_COLORS[ch];
      if (color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * s, y * s, s, s);
      }
    }
  }

  const imgUrl = canvas.toDataURL();
  const imgTag = `<img src="${imgUrl}" style="image-rendering:pixelated;width:${art.w * s}px;height:${art.data.length * s}px">`;

  let extra = '';
  if (type === 'meditate') {
    let dots = '<div class="qi-particles">';
    const colors = ['#5dade2','#d4a853','#85c1e9','#f0d78c','#3498db','#e8b84a'];
    for (let i = 0; i < 8; i++) {
      const c = colors[i % colors.length];
      const left = 20 + Math.floor(Math.random() * 60);
      dots += `<div class="qi-dot" style="background:${c};left:${left}%;bottom:20%;animation-delay:${(i*0.3).toFixed(1)}s;animation-duration:${(1.5+Math.random()).toFixed(1)}s"></div>`;
    }

      const c = colors[i % colors.length];

    }
    fx += '</div>';

  } else if (type === 'breakthrough') {
    let fx = '<div class="qi-particles">';
    const brights = ['#d4a853','#f1c40f','#fff','#e8b84a','#5dade2','#85c1e9'];
    for (let i = 0; i < 12; i++) {
      const c = brights[i % brights.length];
      fx += `<div class="qi-dot" style="background:${c};left:${(10+Math.random()*80).toFixed(0)}%;bottom:20%;animation-delay:${(i*0.12).toFixed(2)}s;animation-duration:${(0.8+Math.random()*0.6).toFixed(1)}s"></div>`;
    }
    for (let i = 0; i < 6; i++) {
      const c = brights[i % brights.length];
      fx += `<div class="qi-orbit" style="background:${c};width:${5+Math.floor(Math.random()*4)}px;height:${5+Math.floor(Math.random()*4)}px;animation-duration:${(1.5+i*0.4).toFixed(1)}s;animation-delay:${(i*0.3).toFixed(1)}s"></div>`;

  } else if (type === 'success') {

  }

  let wrapClass = '';
  if (type === 'meditate') wrapClass = 'scene-canvas-wrap';
  else if (type === 'explore') wrapClass = 'scene-walk';
  else if (type === 'combat' || type === 'monster') wrapClass = '';
  el.innerHTML = `<div class="scene-title">${title || ''}</div><div class="scene-pixel"><div class="${wrapClass}">${imgTag}${extra}</div></div>`;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), dur);
}

async function aiChat(npc, playerMessage) {
  const key = localStorage.getItem('xiuxian_ai_key');
  if (!key || localStorage.getItem('xiuxian_ai_enabled') !== 'true') return null;

  const p = game.player;
  const rel = npc.getRelation(p.id);
  const relLabel = getRelationLabel(rel, npc.gender !== p.gender, npc.isChild, npc.id);
  const bonds = p.bonds || [];
  const isBond = bonds.includes(npc.id);
  let relationship = relLabel;
  if (p.master === npc.id) relationship = '你的师父';
  else if ((p.disciples||[]).includes(npc.id)) relationship = '你的徒弟';
  else if (npc.spouse === '__player__') relationship = '你的道侣';
  else if (npc.isChild) relationship = `你的${npc.gender==='男'?'儿子':'女儿'}`;

  const isSpouse = npc.spouse === '__player__';
  const isConcubine = npc.role === 'concubine';
  const isMaster = p.master === npc.id;
  const isDisciple = (p.disciples||[]).includes(npc.id);
  if (isConcubine) relationship = p.gender === '男' ? '你是对方的侍妾' : '你是对方的男宠';

  const sysPrompt = `你是一个修仙世界的NPC角色，请完全代入以下身份进行对话。

【你的身份】
姓名：${npc.name}
性别：${npc.gender}

【对话规则】
- 用古风/修仙风格说话，简短有个性，1-3句话

          { role: 'system', content: sysPrompt },
          { role: 'user', content: playerMessage || '（向你打招呼）' }
        ],
        max_tokens: 150,
        temperature: 0.8,
      }),
    });
    const data = await resp.json();
    if (data.choices && data.choices[0]) {
      let text = data.choices[0].message.content.trim();
      text = text.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
      return text;
    }
    if (data.error) game.log(`[AI错误] ${data.error.message || JSON.stringify(data.error)}`, 'danger');
  } catch(e) {
    game.log(`[AI连接失败] ${e.message}`, 'danger');
  }
  return null;
}

function exportSave() {
  document.getElementById('menuDropdown').classList.remove('show');
  const data = {
    player: localStorage.getItem('xiuxian_player'),
    memory: localStorage.getItem('xiuxian_memory'),
    map: localStorage.getItem('xiuxian_map'),
  };
  const str = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const ta = document.createElement('textarea');
  ta.value = str;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  if (navigator.clipboard) navigator.clipboard.writeText(str);
  game.log('存档已复制到剪贴板！可粘贴保存到备忘录或发送给自己。', 'system');
}

function importSave() {
  document.getElementById('menuDropdown').classList.remove('show');
  const str = prompt('粘贴存档字符串：');
  if (!str) return;
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(str))));
    if (data.player) localStorage.setItem('xiuxian_player', data.player);
    if (data.memory) localStorage.setItem('xiuxian_memory', data.memory);
    if (data.map) localStorage.setItem('xiuxian_map', data.map);
    location.reload();
  } catch(e) {
    alert('存档格式错误！');
  }
}

(function checkSave() {
  const saved = localStorage.getItem('xiuxian_player');
  if (saved) { const p = JSON.parse(saved); startGame(p.name, p.gender); }
  else renderNameOptions(generateNameOptions());
})();
</script>
