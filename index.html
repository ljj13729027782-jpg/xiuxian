<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>修仙录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #1a1a2e;
  --bg-light: #16213e;
  --bg-card: #0f3460;
  --gold: #d4a853;
  --gold-dim: #a07d3a;
  --text: #e8dcc8;
  --text-dim: #9a8e7a;
  --red: #c0392b;
  --green: #27ae60;
  --blue: #5dade2;
  --pink: #e91e63;
  --purple: #9b59b6;
}

html { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: fixed;
  inset: 0;
  max-width: 500px;
  margin: 0 auto;
}

.header {
  background: var(--bg-light);
  border-bottom: 1px solid var(--gold-dim);
  padding: 10px 16px 8px;
  text-align: center;
  flex-shrink: 0;
  position: relative;
}
.header h1 { font-size: 18px; color: var(--gold); font-weight: normal; letter-spacing: 4px; }
.header .player-info { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.header .player-res { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.header .player-res .lingshi { color: var(--gold); }
.bars-wrap { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
.progress-bar {
  background: var(--bg);
  border-radius: 4px;
  height: 13px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: 4px;
  transition: width 0.4s ease;
}
.progress-fill.full {
  background: linear-gradient(90deg, var(--green), #2ecc71);
  animation: pulse 1.5s infinite;
}
.hp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red), #e74c3c);
  border-radius: 4px;
  transition: width 0.4s ease;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}
.progress-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: var(--text);
  text-shadow: 0 0 3px rgba(0,0,0,0.8);
}
.menu-btn {
  position: absolute; right: 12px; top: 10px;
  background: none; border: none; color: var(--text-dim);
  font-size: 22px; cursor: pointer; padding: 6px; line-height: 1;
  -webkit-tap-highlight-color: transparent;
}
.menu-btn:active { color: var(--gold); }
.menu-dropdown {
  display: none; position: absolute; right: 12px; top: 100%;
  background: var(--bg-card); border: 1px solid var(--gold-dim);
  border-radius: 8px; z-index: 50; overflow: hidden; min-width: 120px;
}
.menu-dropdown.show { display: block; }
.menu-item {
  display: block; width: 100%; padding: 12px 16px;
  background: none; border: none; color: var(--text);
  font-size: 14px; font-family: inherit; text-align: left; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.menu-item:active { background: var(--gold-dim); color: var(--bg); }

.log-area {
  flex: 1; overflow-y: scroll; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; min-height: 0;
}
.log-entry {
  padding: 10px 14px; border-radius: 8px; background: var(--bg-light);
  border-left: 3px solid var(--gold-dim); font-size: 15px;
  animation: fadeIn 0.3s ease;
}
.log-entry.system { border-left-color: var(--blue); color: var(--blue); font-size: 13px; }
.log-entry.danger { border-left-color: var(--red); }
.log-entry.success { border-left-color: var(--green); }
.log-entry.pink { border-left-color: var(--pink); color: var(--pink); }
.log-entry.combat { border-left-color: #e67e22; }
.log-entry.loot { border-left-color: var(--purple); color: var(--purple); }
.log-entry.player-speech { border-left-color: var(--gold); background: #1e2a45; }
.log-entry .npc-name { color: var(--gold); font-weight: bold; }
.log-entry .dialogue { color: #fff; font-style: italic; }
.log-entry .realm-text { color: var(--blue); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.actions {
  flex-shrink: 0; padding: 12px 16px;
  background: var(--bg-light); border-top: 1px solid var(--gold-dim);
  max-height: 45vh; overflow-y: auto;
}
.btn-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 8px;
}
.btn-row:last-child { margin-bottom: 0; }
.btn-row.three { grid-template-columns: 1fr 1fr 1fr; }
.btn-row.four { grid-template-columns: 1fr 1fr 1fr 1fr; }

.btn {
  background: var(--bg-card); color: var(--gold);
  border: 1px solid var(--gold-dim); border-radius: 8px;
  padding: 12px 8px; font-size: 15px; font-family: inherit;
  cursor: pointer; transition: all 0.2s; min-height: 46px;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { background: var(--gold-dim); color: var(--bg); transform: scale(0.96); }
.btn.btn-pink { border-color: var(--pink); color: var(--pink); }
.btn.btn-pink:active { background: var(--pink); color: #fff; }
.btn.btn-glow { border-color: var(--green); color: var(--green); animation: pulse 1.5s infinite; }
.btn.btn-glow:active { background: var(--green); color: #fff; }
.btn.btn-purple { border-color: var(--purple); color: var(--purple); }
.btn.btn-purple:active { background: var(--purple); color: #fff; }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn.btn-reply {
  font-size: 13px; padding: 10px 8px; text-align: left; line-height: 1.4;
}
.btn.btn-sm { padding: 8px 6px; font-size: 13px; min-height: 36px; }

.create-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 24px; gap: 24px;
}
.create-screen h2 { color: var(--gold); font-size: 22px; font-weight: normal; letter-spacing: 3px; }
.create-screen p { color: var(--text-dim); font-size: 14px; margin-bottom: -10px; }
.gender-toggle { display: flex; gap: 16px; }
.gender-label { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 16px; cursor: pointer; }
.name-options { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
.name-btn {
  background: var(--bg-light); color: var(--text);
  border: 1px solid var(--gold-dim); border-radius: 8px;
  padding: 14px; font-size: 18px; font-family: inherit;
  cursor: pointer; transition: all 0.2s; letter-spacing: 6px; text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.name-btn:active { background: var(--gold-dim); color: var(--bg); border-color: var(--gold); }
.refresh-btn {
  background: none; border: none; color: var(--text-dim);
  font-size: 14px; font-family: inherit; cursor: pointer; padding: 8px;
  -webkit-tap-highlight-color: transparent;
}
.refresh-btn:active { color: var(--gold); }

.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 100;
  justify-content: center; align-items: center; padding: 24px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-light); border: 1px solid var(--gold-dim);
  border-radius: 12px; width: 100%; max-width: 460px; max-height: 75vh;
  display: flex; flex-direction: column;
}
.modal.graph-mode { max-width: 95vw; max-height: 90vh; width: 95vw; height: 90vh; }
.graph-viewport { overflow: hidden; position: relative; touch-action: none; flex: 1; min-height: 0; cursor: grab; }
.graph-viewport:active { cursor: grabbing; }
.graph-viewport canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.modal-header {
  padding: 14px 16px; border-bottom: 1px solid var(--gold-dim);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-header h3 { color: var(--gold); font-weight: normal; font-size: 17px; }
.modal-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 4px 8px; }
.modal-body { padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.npc-card { background: var(--bg); border-radius: 8px; padding: 12px; margin-bottom: 10px; border-left: 3px solid var(--gold-dim); }
.npc-card.dead { opacity: 0.5; border-left-color: var(--red); }
.npc-card .name { color: var(--gold); font-size: 16px; }
.npc-card .info { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
.npc-card .relation { font-size: 13px; margin-top: 4px; }
.npc-actions { padding-top: 6px; }
.relation-enemy { color: var(--red); }
.relation-friend { color: var(--green); }
.relation-soulmate, .relation-blood { color: var(--pink); font-weight: bold; }
.empty-text { color: var(--text-dim); text-align: center; padding: 32px 0; font-size: 14px; }
#gameScreen { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.hidden { display: none !important; }

.map-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.map-legend { display: flex; gap: 10px; font-size: 11px; color: var(--text-dim); flex-wrap: wrap; justify-content: center; }
.map-legend span { display: flex; align-items: center; gap: 3px; }
.legend-dot { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.map-grid {
  display: grid;
  grid-template-columns: 14px repeat(16, 20px);
  grid-template-rows: 14px repeat(16, 20px);
  gap: 1px;
  background: var(--bg);
  border: 1px solid var(--gold-dim);
  border-radius: 4px;
  overflow: auto;
  max-height: 50vh;
}
.map-label {
  display: flex; align-items: center; justify-content: center;
  font-size: 7px; color: var(--text-dim); user-select: none;
}
.map-cell {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; cursor: default; position: relative;
  border-radius: 2px; transition: all 0.15s;
}
.map-cell.qi-1 { background: #2a2a3a; }
.map-cell.qi-2 { background: #1e3a4a; }
.map-cell.qi-3 { background: #1a4a6a; }
.map-cell.qi-4 { background: #3a4a1a; }
.map-cell.market { background: #3a1a4a !important; }
.map-cell.reachable { box-shadow: inset 0 0 0 2px rgba(212,168,83,0.6); cursor: pointer; }
.map-cell.reachable:active { transform: scale(0.9); }
.map-cell.has-player::after {
  content: ''; width: 10px; height: 10px;
  background: var(--gold); border-radius: 50%;
  box-shadow: 0 0 6px var(--gold);
}
.map-cell.has-npc::before {
  content: ''; width: 6px; height: 6px;
  background: var(--red); border-radius: 50%;
  position: absolute; top: 2px; right: 2px;
}
.map-cell.market::after { content: '市'; color: var(--purple); font-size: 10px; font-weight: bold; }
.map-cell.has-rift { box-shadow: inset 0 0 6px #e67e22; animation: pulse 1s infinite; }
.map-cell.has-herb { box-shadow: inset 0 0 4px var(--green); }
.map-cell.has-ruin { box-shadow: inset 0 0 6px #e67e22; background: #3a2a1a !important; }
.map-cell.sect-good { background: #1a3a2a !important; }
.map-cell.sect-evil { background: #3a1a1a !important; }
.map-cell.sect-neutral { background: #2a2a3a !important; }
.map-cell.sect-good::after, .map-cell.sect-evil::after, .map-cell.sect-neutral::after {
  content: attr(data-label); color: var(--text); font-size: 7px; font-weight: bold;
}
.map-cell.sect-good.has-player::after, .map-cell.sect-evil.has-player::after, .map-cell.sect-neutral.has-player::after {
  content: ''; background: var(--gold); width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 6px var(--gold);
}
.scene-popup {
  position: fixed; inset: 0; z-index: 300;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.92); gap: 24px;
  animation: sceneFadeIn 0.3s ease;
  max-width: 500px; margin: 0 auto;
  pointer-events: none;
}
.scene-popup .scene-title {
  order: -1;
}
@keyframes sceneFadeIn { from { opacity: 0; } to { opacity: 1; } }
.scene-popup .scene-title {
  color: var(--gold); font-size: 16px; letter-spacing: 4px;
}
.scene-popup .scene-pixel {
  display: flex; align-items: center; justify-content: center;
  image-rendering: pixelated;
}
.px-person {
  width: 20px; height: 30px; position: absolute; bottom: 10px;
}
.px-body { width: 12px; height: 14px; border-radius: 2px; position: absolute; bottom: 0; left: 4px; }
.px-head { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: 14px; left: 5px; }
.px-legs { width: 12px; height: 6px; position: absolute; bottom: -5px; left: 4px; display: flex; gap: 2px; }
.px-leg { width: 4px; height: 6px; border-radius: 1px; }

@keyframes floatUp { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.scene-canvas-wrap { animation: floatUp 2.5s ease-in-out infinite; position: relative; }
.qi-particles { position: absolute; inset: -40px; pointer-events: none; }
.qi-dot {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  animation: qiRise linear infinite;
}
@keyframes qiRise {
  0% { transform: translateY(0) scale(1); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-80px) scale(0.3); opacity: 0; }
}
@keyframes qiOrbit {
  0% { transform: rotate(0deg) translateX(50px) rotate(0deg); opacity: 0.7; }
  50% { opacity: 1; }
  100% { transform: rotate(360deg) translateX(50px) rotate(-360deg); opacity: 0.7; }
}
.qi-orbit {
  position: absolute; width: 5px; height: 5px; border-radius: 50%;
  top: 50%; left: 50%;
  animation: qiOrbit linear infinite;
}
@keyframes sparkBurst {
  0% { transform: scale(0); opacity: 1; }
  50% { transform: scale(1.5); opacity: 1; }
  100% { transform: scale(0); opacity: 0; }
}
@keyframes screenShake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
@keyframes goldenBurst {
  0% { width: 0; height: 0; opacity: 1; }
  100% { width: 250px; height: 250px; opacity: 0; }
}
@keyframes walkBounce {
  0%,100% { transform: translateX(-15px); }
  50% { transform: translateX(15px); }
}
.scene-walk { animation: walkBounce 0.8s ease-in-out infinite; }
@keyframes clashLeft {
  0% { transform: translateX(-60px); }
  40% { transform: translateX(10px); }
  50% { transform: translateX(0); }
  60% { transform: translateX(-5px); }
  100% { transform: translateX(-60px); }
}
@keyframes clashRight {
  0% { transform: translateX(60px); }
  40% { transform: translateX(-10px); }
  50% { transform: translateX(0); }
  60% { transform: translateX(5px); }
  100% { transform: translateX(60px); }
}
@keyframes clashSpark {
  0%,30% { transform: scale(0); opacity: 0; }
  40% { transform: scale(2); opacity: 1; }
  50% { transform: scale(3); opacity: 1; }
  60% { transform: scale(1); opacity: 0.5; }
  70%,100% { transform: scale(0); opacity: 0; }
}

.px-fight-left .px-body { background: #5dade2; }
.px-fight-left .px-head { background: #f5cba7; }
.px-fight-left .px-leg { background: #34495e; }
.px-fight-right .px-body { background: #c0392b; }
.px-fight-right .px-head { background: #d5a6a6; }
.px-fight-right .px-leg { background: #7b241c; }
@keyframes slashLeft { 0% { transform: translateX(0); } 50% { transform: translateX(12px); } 100% { transform: translateX(0); } }
@keyframes slashRight { 0% { transform: translateX(0); } 50% { transform: translateX(-12px); } 100% { transform: translateX(0); } }
.px-fight-left { animation: slashLeft 0.8s infinite; left: 15px; }
.px-fight-right { animation: slashRight 0.8s infinite; right: 15px; }

.px-monster .px-body { background: #8e44ad; width: 18px; height: 18px; border-radius: 4px; left: 1px; }
.px-monster .px-head { background: #c0392b; width: 14px; height: 12px; border-radius: 3px; left: 3px; bottom: 18px; }
.px-monster .px-leg { background: #6c3483; }
@keyframes monsterShake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
.px-monster { animation: monsterShake 0.6s infinite; }

.px-loot { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); }
.px-loot::before {
  content: ''; display: block; width: 24px; height: 16px;
  background: var(--gold); border-radius: 3px;
  border-bottom: 3px solid var(--gold-dim);
}
.px-loot::after {
  content: ''; display: block; width: 8px; height: 8px;
  background: #fff; border-radius: 50%; position: absolute;
  top: -4px; left: 8px;
  animation: glow 1s infinite;
}
@keyframes glow { 0%,100% { opacity: 1; box-shadow: 0 0 4px #fff; } 50% { opacity: 0.5; box-shadow: 0 0 8px var(--gold); } }

.px-heart { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); }
.px-heart::before, .px-heart::after {
  content: ''; position: absolute; width: 12px; height: 12px;
  background: var(--pink); border-radius: 50%;
}
.px-heart::before { left: -6px; top: 0; }
.px-heart::after { left: 6px; top: 0; }
.px-heart-tip {
  width: 0; height: 0; border-left: 12px solid transparent;
  border-right: 12px solid transparent; border-top: 14px solid var(--pink);
  position: absolute; top: 6px; left: -6px;
}
@keyframes heartBeat { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.2); } }
.px-heart { animation: heartBeat 0.8s infinite; }

.px-handshake { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.px-hand { width: 10px; height: 14px; background: #f5cba7; border-radius: 3px; }
.px-hand:first-child { transform: rotate(-15deg); }
.px-hand:last-child { transform: rotate(15deg); background: #d4a853; }

.px-check { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); }
.px-check::before {
  content: '✓'; font-size: 32px; color: var(--green);
}

.combat-panel {
  background: var(--bg); border: 1px solid var(--gold-dim); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 8px;
}
.combat-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.combat-name { font-size: 14px; font-weight: bold; }
.combat-hp-wrap {
  background: var(--bg-light); border-radius: 4px; height: 16px; flex: 1;
  margin: 0 10px; position: relative; overflow: hidden;
}
.combat-hp-fill {
  height: 100%; border-radius: 4px; transition: width 0.3s;
}
.combat-hp-fill.player-bar { background: linear-gradient(90deg, #27ae60, #2ecc71); }
.combat-hp-fill.enemy-bar { background: linear-gradient(90deg, #c0392b, #e74c3c); }
.combat-hp-text {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; font-size: 10px; color: var(--text);
  text-shadow: 0 0 3px rgba(0,0,0,0.8);
}
.combat-info { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 4px; }
.combat-log { font-size: 12px; color: var(--text); padding: 6px 0; max-height: 80px; overflow-y: auto; }
.combat-log div { padding: 2px 0; }

.sect-info-card { background: var(--bg); border-radius: 8px; padding: 14px; margin-bottom: 10px; border-left: 3px solid var(--gold-dim); }
.sect-info-card .sect-title { color: var(--gold); font-size: 17px; }
.sect-info-card .sect-desc { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
.sect-info-card .sect-detail { color: var(--text); font-size: 13px; margin-top: 6px; line-height: 1.8; }
.map-cell.market.has-player::after { content: ''; background: var(--gold); width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 6px var(--gold); }
.map-info { font-size: 12px; color: var(--text-dim); text-align: center; min-height: 18px; }

.shop-item {
  background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
  border-left: 3px solid var(--purple);
}
.shop-item .item-info { flex: 1; }
.shop-item .item-name { color: var(--text); font-size: 14px; }
.shop-item .item-desc { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
.shop-item .item-price { color: var(--gold); font-size: 13px; white-space: nowrap; margin-left: 12px; }
.inv-section { margin-bottom: 14px; }
.inv-section h4 { color: var(--gold); font-size: 14px; margin-bottom: 6px; font-weight: normal; }
.inv-item {
  background: var(--bg); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px;
  display: flex; justify-content: space-between; align-items: center; font-size: 13px;
}
.inv-item .iname { color: var(--text); }
.inv-item .ival { color: var(--gold); }

.origin-reveal {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 24px; gap: 20px; text-align: center;
  animation: fadeIn 0.8s ease;
}
.origin-reveal h2 { color: var(--gold); font-size: 20px; font-weight: normal; letter-spacing: 4px; }
.origin-reveal .origin-name { font-size: 28px; color: var(--pink); letter-spacing: 6px; margin: 8px 0; }
.origin-reveal .origin-desc { color: var(--text); font-size: 15px; line-height: 1.8; max-width: 320px; }
.origin-reveal .origin-effects { color: var(--text-dim); font-size: 13px; line-height: 1.6; max-width: 300px; }

.death-screen {
  position: fixed; inset: 0; z-index: 200;
  background: linear-gradient(180deg, #0a0a15 0%, #1a0a0a 50%, #0a0a15 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 24px; gap: 16px;
  animation: fadeIn 1.5s ease;
  overflow-y: auto;
  max-width: 500px; margin: 0 auto;
}
.death-title {
  font-size: 36px; color: var(--gold); letter-spacing: 12px;
  font-weight: normal; text-shadow: 0 0 20px rgba(212,168,83,0.5);
  animation: pulse 3s infinite;
}
.death-cause { color: var(--red); font-size: 14px; text-align: center; }
.death-card {
  background: rgba(255,255,255,0.05); border: 1px solid var(--gold-dim);
  border-radius: 12px; padding: 16px 20px; width: 100%; max-width: 340px;
  text-align: center;
}
.death-card .dc-name { color: var(--gold); font-size: 20px; letter-spacing: 4px; }
.death-card .dc-info { color: var(--text-dim); font-size: 13px; margin-top: 6px; line-height: 1.8; }
.death-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; width: 100%; max-width: 340px;
}
.death-stat {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 10px 8px; text-align: center;
}
.death-stat .ds-val { color: var(--gold); font-size: 18px; }
.death-stat .ds-label { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
.death-btn {
  margin-top: 8px; background: none; border: 1px solid var(--gold);
  color: var(--gold); padding: 14px 40px; font-size: 16px; font-family: inherit;
  border-radius: 8px; cursor: pointer; letter-spacing: 4px;
  transition: all 0.3s;
}
.death-btn:active { background: var(--gold); color: var(--bg); }
</style>
</head>
<body>

<div id="createScreen" class="create-screen">
  <h2>修 仙 录</h2>
  <div class="gender-toggle">
    <label class="gender-label"><input type="radio" name="playerGender" value="男" checked> 男</label>
    <label class="gender-label"><input type="radio" name="playerGender" value="女"> 女</label>
  </div>
  <p>选择你的道号</p>
  <div id="nameOptions" class="name-options"></div>
  <button class="refresh-btn" onclick="refreshNames()">换一批</button>
</div>

<div id="originScreen" class="create-screen hidden">
  <div class="origin-reveal">
    <h2>天 命 揭 示</h2>
    <div id="originName" class="origin-name"></div>
    <div id="originDesc" class="origin-desc"></div>
    <div id="originEffects" class="origin-effects"></div>
    <button class="btn" onclick="confirmOrigin()" style="margin-top:12px;padding:14px 32px;letter-spacing:4px">踏入修仙之路</button>
  </div>
</div>

<div id="scenePopup" class="scene-popup hidden"></div>
<div id="deathScreen" class="death-screen hidden"></div>

<div id="gameScreen" class="hidden">
  <div class="header">
    <h1>修 仙 录</h1>
    <div class="player-info">
      <span id="playerName"></span> (<span id="playerGender"></span>) · <span id="playerOrigin"></span> · <span id="playerSect"></span> · <span id="playerRealm"></span> · 寿元 <span id="playerLife"></span>
    </div>
    <div class="player-res">
      灵石 <span id="playerLingshi" class="lingshi">0</span> · 战力 <span id="playerPower" style="color:var(--blue)">0</span><span id="playerFollowers"></span> · 位置（<span id="playerPos"></span>）<span id="posQi"></span><span id="playerInfamy"></span>
    </div>
    <div class="bars-wrap">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width:0%"></div>
        <div id="progressText" class="progress-text"></div>
      </div>
      <div class="progress-bar">
        <div id="hpFill" class="hp-fill" style="width:100%"></div>
        <div id="hpText" class="progress-text"></div>
      </div>
    </div>
    <button class="menu-btn" onclick="toggleMenu(event)">&#8942;</button>
    <div id="menuDropdown" class="menu-dropdown">
      <button class="menu-item" onclick="showInventory()">背包</button>
      <button class="menu-item" onclick="showMemory()">记忆录</button>
      <button class="menu-item" onclick="showAiSettings()">AI设置</button>
      <button class="menu-item" onclick="exportSave()">导出存档</button>
      <button class="menu-item" onclick="importSave()">导入存档</button>
      <button class="menu-item" onclick="restartGame()">重新开始</button>
    </div>
  </div>

  <div id="logArea" class="log-area"></div>

  <div style="text-align:center;font-size:11px;color:var(--text-dim);padding:3px 0;background:var(--bg-light);border-top:1px solid rgba(255,255,255,0.05)">
    修仙历 <span id="worldYear">1</span> 年
  </div>
  <div class="actions">
    <div id="mainActions">
      <div class="btn-row">
        <button class="btn" onclick="showMap()">打开地图</button>
        <button class="btn" onclick="game.doExplore()">探索</button>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="game.rest()">修整</button>
        <button class="btn" onclick="game.meditate()">闭关修炼</button>
      </div>
      <div class="btn-row">
        <button id="btnBreakthrough" class="btn" onclick="game.tryBreakthrough()">尝试突破</button>
        <button class="btn" onclick="game.advanceTime()">推进时间</button>
      </div>
      <div class="btn-row hidden" id="marketBtnRow">
        <button class="btn btn-purple" onclick="showMarket()" style="grid-column:1/-1">进入坊市</button>
      </div>
      <div class="btn-row hidden" id="ruinBtnRow">
        <button class="btn" onclick="game.enterRuin()" style="grid-column:1/-1;border-color:#e67e22;color:#e67e22" id="ruinBtnText">探索遗迹</button>
      </div>
      <div class="btn-row hidden" id="npcBtnRow">
        <button class="btn" onclick="showNpcHere()" style="grid-column:1/-1;border-color:var(--red);color:var(--red)" id="npcBtnText">附近有人</button>
      </div>
      <div class="btn-row hidden" id="sectBtnRow">
        <button class="btn" onclick="showSect()" style="grid-column:1/-1;border-color:var(--green);color:var(--green)" id="sectBtnText">宗门驻点</button>
      </div>
    </div>
    <div id="dialogueActions" class="hidden"></div>
    <div id="encounterActions" class="hidden"></div>
  </div>
</div>

<div id="mapModal" class="modal-overlay" onclick="if(event.target===this)closeMap()">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3>天地图</h3>
      <button class="modal-close" onclick="closeMap()">✕</button>
    </div>
    <div class="modal-body">
      <div class="map-container">
        <div class="map-info" id="mapInfo">点击高亮格子移动（每次最多2格，每格消耗1年寿元）</div>
        <div class="map-legend">
          <span><i class="legend-dot" style="background:#2a2a3a"></i>荒芜</span>
          <span><i class="legend-dot" style="background:#1e3a4a"></i>普通</span>
          <span><i class="legend-dot" style="background:#1a4a6a"></i>灵脉</span>
          <span><i class="legend-dot" style="background:#3a4a1a"></i>仙境</span>
          <span><i class="legend-dot" style="background:#3a1a4a"></i>坊市</span>
          <span><i class="legend-dot" style="background:#1a3a2a"></i>正派</span>
          <span><i class="legend-dot" style="background:#3a1a1a"></i>邪派</span>
          <span><i class="legend-dot" style="background:var(--gold);border-radius:50%"></i>你</span>
          <span><i class="legend-dot" style="background:var(--red);border-radius:50%"></i>NPC</span>
        </div>
        <div class="map-grid" id="mapGrid"></div>
      </div>
    </div>
  </div>
</div>

<div id="marketModal" class="modal-overlay" onclick="if(event.target===this)closeMarket()">
  <div class="modal">
    <div class="modal-header">
      <h3>坊市 · <span id="marketLingshi" style="color:var(--gold);font-size:14px"></span></h3>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn btn-sm market-tab" data-tab="pill" onclick="showMarket('pill')" style="min-height:28px;padding:3px 8px;font-size:12px">丹药</button>
        <button class="btn btn-sm market-tab" data-tab="skill" onclick="showMarket('skill')" style="min-height:28px;padding:3px 8px;font-size:12px">功法</button>
        <button class="btn btn-sm market-tab" data-tab="sell" onclick="showMarket('sell')" style="min-height:28px;padding:3px 8px;font-size:12px">出售</button>
        <button class="btn btn-sm market-tab" data-tab="bounty" onclick="showMarket('bounty')" style="min-height:28px;padding:3px 8px;font-size:12px">悬赏</button>
        <button class="modal-close" onclick="closeMarket()">✕</button>
      </div>
    </div>
    <div class="modal-body" id="marketBody"></div>
  </div>
</div>

<div id="sectModal" class="modal-overlay" onclick="if(event.target===this)closeSect()">
  <div class="modal">
    <div class="modal-header">
      <h3>宗门</h3>
      <button class="modal-close" onclick="closeSect()">✕</button>
    </div>
    <div class="modal-body" id="sectBody"></div>
  </div>
</div>

<div id="inventoryModal" class="modal-overlay" onclick="if(event.target===this)closeInventory()">
  <div class="modal">
    <div class="modal-header">
      <h3>背包</h3>
      <button class="modal-close" onclick="closeInventory()">✕</button>
    </div>
    <div class="modal-body" id="inventoryBody"></div>
  </div>
</div>

<div id="memoryModal" class="modal-overlay" onclick="if(event.target===this)closeMemory()">
  <div class="modal">
    <div class="modal-header">
      <h3>记忆录</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-sm" id="memTabList" onclick="switchMemTab('list')" style="min-height:30px;padding:4px 10px">列表</button>

    </div>
    <div id="memoryBody" class="modal-body"></div>
    <div id="memoryGraph" class="hidden graph-viewport">

  </div>
</div>

// ========== 工具函数 ==========

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randPick(arr) { return arr[randInt(0, arr.length - 1)]; }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function randName() { return randPick(SURNAMES) + randPick(GIVEN_NAMES); }
function randMonsterName() { return randPick(MONSTER_PREFIX) + randPick(MONSTER_SUFFIX); }

function getRealmFullName(ri, si) { return REALMS[ri].name + REALMS[ri].stages[si]; }

function getTotalPower(ri, si) {
  let t = 0;
  for (let i = 0; i < ri; i++) t += REALMS[i].stages.length;
  return t + si;
}

function isMaxRealm(ri, si) {
  return ri >= REALMS.length - 1 && si >= REALMS[REALMS.length - 1].stages.length - 1;
}

function getRealmDiff(nRI, nSI, pRI, pSI) {
  const n = getTotalPower(nRI, nSI), p = getTotalPower(pRI, pSI);
  if (n > p) return 'higher';
  if (n < p) return 'lower';
  return 'equal';
}

function getRelationLabel(v, isOpp, isChild, npcId) {
  if (npcId && game && game.memoryStore) {
    const npcObj = game.memoryStore.getById(npcId);
    if (npcObj && npcObj.role === 'concubine') return game.player.gender === '男' ? '侍妾' : '男宠';
    if (npcObj && npcObj.role === 'puppet') return '傀儡';
  }
  if (isChild && npcId) {
    const npc = game && game.memoryStore ? game.memoryStore.getById(npcId) : null;
    if (npc && npc.motherNpcId) {
      const p = game.player;
      if (p.gender === '男') return npc.gender === '男' ? '子（儿子）' : '女（女儿）';
      else return npc.gender === '男' ? '子（儿子）' : '女（女儿）';
    }
    return '血亲';
  }
  const bonds = (game && game.player && game.player.bonds) || [];
  const isBonded = npcId && bonds.includes(npcId);
  if (npcId && game && game.player) {
    const p = game.player;
    const npc = game.memoryStore ? game.memoryStore.getById(npcId) : null;
    if (p.master === npcId) return '师父';
    if ((p.disciples || []).includes(npcId)) return '徒弟';
    if (p.master && npc && npc.masterNpcId === p.master) {
      const diff = getRealmDiff(npc.realmIndex, npc.stageIndex, p.realmIndex, p.stageIndex);
      if (diff === 'higher') return npc.gender === '男' ? '师兄' : '师姐';
      return npc.gender === '男' ? '师弟' : '师妹';
    }
    if (isBonded && npc && npc.spouse === '__player__') return '道侣';
    if (isBonded) return isOpp ? '义兄妹' : (p.gender === '男' ? '结拜兄弟' : '结拜姐妹');
  }
  if (v >= 60) return '情深意重';
  if (v >= 30) return '相谈甚欢';
  if (v >= -29) return '素昧平生';
  if (v >= -59) return '心存芥蒂';
  return '不共戴天';
}

function getRelationCategory(v, isChild, npcId) {
  if (isChild) return 'blood';
  const bonds = (game && game.player && game.player.bonds) || [];
  if (npcId && bonds.includes(npcId)) return 'soulmate';
  if (v >= 30) return 'friend';
  if (v >= -29) return 'neutral';
  return 'enemy';
}

function canBreakthrough(entity) {
  return !isMaxRealm(entity.realmIndex, entity.stageIndex) &&
    entity.exp >= REALMS[entity.realmIndex].expPerStage;
}

function getPillForBreakthrough(realmIndex, stageIndex) {
  const curRealm = REALMS[realmIndex];
  const isMajor = stageIndex >= curRealm.stages.length - 1;
  if (isMajor) {
    return PILLS.find(p => p.forRealm === realmIndex + 1 && p.forStage === 0) || null;
  }
  return PILLS.find(p => p.forRealm === realmIndex && p.forStage === stageIndex + 1) || null;
}

function getMaxMoveRange(realmIndex) {
  if (realmIndex <= 1) return 2;
  if (realmIndex <= 3) return 3;
  if (realmIndex <= 5) return 4;
  return 5;
}

function clearAllSaves() {
  localStorage.removeItem('xiuxian_player');
  localStorage.removeItem('xiuxian_memory');
  localStorage.removeItem('xiuxian_map');
}

// ========== NPC 类 ==========

class NPC {
  constructor(d) {
    this.id = d.id || genId();
    this.name = d.name;
    this.gender = d.gender;
    this.sect = d.sect;
    this.realmIndex = d.realmIndex !== undefined ? d.realmIndex : 0;
    this.stageIndex = d.stageIndex !== undefined ? d.stageIndex : 0;
    this.exp = d.exp || 0;
    this.lifeMax = d.lifeMax;
    this.lifeCurrent = d.lifeCurrent;
    this.personality = d.personality;
    this.isAlive = d.isAlive !== undefined ? d.isAlive : true;
    this.isPermanent = d.isPermanent || false;
    this.isChild = d.isChild || false;
    this.relations = d.relations || {};
    this.tempTurns = d.tempTurns || 0;
    this.age = d.age !== undefined ? d.age : null;
    this.pregnant = d.pregnant || null;
    this.motherNpcId = d.motherNpcId || null;
    this.spouse = d.spouse || null;
    this.masterNpcId = d.masterNpcId || null;
    this.role = d.role || null;
  }
  getRealmName() { return getRealmFullName(this.realmIndex, this.stageIndex); }
  get isMinor() { return this.age !== null && this.age < 20; }
  getRelation(id) { return this.relations[id] || 0; }
  changeRelation(id, d) { this.relations[id] = (this.relations[id] || 0) + d; }
}

// ========== 生成器 ==========

class Generator {
  createRandomNPC(playerRI, override = {}) {
    const maxRI = Math.min(playerRI + 1, REALMS.length - 1);
    const weights = [];
    for (let i = 0; i <= maxRI; i++) {
      const w = Math.pow(0.45, i);
      weights.push(w);
    }
    const total = weights.reduce((a, b) => a + b, 0);
    let roll = Math.random() * total;
    let ri = 0;
    for (let i = 0; i < weights.length; i++) {
      roll -= weights[i];
      if (roll <= 0) { ri = i; break; }
    }
    const r = REALMS[ri];
    const si = randInt(0, r.stages.length - 1);
    const defaults = {
      name: randName(), gender: randPick(['男', '女']),
      sect: Math.random() < 0.15 ? '散修' : randPick(SECT_NAMES),
      realmIndex: ri, stageIndex: si,
      exp: randInt(0, r.expPerStage - 1),
      lifeMax: r.lifeMax,
      lifeCurrent: randInt(Math.floor(r.lifeMax * 0.3), r.lifeMax),
      personality: randPick(Object.keys(PERSONALITIES)),
    };
    return new NPC({ ...defaults, ...override });
  }
}

// ========== 记忆库 ==========

class MemoryStore {
  constructor() { this.npcs = []; }
  add(npc) { npc.isPermanent = true; this.npcs.push(npc); }
  getById(id) { return this.npcs.find(n => n.id === id); }
  getAlive() { return this.npcs.filter(n => n.isAlive); }
  getDead() { return this.npcs.filter(n => !n.isAlive); }
  getAll() { return this.npcs; }
  save() { localStorage.setItem('xiuxian_memory', JSON.stringify(this.npcs)); }
  load() {
    const d = localStorage.getItem('xiuxian_memory');
    if (d) this.npcs = JSON.parse(d).map(x => new NPC(x));
  }
}

// ========== 对话引擎 ==========

class DialogueEngine {
  replaceVars(text, npc, player) {
    return text
      .replace(/\{Player_Name\}/g, player.name)
      .replace(/\{Player_Realm\}/g, getRealmFullName(player.realmIndex, player.stageIndex))
      .replace(/\{NPC_Name\}/g, npc.name)
      .replace(/\{NPC_Sect\}/g, npc.sect)
      .replace(/\{NPC_Realm\}/g, npc.getRealmName())
      .replace(/\{Parent_Call\}/g, player.gender === '男' ? '父亲' : '母亲');
  }

  getDialogue(npc, player) {
    const rel = npc.getRelation(player.id);
    const cat = getRelationCategory(rel, npc.isChild, npc.id);
    const diff = getRealmDiff(npc.realmIndex, npc.stageIndex, player.realmIndex, player.stageIndex);
    let pool;
    if (cat === 'neutral') {
      const pd = DIALOGUES.neutral[npc.personality];
      pool = pd ? pd[diff] : null;
    } else {
      pool = DIALOGUES[cat][diff];
    }
    if (!pool || !pool.length) return '……';
    return this.replaceVars(randPick(pool), npc, player);
  }

  getDeadEncounter(npc) {
    let text = randPick(DIALOGUES.deadEncounter);
    text = text.replace(/\{NPC_Name\}/g, npc.name);
    text = text.replace(/\{NPC_Sect\}/g, npc.sect);
    text = text.replace(/\{NPC_Realm\}/g, npc.getRealmName());
    return text;
  }
}

// ========== 演进引擎 ==========

class EvolutionEngine {
  advanceTime(store, years) {
    const events = [];
    for (const npc of store.getAlive()) {
      npc.lifeCurrent -= years;
      if (npc.lifeCurrent <= 0) {
        npc.isAlive = false;
        events.push({ type: 'death', npcId: npc.id, text: `传闻${npc.sect}的${npc.name}已经陨落，享寿${npc.lifeMax}载。` });
        continue;
      }
      if (!isMaxRealm(npc.realmIndex, npc.stageIndex)) {
        const gain = Math.floor(randInt(10, 50) * (1 + npc.realmIndex * 0.5));
        npc.exp = Math.min(npc.exp + gain, REALMS[npc.realmIndex].expPerStage);
        if (canBreakthrough(npc)) {
          const r = REALMS[npc.realmIndex];
          const chance = r.breakChance * (npc.stageIndex >= r.stages.length - 1 ? 0.7 : 1);
          if (Math.random() < chance) {
            npc.stageIndex++;
            npc.exp = 0;
            if (npc.stageIndex >= REALMS[npc.realmIndex].stages.length) {
              npc.stageIndex = 0;
              npc.realmIndex++;
              npc.lifeMax = REALMS[npc.realmIndex].lifeMax;
              npc.lifeCurrent += Math.floor(REALMS[npc.realmIndex].lifeMax * 0.4);
              events.push({ type: 'breakthrough', text: `传闻${npc.name}大境界突破，晋升${npc.getRealmName()}！` });
            } else {
              events.push({ type: 'breakthrough', text: `传闻${npc.name}突破至${npc.getRealmName()}。` });
            }
          }
        }
      }
    }
    return events;
  }
}

// ========== 战斗引擎 ==========

class CombatEngine {
  calcPower(ri, si, treasurePower) {
    return getTotalPower(ri, si) * 10 + (treasurePower || 0);
  }

  fight(attackerPower, defenderPower) {
    const aRoll = attackerPower * (0.8 + Math.random() * 0.4);
    const dRoll = defenderPower * (0.8 + Math.random() * 0.4);
    return aRoll >= dRoll;
  }
}

// ========== 地图系统 ==========

class MapSystem {
  constructor() {
    this.grid = [];
    this.playerX = 8;
    this.playerY = 8;
  }

  generate() {
    this.grid = [];
    for (let y = 0; y < MAP_SIZE; y++) {
      const row = [];
      for (let x = 0; x < MAP_SIZE; x++) {
        const distFromCenter = Math.abs(x - 8) + Math.abs(y - 8);
        let qi;
        if (distFromCenter <= 3) qi = Math.random() < 0.7 ? 1 : 2;
        else if (distFromCenter <= 7) qi = Math.random() < 0.5 ? 2 : (Math.random() < 0.6 ? 1 : 3);
        else if (distFromCenter <= 11) qi = Math.random() < 0.4 ? 3 : (Math.random() < 0.5 ? 2 : 4);
        else qi = Math.random() < 0.3 ? 4 : 3;
        row.push({ qi, npcIds: [], type: 'normal' });
      }
      this.grid.push(row);
    }
    for (const mp of MARKET_POSITIONS) {
      this.grid[mp.y][mp.x].type = 'market';
      this.grid[mp.y][mp.x].qi = 2;
    }
    for (const sect of SECTS) {
      const p = sect.mapPos;
      this.grid[p.y][p.x].type = 'sect';
      this.grid[p.y][p.x].sectId = sect.id;
      this.grid[p.y][p.x].qi = 3;
    }
    this.playerX = 8;
    this.playerY = 8;
  }

  getCell(x, y) { return this.grid[y]?.[x]; }

  isMarket(x, y) { const c = this.getCell(x, y); return c && c.type === 'market'; }

  shuffleQi() {
    for (let y = 0; y < MAP_SIZE; y++) {
      for (let x = 0; x < MAP_SIZE; x++) {
        const c = this.grid[y][x];
        if (c.cultivateCount > 0) c.cultivateCount = Math.max(0, c.cultivateCount - 1);
        if (c.type === 'market' || c.type === 'sect') continue;
        if (Math.random() < 0.6) {
          const shift = randPick([-1, -1, 0, 1, 1]);
          c.qi = Math.max(1, Math.min(4, c.qi + shift));
        }
      }
    }
  }

  shuffleQiLocal(px, py) {
    for (let dy = -3; dy <= 3; dy++) {
      for (let dx = -3; dx <= 3; dx++) {
        const nx = px + dx, ny = py + dy;
        if (nx < 0 || nx >= MAP_SIZE || ny < 0 || ny >= MAP_SIZE) continue;
        const c = this.grid[ny][nx];
        if (c.type === 'market' || c.type === 'sect') continue;
        if (Math.random() < 0.3) {
          c.qi = Math.max(1, Math.min(4, c.qi + randPick([-1, 1])));
        }
      }
    }
  }

  getReachable(px, py, maxRange) {
    const r = maxRange || 2;
    const cells = [];
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const dist = Math.abs(dx) + Math.abs(dy);
        if (dist === 0 || dist > r) continue;
        const nx = px + dx, ny = py + dy;
        if (nx >= 0 && nx < MAP_SIZE && ny >= 0 && ny < MAP_SIZE) {
          cells.push({ x: nx, y: ny, dist });
        }
      }
    }
    return cells;
  }

  placeNPCs(memoryStore) {
    for (const row of this.grid) for (const cell of row) cell.npcIds = [];
    for (const npc of memoryStore.getAlive()) {
      const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
      if (!(x === this.playerX && y === this.playerY)) {
        this.grid[y][x].npcIds.push(npc.id);
      }
    }
  }

  moveNPCs(memoryStore) {
    const positions = {};
    for (let y = 0; y < MAP_SIZE; y++)
      for (let x = 0; x < MAP_SIZE; x++) {
        for (const id of (this.grid[y][x].npcIds || [])) positions[id] = { x, y };
        this.grid[y][x].npcIds = [];
      }
    for (const [id, pos] of Object.entries(positions)) {
      const npc = memoryStore.getById(id);
      if (!npc || !npc.isAlive) continue;
      const dx = randInt(-2, 2), dy = randInt(-2, 2);
      const nx = Math.max(0, Math.min(MAP_SIZE - 1, pos.x + dx));
      const ny = Math.max(0, Math.min(MAP_SIZE - 1, pos.y + dy));
      this.grid[ny][nx].npcIds.push(id);
    }
  }

  save() {
    localStorage.setItem('xiuxian_map', JSON.stringify({
      grid: this.grid, playerX: this.playerX, playerY: this.playerY
    }));
  }

  load() {
    const d = localStorage.getItem('xiuxian_map');
    if (d) {
      const obj = JSON.parse(d);
      this.grid = obj.grid;
      for (const row of this.grid) for (const cell of row) {
        if (cell.npcId && !cell.npcIds) { cell.npcIds = [cell.npcId]; delete cell.npcId; }
        if (!cell.npcIds) cell.npcIds = [];
      }
      this.playerX = obj.playerX;
      this.playerY = obj.playerY;
      return true;
    }
    return false;
  }
}

    this.player = null;
    this.generator = new Generator();
    this.memoryStore = new MemoryStore();
    this.dialogueEngine = new DialogueEngine();
    this.evolutionEngine = new EvolutionEngine();
    this.combatEngine = new CombatEngine();
    this.mapSystem = new MapSystem();
    this.currentNPC = null;
    this.inEncounter = false;
    this.isDead = false;
  }

  init(name, gender, origin) {
    this.player = {
      id: 'player', name, gender,
      origin: origin || 'mortal',
      realmIndex: 0, stageIndex: 0, exp: 0,
      lifeMax: REALMS[0].lifeMax, lifeCurrent: REALMS[0].lifeMax,
      hp: REALMS[0].hpMax, hpMax: REALMS[0].hpMax,
      inventory: { lingshi: 0, pills: {}, items: [], huixuedan: 0, xunzongfu: 0 },
      skills: [], activeSkill: null,
      sect: null,
      bonds: [],
      master: null,
      disciples: [],
      concubines: [],
      puppets: [],
      worldYear: 1,
      infamy: 0,
      hunters: [],
      bountyTask: null,
      stats: { kills: 0, explored: 0, meditateYears: 0, lingshiEarned: 0, pillsUsed: 0, moved: 0, npcMet: 0, peakRealm: '练气初期' },
    };
    const saved = localStorage.getItem('xiuxian_player');
    if (saved) {
      const p = JSON.parse(saved);
      if (p.realmIndex === undefined) { p.realmIndex = 0; p.stageIndex = 0; p.exp = 0; }
      if (p.hp === undefined) { p.hp = REALMS[p.realmIndex].hpMax; p.hpMax = REALMS[p.realmIndex].hpMax; }
      if (!p.inventory) p.inventory = { lingshi: 0, pills: {}, items: [], huixuedan: 0 };
      if (p.inventory.huixuedan === undefined) p.inventory.huixuedan = 0;
      if (p.inventory.xunzongfu === undefined) p.inventory.xunzongfu = 0;
      if (!p.origin) p.origin = 'mortal';
      if (!p.concubines) p.concubines = [];
      if (!p.puppets) p.puppets = [];
      if (!p.stats) p.stats = { kills: 0, explored: 0, meditateYears: 0, lingshiEarned: 0, pillsUsed: 0, moved: 0, npcMet: 0, peakRealm: getRealmFullName(p.realmIndex, p.stageIndex) };
      this.player = p;
    } else {
      const o = ORIGINS.find(x => x.id === origin);
      if (o) o.apply(this.player);
    }
    this.memoryStore.load();
    for (const npc of this.memoryStore.getAll()) {
      if (npc.realmIndex === undefined) { npc.realmIndex = 0; npc.stageIndex = 0; npc.exp = 0; }
    }
    if (!this.mapSystem.load()) {
      this.mapSystem.generate();
      this.mapSystem.placeNPCs(this.memoryStore);
      this.mapSystem.save();
    }
    this.updateHeader();
    this.updateMarketBtn();
    this.updateNpcBtn();
    const o = ORIGINS.find(x => x.id === this.player.origin);
    this.log(`【出身：${o ? o.name : '凡人'}】${o ? o.desc : ''}`, 'system');
    this.log('你踏上了修仙之路，前方道阻且长。', 'system');
  }

  save() {
    localStorage.setItem('xiuxian_player', JSON.stringify(this.player));
    this.memoryStore.save();
  }

  getPlayerTreasurePower() {
    const base = (this.player.inventory.items || []).reduce((s, t) => s + t.power, 0);
    return this.player.origin === 'demon' ? Math.floor(base * 1.2) : base;
  }

  getPlayerCombatPower() {
    const base = this.combatEngine.calcPower(this.player.realmIndex, this.player.stageIndex, this.getPlayerTreasurePower());
    return this.player.origin === 'demon' ? Math.floor(base * 1.2) : base;
  }

  trackStat(key, val) {
    if (!this.player.stats) this.player.stats = {};
    this.player.stats[key] = (this.player.stats[key] || 0) + (val || 1);
  }

  updatePeakRealm() {
    if (!this.player.stats) this.player.stats = {};
    this.player.stats.peakRealm = getRealmFullName(this.player.realmIndex, this.player.stageIndex);
  }

  worldTick(years) {
    this.player.worldYear = (this.player.worldYear || 1) + years;
    this.player.lifeCurrent -= years;
    document.getElementById('worldYear').textContent = this.player.worldYear;
    for (const npc of this.memoryStore.getAlive()) {
      npc.lifeCurrent -= years;
      if (npc.lifeCurrent <= 0) {
        npc.isAlive = false;
        if (npc.role === 'concubine') this.player.concubines = (this.player.concubines||[]).filter(id => id !== npc.id);
        if (npc.role === 'puppet') this.player.puppets = (this.player.puppets||[]).filter(id => id !== npc.id);
        const rel = npc.getRelation(this.player.id);
        const bonds = this.player.bonds || [];
        const isBond = bonds.includes(npc.id);
        const isMaster = this.player.master === npc.id;
        const isDisciple = (this.player.disciples || []).includes(npc.id);
        const isChild = npc.isChild || npc.motherNpcId;
        const isConcubine = npc.role === 'concubine';
        const isPuppet = npc.role === 'puppet';
        const causes = ['寿元耗尽','修炼走火入魔','遭妖兽袭击','突破失败灵力反噬','被仇家追杀','陨落于秘境之中','遭遇天劫'];
        const cause = npc.lifeCurrent <= -20 ? '寿元耗尽' : randPick(causes);
        let deathMsg = '';
        if (isConcubine) deathMsg = `你的${this.player.gender === '男' ? '侍妾' : '男宠'}<span class="npc-name">${npc.name}</span>因${cause}而陨落！`;
        else if (isPuppet) deathMsg = `你的傀儡<span class="npc-name">${npc.name}</span>因${cause}而损毁！`;
        else if (npc.spouse === '__player__') deathMsg = `噩耗——你的道侣<span class="npc-name">${npc.name}</span>因${cause}而陨落！`;
        else if (isChild) deathMsg = `噩耗——你的${npc.gender === '男' ? '儿子' : '女儿'}<span class="npc-name">${npc.name}</span>因${cause}而陨落！`;
        else if (isMaster) deathMsg = `悲痛——你的师父<span class="npc-name">${npc.name}</span>因${cause}而仙逝……`;
        else if (isDisciple) deathMsg = `你的徒弟<span class="npc-name">${npc.name}</span>因${cause}而身陨！`;
        else if (isBond) deathMsg = `至交<span class="npc-name">${npc.name}</span>因${cause}而陨落……`;
        else if (rel >= 30) deathMsg = `传闻好友${npc.name}因${cause}而陨落。`;
        else if (npc.isPermanent) { this.log(`传闻${npc.name}因${cause}而陨落。`, ''); continue; }
        if (deathMsg) {
          showScenePopup('danger', npc.name + ' 陨落', 2000);
          this.log(deathMsg, 'danger');
        }
      }
      if (npc.age !== null) npc.age += years;
      if (npc.pregnant) {
        npc.pregnant.turnsLeft -= years;
        if (npc.pregnant.turnsLeft <= 0) {
          const baby = this.generator.createRandomNPC(0, {
            name: npc.pregnant.name, gender: npc.pregnant.gender,
            sect: this.player.sect ? (getSectById(this.player.sect)||{}).name || '散修' : '散修',
            realmIndex: 0, stageIndex: 0, exp: 0,
          });
          baby.isChild = true; baby.age = 0; baby.motherNpcId = npc.id;
          baby.isPermanent = true; baby.changeRelation(this.player.id, 100);
          this.memoryStore.add(baby);
          npc.pregnant = null;
          showScenePopup('success', '喜得贵子', 2000);
          this.log(`<span class="npc-name">${npc.name}</span>诞下一${baby.gender === '男' ? '子' : '女'}，取名<span class="npc-name">${baby.name}</span>！`, 'pink');
        }
      }
      if (npc.age !== null && npc.isChild && npc.age >= 20 && npc.age - years < 20) {
        showScenePopup('success', npc.name + ' 成年', 1800);
        this.log(`你的${npc.gender === '男' ? '儿子' : '女儿'}<span class="npc-name">${npc.name}</span>已经成年！`, 'pink');
        this.placeNpcOnMap(npc); npc.tempTurns = 3;
      }
    }
    for (const npc of this.memoryStore.getAlive()) {
      const bonds = this.player.bonds || [];
      const isClose = bonds.includes(npc.id) || this.player.master === npc.id ||
        (this.player.disciples||[]).includes(npc.id) || npc.isChild || npc.motherNpcId;
      if (!isClose) continue;
      if (npc.rescueTask) {
        npc.lifeCurrent = Math.max(npc.lifeCurrent, 10);
      }
      if (npc.lifeCurrent > 0 && !npc.rescueTask && Math.random() < 0.05) {
        const rescueTypes = [
          { msg: '被歹人追杀，速来援助', type: 'fight', desc: '击退歹人' },
          { msg: '遭遇强敌，需要帮手', type: 'fight', desc: '击退强敌' },
          { msg: '急需突破丹药，你可有', type: 'pill', desc: '送突破丹药' },
          { msg: '灵石告急，能否接济', type: 'lingshi', desc: '接济灵石' },
        ];
        const rt = randPick(rescueTypes);
        this.placeNpcOnMap(npc);
        npc.tempTurns = 20;
        npc.rescueTask = rt;
        let pos = '';
        for (let y = 0; y < MAP_SIZE; y++)
          for (let x = 0; x < MAP_SIZE; x++)
            if ((this.mapSystem.grid[y][x].npcIds||[]).includes(npc.id)) pos = `（${x+1},${y+1}）`;
        showScenePopup('danger', npc.name + ' 求救', 2500);
        this.log(`<span class="npc-name">${npc.name}</span>传来求救：「${rt.msg}！我在${pos}，快来！」`, 'danger');
      }
    }

    if (this.player.lifeCurrent <= 0) {
      this.die('你的寿元已尽，道消身陨……游戏结束。');
    }
  }

  placeNpcAtPlayer(npc) {
    this.removeNpcFromCell(npc);
    const cell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
    if (cell) {
      if (!cell.npcIds) cell.npcIds = [];
      if (!cell.npcIds.includes(npc.id)) cell.npcIds.push(npc.id);
    }
  }

  removeNpcFromCell(npc) {
    for (let y = 0; y < MAP_SIZE; y++)
      for (let x = 0; x < MAP_SIZE; x++) {
        const ids = this.mapSystem.grid[y][x].npcIds || [];
        const idx = ids.indexOf(npc.id);
        if (idx !== -1) ids.splice(idx, 1);
      }
  }

  placeNpcOnMap(npc) {
    for (let y = 0; y < MAP_SIZE; y++)
      for (let x = 0; x < MAP_SIZE; x++) {
        const ids = this.mapSystem.grid[y][x].npcIds || [];
        const idx = ids.indexOf(npc.id);
        if (idx !== -1) ids.splice(idx, 1);
      }
    const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
    if (!this.mapSystem.grid[y][x].npcIds) this.mapSystem.grid[y][x].npcIds = [];
    this.mapSystem.grid[y][x].npcIds.push(npc.id);
  }

  moveFollowers() {
    const ids = [...(this.player.concubines || []), ...(this.player.puppets || [])];
    for (const id of ids) {
      const npc = this.memoryStore.getById(id);
      if (npc && npc.isAlive) this.placeNpcAtPlayer(npc);
    }
  }

  getFollowerAtk() {
    let atk = 0;
    for (const id of (this.player.concubines || [])) {
      const npc = this.memoryStore.getById(id);
      if (npc && npc.isAlive) atk += getTotalPower(npc.realmIndex, npc.stageIndex) * 4;
    }
    for (const id of (this.player.puppets || [])) {
      const npc = this.memoryStore.getById(id);
      if (npc && npc.isAlive) atk += getTotalPower(npc.realmIndex, npc.stageIndex) * 6;
    }
    return atk;
  }

  getFollowerNames() {
    const names = [];
    for (const id of (this.player.concubines || [])) {
      const npc = this.memoryStore.getById(id);
      if (npc && npc.isAlive) names.push(npc.name + '(侍)');
    }
    for (const id of (this.player.puppets || [])) {
      const npc = this.memoryStore.getById(id);
      if (npc && npc.isAlive) names.push(npc.name + '(傀)');
    }
    return names;
  }

  dismissFollower(npcId) {
    const npc = this.memoryStore.getById(npcId);
    if (!npc) return;
    if (npc.role === 'concubine') {
      this.player.concubines = (this.player.concubines || []).filter(id => id !== npcId);
      npc.role = null;
      const label = this.player.gender === '男' ? '侍妾' : '男宠';
      this.log(`你释放了${label}${npc.name}，让其自行离去。`, 'system');
    } else if (npc.role === 'puppet') {
      this.player.puppets = (this.player.puppets || []).filter(id => id !== npcId);
      npc.role = null;
      npc.isAlive = false;
      this.log(`你解除了傀儡${npc.name}的术法，其灵体消散。`, 'system');
    }
    this.removeNpcFromCell(npc);
    if (npc.isAlive) this.placeNpcOnMap(npc);
    this.memoryStore.save();
    this.save();
    this.updateHeader();
    this.updateNpcBtn();
    this.showMainActions();
  }

  applyOriginRelation(npc) {
    const o = this.player.origin;
    if (o === 'sect') {
      if (npc.personality === 'righteous' || npc.personality === 'kind') npc.changeRelation(this.player.id, 10);
    } else if (o === 'noble') {
      if (npc.personality === 'greedy') npc.changeRelation(this.player.id, 15);
    } else if (o === 'demon') {
      npc.changeRelation(this.player.id, -15);
      if (npc.personality === 'sinister') npc.changeRelation(this.player.id, 35);
    }
    const infamy = this.player.infamy || 0;
    if (infamy >= 30) {
      const sectObj = getSectByName(npc.sect);
      if (sectObj && sectObj.type === '正') npc.changeRelation(this.player.id, -10);
    }
    if (this.player.sect && npc.sect) {
      const playerSect = getSectById(this.player.sect);
      const npcSect = getSectByName(npc.sect);
      if (playerSect && npcSect) {
        if (playerSect.id === npcSect.id) {
          npc.changeRelation(this.player.id, 30);
        } else if (playerSect.rivals.includes(npcSect.id)) {
          npc.changeRelation(this.player.id, -20);
        }
      }
    }
  }

  updateHeader() {
    const p = this.player;
    document.getElementById('playerName').textContent = p.name;
    document.getElementById('playerGender').textContent = p.gender;
    const originObj = ORIGINS.find(x => x.id === p.origin);
    document.getElementById('playerOrigin').textContent = originObj ? originObj.name : '凡人';
    const playerSect = p.sect ? getSectById(p.sect) : null;
    document.getElementById('playerSect').textContent = playerSect ? playerSect.name : '散修';
    document.getElementById('playerRealm').textContent = getRealmFullName(p.realmIndex, p.stageIndex);
    document.getElementById('playerLife').textContent = p.lifeCurrent;
    document.getElementById('playerLingshi').textContent = p.inventory.lingshi;
    const ms = this.mapSystem;
    document.getElementById('playerPos').textContent = `${ms.playerX+1},${ms.playerY+1}`;
    const cell = ms.getCell(ms.playerX, ms.playerY);
    document.getElementById('posQi').textContent = cell ? ` · ${cell.type === 'market' ? '坊市' : cell.type === 'sect' ? (getSectById(cell.sectId)||{}).name||'' : QI_NAMES[cell.qi]}` : '';
    const infamy = p.infamy || 0;
    let infamyText = '';
    if (infamy >= 100) infamyText = ' · <span style="color:var(--red)">人人喊打</span>';
    else if (infamy >= 60) infamyText = ' · <span style="color:var(--red)">臭名昭著</span>';
    else if (infamy >= 30) infamyText = ' · <span style="color:#e67e22">恶名远播</span>';
    document.getElementById('playerInfamy').innerHTML = infamyText;
    document.getElementById('worldYear').textContent = p.worldYear || 1;
    const skillPow = p.activeSkill ? (getSkillById(p.activeSkill)||{}).power||0 : 0;
    const totalPow = getTotalPower(p.realmIndex, p.stageIndex) * 8 + this.getPlayerTreasurePower() + skillPow;
    document.getElementById('playerPower').textContent = p.origin === 'demon' ? Math.floor(totalPow * 1.2) : totalPow;
    const cc = (p.concubines || []).filter(id => { const n = this.memoryStore.getById(id); return n && n.isAlive; }).length;
    const pp = (p.puppets || []).filter(id => { const n = this.memoryStore.getById(id); return n && n.isAlive; }).length;
    let fText = '';
    if (cc > 0) fText += ` · <span style="color:var(--pink)">侍${cc}</span>`;
    if (pp > 0) fText += ` · <span style="color:#9b59b6">傀${pp}</span>`;
    document.getElementById('playerFollowers').innerHTML = fText;

    const maxExp = REALMS[p.realmIndex].expPerStage;
    const atMax = isMaxRealm(p.realmIndex, p.stageIndex);
    const full = !atMax && p.exp >= maxExp;
    const pct = atMax ? 100 : Math.min(100, Math.floor(p.exp / maxExp * 100));
    const fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.className = 'progress-fill' + (full ? ' full' : '');
    document.getElementById('progressText').textContent =
      atMax ? '修为圆满' : (full ? `修为已满 可尝试突破！` : `修为 ${p.exp}/${maxExp}`);

    const hpPct = Math.max(0, Math.floor(p.hp / p.hpMax * 100));
    document.getElementById('hpFill').style.width = hpPct + '%';
    document.getElementById('hpText').textContent = `气血 ${p.hp}/${p.hpMax}`;

    const btn = document.getElementById('btnBreakthrough');
    if (full) {
      const pill = getPillForBreakthrough(p.realmIndex, p.stageIndex);
      const hasPill = pill ? (p.inventory.pills[pill.id] || 0) > 0 : true;
      if (pill && !hasPill) {
        btn.className = 'btn';
        btn.disabled = true;
        btn.textContent = `需要${pill.name}`;
      } else {
        btn.className = 'btn btn-glow';
        btn.disabled = false;
        btn.textContent = '尝试突破';
      }
    } else {
      btn.className = 'btn';
      btn.disabled = atMax || !full;
      btn.textContent = '尝试突破';
    }
  }

  updateNpcBtn() {
    const cell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
    const row = document.getElementById('npcBtnRow');
    const npcIds = (cell && cell.npcIds) ? cell.npcIds.filter(id => { const n = this.memoryStore.getById(id); return n && n.isAlive; }) : [];
    if (npcIds.length > 0) {
      row.classList.remove('hidden');
      const rescueNpc = npcIds.map(id => this.memoryStore.getById(id)).find(n => n && n.rescueTask);
      if (rescueNpc) {
        document.getElementById('npcBtnText').textContent = `救援 ${rescueNpc.name}（${rescueNpc.rescueTask.desc}）`;
        document.getElementById('npcBtnText').onclick = () => this.doRescue(rescueNpc);
      } else {
        const names = npcIds.map(id => this.memoryStore.getById(id).name);
        document.getElementById('npcBtnText').textContent = `此处有人（${npcIds.length}）：${names.join('、')}`;
        document.getElementById('npcBtnText').onclick = showNpcHere;
      }
      return;
    }
    row.classList.add('hidden');
  }

  updateMarketBtn() {
    const cell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
    document.getElementById('marketBtnRow').classList.toggle('hidden', !cell || cell.type !== 'market');
    const sectRow = document.getElementById('sectBtnRow');
    if (cell && cell.type === 'sect' && cell.sectId) {
      const s = getSectById(cell.sectId);
      sectRow.classList.remove('hidden');
      document.getElementById('sectBtnText').textContent = s ? s.name : '宗门驻点';
    } else {
      sectRow.classList.add('hidden');
    }
    const ruinRow = document.getElementById('ruinBtnRow');
    if (cell && cell.ruin) {
      ruinRow.classList.remove('hidden');
      const r = RUINS[cell.ruin.id];
      document.getElementById('ruinBtnText').textContent = `探索遗迹：${r ? r.name : '未知'}`;
    } else {
      ruinRow.classList.add('hidden');
    }
  }

  log(text, type) {
    const area = document.getElementById('logArea');
    const div = document.createElement('div');
    div.className = 'log-entry' + (type ? ' ' + type : '');
    div.innerHTML = text;
    area.appendChild(div);
    requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; setTimeout(() => area.scrollTop = area.scrollHeight, 100); });
  }

  hideAllActions() {
    document.getElementById('mainActions').classList.add('hidden');
    document.getElementById('encounterActions').classList.add('hidden');
    document.getElementById('dialogueActions').classList.add('hidden');
  }

  showMainActions() {
    this.hideAllActions();
    document.getElementById('mainActions').classList.remove('hidden');
    this.inEncounter = false;
    this.currentNPC = null;
    this.updateNpcBtn();
  }

  die(msg) {
    this.isDead = true;
    clearAllSaves();
    document.getElementById('gameScreen').classList.add('hidden');
    const p = this.player;
    const o = ORIGINS.find(x => x.id === p.origin);
    const s = p.stats || {};
    const ds = document.getElementById('deathScreen');
    ds.classList.remove('hidden');
    ds.innerHTML = `
      <div class="death-title">道 消 身 陨</div>
      <div class="death-cause">${msg}</div>
      <div class="death-card">
        <div class="dc-name">${p.name}</div>
        <div class="dc-info">
          ${p.gender} · ${o ? o.name : '凡人'}<br>
          最终境界：${getRealmFullName(p.realmIndex, p.stageIndex)}<br>
          最高境界：${s.peakRealm || '练气初期'}<br>
          剩余寿元：${Math.max(0, p.lifeCurrent)}
        </div>
      </div>
      <div class="death-stats">
        <div class="death-stat"><div class="ds-val">${s.kills||0}</div><div class="ds-label">击杀数</div></div>
        <div class="death-stat"><div class="ds-val">${s.explored||0}</div><div class="ds-label">探索次数</div></div>
        <div class="death-stat"><div class="ds-val">${s.moved||0}</div><div class="ds-label">移动步数</div></div>
        <div class="death-stat"><div class="ds-val">${s.npcMet||0}</div><div class="ds-label">遭遇修仙者</div></div>
        <div class="death-stat"><div class="ds-val">${s.meditateYears||0}</div><div class="ds-label">闭关总年数</div></div>
        <div class="death-stat"><div class="ds-val">${s.lingshiEarned||0}</div><div class="ds-label">累计获灵石</div></div>
        <div class="death-stat"><div class="ds-val">${s.pillsUsed||0}</div><div class="ds-label">消耗丹药</div></div>
        <div class="death-stat"><div class="ds-val">${(p.inventory.items||[]).length}</div><div class="ds-label">持有宝物</div></div>
      </div>
      <button class="death-btn" onclick="location.reload()">重 入 轮 回</button>
    `;
  }

  showDialogueOptions(npc) {
    this.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    container.innerHTML = '';

    const rel = npc.getRelation(this.player.id);
    const cat = getRelationCategory(rel, npc.isChild, npc.id);
    const options = REPLIES[cat] || REPLIES.neutral;

    const row = document.createElement('div');
    row.className = 'btn-row';
    row.style.gridTemplateColumns = `repeat(${options.length}, 1fr)`;

    for (let i = 0; i < options.length; i++) {
      const opt = options[i];
      const btn = document.createElement('button');
      btn.className = 'btn btn-reply';
      btn.textContent = opt.text;
      btn.onclick = () => this.handleReply(npc, opt, i);
      row.appendChild(btn);
    }
    container.appendChild(row);
    if (localStorage.getItem('xiuxian_ai_enabled') === 'true' && localStorage.getItem('xiuxian_ai_key')) {
      const chatRow = document.createElement('div');
      chatRow.style.cssText = 'display:flex;gap:6px;margin-top:6px';
      chatRow.innerHTML = `<input id="npcChatInput" placeholder="自由对话..." style="flex:1;background:var(--bg);color:var(--text);border:1px solid var(--gold-dim);border-radius:6px;padding:8px;font-size:13px;font-family:inherit"><button class="btn btn-sm" onclick="game.aiReplyToNpc()">发送</button>`;
      container.appendChild(chatRow);
    }
  }

  aiReplyToNpc() {
    const input = document.getElementById('npcChatInput');
    if (!input || !input.value.trim() || !this.currentNPC) return;
    const msg = input.value.trim();
    const npc = this.currentNPC;
    input.value = '';
    this.log(`你：<span class="dialogue">"${msg}"</span>`, 'player-speech');
    this.log(`<span style="color:var(--text-dim)">${npc.name}思索中……</span>`, '');
    aiChat(npc, msg).then(reply => {
      const area = document.getElementById('logArea');
      if (area.lastChild) area.removeChild(area.lastChild);
      if (reply) {
        const { text, cmds } = this.parseAiCommands(reply, npc);
        this.log(`<span class="npc-name">${npc.name}</span>：<span class="dialogue">"${text}"</span>`);
        for (const cmd of cmds) this.executeAiCommand(cmd, npc);
      } else {
        const fallback = this.dialogueEngine.getDialogue(npc, this.player);
        this.log(`<span class="npc-name">${npc.name}</span>：<span class="dialogue">"${fallback}"</span>`);
      }
      this.updateHeader(); this.save();
    });
  }

  parseAiCommands(reply, npc) {
    const cmds = [];
    let text = reply;
    const patterns = [
      { re: /\[送灵石[：:](\d+)\]/g, type: 'giveLingshi' },
      { re: /\[送丹药\]/g, type: 'givePill' },
      { re: /\[好感\+(\d+)\]/g, type: 'relUp' },
      { re: /\[好感-(\d+)\]/g, type: 'relDown' },
      { re: /\[双修\]/g, type: 'dual' },
      { re: /\[表白\]/g, type: 'propose' },
      { re: /\[结拜\]/g, type: 'bond' },
      { re: /\[传功[：:](\d+)\]/g, type: 'teachExp' },
    ];
    for (const p of patterns) {
      let m;
      while ((m = p.re.exec(reply)) !== null) {
        cmds.push({ type: p.type, value: m[1] ? parseInt(m[1]) : 0 });
      }
      text = text.replace(p.re, '');
    }
    return { text: text.trim(), cmds };
  }

  executeAiCommand(cmd, npc) {
    const p = this.player;
    if (cmd.type === 'giveLingshi') {
      const v = Math.min(cmd.value, Math.max(50, npc.realmIndex * 30));
      p.inventory.lingshi += v;
      this.trackStat('lingshiEarned', v);
      this.log(`${npc.name}赠你 ${v} 灵石。`, 'success');
    } else if (cmd.type === 'givePill') {
      const maxR = Math.min(npc.realmIndex + 1, 7);
      const avail = PILLS.filter(pp => pp.forRealm <= maxR);
      if (avail.length) {
        const dp = randPick(avail);
        p.inventory.pills[dp.id] = (p.inventory.pills[dp.id] || 0) + 1;
        this.log(`${npc.name}赠你一颗<span class="npc-name">${dp.name}</span>。`, 'loot');
      }
    } else if (cmd.type === 'relUp') {
      const v = Math.min(cmd.value, 10);
      npc.changeRelation(p.id, v);
      this.log(`好感度 +${v}`, 'success');
    } else if (cmd.type === 'relDown') {
      const v = Math.min(cmd.value, 10);
      npc.changeRelation(p.id, -v);
      this.log(`好感度 -${v}`, 'danger');
    } else if (cmd.type === 'dual' && (npc.spouse === '__player__' || npc.role === 'concubine')) {
      showScenePopup('dual', '双 修', 2000);
      this.worldTick(1);
      if (this.isDead) return;
      const expGain = randInt(40, 100);
      const hpGain = Math.floor(p.hpMax * 0.2);
      p.exp = Math.min(p.exp + expGain, REALMS[p.realmIndex].expPerStage);
      p.hp = Math.min(p.hpMax, p.hp + hpGain);
      p.lifeCurrent += randInt(2, 5);
      this.log(`与${npc.name}双修，修为+${expGain}，气血+${hpGain}。`, 'pink');
    } else if (cmd.type === 'propose' && !npc.isChild) {
      showScenePopup('dual', '结 为 道 侣', 2000);
      if (!p.bonds) p.bonds = [];
      if (!p.bonds.includes(npc.id)) p.bonds.push(npc.id);
      npc.spouse = '__player__';
      npc.changeRelation(p.id, 30);
      this.log(`【${npc.name}成为你的道侣】`, 'pink');
    } else if (cmd.type === 'bond' && !npc.isChild) {
      showScenePopup('bond', '义 结 金 兰', 2000);
      if (!p.bonds) p.bonds = [];
      if (!p.bonds.includes(npc.id)) p.bonds.push(npc.id);
      npc.changeRelation(p.id, 20);
      this.log(`【与${npc.name}结拜】`, 'success');
    } else if (cmd.type === 'teachExp' && p.master === npc.id) {
      const v = Math.min(cmd.value, 50);
      p.exp = Math.min(p.exp + v, REALMS[p.realmIndex].expPerStage);
      this.log(`师父传功，修为+${v}。`, 'success');
    }
    this.memoryStore.save();
  }

  handleReply(npc, opt, idx) {
    const playerDialogue = this.dialogueEngine.replaceVars(opt.dialogue, npc, this.player);
    this.log(`你：<span class="dialogue">"${playerDialogue}"</span>`, 'player-speech');

    npc.changeRelation(this.player.id, opt.mod);

    const rel = npc.getRelation(this.player.id);
    const cat = getRelationCategory(rel, npc.isChild, npc.id);
    const npcReplies = NPC_REPLY_AFTER[cat] || NPC_REPLY_AFTER.neutral;
    const replyIdx = Math.min(idx, npcReplies.length - 1);
    const npcReply = this.dialogueEngine.replaceVars(npcReplies[replyIdx], npc, this.player);
    this.log(`<span class="npc-name">${npc.name}</span>：<span class="dialogue">"${npcReply}"</span>`);

    if (opt.mod !== 0) {
      const sign = opt.mod > 0 ? '+' : '';
      this.log(`好感度 ${sign}${opt.mod}`, opt.mod > 0 ? 'success' : 'danger');
    }

    this.showEncounterActions(npc);
  }

  showEncounterActions(npc) {
    this.hideAllActions();
    const container = document.getElementById('encounterActions');
    container.classList.remove('hidden');
    container.innerHTML = '';

    const rel = npc.getRelation(this.player.id);
    const isOpp = npc.gender !== this.player.gender;
    const isBonded = (this.player.bonds || []).includes(npc.id);
    const isConcubine = npc.role === 'concubine';
    const isPuppet = npc.role === 'puppet';

    if (isPuppet) {
      container.innerHTML = `<div style="color:var(--text-dim);font-size:13px;margin-bottom:6px">${npc.name}（傀儡）面无表情地等待命令。</div>
        <div class="btn-row" style="grid-template-columns:1fr 1fr">
          <button class="btn" style="color:var(--red)" onclick="game.dismissFollower('${npc.id}')">解除傀儡</button>
          <button class="btn" onclick="game.interact('leave')">离开</button>
        </div>`;
      this.inEncounter = true;
      return;
    }

    if (isConcubine) {
      const label = this.player.gender === '男' ? '侍妾' : '男宠';
      const cRel = npc.getRelation(this.player.id);
      let cAttitude, cColor;
      if (cRel <= -30) { cAttitude = `${npc.name}面如死灰，眼神空洞，机械地行礼："主人……有何吩咐。"`; cColor = 'var(--text-dim)'; }
      else if (cRel <= -10) { cAttitude = `${npc.name}微微发抖，畏惧地低下头："主人……奴婢在。"`; cColor = '#888'; }
      else if (cRel <= 15) { cAttitude = `${npc.name}恭敬地站在一旁，表情平淡："主人有事请吩咐。"`; cColor = 'var(--text-dim)'; }
      else if (cRel <= 40) { cAttitude = `${npc.name}微微一笑，柔声道："主人回来了。"`; cColor = 'var(--text)'; }
      else if (cRel <= 60) { cAttitude = `${npc.name}眼中带笑，主动迎上来："主人，想你了。"`; cColor = 'var(--pink)'; }
      else { cAttitude = `${npc.name}满脸幸福地偎依过来："能陪在主人身边，真好。"`; cColor = 'var(--pink)'; }
      container.innerHTML = `<div style="color:${cColor};font-size:13px;margin-bottom:6px">${cAttitude}<span style="color:var(--text-dim);font-size:11px">（${label} · 好感${cRel}）</span></div>
        <div class="btn-row three">
          <button class="btn btn-pink" onclick="game.interact('dual')">双修</button>
          <button class="btn" onclick="game.interact('gift')">赠礼</button>
          <button class="btn" style="color:var(--red)" onclick="game.dismissFollower('${npc.id}')">释放</button>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="game.interact('leave')" style="grid-column:1/-1">离开</button>
        </div>`;
      this.inEncounter = true;
      return;
    }

    let row1 = '<div class="btn-row three">';
    row1 += '<button class="btn" onclick="game.interact(\'spar\')">切磋</button>';
    row1 += '<button class="btn" onclick="game.interact(\'gift\')">赠礼</button>';
    row1 += '<button class="btn" onclick="game.interact(\'rob\')">抢夺</button>';
    row1 += '</div>';

    let row2 = '<div class="btn-row">';
    const btns2 = [];
    if (npc.spouse === '__player__' && !npc.isChild) {
      btns2.push('<button class="btn btn-pink" onclick="game.interact(\'dual\')">双修</button>');
    }
    if (rel >= 60 && !isBonded && isOpp && !npc.isChild) {
      btns2.push(`<button class="btn btn-pink" onclick="game.interactPropose('${npc.id}','couple')">请求结为道侣</button>`);
    }
    if (rel >= 60 && !isBonded && !npc.isChild) {
      btns2.push(`<button class="btn" onclick="game.interactPropose('${npc.id}','bond')">请求结拜</button>`);
    }
    const npcHigher2 = getRealmDiff(npc.realmIndex, npc.stageIndex, this.player.realmIndex, this.player.stageIndex) === 'higher';
    const npcLower2 = getRealmDiff(npc.realmIndex, npc.stageIndex, this.player.realmIndex, this.player.stageIndex) === 'lower';
    const isMaster2 = this.player.master === npc.id;
    const isDisciple2 = (this.player.disciples||[]).includes(npc.id);
    if (!isMaster2 && !isDisciple2 && !this.player.master && npcHigher2 && rel >= 30 && !npc.isChild) {
      btns2.push(`<button class="btn" style="border-color:var(--gold);color:var(--gold)" onclick="game.interactPropose('${npc.id}','apprentice')">拜师</button>`);
    }
    if (!isMaster2 && !isDisciple2 && npcLower2 && rel >= 30 && !npc.isChild) {
      btns2.push(`<button class="btn" style="border-color:var(--gold);color:var(--gold)" onclick="game.interactPropose('${npc.id}','recruit')">收徒</button>`);
    }
    btns2.push(`<button class="btn" onclick="game.interact('leave')"${btns2.length ? '' : ' style="grid-column:1/-1"'}>离开</button>`);
    if (btns2.length > 1) row2 = `<div class="btn-row" style="grid-template-columns:repeat(${btns2.length},1fr)">`;
    row2 += btns2.join('') + '</div>';

    container.innerHTML = row1 + row2;
    this.inEncounter = true;
  }

  // ===== 地图移动 =====
  movePlayer(tx, ty) {
    if (this.isDead) return;
    const maxRange = getMaxMoveRange(this.player.realmIndex);
    const dist = Math.abs(tx - this.mapSystem.playerX) + Math.abs(ty - this.mapSystem.playerY);
    if (dist === 0 || dist > maxRange) return;

    this.worldTick(dist);
    if (this.isDead) { closeMap(); return; }

    this.mapSystem.playerX = tx;
    this.mapSystem.playerY = ty;
    this.mapSystem.save();
    this.trackStat('moved', dist);

    const cell = this.mapSystem.getCell(tx, ty);
    let locMsg;
    if (cell.type === 'market') locMsg = '这里是一处坊市。';
    else if (cell.type === 'sect' && cell.sectId) { const s = getSectById(cell.sectId); locMsg = `这里是${s ? s.name : '一处宗门'}的驻地。`; }
    else locMsg = `此地灵气：${QI_NAMES[cell.qi]}。`;
    this.log(`你移动至（${tx+1},${ty+1}），${locMsg}消耗寿元${dist}年。`, 'system');

    this.updateHeader();
    this.updateMarketBtn();
    this.save();
    closeMap();

    this.moveFollowers();
    this.updateNpcBtn();
    if (cell.type === 'normal' && (!cell.npcIds || !cell.npcIds.length) && Math.random() < 0.15) {
      this.triggerRandomEvent();
    }
  }

  // ===== 探索 =====
  doExplore() {
    if (this.isDead || this.inEncounter) return;
    showScenePopup('explore', '探 索', 1200);
    this.trackStat('explored');

    this.worldTick(1);
    if (this.isDead) return;

    const cell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
    const qi = cell ? cell.qi : 2;

    if (this.player.bountyTask && !this.player.bountyTask.done) {
      const bt = this.player.bountyTask;
      if (this.mapSystem.playerX === bt.x && this.mapSystem.playerY === bt.y) {
        if (bt.type === 'slay') {
          this.log(`你找到了悬赏目标！一头凶猛的妖兽挡在面前！`, 'combat');
          this.encounterMonster();
        } else if (bt.type === 'capture') {
          const target = this.generator.createRandomNPC(this.player.realmIndex, { personality: 'sinister' });
          this.log(`你发现了悬赏通缉犯<span class="npc-name">${target.name}</span>！`, 'combat');
          target.changeRelation(this.player.id, -40);
          this.resolveCombatWithNPC(target, false);
        } else {
          const amount = randInt(20, 60);
          this.player.inventory.lingshi += amount;
          this.log(`你在此处找到了悬赏物品，额外获得 ${amount} 灵石。`, 'loot');
        }
        bt.done = true;
        showScenePopup('success', '悬 赏 完 成', 1500);
        this.log(`悬赏完成！回坊市领取 ${bt.reward} 灵石奖励。`, 'success');
        this.updateHeader(); this.save();
        return;
      }
    }
    if (cell && cell.rift) {
      showScenePopup('loot', '秘 境 探 索', 1500);
      delete cell.rift;
      const r = Math.random();
      if (r < 0.33) {
        const amount = randInt(100, 300) * Math.max(1, this.player.realmIndex);
        this.player.inventory.lingshi += amount;
        this.trackStat('lingshiEarned', amount);
        this.log(`你踏入秘境裂缝，发现一座灵石矿脉！获得 ${amount} 灵石！`, 'loot');
      } else if (r < 0.66) {
        const maxR = Math.min(this.player.realmIndex + 2, 7);
        const avail = PILLS.filter(pp => pp.forRealm <= maxR);
        const dp = avail.length ? randPick(avail) : null;
        if (dp) {
          this.player.inventory.pills[dp.id] = (this.player.inventory.pills[dp.id] || 0) + 1;
          this.log(`秘境中藏有一颗<span class="npc-name">${dp.name}</span>！`, 'loot');
        }
      } else {
        const tier = Math.min(this.player.realmIndex + 2, TREASURES.length - 1);
        const t = { ...TREASURES[randInt(Math.max(0, tier - 1), tier)] };
        this.player.inventory.items.push(t);
        this.log(`秘境深处发现宝物——<span class="npc-name">${t.name}</span>（战力+${t.power}）！`, 'loot');
      }
      this.mapSystem.save();
      this.updateHeader(); this.save();
      return;
    }
    if (cell && cell.herb) {
      delete cell.herb;
      const r = Math.random();
      if (r < 0.5) {
        const amount = randInt(20, 80) * Math.max(1, qi);
        this.player.inventory.lingshi += amount;
        this.trackStat('lingshiEarned', amount);
        this.log(`你采集到天材地宝，价值 ${amount} 灵石！`, 'loot');
      } else {
        const maxR = Math.min(this.player.realmIndex + 1, 7);
