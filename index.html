<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>修仙录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #1a1a2e;
  --bg-light: #16213e;
  --bg-card: #0f3460;
  --gold: #d4a853;
  --gold-dim: #a07d3a;
  --text: #e8dcc8;
  --text-dim: #9a8e7a;
  --red: #c0392b;
  --green: #27ae60;
  --blue: #5dade2;
  --pink: #e91e63;
  --purple: #9b59b6;
}

html { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: fixed;
  inset: 0;
  max-width: 500px;
  margin: 0 auto;
}

.header {
  background: var(--bg-light);
  border-bottom: 1px solid var(--gold-dim);
  padding: 10px 16px 8px;
  text-align: center;
  flex-shrink: 0;
  position: relative;
}
.header h1 { font-size: 18px; color: var(--gold); font-weight: normal; letter-spacing: 4px; }
.header .player-info { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.header .player-res { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.header .player-res .lingshi { color: var(--gold); }
.bars-wrap { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
.progress-bar {
  background: var(--bg);
  border-radius: 4px;
  height: 13px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: 4px;
  transition: width 0.4s ease;
}
.progress-fill.full {
  background: linear-gradient(90deg, var(--green), #2ecc71);
  animation: pulse 1.5s infinite;
}
.hp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red), #e74c3c);
  border-radius: 4px;
  transition: width 0.4s ease;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}
.progress-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: var(--text);
  text-shadow: 0 0 3px rgba(0,0,0,0.8);
}
.menu-btn {
  position: absolute; right: 12px; top: 10px;
  background: none; border: none; color: var(--text-dim);
  font-size: 22px; cursor: pointer; padding: 6px; line-height: 1;
  -webkit-tap-highlight-color: transparent;
}
.menu-btn:active { color: var(--gold); }
.menu-dropdown {
  display: none; position: absolute; right: 12px; top: 100%;
  background: var(--bg-card); border: 1px solid var(--gold-dim);
  border-radius: 8px; z-index: 50; overflow: hidden; min-width: 120px;
}
.menu-dropdown.show { display: block; }
.menu-item {
  display: block; width: 100%; padding: 12px 16px;
  background: none; border: none; color: var(--text);
  font-size: 14px; font-family: inherit; text-align: left; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.menu-item:active { background: var(--gold-dim); color: var(--bg); }

.log-area {
  flex: 1; overflow-y: scroll; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; min-height: 0;
}
.log-entry {
  padding: 10px 14px; border-radius: 8px; background: var(--bg-light);
  border-left: 3px solid var(--gold-dim); font-size: 15px;
  animation: fadeIn 0.3s ease;
}
.log-entry.system { border-left-color: var(--blue); color: var(--blue); font-size: 13px; }
.log-entry.danger { border-left-color: var(--red); }
.log-entry.success { border-left-color: var(--green); }
.log-entry.pink { border-left-color: var(--pink); color: var(--pink); }
.log-entry.combat { border-left-color: #e67e22; }
.log-entry.loot { border-left-color: var(--purple); color: var(--purple); }
.log-entry.player-speech { border-left-color: var(--gold); background: #1e2a45; }
.log-entry .npc-name, .log-entry .player-name {
  font-weight: bold;
  text-decoration-line: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}
.log-entry .npc-name { color: var(--gold); text-decoration-color: var(--gold-dim); }
.log-entry .player-name { color: #7dd3fc; text-decoration-color: #3b82f6; }
.log-entry .dialogue { color: #fff; font-style: italic; }
.log-entry .realm-text { color: var(--blue); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.actions {
  flex-shrink: 0; padding: 12px 16px;
  background: var(--bg-light); border-top: 1px solid var(--gold-dim);
  max-height: 45vh; overflow-y: auto;
}
.btn-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 8px;
}
.btn-row:last-child { margin-bottom: 0; }
.btn-row.three { grid-template-columns: 1fr 1fr 1fr; }
.btn-row.four { grid-template-columns: 1fr 1fr 1fr 1fr; }

.btn {
  background: var(--bg-card); color: var(--gold);
  border: 1px solid var(--gold-dim); border-radius: 8px;
  padding: 12px 8px; font-size: 15px; font-family: inherit;
  cursor: pointer; transition: all 0.2s; min-height: 46px;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { background: var(--gold-dim); color: var(--bg); transform: scale(0.96); }
.btn.btn-pink { border-color: var(--pink); color: var(--pink); }
.btn.btn-pink:active { background: var(--pink); color: #fff; }
.btn.btn-glow { border-color: var(--green); color: var(--green); animation: pulse 1.5s infinite; }
.btn.btn-glow:active { background: var(--green); color: #fff; }
.btn.btn-purple { border-color: var(--purple); color: var(--purple); }
.btn.btn-purple:active { background: var(--purple); color: #fff; }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn.btn-reply {
  font-size: 13px; padding: 10px 8px; text-align: left; line-height: 1.4;
}
.btn.btn-sm { padding: 8px 6px; font-size: 13px; min-height: 36px; }

/* ===== 像素风主界面 / 当前行动 ===== */
body::before { content:''; position:fixed; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(8,22,42,.18),rgba(6,15,31,.86)),radial-gradient(circle at 50% -10%,rgba(66,177,211,.12),transparent 42%),#071426; }
#gameScreen { background:linear-gradient(180deg,#0a1c33 0%,#071426 100%); }
#gameScreen .header { background:linear-gradient(180deg,#0b2039,#08172b); border-bottom:2px solid #8b6a31; box-shadow:0 4px 18px rgba(0,0,0,.35); }
#gameScreen .header h1 { font-weight:700; text-shadow:2px 2px 0 #513a16,0 0 12px rgba(212,168,83,.3); }
#gameScreen .progress-bar { border:1px solid rgba(160,125,58,.72); border-radius:2px; }
.activity-panel { --activity-scene-bg:url('assets/activity-meditate-bg-v2.png'); flex-shrink:0; margin:10px 12px 0; min-height:176px; position:relative; overflow:hidden; border:1px solid #a07d3a; border-radius:5px; background-color:#071426; background-image:var(--activity-scene-bg); background-position:center; background-size:cover; background-repeat:no-repeat; box-shadow:inset 0 0 0 2px rgba(5,15,30,.82),0 5px 18px rgba(0,0,0,.32); image-rendering:pixelated; }
.activity-panel::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent 18%,rgba(5,15,29,.2) 47%,rgba(5,15,29,.93) 100%); pointer-events:none; }
.activity-scene-label { position:absolute; left:10px; top:10px; z-index:1; padding:3px 9px; color:#bceeff; background:rgba(4,18,34,.78); border-left:2px solid #5dade2; font-size:11px; letter-spacing:2px; }
.activity-card { position:absolute; z-index:2; right:10px; top:12px; bottom:12px; width:48%; padding:10px; display:flex; flex-direction:column; justify-content:center; background:rgba(5,18,34,.86); border:1px solid rgba(160,125,58,.8); box-shadow:inset 0 0 14px rgba(34,123,160,.1); }
.activity-kicker { color:var(--gold); font-size:10px; letter-spacing:2px; }
.activity-title { color:#82e6ff; font-size:18px; font-weight:700; margin:2px 0; text-shadow:0 0 10px rgba(93,173,226,.35); }
.activity-subtitle { color:var(--text-dim); font-size:10px; line-height:1.35; }
.activity-meta { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; }
.activity-chip { padding:2px 5px; border:1px solid rgba(93,173,226,.5); color:#bceeff; font-size:9px; background:rgba(11,52,83,.55); }
.activity-progress { height:5px; margin-top:9px; background:#06101f; border:1px solid rgba(93,173,226,.4); }
.activity-progress>i { display:block; height:100%; width:22%; background:linear-gradient(90deg,#248bb0,#72e4f6); transition:width .4s ease-out; }
.log-title { flex-shrink:0; margin:9px 16px 0; color:var(--gold); font-size:11px; letter-spacing:3px; text-align:center; }
#gameScreen .log-area { padding:8px 12px 10px; gap:8px; }
#gameScreen .log-entry { border-radius:3px; background:linear-gradient(90deg,rgba(15,52,96,.84),rgba(13,34,61,.72)); box-shadow:inset 0 0 0 1px rgba(93,173,226,.06); font-size:13px; padding:8px 11px; }
#gameScreen .actions { padding:9px 12px 11px; background:linear-gradient(180deg,#0a1d35,#08162a); }
#gameScreen .btn-row { gap:8px; margin-bottom:7px; }
#gameScreen .btn { border-radius:4px; font-weight:600; background:linear-gradient(180deg,#123b66,#0d2d51); box-shadow:inset 0 0 0 1px rgba(114,228,246,.08),0 2px 0 rgba(0,0,0,.28); }
#gameScreen .btn.action-active { border-color:#72e4f6; color:#aaf5ff; box-shadow:inset 0 0 12px rgba(72,206,235,.16),0 0 9px rgba(72,206,235,.22); }
.activity-enter { animation:activityReveal .4s ease-out; }
@keyframes activityReveal { from { opacity:.55; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
@media (max-height:760px) { .activity-panel { min-height:142px; margin-top:7px; } .activity-card { padding:7px; } .activity-title { font-size:15px; } #gameScreen .log-area { padding-top:6px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; } }

/* ===== 目标稿 1:1 视觉体系 ===== */
:root {
  --bg:#061426; --bg-light:#091d35; --bg-card:#0d3157;
  --gold:#f0bd58; --gold-dim:#9d7733; --text:#f2e8d2;
  --text-dim:#b2a88f; --blue:#67dcff; --red:#e84343;
}
body { background:#061426; border-left:1px solid #102b49; border-right:1px solid #102b49; }

.quick-nav { flex-shrink:0; display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:6px 8px calc(7px + env(safe-area-inset-bottom)); position:relative; background:linear-gradient(180deg,#101b1a,#090f0f); border-top:2px solid #947039; box-shadow:inset 0 3px #07100f,inset 0 4px rgba(214,173,88,.18),0 -7px 20px rgba(0,0,0,.38); }
.quick-nav::before { content:''; position:absolute; left:8px; right:8px; top:2px; height:1px; background:linear-gradient(90deg,transparent,#c49a4d 12%,#c49a4d 88%,transparent); }
.quick-nav-btn { min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; position:relative; overflow:hidden; border:1px solid #7f6438; background:linear-gradient(180deg,#102926,#0a1c1b); color:#d8c7a0; font:700 11px/1.1 inherit; letter-spacing:2px; cursor:pointer; clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px); box-shadow:inset 0 0 0 2px #081411,inset 0 0 0 3px rgba(157,123,59,.18); -webkit-tap-highlight-color:transparent; }

.name-btn,.death-btn { border:2px solid #bd8c32; border-radius:2px; background:linear-gradient(180deg,#123d68,#0a294a); color:#f5e6c8; box-shadow:inset 0 0 0 2px #07182d; }
.menu-dropdown { border:2px solid #bd8c32; border-radius:2px; background:#081d35; }
.menu-item { border-bottom:1px solid rgba(157,119,51,.35); }
.activity-clouds { position:absolute; z-index:1; left:0; top:5%; width:200%; height:68%; pointer-events:none; opacity:.18; background-image:url('assets/clouds-overlay.png'),url('assets/clouds-overlay.png'); background-repeat:no-repeat,no-repeat; background-size:50% 100%,50% 100%; background-position:0 50%,100% 50%; animation:cloudTrack 24s linear infinite; image-rendering:pixelated; will-change:transform; }
.activity-panel[data-period="day"] .activity-clouds { opacity:.08; mix-blend-mode:screen; }
.activity-panel[data-period="day"] .activity-person,.activity-panel[data-period="day"] .activity-person-standing { filter:brightness(1.08) saturate(.92); }

.activity-panel[data-action="map"] .activity-person,.activity-panel[data-action="explore"] .activity-person,.activity-panel[data-action="time"] .activity-person,.activity-panel[data-action="idle"][data-scene="market"] .activity-person,.activity-panel[data-action="idle"][data-scene="sect"] .activity-person,.activity-panel[data-action="idle"][data-scene="ruin"] .activity-person { display:none; }
.activity-panel[data-action="map"] .activity-person-standing,.activity-panel[data-action="explore"] .activity-person-standing,.activity-panel[data-action="time"] .activity-person-standing,.activity-panel[data-action="idle"][data-scene="market"] .activity-person-standing,.activity-panel[data-action="idle"][data-scene="sect"] .activity-person-standing,.activity-panel[data-action="idle"][data-scene="ruin"] .activity-person-standing { display:block; }
.activity-panel[data-action="map"] .activity-aura,.activity-panel[data-action="explore"] .activity-aura,.activity-panel[data-action="time"] .activity-aura,.activity-panel[data-action="idle"][data-scene="market"] .activity-aura,.activity-panel[data-action="idle"][data-scene="sect"] .activity-aura,.activity-panel[data-action="idle"][data-scene="ruin"] .activity-aura { display:none; }
.activity-aura::after { content:''; position:absolute; inset:26%; border-radius:50%; background:radial-gradient(circle,rgba(109,244,255,.26),rgba(31,173,220,.06) 45%,transparent 72%); box-shadow:0 0 17px rgba(70,231,255,.42); }
@keyframes cloudTrack { from { transform:translate3d(0,0,0); } to { transform:translate3d(-50%,0,0); } }

/* 主框用切图，次级控件保持克制，避免金饰层层堆叠。 */
.world-year-bar { border-top:1px solid rgba(176,132,52,.72); border-bottom:1px solid rgba(176,132,52,.72); box-shadow:inset 0 1px rgba(240,189,88,.08); }
#gameScreen .actions { border:0; padding:12px 16px 18px; box-shadow:inset 0 2px #9d7733,inset 0 -2px #9d7733; }
#gameScreen .btn { border:1px solid rgba(191,143,52,.9); padding-left:42px; padding-right:42px; text-align:center; clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px); box-shadow:inset 0 0 0 1px rgba(6,20,38,.72),inset 0 0 13px rgba(39,125,180,.17),0 2px 0 #03101f; }

}

.create-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 24px; gap: 24px;
}
.create-screen h2 { color: var(--gold); font-size: 22px; font-weight: normal; letter-spacing: 3px; }
.create-screen p { color: var(--text-dim); font-size: 14px; margin-bottom: -10px; }
.gender-toggle { display: flex; gap: 16px; }
.gender-label { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 16px; cursor: pointer; }
.name-options { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
.name-btn {
  background: var(--bg-light); color: var(--text);
  border: 1px solid var(--gold-dim); border-radius: 8px;
  padding: 14px; font-size: 18px; font-family: inherit;
  cursor: pointer; transition: all 0.2s; letter-spacing: 6px; text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.name-btn:active { background: var(--gold-dim); color: var(--bg); border-color: var(--gold); }
.refresh-btn {
  background: none; border: none; color: var(--text-dim);
  font-size: 14px; font-family: inherit; cursor: pointer; padding: 8px;
  -webkit-tap-highlight-color: transparent;
}
.refresh-btn:active { color: var(--gold); }

.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 100;
  justify-content: center; align-items: center; padding: 24px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-light); border: 1px solid var(--gold-dim);
  border-radius: 12px; width: 100%; max-width: 460px; max-height: 75vh;
  display: flex; flex-direction: column;
}
.modal.graph-mode { max-width: 95vw; max-height: 90vh; width: 95vw; height: 90vh; }
.graph-viewport { overflow: hidden; position: relative; touch-action: none; flex: 1; min-height: 0; cursor: grab; }
.graph-viewport:active { cursor: grabbing; }
.graph-viewport canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.modal-header {
  padding: 14px 16px; border-bottom: 1px solid var(--gold-dim);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-header h3 { color: var(--gold); font-weight: normal; font-size: 17px; }
.modal-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 4px 8px; }
.modal-body { padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.npc-card { background: var(--bg); border-radius: 8px; padding: 12px; margin-bottom: 10px; border-left: 3px solid var(--gold-dim); }
.npc-card.dead { opacity: 0.5; border-left-color: var(--red); }
.npc-card .name { color: var(--gold); font-size: 16px; }
.npc-card .info { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
.npc-card .relation { font-size: 13px; margin-top: 4px; }
.npc-actions { padding-top: 6px; }
.relation-enemy { color: var(--red); }
.relation-friend { color: var(--green); }
.relation-soulmate, .relation-blood { color: var(--pink); font-weight: bold; }
.empty-text { color: var(--text-dim); text-align: center; padding: 32px 0; font-size: 14px; }
#gameScreen { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.hidden { display: none !important; }

.map-modal { width:calc(100% - 20px); max-width:420px; border:1px solid #b78938; border-radius:0; background:linear-gradient(180deg,#07192e 0%,#051426 100%); box-shadow:0 0 0 3px #06101e,0 0 0 4px rgba(74,174,214,.32),0 18px 50px rgba(0,0,0,.72); }
.map-modal .modal-header { position:relative; padding:16px 18px 13px; border-bottom:1px solid rgba(197,151,63,.72); background:linear-gradient(90deg,rgba(12,49,78,.72),rgba(5,18,34,.3),rgba(12,49,78,.72)); }
.map-modal .modal-header::after { content:'◆'; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); padding:0 8px; color:#d2a64e; background:#07182b; font-size:10px; }
.map-modal .modal-header h3 { width:100%; text-align:center; color:#f0c465; font-size:19px; font-weight:700; letter-spacing:8px; text-shadow:0 2px #3c2b12; }
.map-modal .modal-close { position:absolute; right:9px; top:8px; color:#8eb3c6; }
.map-modal .modal-body { padding:16px 12px 14px; background:radial-gradient(circle at 50% 36%,rgba(29,96,128,.16),transparent 55%); }
.map-container { display:flex; flex-direction:column; align-items:stretch; gap:10px; }
.map-info { min-height:auto; padding:9px 10px; border:1px solid rgba(71,149,183,.35); background:rgba(4,17,32,.74); color:#b9d9e7; font-size:11px; text-align:center; letter-spacing:.5px; }
.map-info strong { color:#f0c465; font-size:13px; }
.map-info em { color:#65daf5; font-style:normal; }
.map-legend { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; padding:0 2px; color:#8fb1c0; font-size:9px; }
.map-legend span { display:flex; align-items:center; justify-content:center; gap:4px; white-space:nowrap; }
.legend-dot { width:9px; height:9px; flex:0 0 auto; display:inline-block; border:1px solid rgba(157,205,220,.18); box-shadow:inset 0 0 0 1px rgba(0,0,0,.22); }
.map-grid {
  display: grid;
  grid-template-columns: 14px repeat(16, minmax(0, 1fr));
  grid-template-rows: 14px repeat(16, minmax(0, 1fr));
  gap: 1px;
  width:100%; max-width:374px; aspect-ratio:1/1;
  align-self:center; padding:5px;
  background:#020b15;
  border:1px solid #bd8e39;
  outline:1px solid rgba(73,164,199,.36); outline-offset:-4px;
  border-radius:0; overflow:hidden;
  box-shadow:inset 0 0 24px rgba(0,0,0,.8),0 8px 22px rgba(0,0,0,.3);
}
.map-label {
  display: flex; align-items: center; justify-content: center;
  font-size:6px; color:#54788b; user-select:none;
}
.map-cell {
  width:100%; height:100%; min-width:0; min-height:0;
  display: flex; align-items: center; justify-content: center;
  font-size:8px; cursor:default; position:relative;
  border:1px solid rgba(70,121,143,.13); border-radius:0;
  transition:filter .15s,box-shadow .15s,transform .15s;
  image-rendering:pixelated;
}
.map-cell.qi-1 { background:linear-gradient(135deg,#151c2b 0 45%,#1b2635 46% 100%); }
.map-cell.qi-2 { background:linear-gradient(135deg,#123044 0 48%,#17394b 49% 100%); }
.map-cell.qi-3 { background:linear-gradient(135deg,#0f4059 0 46%,#15516a 47% 100%); }
.map-cell.qi-4 { background:linear-gradient(135deg,#263b22 0 48%,#31492a 49% 100%); }
.map-cell.market { background:linear-gradient(135deg,#47234d,#64295c) !important; }
.map-cell.reachable { z-index:1; box-shadow:inset 0 0 0 1px #cf9d43,0 0 4px rgba(218,169,75,.28); cursor:pointer; filter:brightness(1.12); }
.map-cell.reachable:active { transform:scale(.86); }
.map-cell.has-player::after {
  content:''; width:9px; height:9px; z-index:3;
  background:#72e9ff; border:2px solid #f1c45f;
  transform:rotate(45deg);
  box-shadow:0 0 0 2px rgba(5,25,41,.86),0 0 9px #41d8ff;
}
.map-cell.has-npc::before {
  content:''; width:4px; height:4px; z-index:4;
  background:#ff5c62; border:1px solid #ffd0c8;
  position:absolute; top:2px; right:2px;
  box-shadow:0 0 4px #ef3d45;
}
.map-cell.market::after { content:'市'; color:#ffd06b; font-size:9px; font-weight:bold; text-shadow:0 1px #351327; }
.map-cell.has-rift { box-shadow: inset 0 0 6px #e67e22; animation: pulse 1s infinite; }
.map-cell.has-herb { box-shadow: inset 0 0 4px var(--green); }
.map-cell.has-ruin { box-shadow:inset 0 0 7px #d98632; background:#49331d !important; }
.map-cell.sect-good { background:linear-gradient(135deg,#174331,#205640) !important; }
.map-cell.sect-evil { background:linear-gradient(135deg,#481f27,#5d2830) !important; }
.map-cell.sect-neutral { background:linear-gradient(135deg,#303245,#3d4056) !important; }
.map-cell.sect-good::after, .map-cell.sect-evil::after, .map-cell.sect-neutral::after {
  content:attr(data-label); color:#e8dcc2; font-size:8px; font-weight:bold; text-shadow:0 1px #07111c;
}
.map-cell.sect-good.has-player::after, .map-cell.sect-evil.has-player::after, .map-cell.sect-neutral.has-player::after {
  content:''; width:9px; height:9px; background:#72e9ff; border:2px solid #f1c45f; transform:rotate(45deg); box-shadow:0 0 0 2px rgba(5,25,41,.86),0 0 9px #41d8ff;
}
.map-hint { color:#66899a; text-align:center; font-size:10px; letter-spacing:.5px; }
.scene-popup {
  position: fixed; inset: 0; z-index: 300;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.92); gap: 24px;
  animation: sceneFadeIn 0.3s ease;
  max-width: 500px; margin: 0 auto;
  pointer-events: none;
}
.scene-popup .scene-title {
  order: -1;
}
@keyframes sceneFadeIn { from { opacity: 0; } to { opacity: 1; } }
.scene-popup .scene-title {
  color: var(--gold); font-size: 16px; letter-spacing: 4px;
}
.scene-popup .scene-pixel {
  display: flex; align-items: center; justify-content: center;
  image-rendering: pixelated;
}
.px-person {
  width: 20px; height: 30px; position: absolute; bottom: 10px;
}
.px-body { width: 12px; height: 14px; border-radius: 2px; position: absolute; bottom: 0; left: 4px; }
.px-head { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: 14px; left: 5px; }
.px-legs { width: 12px; height: 6px; position: absolute; bottom: -5px; left: 4px; display: flex; gap: 2px; }
.px-leg { width: 4px; height: 6px; border-radius: 1px; }

@keyframes floatUp { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.scene-canvas-wrap { animation: floatUp 2.5s ease-in-out infinite; position: relative; }
.qi-particles { position: absolute; inset: -40px; pointer-events: none; }
.qi-dot {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  animation: qiRise linear infinite;
}
@keyframes qiRise {
  0% { transform: translateY(0) scale(1); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-80px) scale(0.3); opacity: 0; }
}
@keyframes qiOrbit {
  0% { transform: rotate(0deg) translateX(50px) rotate(0deg); opacity: 0.7; }
  50% { opacity: 1; }
  100% { transform: rotate(360deg) translateX(50px) rotate(-360deg); opacity: 0.7; }
}
.qi-orbit {
  position: absolute; width: 5px; height: 5px; border-radius: 50%;
  top: 50%; left: 50%;
  animation: qiOrbit linear infinite;
}
@keyframes sparkBurst {
  0% { transform: scale(0); opacity: 1; }
  50% { transform: scale(1.5); opacity: 1; }
  100% { transform: scale(0); opacity: 0; }
}
@keyframes screenShake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
@keyframes goldenBurst {
  0% { width: 0; height: 0; opacity: 1; }
  100% { width: 250px; height: 250px; opacity: 0; }
}
@keyframes walkBounce {
  0%,100% { transform: translateX(-15px); }
  50% { transform: translateX(15px); }
}
.scene-walk { animation: walkBounce 0.8s ease-in-out infinite; }
@keyframes clashLeft {
  0% { transform: translateX(-60px); }
  40% { transform: translateX(10px); }
  50% { transform: translateX(0); }
  60% { transform: translateX(-5px); }
  100% { transform: translateX(-60px); }
}
@keyframes clashRight {
  0% { transform: translateX(60px); }
  40% { transform: translateX(-10px); }
  50% { transform: translateX(0); }
  60% { transform: translateX(5px); }
  100% { transform: translateX(60px); }
}
@keyframes clashSpark {
  0%,30% { transform: scale(0); opacity: 0; }
  40% { transform: scale(2); opacity: 1; }
  50% { transform: scale(3); opacity: 1; }
  60% { transform: scale(1); opacity: 0.5; }
  70%,100% { transform: scale(0); opacity: 0; }
}

.px-fight-left .px-body { background: #5dade2; }
.px-fight-left .px-head { background: #f5cba7; }
.px-fight-left .px-leg { background: #34495e; }
.px-fight-right .px-body { background: #c0392b; }
.px-fight-right .px-head { background: #d5a6a6; }
.px-fight-right .px-leg { background: #7b241c; }
@keyframes slashLeft { 0% { transform: translateX(0); } 50% { transform: translateX(12px); } 100% { transform: translateX(0); } }
@keyframes slashRight { 0% { transform: translateX(0); } 50% { transform: translateX(-12px); } 100% { transform: translateX(0); } }
.px-fight-left { animation: slashLeft 0.8s infinite; left: 15px; }
.px-fight-right { animation: slashRight 0.8s infinite; right: 15px; }

.px-monster .px-body { background: #8e44ad; width: 18px; height: 18px; border-radius: 4px; left: 1px; }
.px-monster .px-head { background: #c0392b; width: 14px; height: 12px; border-radius: 3px; left: 3px; bottom: 18px; }
.px-monster .px-leg { background: #6c3483; }
@keyframes monsterShake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
.px-monster { animation: monsterShake 0.6s infinite; }

.px-loot { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); }
.px-loot::before {
  content: ''; display: block; width: 24px; height: 16px;
  background: var(--gold); border-radius: 3px;
  border-bottom: 3px solid var(--gold-dim);
}
.px-loot::after {
  content: ''; display: block; width: 8px; height: 8px;
  background: #fff; border-radius: 50%; position: absolute;
  top: -4px; left: 8px;
  animation: glow 1s infinite;
}
@keyframes glow { 0%,100% { opacity: 1; box-shadow: 0 0 4px #fff; } 50% { opacity: 0.5; box-shadow: 0 0 8px var(--gold); } }

.px-heart { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); }
.px-heart::before, .px-heart::after {
  content: ''; position: absolute; width: 12px; height: 12px;
  background: var(--pink); border-radius: 50%;
}
.px-heart::before { left: -6px; top: 0; }
.px-heart::after { left: 6px; top: 0; }
.px-heart-tip {
  width: 0; height: 0; border-left: 12px solid transparent;
  border-right: 12px solid transparent; border-top: 14px solid var(--pink);
  position: absolute; top: 6px; left: -6px;
}
@keyframes heartBeat { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.2); } }
.px-heart { animation: heartBeat 0.8s infinite; }

.px-handshake { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.px-hand { width: 10px; height: 14px; background: #f5cba7; border-radius: 3px; }
.px-hand:first-child { transform: rotate(-15deg); }
.px-hand:last-child { transform: rotate(15deg); background: #d4a853; }

.px-check { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); }
.px-check::before {
  content: '✓'; font-size: 32px; color: var(--green);
}

.combat-panel {
  background: var(--bg); border: 1px solid var(--gold-dim); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 8px;
}
.combat-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.combat-name { font-size: 14px; font-weight: bold; }
.combat-hp-wrap {
  background: var(--bg-light); border-radius: 4px; height: 16px; flex: 1;
  margin: 0 10px; position: relative; overflow: hidden;
}
.combat-hp-fill {
  height: 100%; border-radius: 4px; transition: width 0.3s;
}
.combat-hp-fill.player-bar { background: linear-gradient(90deg, #27ae60, #2ecc71); }
.combat-hp-fill.enemy-bar { background: linear-gradient(90deg, #c0392b, #e74c3c); }
.combat-hp-text {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; font-size: 10px; color: var(--text);
  text-shadow: 0 0 3px rgba(0,0,0,0.8);
}
.combat-info { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 4px; }
.combat-log { font-size: 12px; color: var(--text); padding: 6px 0; max-height: 80px; overflow-y: auto; }
.combat-log div { padding: 2px 0; }

.sect-info-card { background: var(--bg); border-radius: 8px; padding: 14px; margin-bottom: 10px; border-left: 3px solid var(--gold-dim); }
.sect-info-card .sect-title { color: var(--gold); font-size: 17px; }
.sect-info-card .sect-desc { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
.sect-info-card .sect-detail { color: var(--text); font-size: 13px; margin-top: 6px; line-height: 1.8; }
.map-cell.market.has-player::after { content: ''; background: var(--gold); width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 6px var(--gold); }
.map-info { font-size: 12px; color: var(--text-dim); text-align: center; min-height: 18px; }

.shop-item {
  background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
  border-left: 3px solid var(--purple);
}
.shop-item .item-info { flex: 1; }
.shop-item .item-name { color: var(--text); font-size: 14px; }
.shop-item .item-desc { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
.shop-item .item-price { color: var(--gold); font-size: 13px; white-space: nowrap; margin-left: 12px; }
.inv-section { margin-bottom: 14px; }
.inv-section h4 { color: var(--gold); font-size: 14px; margin-bottom: 6px; font-weight: normal; }
.inv-item {
  background: var(--bg); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px;
  display: flex; justify-content: space-between; align-items: center; font-size: 13px;
}
.inv-item .iname { color: var(--text); }
.inv-item .ival { color: var(--gold); }

.origin-reveal {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 24px; gap: 20px; text-align: center;
  animation: fadeIn 0.8s ease;
}
.origin-reveal h2 { color: var(--gold); font-size: 20px; font-weight: normal; letter-spacing: 4px; }
.origin-reveal .origin-name { font-size: 28px; color: var(--pink); letter-spacing: 6px; margin: 8px 0; }
.origin-reveal .origin-desc { color: var(--text); font-size: 15px; line-height: 1.8; max-width: 320px; }
.origin-reveal .origin-effects { color: var(--text-dim); font-size: 13px; line-height: 1.6; max-width: 300px; }

.death-screen {
  position: fixed; inset: 0; z-index: 200;
  background: linear-gradient(180deg, #0a0a15 0%, #1a0a0a 50%, #0a0a15 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 24px; gap: 16px;
  animation: fadeIn 1.5s ease;
  overflow-y: auto;
  max-width: 500px; margin: 0 auto;
}
.death-title {
  font-size: 36px; color: var(--gold); letter-spacing: 12px;
  font-weight: normal; text-shadow: 0 0 20px rgba(212,168,83,0.5);
  animation: pulse 3s infinite;
}
.death-cause { color: var(--red); font-size: 14px; text-align: center; }
.death-card {
  background: rgba(255,255,255,0.05); border: 1px solid var(--gold-dim);
  border-radius: 12px; padding: 16px 20px; width: 100%; max-width: 340px;
  text-align: center;
}
.death-card .dc-name { color: var(--gold); font-size: 20px; letter-spacing: 4px; }
.death-card .dc-info { color: var(--text-dim); font-size: 13px; margin-top: 6px; line-height: 1.8; }
.death-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; width: 100%; max-width: 340px;
}
.death-stat {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 10px 8px; text-align: center;
}
.death-stat .ds-val { color: var(--gold); font-size: 18px; }
.death-stat .ds-label { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
.death-btn {
  margin-top: 8px; background: none; border: 1px solid var(--gold);
  color: var(--gold); padding: 14px 40px; font-size: 16px; font-family: inherit;
  border-radius: 8px; cursor: pointer; letter-spacing: 4px;
  transition: all 0.3s;
}
.death-btn:active { background: var(--gold); color: var(--bg); }

/* 角色状态铭牌：顶部只保留题名与核心进度，身份信息集中在场景内。 */
#gameScreen .header { min-height:92px; padding:9px 20px 8px; }
#gameScreen .header h1 { margin-bottom:4px; }
#gameScreen .bars-wrap { margin-top:2px; }
.character-card {
  top:50%; bottom:auto; height:246px; transform:translateY(-50%);
  justify-content:flex-start; text-align:left; gap:8px;
  padding:10px 11px 11px; overflow:hidden;
  box-shadow:0 8px 18px rgba(0,0,0,.36), inset 0 0 18px rgba(32,104,127,.12);
}
.character-card-title {
  position:relative; display:flex; align-items:center; justify-content:center;
  height:20px; color:#d9b35f; font-size:10px; font-weight:bold; letter-spacing:3px;
}
.character-card-title::before,.character-card-title::after {
  content:""; height:1px; flex:1; background:linear-gradient(90deg,transparent,#9f782f);
}
.character-card-title::after { background:linear-gradient(90deg,#9f782f,transparent); }
.character-card-title span { padding:0 7px; white-space:nowrap; }
.character-card-head {
  display:flex; align-items:center; gap:11px; min-width:0;
  padding-bottom:8px; border-bottom:1px solid rgba(168,124,49,.72);
}
.character-avatar {
  width:62px; height:62px; flex:0 0 62px;
  border:1px solid #b88a3b;
  background-color:#10263a;
  background-image:url('assets/activity-standing-person.png');
  background-repeat:no-repeat; background-size:auto 250px; background-position:-105px -43px;
  box-shadow:0 0 0 2px #071526, 0 0 0 3px rgba(76,202,231,.45), inset 0 0 8px rgba(55,206,232,.22);
  image-rendering:pixelated;
}
.character-identity { min-width:0; flex:1; }
.character-name {
  color:#f3d28c; font-size:17px; line-height:1.2; font-weight:bold; letter-spacing:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.character-name small { margin-left:5px; color:#94cfda; font-size:9px; font-weight:normal; letter-spacing:0; }
.character-origin {
  display:flex; align-items:center; gap:5px; margin-top:4px;
  color:#b7c9cc; font-size:10px; white-space:nowrap; overflow:hidden;
}
.character-origin i { width:2px; height:2px; flex:0 0 2px; background:#b88a3b; transform:rotate(45deg); }
.character-realm { margin-top:6px; color:#67d9ed; font-size:12px; font-weight:bold; letter-spacing:1px; text-shadow:0 0 6px rgba(70,210,235,.32); }
.character-life {
  display:flex; align-items:baseline; justify-content:center; gap:5px;
  min-height:28px; border:1px solid rgba(168,124,49,.48);
  background:linear-gradient(90deg,rgba(11,39,57,.72),rgba(20,52,62,.72),rgba(11,39,57,.72)); color:#b9cbd0; font-size:10px;
}
.character-life strong { color:#f1d18b; font-size:15px; letter-spacing:1px; }
.character-life small { color:#9eb1b7; font-size:9px; }
.character-stats { display:grid; grid-template-columns:1fr 1fr; gap:5px; min-width:0; }
.character-stat {
  min-width:0; min-height:36px; display:flex; align-items:center; justify-content:flex-start; gap:7px; padding:3px 8px;
  border:1px solid rgba(42,161,189,.63); background:rgba(7,34,53,.72);
  color:#d5e5e5; font-size:9px; overflow:hidden;
}
.character-stat svg { width:18px; height:18px; flex:0 0 18px; fill:#68dced; filter:drop-shadow(0 0 3px rgba(71,216,236,.52)); }
.character-stat-copy { display:flex; min-width:0; flex:1; flex-direction:column; gap:1px; }
.character-stat-copy small { color:#789ba4; font-size:7px; line-height:1; }
.character-stat strong { min-width:0; color:#eef0df; font-size:11px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.character-stat > span { font-size:7px; white-space:nowrap; }
.character-position { grid-column:1 / -1; padding:3px 9px; }
.character-position strong { overflow:visible; }
.character-position #posQi { color:#9fc3c8; overflow:hidden; text-overflow:ellipsis; }
.activity-runtime { display:none !important; }

/* 墨玉古风配色：蓝青仅作为灵气与交互高光，不再充当大面积底色。 */
:root {
  --bg:#111714;
  --bg-light:#18211d;
  --bg-card:#20302a;
  --gold:#d8b36a;
  --gold-dim:#846c3d;
  --text:#e9dfca;
  --text-dim:#aa9f89;
  --blue:#72cfcb;
}
body {
  background:#111714;
  border-color:#28362f;
}
body::before {
  background:radial-gradient(circle at 50% -8%,rgba(124,108,64,.12),transparent 40%),linear-gradient(180deg,#18211d,#0d1210 78%);
}
#gameScreen {
  background:linear-gradient(180deg,#18221e 0%,#101713 52%,#0c110f 100%);
  border-color:#26372f;
}
#gameScreen .header {
  background:linear-gradient(180deg,rgba(16,25,22,.18),rgba(15,22,20,.9)),url('assets/activity-meditate.png') 68% 38%/cover no-repeat;
  border-bottom-color:#7f673b;
}
#gameScreen .header::after { background:linear-gradient(180deg,transparent,#111916); }
#gameScreen .progress-bar { background:#101512; border-color:#8b7040; }
.activity-panel {
  background-color:#17211d;
  box-shadow:inset 0 0 0 3px #121a17,0 6px 18px rgba(0,0,0,.3);
}
.activity-panel::after {
  background:linear-gradient(90deg,transparent 0%,rgba(16,25,22,.03) 48%,rgba(17,26,23,.78) 60%,rgba(14,22,19,.94) 100%);
}
.activity-scene-label {
  color:#e5dbc1; background:rgba(21,31,27,.8); border-left-color:#c89f55;
}
.activity-card,.character-card {
  border-color:#987a42;
  background:linear-gradient(145deg,rgba(33,46,40,.88),rgba(17,26,23,.9));
  box-shadow:0 8px 18px rgba(0,0,0,.3),inset 0 0 22px rgba(123,151,119,.07);
  backdrop-filter:blur(2px);
}
.character-card-head { border-bottom-color:rgba(154,125,68,.62); }
.character-avatar {
  background-color:#213029;
  box-shadow:0 0 0 2px #131c18,0 0 0 3px rgba(181,145,76,.52),inset 0 0 8px rgba(143,168,125,.15);
}
.character-name { color:#f0d28f; }
.character-name small,.character-origin { color:#b7b4a4; }
.character-realm { color:#a9c998; text-shadow:0 0 6px rgba(142,190,132,.22); }
.character-life {
  border-color:rgba(151,122,65,.5);
  background:linear-gradient(90deg,rgba(31,42,36,.72),rgba(49,58,42,.72),rgba(31,42,36,.72));
}
.character-stat {
  border-color:rgba(113,139,111,.58);
  background:linear-gradient(180deg,rgba(37,54,46,.78),rgba(25,39,33,.82));
}
.character-stat svg { fill:#c3b06f; filter:drop-shadow(0 0 3px rgba(193,166,92,.26)); }
.character-stat-copy small { color:#8f9c8c; }
#gameScreen .log-area {
  background:linear-gradient(180deg,rgba(25,37,32,.94),rgba(14,22,19,.98));
  border-color:rgba(139,111,58,.58); border-top-color:rgba(128,147,111,.45);
  outline-color:rgba(78,100,85,.32); scrollbar-color:#75623b #111714;
}
#gameScreen .log-area::-webkit-scrollbar-track { background:#111714; border-left-color:#2b3b33; }
#gameScreen .log-entry {
  color:#d9e0d3;
  background:linear-gradient(90deg,rgba(38,57,48,.88),rgba(26,40,34,.76));
  box-shadow:inset 0 0 0 1px rgba(174,196,158,.04);
}
.log-title,.world-year-bar {
  background:linear-gradient(90deg,#111916,#243229,#111916);
}
#gameScreen .actions {
  background:linear-gradient(180deg,#18231e,#101713);
  box-shadow:inset 0 2px #80683b,inset 0 -2px #80683b;
}
#gameScreen .btn {
  color:#e8c577;
  border-color:rgba(156,124,62,.9);
  background:linear-gradient(180deg,#2d493d,#20372f);
  box-shadow:inset 0 0 0 1px rgba(10,18,15,.74),inset 0 0 12px rgba(105,139,112,.12),0 2px 0 #0a0f0d;
  text-shadow:1px 1px 0 #49391d;
}
#gameScreen .btn::before { color:#c7bc79; text-shadow:0 0 6px rgba(198,182,107,.25); }
#gameScreen .btn.action-active {
  color:#e6f0da; border-color:#9cc78f;
  background:linear-gradient(180deg,#3d614d,#294739);
  box-shadow:inset 0 0 14px rgba(151,195,137,.16),0 0 8px rgba(139,186,130,.34),0 3px 0 #0a0f0d;
  text-shadow:0 0 7px rgba(173,210,157,.35);
}
.modal-overlay { background:rgba(8,12,10,.86); }
.modal { background:linear-gradient(180deg,#26372f,#141d19); box-shadow:0 0 0 3px #101713,0 12px 38px rgba(0,0,0,.6); }
.modal-header { background:#1b2822; }
.modal-body { background:linear-gradient(180deg,rgba(31,46,39,.97),rgba(17,26,22,.99)); }
.npc-card,.sect-info-card,.shop-item,.inv-item,.combat-panel {
  border-left-color:#8fa77e;
  background:linear-gradient(90deg,#263c32,#192a23);
}
.menu-dropdown { background:#1a2821; }

/* 全屏重点动作演出：复用现有高质量像素场景与人物切图。 */
.scene-popup.scene-cinematic {
  position:fixed;
  inset:0;
  z-index:300;
  width:100%;
  max-width:500px;
  height:100dvh;
  margin:0 auto;
  display:block;
  overflow:hidden;
  isolation:isolate;
  background:#07110f;
  pointer-events:none;
  animation:cinemaOpen 400ms ease-out both;
}
.scene-cinematic.cinema-leave { animation:cinemaClose 400ms ease-out both; }
.cinema-backdrop,
.cinema-shade,
.cinema-clouds,
.cinema-light,
.cinema-effects,
.cinema-actors { position:absolute; inset:0; }
.cinema-backdrop {
  z-index:0;
  background-position:left center;
  background-size:cover;
  image-rendering:pixelated;
  transform:scale(1.06);
  animation:cinemaDrift 2.4s ease-out both;
}
.cinema-shade {
  z-index:1;
  background:
    linear-gradient(180deg,rgba(4,10,9,.34),transparent 28%,transparent 66%,rgba(3,8,7,.8)),
    radial-gradient(circle at 50% 48%,transparent 16%,rgba(2,7,6,.52) 88%);
}
.cinema-clouds {
  z-index:2;
  left:-45%;
  width:190%;
  opacity:.25;
  background:url('assets/clouds-overlay.png') 0 52%/50% 52% repeat-x;
  image-rendering:pixelated;
  animation:cinemaClouds 8s linear infinite;
}
.cinema-light {
  z-index:3;
  opacity:.72;
  mix-blend-mode:screen;
  background:radial-gradient(circle at 50% 52%,var(--cinema-light,rgba(83,224,237,.32)),transparent 44%);
  animation:cinemaLight 1.6s ease-in-out infinite;
}
.cinema-actors { z-index:5; }
.cinema-actor {
  position:absolute;
  bottom:18%;
  width:39%;
  height:52%;
  background-position:center bottom;
  background-size:contain;
  background-repeat:no-repeat;
  image-rendering:pixelated;
  filter:drop-shadow(0 9px 7px rgba(0,0,0,.48));
}
.cinema-player {
  inset:0;
  width:auto;
  height:auto;
  transform:none;
  background-image:url('assets/activity-standing-person.png');
  /* 站立素材保留整张透明画布，按场景高度定标，和 NPC 共用同一人物尺度。 */
  background-size:auto 38%;
  background-position:20% 62%;
  animation:cinemaHeroIn 600ms ease-out both;
}
.cinema-player.is-seated {
  inset:0;
  width:auto;
  height:auto;
  background-image:url('assets/activity-meditate-person.png');
  background-size:cover;
  background-position:20% center;
}
.cinema-npc {
  right:8%;
  bottom:18%;
  width:27%;
  height:44%;
  background-image:url('assets/activity-npc-sprite.png');
  animation:cinemaNpcIn 600ms ease-out both;
}
.scene-combat .cinema-npc,
.scene-monster .cinema-npc,
.scene-dual .cinema-npc,
.scene-bond .cinema-npc { right:4%; }
.scene-dual .cinema-npc,
.scene-bond .cinema-npc { right:10%; }
.cinema-effects { z-index:6; }
.cinema-aura {
  position:absolute;
  left:31%;
  top:54%;
  width:min(76vw,380px);
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:url('assets/qi-orbit.png') center/contain no-repeat;
  image-rendering:pixelated;
  filter:drop-shadow(0 0 8px rgba(86,235,246,.68));
  animation:cinemaAura 2.4s linear infinite;
}
.cinema-aura.aura-back { z-index:-1; opacity:.48; animation-direction:reverse; animation-duration:3.2s; }
.cinema-particle {
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--size);
  height:var(--size);
  background:var(--spark,#79e8ef);
  box-shadow:0 0 6px var(--spark,#79e8ef);
  image-rendering:pixelated;
  animation:cinemaParticle var(--speed) ease-out var(--delay) infinite;
}
.cinema-slash {
  position:absolute;
  left:12%;
  top:45%;
  width:76%;
  height:6px;
  opacity:0;
  background:linear-gradient(90deg,transparent,#fff7c2 32%,#67e8f2 58%,transparent);
  box-shadow:0 0 8px #fff7c2,0 0 18px #67e8f2;
  transform:rotate(-24deg) scaleX(.15);
  transform-origin:center;
  animation:cinemaSlash 1.15s ease-out infinite;
}
.cinema-slash.slash-b { transform:rotate(21deg) scaleX(.15); animation-delay:.18s; }
.cinema-lightning {
  position:absolute;
  left:50%;
  top:-8%;
  width:8px;
  height:68%;
  transform:translateX(-50%) skewX(-13deg);
  opacity:0;
  background:linear-gradient(#fff,#e5c96b 38%,#5bdce9 82%,transparent);
  box-shadow:0 0 10px #fff,0 0 25px #e5c96b;
  animation:cinemaLightning 1.6s steps(2,end) infinite;
}
.cinema-relic {
  position:absolute;
  left:50%;
  top:51%;
  width:72px;
  height:72px;
  transform:translate(-50%,-50%) rotate(45deg);
  border:5px double #f4d783;
  background:radial-gradient(circle,#fff6c5 0 10%,#d3a743 12% 30%,#21483a 32% 62%,#0e1c17 64%);
  box-shadow:0 0 18px #f0cc69,0 0 55px rgba(240,204,105,.58);
  animation:cinemaRelic 1.8s ease-in-out infinite;
}
.cinema-thread {
  position:absolute;
  left:30%;
  right:27%;
  top:52%;
  height:3px;
  background:linear-gradient(90deg,transparent,#f0cc78 18%,#f0cc78 82%,transparent);
  box-shadow:0 0 8px #f0cc78;
  transform:scaleX(0);
  animation:cinemaThread 1.2s ease-out .3s forwards;
}
.scene-dual .cinema-thread { background:linear-gradient(90deg,transparent,#ef7d9f 18%,#ef7d9f 82%,transparent); box-shadow:0 0 8px #ef7d9f; }
.cinema-seal {
  position:absolute;
  left:50%;
  top:48%;
  width:140px;
  height:140px;
  transform:translate(-50%,-50%) scale(.2) rotate(-12deg);
  border:4px double #edcf78;
  box-shadow:inset 0 0 0 5px rgba(12,41,31,.78),0 0 26px rgba(237,207,120,.66);
  opacity:0;
  animation:cinemaSeal 1.5s ease-out .25s forwards;
}
.cinema-seal::before,
.cinema-seal::after { content:''; position:absolute; background:#edcf78; opacity:.78; }
.cinema-seal::before { left:18%; right:18%; top:48%; height:4px; }
.cinema-seal::after { top:18%; bottom:18%; left:48%; width:4px; }
.cinema-caption {
  position:absolute;
  z-index:9;
  left:8%;
  right:8%;
  bottom:8%;
  text-align:center;
  color:#f3d58c;
  font:900 clamp(22px,7vw,34px)/1.2 "STKaiti","KaiTi",serif;
  letter-spacing:.42em;
  text-indent:.42em;
  text-shadow:0 2px #3b2b14,0 0 14px rgba(241,204,111,.45);
  animation:cinemaCaption 600ms ease-out 250ms both;
}
.cinema-caption::before,
.cinema-caption::after { content:'◆'; margin:0 12px; color:#9e7c3f; font-size:.42em; vertical-align:middle; }
.scene-danger { --cinema-light:rgba(188,39,42,.42); }
.scene-danger .cinema-backdrop,
.scene-monster .cinema-backdrop { filter:saturate(.65) brightness(.55) hue-rotate(-8deg); }
.scene-danger .cinema-shade,
.scene-monster .cinema-shade { background:radial-gradient(circle at 50% 48%,transparent 8%,rgba(35,0,4,.76) 84%); }
.scene-loot,
.scene-success { --cinema-light:rgba(234,198,99,.42); }
.scene-dual { --cinema-light:rgba(221,96,139,.32); }
.scene-explore .cinema-backdrop { animation:cinemaExplore 2.4s ease-out both; }
.scene-explore .cinema-player { animation:cinemaWalk 1.1s steps(2,end) infinite,cinemaHeroIn 600ms ease-out both; }
.scene-combat .cinema-actors,
.scene-monster .cinema-actors { animation:cinemaImpact 1.15s ease-in-out infinite; }

@keyframes cinemaOpen { from{opacity:0} to{opacity:1} }
@keyframes cinemaClose { to{opacity:0;filter:brightness(1.25)} }
@keyframes cinemaDrift { from{transform:scale(1.1) translateX(-2%)} to{transform:scale(1.04) translateX(1%)} }
@keyframes cinemaExplore { from{transform:scale(1.08) translateX(4%)} to{transform:scale(1.04) translateX(-4%)} }
@keyframes cinemaClouds { to{transform:translateX(-25%)} }
@keyframes cinemaLight { 50%{opacity:1;transform:scale(1.08)} }
@keyframes cinemaHeroIn { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes cinemaNpcIn { from{opacity:0;transform:translateX(28px)} to{opacity:1;transform:translateX(0)} }
@keyframes cinemaWalk { 50%{translate:4px -3px} }
@keyframes cinemaAura { to{transform:translate(-50%,-50%) rotate(360deg)} }
@keyframes cinemaParticle { 0%{opacity:0;transform:translateY(24px) scale(.6)} 30%{opacity:1} 100%{opacity:0;transform:translateY(-90px) scale(.2)} }
@keyframes cinemaSlash { 0%,35%{opacity:0;transform:rotate(-24deg) scaleX(.15)} 45%,60%{opacity:1;transform:rotate(-24deg) scaleX(1)} 72%,100%{opacity:0;transform:rotate(-24deg) scaleX(1.08)} }
@keyframes cinemaLightning { 0%,72%,100%{opacity:0} 74%,82%{opacity:1} 84%{opacity:.25} 87%{opacity:1} 90%{opacity:0} }
@keyframes cinemaRelic { 50%{transform:translate(-50%,-58%) rotate(135deg);filter:brightness(1.3)} }
@keyframes cinemaThread { to{transform:scaleX(1)} }
@keyframes cinemaSeal { 55%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(0)} 100%{opacity:.72;transform:translate(-50%,-50%) scale(1) rotate(0)} }
@keyframes cinemaCaption { from{opacity:0;transform:translateY(12px);letter-spacing:.8em} to{opacity:1;transform:none} }
@keyframes cinemaImpact { 50%{transform:translateX(2px)} 52%{transform:translateX(-2px)} }

@media (prefers-reduced-motion:reduce) {
  .scene-cinematic *,
  .scene-cinematic *::before,
  .scene-cinematic *::after { animation:none!important; }
}

// ========== 工具函数 ==========

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randPick(arr) { return arr[randInt(0, arr.length - 1)]; }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function randName() { return randPick(SURNAMES) + randPick(NAME_CHAR1) + randPick(NAME_CHAR2); }
function randMonsterName() { return randPick(MONSTER_PREFIX) + randPick(MONSTER_SUFFIX); }

function getRealmFullName(ri, si) { return REALMS[ri].name + REALMS[ri].stages[si]; }

function getTotalPower(ri, si) {
  let t = 1;
  for (let i = 0; i < ri; i++) t += REALMS[i].stages.length;
  return t + si;
}

function isMaxRealm(ri, si) {
  return ri >= REALMS.length - 1 && si >= REALMS[REALMS.length - 1].stages.length - 1;
}

function getRealmDiff(nRI, nSI, pRI, pSI) {
  const n = getTotalPower(nRI, nSI), p = getTotalPower(pRI, pSI);
  if (n > p) return 'higher';
  if (n < p) return 'lower';
  return 'equal';
}

function getRelationLabel(v, isOpp, isChild, npcId) {
  if (npcId && game && game.memoryStore) {
    const npcObj = game.memoryStore.getById(npcId);
    if (npcObj && npcObj.role === 'concubine') return game.player.gender === '男' ? '侍妾' : '男宠';
    if (npcObj && npcObj.role === 'puppet') return '傀儡';
    if (npcObj && npcObj.role === 'parent') return npcObj.gender === '男' ? '父亲' : '母亲';
  }
  if (isChild && npcId) {
    const npc = game && game.memoryStore ? game.memoryStore.getById(npcId) : null;
    if (npc && npc.motherNpcId) {
      const p = game.player;
      if (p.gender === '男') return npc.gender === '男' ? '子（儿子）' : '女（女儿）';
      else return npc.gender === '男' ? '子（儿子）' : '女（女儿）';
    }
    return '血亲';
  }
  const bonds = (game && game.player && game.player.bonds) || [];
  const isBonded = npcId && bonds.includes(npcId);
  if (npcId && game && game.player) {
    const p = game.player;
    const npc = game.memoryStore ? game.memoryStore.getById(npcId) : null;
    if (p.master === npcId) return '师父';
    if ((p.disciples || []).includes(npcId)) return '徒弟';
    if (p.master && npc && npc.masterNpcId === p.master) {
      const diff = getRealmDiff(npc.realmIndex, npc.stageIndex, p.realmIndex, p.stageIndex);
      if (diff === 'higher') return npc.gender === '男' ? '师兄' : '师姐';
      return npc.gender === '男' ? '师弟' : '师妹';
    }
    if (isBonded && npc && npc.spouse === '__player__') return '道侣';
    if (isBonded) return isOpp ? '义兄妹' : (p.gender === '男' ? '结拜兄弟' : '结拜姐妹');
  }
  if (v >= 60) return '情深意重';
  if (v >= 30) return '相谈甚欢';
  if (v >= -29) return '素昧平生';
  if (v >= -59) return '心存芥蒂';
  return '不共戴天';
}

function getRelationCategory(v, isChild, npcId) {
  if (isChild) return 'blood';
  if (npcId && game && game.memoryStore) {
    const npcObj = game.memoryStore.getById(npcId);
    if (npcObj && npcObj.role === 'parent') return 'blood';
  }
  const bonds = (game && game.player && game.player.bonds) || [];
  if (npcId && bonds.includes(npcId)) return 'soulmate';
  if (v >= 30) return 'friend';
  if (v >= -29) return 'neutral';
  return 'enemy';
}

function canBreakthrough(entity) {
  return !isMaxRealm(entity.realmIndex, entity.stageIndex) &&
    entity.exp >= REALMS[entity.realmIndex].expPerStage;
}

function getPillForBreakthrough(realmIndex, stageIndex) {
  const curRealm = REALMS[realmIndex];
  const isMajor = stageIndex >= curRealm.stages.length - 1;
  if (isMajor) {
    return PILLS.find(p => p.forRealm === realmIndex + 1 && p.forStage === 0) || null;
  }
  return PILLS.find(p => p.forRealm === realmIndex && p.forStage === stageIndex + 1) || null;
}

function getMaxMoveRange(realmIndex) {
  if (realmIndex <= 1) return 2;
  if (realmIndex <= 3) return 3;
  if (realmIndex <= 5) return 4;
  return 5;
}

function clearAllSaves() {
  localStorage.removeItem('xiuxian_player');
  localStorage.removeItem('xiuxian_memory');
  localStorage.removeItem('xiuxian_map');
}

// ========== NPC 类 ==========

const NPC_HEAD_COUNTS = { '男': 3, '女': 2 };
const NPC_BODY_COUNTS = { '男': 3, '女': 4 };

function hashNpcAppearanceSeed(value) {
  let h = 2166136261;
  const str = String(value || 'npc');
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function createNpcAppearance(id, gender) {
  let state = hashNpcAppearanceSeed(`${id}|${gender || '男'}`) || 0x6d2b79f5;
  const next = max => {
    state ^= state << 13;
    state ^= state >>> 17;
    state ^= state << 5;
    return (state >>> 0) % max;
  };
  return {
    head: next(NPC_HEAD_COUNTS[gender] || NPC_HEAD_COUNTS['男']),
    body: next(NPC_BODY_COUNTS[gender] || NPC_BODY_COUNTS['男']),
  };
}

function normalizeNpcAppearance(value, id, gender) {
  const fallback = createNpcAppearance(id, gender);
  const source = value && typeof value === 'object' ? value : {};
  const headCount = NPC_HEAD_COUNTS[gender] || NPC_HEAD_COUNTS['男'];
  const bodyCount = NPC_BODY_COUNTS[gender] || NPC_BODY_COUNTS['男'];
  const oldBody = Number.isInteger(source.body) ? source.body
    : Number.isInteger(source.upper) ? source.upper
    : Number.isInteger(source.lower) ? source.lower
    : fallback.body;
  return {
    head: Number.isInteger(source.head)
      ? ((source.head % headCount) + headCount) % headCount
      : fallback.head,
    body: ((oldBody % bodyCount) + bodyCount) % bodyCount,
  };
}

function getNpcHeadAsset(gender, index) {
  const group = gender === '女' ? 'female' : 'male';
  return `assets/npc-parts/${group}/head-canvas-${index + 1}.png?v=4`;
}

function getNpcBodyAsset(gender, index) {
  const group = gender === '女' ? 'female' : 'male';
  return `assets/npc-parts/${group}/body-canvas-${index + 1}.png?v=4`;
}

function renderNpcPaperDoll(npc) {
  if (!npc) return '';
  const look = normalizeNpcAppearance(npc.appearance, npc.id, npc.gender);
  const head = getNpcHeadAsset(npc.gender, look.head);
  const body = `<img class="npc-part npc-part-body" src="${getNpcBodyAsset(npc.gender, look.body)}" alt="">`;
  return `<span class="npc-paperdoll" data-gender="${npc.gender === '女' ? '女' : '男'}" data-appearance-id="${npc.appearanceId || ''}" data-head="${look.head}" data-body="${look.body}">
    ${body}
    <img class="npc-part npc-part-head" src="${head}" alt="">
  </span>`;
}

class NPC {
  constructor(d) {
    this.id = d.id || genId();
    this.name = d.name;
    this.gender = d.gender;
    this.sect = d.sect;
    this.realmIndex = d.realmIndex !== undefined ? d.realmIndex : 0;
    this.stageIndex = d.stageIndex !== undefined ? d.stageIndex : 0;
    this.exp = d.exp || 0;
    this.lifeMax = d.lifeMax;
    this.lifeCurrent = d.lifeCurrent;
    this.personality = d.personality;
    this.isAlive = d.isAlive !== undefined ? d.isAlive : true;
    this.isPermanent = d.isPermanent || false;
    this.isChild = d.isChild || false;
    this.relations = d.relations || {};
    this.tempTurns = d.tempTurns || 0;
    this.age = d.age !== undefined ? d.age : null;
    this.pregnant = d.pregnant || null;
    this.motherNpcId = d.motherNpcId || null;
    this.spouse = d.spouse || null;
    this.masterNpcId = d.masterNpcId || null;
    this.role = d.role || null;
    this.appearance = normalizeNpcAppearance(d.appearance, this.id, this.gender);
    this.appearanceId = d.appearanceId || `look_${hashNpcAppearanceSeed(`${this.id}|${this.gender}`).toString(36)}`;
    // 旧存档没有此字段时自动补为空数组，最多保留最近八条关键往事。
    this.memories = Array.isArray(d.memories) ? d.memories.slice(-8) : [];
  }
  getRealmName() { return getRealmFullName(this.realmIndex, this.stageIndex); }
  get isMinor() { return this.age !== null && this.age < 20; }
  getRelation(id) { return this.relations[id] || 0; }
  changeRelation(id, d) { this.relations[id] = (this.relations[id] || 0) + d; }
  getRecentMemory() { return this.memories[this.memories.length - 1] || ''; }
}

// ========== 生成器 ==========

class Generator {
  createRandomNPC(playerRI, override = {}) {
    const maxRI = Math.min(playerRI + 1, REALMS.length - 1);
    const weights = [];
    for (let i = 0; i <= maxRI; i++) {
      const w = Math.pow(0.45, i);
      weights.push(w);
    }
    const total = weights.reduce((a, b) => a + b, 0);
    let roll = Math.random() * total;
    let ri = 0;
    for (let i = 0; i < weights.length; i++) {
      roll -= weights[i];
      if (roll <= 0) { ri = i; break; }
    }
    const r = REALMS[ri];
    const si = randInt(0, r.stages.length - 1);
    const defaults = {
      name: randName(), gender: randPick(['男', '女']),
      sect: Math.random() < 0.15 ? '散修' : randPick(SECT_NAMES),
      realmIndex: ri, stageIndex: si,
      exp: randInt(0, r.expPerStage - 1),
      lifeMax: r.lifeMax,
      lifeCurrent: randInt(Math.floor(r.lifeMax * 0.3), r.lifeMax),
      personality: randPick(Object.keys(PERSONALITIES)),
    };
    return new NPC({ ...defaults, ...override });
  }
}

class MemoryStore {
  constructor() { this.npcs = []; }
  add(npc) { npc.isPermanent = true; this.npcs.push(npc); }
  getById(id) { return this.npcs.find(n => n.id === id); }
  getAlive() { return this.npcs.filter(n => n.isAlive); }
  getDead() { return this.npcs.filter(n => !n.isAlive); }
  getAll() { return this.npcs; }
  save() { localStorage.setItem('xiuxian_memory', JSON.stringify(this.npcs)); }
  load() {
    const d = localStorage.getItem('xiuxian_memory');
    if (d) this.npcs = JSON.parse(d).map(x => new NPC(x));

}

// ========== 对话引擎 ==========

class DialogueEngine {
  replaceVars(text, npc, player) {
    return text
      .replace(/\{Player_Name\}/g, player.name)
      .replace(/\{Player_Realm\}/g, getRealmFullName(player.realmIndex, player.stageIndex))
      .replace(/\{NPC_Name\}/g, npc.name)
      .replace(/\{NPC_Sect\}/g, npc.sect)
      .replace(/\{NPC_Realm\}/g, npc.getRealmName())
      .replace(/\{Parent_Call\}/g, npc.gender === '男' ? '父亲' : '母亲');
  }

  getDialogue(npc, player) {
    const rel = npc.getRelation(player.id);
    const cat = getRelationCategory(rel, npc.isChild, npc.id);
    const diff = getRealmDiff(npc.realmIndex, npc.stageIndex, player.realmIndex, player.stageIndex);
    let pool;
    if (cat === 'neutral') {
      const pd = DIALOGUES.neutral[npc.personality];
      pool = pd ? pd[diff] : null;
    } else {
      pool = DIALOGUES[cat][diff];
    }
    if (!pool || !pool.length) return '……';
    const dialogue = this.replaceVars(randPick(pool), npc, player);
    const memory = npc.getRecentMemory();
    // 老相识偶尔会主动提起最近的往事，让关系不只是一个数值。
    if (memory && npc.isPermanent && Math.random() < 0.45) return `${memory}……${dialogue}`;
    return dialogue;
  }

  getDeadEncounter(npc) {
    let text = randPick(DIALOGUES.deadEncounter);
    text = text.replace(/\{NPC_Name\}/g, npc.name);
    text = text.replace(/\{NPC_Sect\}/g, npc.sect);
    text = text.replace(/\{NPC_Realm\}/g, npc.getRealmName());
    return text;
  }
}

// ========== 演进引擎 ==========

class EvolutionEngine {
  advanceTime(store, years) {
    const events = [];
    for (const npc of store.getAlive()) {
      npc.lifeCurrent -= years;
      if (npc.lifeCurrent <= 0) {
        npc.isAlive = false;
        events.push({ type: 'death', npcId: npc.id, text: `传闻${npc.sect}的${npc.name}已经陨落，享寿${npc.lifeMax}载。` });
        continue;
      }
      if (!isMaxRealm(npc.realmIndex, npc.stageIndex)) {
        const gain = Math.floor(randInt(10, 50) * (1 + npc.realmIndex * 0.5));
        npc.exp = Math.min(npc.exp + gain, REALMS[npc.realmIndex].expPerStage);
        if (canBreakthrough(npc)) {
          const r = REALMS[npc.realmIndex];
          const chance = r.breakChance * (npc.stageIndex >= r.stages.length - 1 ? 0.7 : 1);
          if (Math.random() < chance) {
            npc.stageIndex++;
            npc.exp = 0;
            if (npc.stageIndex >= REALMS[npc.realmIndex].stages.length) {
              npc.stageIndex = 0;
              npc.realmIndex++;
              npc.lifeMax = REALMS[npc.realmIndex].lifeMax;
              npc.lifeCurrent += Math.floor(REALMS[npc.realmIndex].lifeMax * 0.4);
              events.push({ type: 'breakthrough', text: `传闻${npc.name}大境界突破，晋升${npc.getRealmName()}！` });
            } else {
              events.push({ type: 'breakthrough', text: `传闻${npc.name}突破至${npc.getRealmName()}。` });
            }
          }
        }
      }
    }
    return events;
  }
}

// ========== 战斗引擎 ==========

class CombatEngine {
  calcPower(ri, si, treasurePower) {
    return getTotalPower(ri, si) * 10 + (treasurePower || 0);
  }

  fight(attackerPower, defenderPower) {
    const aRoll = attackerPower * (0.8 + Math.random() * 0.4);
    const dRoll = defenderPower * (0.8 + Math.random() * 0.4);
    return aRoll >= dRoll;
  }
}

// ========== 地图系统 ==========

class MapSystem {
  constructor() {
    this.grid = [];
    this.playerX = 8;
    this.playerY = 8;
  }

  generate() {
    this.grid = [];
    for (let y = 0; y < MAP_SIZE; y++) {
      const row = [];
      for (let x = 0; x < MAP_SIZE; x++) {
        const distFromCenter = Math.abs(x - 8) + Math.abs(y - 8);
        let qi;
        if (distFromCenter <= 3) qi = Math.random() < 0.7 ? 1 : 2;
        else if (distFromCenter <= 7) qi = Math.random() < 0.5 ? 2 : (Math.random() < 0.6 ? 1 : 3);
        else if (distFromCenter <= 11) qi = Math.random() < 0.4 ? 3 : (Math.random() < 0.5 ? 2 : 4);
        else qi = Math.random() < 0.3 ? 4 : 3;
        row.push({ qi, npcIds: [], type: 'normal' });
      }
      this.grid.push(row);
    }
    for (const mp of MARKET_POSITIONS) {
      this.grid[mp.y][mp.x].type = 'market';
      this.grid[mp.y][mp.x].qi = 2;
    }
    for (const sect of SECTS) {
      const p = sect.mapPos;
      this.grid[p.y][p.x].type = 'sect';
      this.grid[p.y][p.x].sectId = sect.id;
      this.grid[p.y][p.x].qi = 3;
    }
    this.playerX = 8;
    this.playerY = 8;
  }

  getCell(x, y) { return this.grid[y]?.[x]; }

  isMarket(x, y) { const c = this.getCell(x, y); return c && c.type === 'market'; }

  shuffleQi() {
    for (let y = 0; y < MAP_SIZE; y++) {
      for (let x = 0; x < MAP_SIZE; x++) {
        const c = this.grid[y][x];
        if (c.cultivateCount > 0) c.cultivateCount = Math.max(0, c.cultivateCount - 1);
        if (c.type === 'market' || c.type === 'sect') continue;
        if (Math.random() < 0.6) {
          const shift = randPick([-1, -1, 0, 1, 1]);
          c.qi = Math.max(1, Math.min(4, c.qi + shift));
        }
      }
    }
  }

  shuffleQiLocal(px, py) {
    for (let dy = -3; dy <= 3; dy++) {
      for (let dx = -3; dx <= 3; dx++) {
        const nx = px + dx, ny = py + dy;
        if (nx < 0 || nx >= MAP_SIZE || ny < 0 || ny >= MAP_SIZE) continue;
        const c = this.grid[ny][nx];
        if (c.type === 'market' || c.type === 'sect') continue;
        if (Math.random() < 0.3) {
          c.qi = Math.max(1, Math.min(4, c.qi + randPick([-1, 1])));
        }
      }
    }
  }

  getReachable(px, py, maxRange) {
    const r = maxRange || 2;
    const cells = [];
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const dist = Math.abs(dx) + Math.abs(dy);
        if (dist === 0 || dist > r) continue;
        const nx = px + dx, ny = py + dy;
        if (nx >= 0 && nx < MAP_SIZE && ny >= 0 && ny < MAP_SIZE) {
          cells.push({ x: nx, y: ny, dist });
        }
      }
    }
    return cells;
  }

  placeNPCs(memoryStore) {
    for (const row of this.grid) for (const cell of row) cell.npcIds = [];
    for (const npc of memoryStore.getAlive()) {
      const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
      if (!(x === this.playerX && y === this.playerY)) {
        this.grid[y][x].npcIds.push(npc.id);
      }
    }
  }

  moveNPCs(memoryStore) {
    const positions = {};
    for (let y = 0; y < MAP_SIZE; y++)
      for (let x = 0; x < MAP_SIZE; x++) {
        for (const id of (this.grid[y][x].npcIds || [])) positions[id] = { x, y };
        this.grid[y][x].npcIds = [];
      }
    for (const [id, pos] of Object.entries(positions)) {
      const npc = memoryStore.getById(id);
      if (!npc || !npc.isAlive) continue;
      const dx = randInt(-2, 2), dy = randInt(-2, 2);
      const nx = Math.max(0, Math.min(MAP_SIZE - 1, pos.x + dx));
      const ny = Math.max(0, Math.min(MAP_SIZE - 1, pos.y + dy));
      this.grid[ny][nx].npcIds.push(id);
    }
  }

  save() {
    localStorage.setItem('xiuxian_map', JSON.stringify({
      grid: this.grid, playerX: this.playerX, playerY: this.playerY
    }));
  }

  load() {
    const d = localStorage.getItem('xiuxian_map');
    if (d) {
      const obj = JSON.parse(d);
      this.grid = obj.grid;
      for (const row of this.grid) for (const cell of row) {
        if (cell.npcId && !cell.npcIds) { cell.npcIds = [cell.npcId]; delete cell.npcId; }
        if (!cell.npcIds) cell.npcIds = [];
      }
      this.playerX = obj.playerX;
      this.playerY = obj.playerY;
      return true;
    }
    return false;
  }
}

  spirit: { night:'assets/scene-spirit-vein-v2.png', day:'assets/scene-spirit-vein-v2.png' },
