};

function getActivitySceneKey(cell) {
  if (!cell) return 'wilderness';
  if (cell.ruin || cell.rift) return 'ruin';
  if (cell.type === 'market') return 'market';
  if (cell.type === 'sect') return 'sect';
  if (cell.qi >= 4) return 'paradise';
  if (cell.qi === 3) return 'spirit';
  return 'wilderness';
}

function getActivityScenePeriod(type, worldYear) {
  if (type === 'map' || type === 'explore') return 'day';
  if (type === 'meditate' || type === 'breakthrough' || type === 'time') return 'night';
  return ((worldYear || 1) % 4 < 2) ? 'day' : 'night';
}

class Game {
  constructor() {
    this.player = null;
    this.generator = new Generator();
    this.memoryStore = new MemoryStore();
    this.dialogueEngine = new DialogueEngine();
    this.evolutionEngine = new EvolutionEngine();
    this.combatEngine = new CombatEngine();
    this.mapSystem = new MapSystem();
    this.currentNPC = null;
    this.inEncounter = false;
    this.isDead = false;
  }

  setActivity(type, detail = {}) {
    const presets = {
      idle: ['初入仙途','静观天地，择路而行','状态安稳',22],
      map: ['观览天地图','推演路线，寻找机缘','查看周遭',35],
      explore: ['外出历练','踏山寻宝，访道问缘','寿元 -1',58],
      rest: ['调息疗伤','吐纳灵气，平复伤势',detail.gain || '气血恢复',72],
      meditate: ['闭关修炼','抱元守一，炼气归真',detail.gain || '修为精进',82],
      breakthrough: ['冲击境界','灵力奔涌，道关在前',detail.gain || '成败未卜',94],
      time: ['静观岁月','世事流转，因果暗生',detail.gain || '岁月流逝',48],
    };
    const value = presets[type] || presets.idle;
    const cell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
    const place = cell ? (cell.type === 'market' ? '坊市' : cell.type === 'sect' ? ((getSectById(cell.sectId)||{}).name || '宗门驻地') : `${QI_NAMES[cell.qi]}之地`) : '未知之地';
    document.getElementById('activityTitle').textContent = value[0];
    document.getElementById('activitySubtitle').textContent = value[1];
    document.getElementById('activityGain').textContent = value[2];
    document.getElementById('activityTime').textContent = detail.time || `修仙历 ${this.player.worldYear || 1} 年`;
    document.getElementById('activityPeriod').textContent = detail.period || (type === 'idle' ? '此刻无事' : '行动进行中');
    document.getElementById('activityStop').textContent = type === 'meditate' ? '提前出关' : '结束行动';
    document.getElementById('activityScene').textContent = place;
    document.getElementById('activityProgress').style.width = `${value[3]}%`;
    document.querySelectorAll('[data-action]').forEach(el => el.classList.toggle('action-active', el.dataset.action === type));
    const panel = document.getElementById('activityPanel');
    const sceneKey = getActivitySceneKey(cell);
    const scenePeriod = getActivityScenePeriod(type, this.player.worldYear);
    panel.dataset.scene = sceneKey;
    panel.dataset.action = type;
    panel.dataset.period = scenePeriod;
    panel.style.setProperty('--activity-scene-bg', `url('${ACTIVITY_SCENES[sceneKey][scenePeriod]}')`);
    panel.classList.remove('activity-enter');
    requestAnimationFrame(() => panel.classList.add('activity-enter'));
  }

  init(name, gender, origin) {
    this.player = {
      id: 'player', name, gender,
      origin: origin || 'mortal',
      realmIndex: 0, stageIndex: 0, exp: 0,
      lifeMax: REALMS[0].lifeMax, lifeCurrent: REALMS[0].lifeMax,
      hp: REALMS[0].hpMax, hpMax: REALMS[0].hpMax,
      inventory: { lingshi: 0, pills: {}, items: [], huixuedan: 0, xunzongfu: 0 },
      skills: [], activeSkill: null,
      sect: null,
      bonds: [],
      master: null,
      disciples: [],
      concubines: [],
      puppets: [],
      worldYear: 1,
      infamy: 0,
      hunters: [],
      bountyTask: null,
      stats: { kills: 0, explored: 0, meditateYears: 0, lingshiEarned: 0, pillsUsed: 0, moved: 0, npcMet: 0, peakRealm: '练气初期' },
    };
    const saved = localStorage.getItem('xiuxian_player');
    if (saved) {
      const p = JSON.parse(saved);
      if (p.realmIndex === undefined) { p.realmIndex = 0; p.stageIndex = 0; p.exp = 0; }
      if (p.hp === undefined) { p.hp = REALMS[p.realmIndex].hpMax; p.hpMax = REALMS[p.realmIndex].hpMax; }
      if (!p.inventory) p.inventory = { lingshi: 0, pills: {}, items: [], huixuedan: 0 };
      if (p.inventory.huixuedan === undefined) p.inventory.huixuedan = 0;
      if (p.inventory.xunzongfu === undefined) p.inventory.xunzongfu = 0;
      if (!p.origin) p.origin = 'mortal';
      if (!p.concubines) p.concubines = [];
      if (!p.puppets) p.puppets = [];
      if (!p.stats) p.stats = { kills: 0, explored: 0, meditateYears: 0, lingshiEarned: 0, pillsUsed: 0, moved: 0, npcMet: 0, peakRealm: getRealmFullName(p.realmIndex, p.stageIndex) };
      this.player = p;
    } else {
      const o = ORIGINS.find(x => x.id === origin);
      if (o) o.apply(this.player);
      this.generateParents();
    }
    this.memoryStore.load();
    for (const npc of this.memoryStore.getAll()) {
      if (npc.realmIndex === undefined) { npc.realmIndex = 0; npc.stageIndex = 0; npc.exp = 0; }
    }
    if (!this.mapSystem.load()) {
      this.mapSystem.generate();
      this.mapSystem.placeNPCs(this.memoryStore);
      this.mapSystem.save();
    }
    this.updateHeader();
    this.updateMarketBtn();
    this.updateNpcBtn();
    this.setActivity('idle');
    const o = ORIGINS.find(x => x.id === this.player.origin);
    this.log(`【出身：${o ? o.name : '凡人'}】${o ? o.desc : ''}`, 'system');
    this.log('你踏上了修仙之路，前方道阻且长。', 'system');
  }

  generateParents() {
    const surname = this.player.name[0];
    const parentRI = randInt(1, 2);
    const parentSI = randInt(0, REALMS[parentRI].stages.length - 1);
    const sectName = this.player.sect ? (getSectById(this.player.sect)||{}).name || '散修' : '散修';

    const father = this.generator.createRandomNPC(parentRI, {
      name: surname + randPick(NAME_CHAR1) + randPick(NAME_CHAR2), gender: '男',
      sect: sectName, personality: randPick(['righteous', 'kind', 'righteous']),
      realmIndex: parentRI, stageIndex: parentSI,
    });
    father.role = 'parent';
    father.isPermanent = true;
    father.changeRelation(this.player.id, 80);
    this.memoryStore.add(father);

    const motherRI = randInt(0, parentRI);
    const motherSI = randInt(0, REALMS[motherRI].stages.length - 1);
    const mother = this.generator.createRandomNPC(motherRI, {
      gender: '女', sect: sectName,
      personality: randPick(['kind', 'kind', 'righteous']),
      realmIndex: motherRI, stageIndex: motherSI,
    });
    mother.role = 'parent';
    mother.isPermanent = true;
    mother.changeRelation(this.player.id, 80);
    this.memoryStore.add(mother);

    this.memoryStore.save();
  }

  save() {
    if (this.isDead) return;
    localStorage.setItem('xiuxian_player', JSON.stringify(this.player));
    this.memoryStore.save();
  }

  getPlayerTreasurePower() {
    const base = (this.player.inventory.items || []).reduce((s, t) => s + t.power, 0);
    return this.player.origin === 'demon' ? Math.floor(base * 1.2) : base;
  }

  getPlayerCombatPower() {
    const base = this.combatEngine.calcPower(this.player.realmIndex, this.player.stageIndex, this.getPlayerTreasurePower());
    return this.player.origin === 'demon' ? Math.floor(base * 1.2) : base;
  }

  trackStat(key, val) {
    if (!this.player.stats) this.player.stats = {};
    this.player.stats[key] = (this.player.stats[key] || 0) + (val || 1);
  }

  rememberNpc(npc, text) {
    if (!npc || !text) return;
    if (!Array.isArray(npc.memories)) npc.memories = [];
    if (npc.memories[npc.memories.length - 1] === text) return;
    npc.memories.push(text);
    if (npc.memories.length > 8) npc.memories.splice(0, npc.memories.length - 8);
  }

  updatePeakRealm() {
    if (!this.player.stats) this.player.stats = {};
    this.player.stats.peakRealm = getRealmFullName(this.player.realmIndex, this.player.stageIndex);
  }

  worldTick(years) {
    this.player.worldYear = (this.player.worldYear || 1) + years;
    this.player.lifeCurrent -= years;
    document.getElementById('worldYear').textContent = this.player.worldYear;
    for (const npc of this.memoryStore.getAlive()) {
      npc.lifeCurrent -= years;
      if (npc.lifeCurrent <= 0) {
        npc.isAlive = false;
        if (npc.role === 'concubine') this.player.concubines = (this.player.concubines||[]).filter(id => id !== npc.id);
        if (npc.role === 'puppet') this.player.puppets = (this.player.puppets||[]).filter(id => id !== npc.id);
        const rel = npc.getRelation(this.player.id);
        const bonds = this.player.bonds || [];
        const isBond = bonds.includes(npc.id);
        const isMaster = this.player.master === npc.id;
        const isDisciple = (this.player.disciples || []).includes(npc.id);
        const isChild = npc.isChild || npc.motherNpcId;
        const isConcubine = npc.role === 'concubine';
        const isPuppet = npc.role === 'puppet';
        const causes = ['寿元耗尽','修炼走火入魔','遭妖兽袭击','突破失败灵力反噬','被仇家追杀','陨落于秘境之中','遭遇天劫'];
        const cause = npc.lifeCurrent <= -20 ? '寿元耗尽' : randPick(causes);
        let deathMsg = '';
        if (isConcubine) deathMsg = `你的${this.player.gender === '男' ? '侍妾' : '男宠'}<span class="npc-name">${npc.name}</span>因${cause}而陨落！`;
        else if (isPuppet) deathMsg = `你的傀儡<span class="npc-name">${npc.name}</span>因${cause}而损毁！`;
        else if (npc.spouse === '__player__') deathMsg = `噩耗——你的道侣<span class="npc-name">${npc.name}</span>因${cause}而陨落！`;
        else if (npc.role === 'parent') deathMsg = `噩耗——你的${npc.gender === '男' ? '父亲' : '母亲'}<span class="npc-name">${npc.name}</span>因${cause}而${cause === '寿元耗尽' ? '仙逝' : '陨落'}……`;
        else if (isChild) deathMsg = `噩耗——你的${npc.gender === '男' ? '儿子' : '女儿'}<span class="npc-name">${npc.name}</span>因${cause}而陨落！`;
        else if (isMaster) deathMsg = `悲痛——你的师父<span class="npc-name">${npc.name}</span>因${cause}而仙逝……`;
        else if (isDisciple) deathMsg = `你的徒弟<span class="npc-name">${npc.name}</span>因${cause}而身陨！`;
        else if (isBond) deathMsg = `至交<span class="npc-name">${npc.name}</span>因${cause}而陨落……`;
        else if (rel >= 30) deathMsg = `传闻好友${npc.name}因${cause}而陨落。`;
        else if (npc.isPermanent) { this.log(`传闻${npc.name}因${cause}而陨落。`, ''); continue; }
        if (deathMsg) {
          showScenePopup('danger', npc.name + ' 陨落', 2000);
          this.log(deathMsg, 'danger');
        }
      }
      if (npc.age !== null) npc.age += years;
      if (npc.pregnant) {
        npc.pregnant.turnsLeft -= years;
        if (npc.pregnant.turnsLeft <= 0) {
          const baby = this.generator.createRandomNPC(0, {
            name: npc.pregnant.name, gender: npc.pregnant.gender,
            sect: this.player.sect ? (getSectById(this.player.sect)||{}).name || '散修' : '散修',
            realmIndex: 0, stageIndex: 0, exp: 0,
          });
          baby.isChild = true; baby.age = 0; baby.motherNpcId = npc.id;
          baby.isPermanent = true; baby.changeRelation(this.player.id, 100);
          this.memoryStore.add(baby);
          npc.pregnant = null;
          showScenePopup('success', '喜得贵子', 2000);
          this.log(`<span class="npc-name">${npc.name}</span>诞下一${baby.gender === '男' ? '子' : '女'}，取名<span class="npc-name">${baby.name}</span>！`, 'pink');
        }
      }
      if (npc.age !== null && npc.isChild && npc.age >= 20 && npc.age - years < 20) {
        showScenePopup('success', npc.name + ' 成年', 1800);
        this.log(`你的${npc.gender === '男' ? '儿子' : '女儿'}<span class="npc-name">${npc.name}</span>已经成年！`, 'pink');
        this.placeNpcOnMap(npc); npc.tempTurns = 3;
      }
      if (npc.role === 'concubine' && npc.isAlive && !isMaxRealm(npc.realmIndex, npc.stageIndex)) {
        const maxRI = Math.min(this.player.realmIndex, REALMS.length - 1);
        if (npc.realmIndex < maxRI || (npc.realmIndex === maxRI && npc.stageIndex < this.player.stageIndex)) {
          const gain = Math.floor(randInt(5, 25) * (1 + npc.realmIndex * 0.3));
          npc.exp = Math.min((npc.exp || 0) + gain, REALMS[npc.realmIndex].expPerStage);
          if (canBreakthrough(npc)) {
            const r = REALMS[npc.realmIndex];
            if (Math.random() < r.breakChance) {
              npc.stageIndex++;
              npc.exp = 0;
              if (npc.stageIndex >= r.stages.length) {
                npc.stageIndex = 0;
                npc.realmIndex++;
                npc.lifeMax = REALMS[npc.realmIndex].lifeMax;
                npc.lifeCurrent += Math.floor(REALMS[npc.realmIndex].lifeMax * 0.4);
                npc.hpMax = REALMS[npc.realmIndex].hpMax;
                this.log(`你的侍妾<span class="npc-name">${npc.name}</span>突破至<span class="realm-text">${npc.getRealmName()}</span>！`, 'pink');
              }
            }
          }
        }
      }
    }
    for (const npc of this.memoryStore.getAlive()) {
      const bonds = this.player.bonds || [];
      const isClose = bonds.includes(npc.id) || this.player.master === npc.id ||
        (this.player.disciples||[]).includes(npc.id) || npc.isChild || npc.motherNpcId;
      if (!isClose) continue;
      if (npc.rescueTask) {
        npc.lifeCurrent = Math.max(npc.lifeCurrent, 10);
      }
      if (npc.lifeCurrent > 0 && !npc.rescueTask && Math.random() < 0.05) {
        const rescueTypes = [
          { msg: '被歹人追杀，速来援助', type: 'fight', desc: '击退歹人' },
          { msg: '遭遇强敌，需要帮手', type: 'fight', desc: '击退强敌' },
          { msg: '急需突破丹药，你可有', type: 'pill', desc: '送突破丹药' },
          { msg: '灵石告急，能否接济', type: 'lingshi', desc: '接济灵石' },
        ];
        const rt = randPick(rescueTypes);
        this.placeNpcOnMap(npc);
        npc.tempTurns = 20;
        npc.rescueTask = rt;
        let pos = '';
        for (let y = 0; y < MAP_SIZE; y++)
          for (let x = 0; x < MAP_SIZE; x++)
            if ((this.mapSystem.grid[y][x].npcIds||[]).includes(npc.id)) pos = `（${x+1},${y+1}）`;
        showScenePopup('danger', npc.name + ' 求救', 2500);
        this.log(`<span class="npc-name">${npc.name}</span>传来求救：「${rt.msg}！我在${pos}，快来！」`, 'danger');
      }
    }

    if (!this.isDead && !this.inEncounter && this.player.sect) {
      const sect = getSectById(this.player.sect);
      if (sect && sect.rivals.length && Math.random() < 0.03) {
        this.pendingSectEvent = 'war';
      }
      const wy = this.player.worldYear || 1;
      if (sect && wy % 50 < years && wy >= 50) {
        this.pendingSectEvent = 'tournament';
      }
    }

    if (this.player.lifeCurrent <= 0) {
      this.die('你的寿元已尽，道消身陨……游戏结束。');
    }
  }

  placeNpcAtPlayer(npc) {
    this.removeNpcFromCell(npc);
    const cell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
    if (cell) {
      if (!cell.npcIds) cell.npcIds = [];
      if (!cell.npcIds.includes(npc.id)) cell.npcIds.push(npc.id);
    }
  }

  removeNpcFromCell(npc) {
    for (let y = 0; y < MAP_SIZE; y++)
      for (let x = 0; x < MAP_SIZE; x++) {
        const ids = this.mapSystem.grid[y][x].npcIds || [];
        const idx = ids.indexOf(npc.id);
        if (idx !== -1) ids.splice(idx, 1);
      }
  }

  placeNpcOnMap(npc) {
    for (let y = 0; y < MAP_SIZE; y++)
      for (let x = 0; x < MAP_SIZE; x++) {
        const ids = this.mapSystem.grid[y][x].npcIds || [];
        const idx = ids.indexOf(npc.id);
        if (idx !== -1) ids.splice(idx, 1);
      }
    const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
    if (!this.mapSystem.grid[y][x].npcIds) this.mapSystem.grid[y][x].npcIds = [];
    this.mapSystem.grid[y][x].npcIds.push(npc.id);
  }

  moveFollowers() {
    const ids = [...(this.player.concubines || []), ...(this.player.puppets || [])];
    for (const id of ids) {
      const npc = this.memoryStore.getById(id);
      if (npc && npc.isAlive) this.placeNpcAtPlayer(npc);
    }
  }

  getFollowerAtk() {
    let atk = 0;
    for (const id of (this.player.concubines || [])) {
      const npc = this.memoryStore.getById(id);
      if (npc && npc.isAlive) atk += getTotalPower(npc.realmIndex, npc.stageIndex) * 4;
    }
    for (const id of (this.player.puppets || [])) {
      const npc = this.memoryStore.getById(id);
      if (npc && npc.isAlive) atk += getTotalPower(npc.realmIndex, npc.stageIndex) * 6;
    }
    return atk;
  }

  getFollowerNames() {
    const names = [];
    for (const id of (this.player.concubines || [])) {
      const npc = this.memoryStore.getById(id);
      if (npc && npc.isAlive) names.push(npc.name + '(侍)');
    }
    for (const id of (this.player.puppets || [])) {
      const npc = this.memoryStore.getById(id);
      if (npc && npc.isAlive) names.push(npc.name + '(傀)');
    }
    return names;
  }

  dismissFollower(npcId) {
    const npc = this.memoryStore.getById(npcId);
    if (!npc) return;
    if (npc.role === 'concubine') {
      this.player.concubines = (this.player.concubines || []).filter(id => id !== npcId);
      npc.role = null;
      const label = this.player.gender === '男' ? '侍妾' : '男宠';
      this.log(`你释放了${label}${npc.name}，让其自行离去。`, 'system');
    } else if (npc.role === 'puppet') {
      this.player.puppets = (this.player.puppets || []).filter(id => id !== npcId);
      npc.role = null;
      npc.isAlive = false;
      this.log(`你解除了傀儡${npc.name}的术法，其灵体消散。`, 'system');
    }
    this.removeNpcFromCell(npc);
    if (npc.isAlive) this.placeNpcOnMap(npc);
    this.memoryStore.save();
    this.save();
    this.updateHeader();
    this.updateNpcBtn();
    this.showMainActions();
  }

  applyOriginRelation(npc) {
    const o = this.player.origin;
    if (o === 'sect') {
      if (npc.personality === 'righteous' || npc.personality === 'kind') npc.changeRelation(this.player.id, 10);
    } else if (o === 'noble') {
      if (npc.personality === 'greedy') npc.changeRelation(this.player.id, 15);
    } else if (o === 'demon') {
      npc.changeRelation(this.player.id, -15);
      if (npc.personality === 'sinister') npc.changeRelation(this.player.id, 35);
    }
    const infamy = this.player.infamy || 0;
    if (infamy >= 30) {
      const sectObj = getSectByName(npc.sect);
      if (sectObj && sectObj.type === '正') npc.changeRelation(this.player.id, -10);
    }
    if (this.player.sect && npc.sect) {
      const playerSect = getSectById(this.player.sect);
      const npcSect = getSectByName(npc.sect);
      if (playerSect && npcSect) {
        if (playerSect.id === npcSect.id) {
          npc.changeRelation(this.player.id, 30);
        } else if (playerSect.rivals.includes(npcSect.id)) {
          npc.changeRelation(this.player.id, -20);
        }
      }
    }
  }

  updateHeader() {
    const p = this.player;
    document.getElementById('playerName').textContent = p.name;
    document.getElementById('playerGender').textContent = p.gender;
    const originObj = ORIGINS.find(x => x.id === p.origin);
    document.getElementById('playerOrigin').textContent = originObj ? originObj.name : '凡人';
    const playerSect = p.sect ? getSectById(p.sect) : null;
    document.getElementById('playerSect').textContent = playerSect ? playerSect.name : '散修';
    document.getElementById('playerRealm').textContent = getRealmFullName(p.realmIndex, p.stageIndex);
    document.getElementById('playerLife').textContent = p.lifeCurrent;
    document.getElementById('playerLingshi').textContent = p.inventory.lingshi;
    const ms = this.mapSystem;
    document.getElementById('playerPos').textContent = `${ms.playerX+1},${ms.playerY+1}`;
    const cell = ms.getCell(ms.playerX, ms.playerY);
    document.getElementById('posQi').textContent = cell ? ` · ${cell.type === 'market' ? '坊市' : cell.type === 'sect' ? (getSectById(cell.sectId)||{}).name||'' : QI_NAMES[cell.qi]}` : '';
    const infamy = p.infamy || 0;
    let infamyText = '';
    if (infamy >= 100) infamyText = ' · <span style="color:var(--red)">人人喊打</span>';
    else if (infamy >= 60) infamyText = ' · <span style="color:var(--red)">臭名昭著</span>';
    else if (infamy >= 30) infamyText = ' · <span style="color:#e67e22">恶名远播</span>';
    document.getElementById('playerInfamy').innerHTML = infamyText;
    document.getElementById('worldYear').textContent = p.worldYear || 1;
    const skillPow = p.activeSkill ? (getSkillById(p.activeSkill)||{}).power||0 : 0;
    const totalPow = getTotalPower(p.realmIndex, p.stageIndex) * 8 + this.getPlayerTreasurePower() + skillPow;
    document.getElementById('playerPower').textContent = p.origin === 'demon' ? Math.floor(totalPow * 1.2) : totalPow;
    const cc = (p.concubines || []).filter(id => { const n = this.memoryStore.getById(id); return n && n.isAlive; }).length;
    const pp = (p.puppets || []).filter(id => { const n = this.memoryStore.getById(id); return n && n.isAlive; }).length;
    let fText = '';
    if (cc > 0) fText += ` · <span style="color:var(--pink)">侍${cc}</span>`;
    if (pp > 0) fText += ` · <span style="color:#9b59b6">傀${pp}</span>`;
    document.getElementById('playerFollowers').innerHTML = fText;

    const maxExp = REALMS[p.realmIndex].expPerStage;
    const atMax = isMaxRealm(p.realmIndex, p.stageIndex);
    const full = !atMax && p.exp >= maxExp;
    const pct = atMax ? 100 : Math.min(100, Math.floor(p.exp / maxExp * 100));
    const fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.className = 'progress-fill' + (full ? ' full' : '');
    document.getElementById('progressText').textContent =
      atMax ? '修为圆满' : (full ? `修为已满 可尝试突破！` : `修为 ${p.exp}/${maxExp}`);

    const hpPct = Math.max(0, Math.floor(p.hp / p.hpMax * 100));
    document.getElementById('hpFill').style.width = hpPct + '%';
    document.getElementById('hpText').textContent = `气血 ${p.hp}/${p.hpMax}`;

    const btn = document.getElementById('btnBreakthrough');
    const btnLabel = btn.querySelector('span');
    if (full) {
      const pill = getPillForBreakthrough(p.realmIndex, p.stageIndex);
      const hasPill = pill ? (p.inventory.pills[pill.id] || 0) > 0 : true;
      if (pill && !hasPill) {
        btn.className = 'btn';
        btn.disabled = true;
        btnLabel.textContent = `需要${pill.name}`;
      } else {
        btn.className = 'btn btn-glow';
        btn.disabled = false;
        btnLabel.textContent = '尝试突破';
      }
    } else {
      btn.className = 'btn';
      btn.disabled = atMax || !full;
      btnLabel.textContent = '尝试突破';
    }
  }

  // 战报统一标记人名：即使旧代码漏写了 span，临时 NPC 也能有相同的视觉提示。
  highlightLogNames(container) {
    if (!this.player) return;
    const nameClasses = new Map();
    if (this.player.name) nameClasses.set(this.player.name, 'player-name');
    for (const npc of this.memoryStore.getAll()) {
      if (npc.name && npc.name !== this.player.name) nameClasses.set(npc.name, 'npc-name');
    }
    if (this.currentNPC && this.currentNPC.name && this.currentNPC.name !== this.player.name) {
      nameClasses.set(this.currentNPC.name, 'npc-name');
    }
    const names = [...nameClasses.keys()].filter(name => name.length > 1).sort((a, b) => b.length - a.length);
    if (!names.length) return;
    const escaped = names.map(name => name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const pattern = new RegExp(`(${escaped.join('|')})`, 'g');
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) textNodes.push(node);
    for (const textNode of textNodes) {
      pattern.lastIndex = 0;
      if (!pattern.test(textNode.nodeValue) || textNode.parentElement.closest('.npc-name, .player-name')) continue;
      pattern.lastIndex = 0;
      const fragment = document.createDocumentFragment();
      for (const part of textNode.nodeValue.split(pattern)) {
        const cls = nameClasses.get(part);
        if (cls) {
          const span = document.createElement('span');
          span.className = cls;
          span.textContent = part;
          fragment.appendChild(span);
        } else if (part) fragment.appendChild(document.createTextNode(part));
      }
      textNode.parentNode.replaceChild(fragment, textNode);
    }
  }

  tryRescue() {
    const ri = this.player.realmIndex;
    const alive = this.memoryStore.getAlive();
    const parents = alive.filter(n => n.role === 'parent');
    const master = this.player.master ? alive.find(n => n.id === this.player.master) : null;
    const elders = alive.filter(n => n.getRelation(this.player.id) >= 30 && n.realmIndex > ri);

    const rescuers = [];
    for (const p of parents) rescuers.push({ npc: p, type: 'parent', baseChance: 0.7 });
    if (master) rescuers.push({ npc: master, type: 'master', baseChance: 0.5 });
    for (const e of elders) rescuers.push({ npc: e, type: 'elder', baseChance: 0.3 });

    if (!rescuers.length) return false;

    let realmMod = ri <= 1 ? 0.15 : ri <= 2 ? 0.05 : ri <= 3 ? -0.05 : -0.2;
    const rescueUsed = this.player.rescueCount || 0;
    const decayMod = -rescueUsed * 0.15;

    for (const r of rescuers) {
      const chance = Math.max(0.05, r.baseChance + realmMod + decayMod);
      if (Math.random() < chance) {
        this.player.hp = Math.floor(this.player.hpMax * 0.3);
        this.player.rescueCount = rescueUsed + 1;
        const label = r.type === 'parent' ? (r.npc.gender === '男' ? '父亲' : '母亲') :
                      r.type === 'master' ? '师父' : '前辈';
        showScenePopup('success', label + '搭救', 2000);
        this.log(`就在你命悬一线之际，${label}<span class="npc-name">${r.npc.name}</span>及时赶到，将你救下！`, 'success');
        this.log(`"${this.getRescueDialogue(r.type, r.npc)}"`, '');
        this.log(`你捡回一条命，气血恢复至 ${this.player.hp}。`, 'system');
        this.updateHeader();
        this.save();
        this.showMainActions();
        return true;
      }
    }
    return false;
  }

  parseAiCommands(reply, npc) {
    const cmds = [];
    let text = reply;
    const patterns = [
      { re: /\[送灵石[：:](\d+)\]/g, type: 'giveLingshi' },
      { re: /\[送丹药\]/g, type: 'givePill' },
      { re: /\[好感\+(\d+)\]/g, type: 'relUp' },
      { re: /\[好感-(\d+)\]/g, type: 'relDown' },
      { re: /\[双修\]/g, type: 'dual' },
      { re: /\[表白\]/g, type: 'propose' },
      { re: /\[结拜\]/g, type: 'bond' },
      { re: /\[传功[：:](\d+)\]/g, type: 'teachExp' },
    ];
    for (const p of patterns) {
      let m;
      while ((m = p.re.exec(reply)) !== null) {
        cmds.push({ type: p.type, value: m[1] ? parseInt(m[1]) : 0 });
      }
      text = text.replace(p.re, '');
    }
    return { text: text.trim(), cmds };
  }

  executeAiCommand(cmd, npc) {
    const p = this.player;
    if (cmd.type === 'giveLingshi') {
      const v = Math.min(cmd.value, Math.max(50, npc.realmIndex * 30));
      p.inventory.lingshi += v;
      this.trackStat('lingshiEarned', v);
      this.log(`${npc.name}赠你 ${v} 灵石。`, 'success');
    } else if (cmd.type === 'givePill') {
      const maxR = Math.min(npc.realmIndex + 1, 7);
      const avail = PILLS.filter(pp => pp.forRealm <= maxR);
      if (avail.length) {
        const dp = randPick(avail);
        p.inventory.pills[dp.id] = (p.inventory.pills[dp.id] || 0) + 1;
        this.log(`${npc.name}赠你一颗<span class="npc-name">${dp.name}</span>。`, 'loot');
      }
    } else if (cmd.type === 'relUp') {
      const v = Math.min(cmd.value, 10);
      npc.changeRelation(p.id, v);
      this.log(`好感度 +${v}`, 'success');
    } else if (cmd.type === 'relDown') {
      const v = Math.min(cmd.value, 10);
      npc.changeRelation(p.id, -v);
      this.log(`好感度 -${v}`, 'danger');
    } else if (cmd.type === 'dual' && (npc.spouse === '__player__' || npc.role === 'concubine')) {
      showScenePopup('dual', '双 修', 2000);
      this.worldTick(1);
      if (this.isDead) return;
      const expGain = randInt(40, 100);
      const hpGain = Math.floor(p.hpMax * 0.2);
      p.exp = Math.min(p.exp + expGain, REALMS[p.realmIndex].expPerStage);
      p.hp = Math.min(p.hpMax, p.hp + hpGain);
      p.lifeCurrent += randInt(2, 5);
      this.log(`与${npc.name}双修，修为+${expGain}，气血+${hpGain}。`, 'pink');
      if (!isMaxRealm(npc.realmIndex, npc.stageIndex)) {
        const npcExp = Math.floor(expGain * 0.6);
        npc.exp = Math.min((npc.exp || 0) + npcExp, REALMS[npc.realmIndex].expPerStage);
        if (canBreakthrough(npc) && Math.random() < REALMS[npc.realmIndex].breakChance) {
          npc.stageIndex++; npc.exp = 0;
          if (npc.stageIndex >= REALMS[npc.realmIndex].stages.length) {
            npc.stageIndex = 0; npc.realmIndex++;
            npc.lifeMax = REALMS[npc.realmIndex].lifeMax;
            npc.lifeCurrent += Math.floor(REALMS[npc.realmIndex].lifeMax * 0.4);
            npc.hpMax = REALMS[npc.realmIndex].hpMax;
          }
          this.log(`${npc.name}修为精进，突破至<span class="realm-text">${npc.getRealmName()}</span>！`, 'pink');
        }
      }
    } else if (cmd.type === 'propose' && !npc.isChild) {
      showScenePopup('dual', '结 为 道 侣', 2000);
      if (!p.bonds) p.bonds = [];
      if (!p.bonds.includes(npc.id)) p.bonds.push(npc.id);
      npc.spouse = '__player__';
      npc.changeRelation(p.id, 30);
      this.log(`【${npc.name}成为你的道侣】`, 'pink');
    } else if (cmd.type === 'bond' && !npc.isChild) {
      showScenePopup('bond', '义 结 金 兰', 2000);
      if (!p.bonds) p.bonds = [];
      if (!p.bonds.includes(npc.id)) p.bonds.push(npc.id);
      npc.changeRelation(p.id, 20);
      this.log(`【与${npc.name}结拜】`, 'success');
    } else if (cmd.type === 'teachExp' && p.master === npc.id) {
      const v = Math.min(cmd.value, 50);
      p.exp = Math.min(p.exp + v, REALMS[p.realmIndex].expPerStage);
      this.log(`师父传功，修为+${v}。`, 'success');
    }
    this.memoryStore.save();
  }

  handleReply(npc, opt, idx) {
    const playerDialogue = this.dialogueEngine.replaceVars(opt.dialogue, npc, this.player);
    this.log(`你：<span class="dialogue">"${playerDialogue}"</span>`, 'player-speech');

    npc.changeRelation(this.player.id, opt.mod);
    if (Math.abs(opt.mod) >= 8) {
      this.rememberNpc(npc, opt.mod > 0 ? `你曾对我说过「${opt.text}」` : `你曾以「${opt.text}」令我不快`);
    }

    const rel = npc.getRelation(this.player.id);
    const cat = getRelationCategory(rel, npc.isChild, npc.id);
    const npcReplies = NPC_REPLY_AFTER[cat] || NPC_REPLY_AFTER.neutral;
    const replyIdx = Math.min(idx, npcReplies.length - 1);
    const npcReply = this.dialogueEngine.replaceVars(npcReplies[replyIdx], npc, this.player);
    this.log(`<span class="npc-name">${npc.name}</span>：<span class="dialogue">"${npcReply}"</span>`);
    _aiChatHistory.push({ role: 'user', content: playerDialogue });
    _aiChatHistory.push({ role: 'assistant', content: npcReply });

    if (opt.mod !== 0) {
      const sign = opt.mod > 0 ? '+' : '';
      this.log(`好感度 ${sign}${opt.mod}`, opt.mod > 0 ? 'success' : 'danger');
    }

    this.showEncounterActions(npc);
  }

  showEncounterActions(npc) {
    this.hideAllActions();
    const container = document.getElementById('encounterActions');
    container.classList.remove('hidden');
    container.innerHTML = '';

    const rel = npc.getRelation(this.player.id);
    const isOpp = npc.gender !== this.player.gender;
    const isBonded = (this.player.bonds || []).includes(npc.id);
    const isConcubine = npc.role === 'concubine';
    const isPuppet = npc.role === 'puppet';

    if (isPuppet) {
      container.innerHTML = `<div style="color:var(--text-dim);font-size:13px;margin-bottom:6px">${npc.name}（傀儡）面无表情地等待命令。</div>
        <div class="btn-row" style="grid-template-columns:1fr 1fr">
          <button class="btn" style="color:var(--red)" onclick="game.dismissFollower('${npc.id}')">解除傀儡</button>
          <button class="btn" onclick="game.interact('leave')">离开</button>
        </div>`;
      this.inEncounter = true;
      return;
    }

    if (isConcubine) {
      const label = this.player.gender === '男' ? '侍妾' : '男宠';
      const cRel = npc.getRelation(this.player.id);
      let cAttitude, cColor;
      if (cRel <= -30) { cAttitude = `${npc.name}面如死灰，眼神空洞，机械地行礼："主人……有何吩咐。"`; cColor = 'var(--text-dim)'; }
      else if (cRel <= -10) { cAttitude = `${npc.name}微微发抖，畏惧地低下头："主人……奴婢在。"`; cColor = '#888'; }
      else if (cRel <= 15) { cAttitude = `${npc.name}恭敬地站在一旁，表情平淡："主人有事请吩咐。"`; cColor = 'var(--text-dim)'; }
      else if (cRel <= 40) { cAttitude = `${npc.name}微微一笑，柔声道："主人回来了。"`; cColor = 'var(--text)'; }
      else if (cRel <= 60) { cAttitude = `${npc.name}眼中带笑，主动迎上来："主人，想你了。"`; cColor = 'var(--pink)'; }
      else { cAttitude = `${npc.name}满脸幸福地偎依过来："能陪在主人身边，真好。"`; cColor = 'var(--pink)'; }
      container.innerHTML = `<div style="color:${cColor};font-size:13px;margin-bottom:6px">${cAttitude}<span style="color:var(--text-dim);font-size:11px">（${label} · 好感${cRel}）</span></div>
        <div class="btn-row three">
          <button class="btn btn-pink" onclick="game.interact('dual')">双修</button>
          <button class="btn" onclick="game.interact('gift')">赠礼</button>
          <button class="btn" style="color:var(--red)" onclick="game.dismissFollower('${npc.id}')">释放</button>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="game.interact('leave')" style="grid-column:1/-1">离开</button>
        </div>`;
      this.inEncounter = true;
      return;
    }

    const encPower = getTotalPower(npc.realmIndex, npc.stageIndex) * 8 + randInt(0, 15);
    const myPower = getTotalPower(this.player.realmIndex, this.player.stageIndex) * 8 + this.getPlayerTreasurePower();
    let powerHint = '';
    if (encPower > myPower * 1.5) powerHint = '<span style="color:var(--red)">（远强于你）</span>';
    else if (encPower > myPower * 1.1) powerHint = '<span style="color:#e67e22">（略强于你）</span>';
    else if (encPower > myPower * 0.9) powerHint = '<span style="color:var(--text-dim)">（旗鼓相当）</span>';
    else if (encPower > myPower * 0.5) powerHint = '<span style="color:var(--blue)">（弱于你）</span>';
    else powerHint = '<span style="color:var(--green)">（远弱于你）</span>';
    container.innerHTML = `<div style="color:var(--text-dim);font-size:12px;margin-bottom:6px">对方战力：<span style="color:var(--blue)">${encPower}</span> ${powerHint} · 你的战力：<span style="color:var(--gold)">${myPower}</span></div>`;

    let row1 = '<div class="btn-row three">';
    row1 += '<button class="btn" onclick="game.interact(\'spar\')">切磋</button>';
    row1 += '<button class="btn" onclick="game.interact(\'gift\')">赠礼</button>';
    row1 += '<button class="btn" onclick="game.interact(\'rob\')">抢夺</button>';
    row1 += '</div>';

    let row2 = '<div class="btn-row">';
    const btns2 = [];
    if (npc.spouse === '__player__' && !npc.isChild) {
      btns2.push('<button class="btn btn-pink" onclick="game.interact(\'dual\')">双修</button>');
    }
    if (rel >= 60 && !isBonded && isOpp && !npc.isChild) {
      btns2.push(`<button class="btn btn-pink" onclick="game.interactPropose('${npc.id}','couple')">请求结为道侣</button>`);
    }
    if (rel >= 60 && !isBonded && !npc.isChild) {
      btns2.push(`<button class="btn" onclick="game.interactPropose('${npc.id}','bond')">请求结拜</button>`);
    }
    const npcHigher2 = getRealmDiff(npc.realmIndex, npc.stageIndex, this.player.realmIndex, this.player.stageIndex) === 'higher';
    const npcLower2 = getRealmDiff(npc.realmIndex, npc.stageIndex, this.player.realmIndex, this.player.stageIndex) === 'lower';
    const isMaster2 = this.player.master === npc.id;
    const isDisciple2 = (this.player.disciples||[]).includes(npc.id);
    if (!isMaster2 && !isDisciple2 && !this.player.master && npcHigher2 && rel >= 30 && !npc.isChild) {
      btns2.push(`<button class="btn" style="border-color:var(--gold);color:var(--gold)" onclick="game.interactPropose('${npc.id}','apprentice')">拜师</button>`);
    }
    if (!isMaster2 && !isDisciple2 && npcLower2 && rel >= 30 && !npc.isChild) {
      btns2.push(`<button class="btn" style="border-color:var(--gold);color:var(--gold)" onclick="game.interactPropose('${npc.id}','recruit')">收徒</button>`);
    }
    btns2.push(`<button class="btn" onclick="game.interact('leave')"${btns2.length ? '' : ' style="grid-column:1/-1"'}>离开</button>`);
    if (btns2.length > 1) row2 = `<div class="btn-row" style="grid-template-columns:repeat(${btns2.length},1fr)">`;
    row2 += btns2.join('') + '</div>';

    container.innerHTML = row1 + row2;
    this.inEncounter = true;
  }

  // ===== 地图移动 =====
  movePlayer(tx, ty) {
    if (this.isDead) return;
    const maxRange = getMaxMoveRange(this.player.realmIndex);
    const dist = Math.abs(tx - this.mapSystem.playerX) + Math.abs(ty - this.mapSystem.playerY);
    if (dist === 0 || dist > maxRange) return;

    this.worldTick(dist);
    if (this.isDead) { closeMap(); return; }

    this.mapSystem.playerX = tx;
    this.mapSystem.playerY = ty;
    this.mapSystem.save();
    this.trackStat('moved', dist);

    const cell = this.mapSystem.getCell(tx, ty);
    let locMsg;
    if (cell.type === 'market') locMsg = '这里是一处坊市。';
    else if (cell.type === 'sect' && cell.sectId) { const s = getSectById(cell.sectId); locMsg = `这里是${s ? s.name : '一处宗门'}的驻地。`; }
    else locMsg = `此地灵气：${QI_NAMES[cell.qi]}。`;
    this.log(`你移动至（${tx+1},${ty+1}），${locMsg}消耗寿元${dist}年。`, 'system');

    this.updateHeader();
    this.updateMarketBtn();
    this.setActivity('idle');
    this.save();
    closeMap();

    this.moveFollowers();
    this.updateNpcBtn();
    if (cell.type === 'normal' && (!cell.npcIds || !cell.npcIds.length) && Math.random() < 0.15) {
      this.triggerRandomEvent();
    }
  }

  // ===== 探索 =====
  doExplore() {
    if (this.isDead || this.inEncounter) return;
    this.setActivity('explore');
    showScenePopup('explore', '探 索', 1200);
    this.trackStat('explored');

    this.worldTick(1);
    if (this.isDead) return;

    const cell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
    const qi = cell ? cell.qi : 2;

    if (this.player.bountyTask && !this.player.bountyTask.done) {
      const bt = this.player.bountyTask;
      if (this.mapSystem.playerX === bt.x && this.mapSystem.playerY === bt.y) {
        if (bt.type === 'slay') {
          this.log(`你找到了悬赏目标！一头凶猛的妖兽挡在面前！`, 'combat');
          this.encounterMonster();
        } else if (bt.type === 'capture') {
          const target = this.generator.createRandomNPC(this.player.realmIndex, { personality: 'sinister' });
          this.log(`你发现了悬赏通缉犯<span class="npc-name">${target.name}</span>！`, 'combat');
          target.changeRelation(this.player.id, -40);
          this.resolveCombatWithNPC(target, false);
        } else if (bt.type === 'escort') {
          this.log(`你成功将护送目标带到了安全地点！途中遭遇了一波袭击——`, 'combat');
          this.encounterMonster();
        } else if (bt.type === 'investigate') {
          const r = Math.random();
          if (r < 0.4) {
            this.log(`你调查了此处异象，发现是一头妖兽在作祟！`, 'combat');
            this.encounterMonster();
          } else if (r < 0.7) {
            const expGain = randInt(20, 60) * Math.max(1, this.player.realmIndex);
            this.player.exp += expGain;
            this.log(`你调查了此处异象，发现是一处天然灵脉。你趁机修炼，获得 ${expGain} 经验。`, 'success');
          } else {
            const amount = randInt(30, 80);
            this.player.inventory.lingshi += amount;
            this.log(`你调查了此处异象，发现了一个废弃的储物袋，获得 ${amount} 灵石。`, 'loot');
          }
        } else {
          const amount = randInt(20, 60);
          this.player.inventory.lingshi += amount;
          this.log(`你在此处找到了悬赏物品，额外获得 ${amount} 灵石。`, 'loot');
        }
        bt.done = true;
        showScenePopup('success', '悬 赏 完 成', 1500);
        this.log(`悬赏完成！回坊市领取 ${bt.reward} 灵石奖励。`, 'success');
        this.updateHeader(); this.save();
        return;
      }
    }
    if (cell && cell.rift) {
      showScenePopup('loot', '秘 境 探 索', 1500);
      delete cell.rift;
      const r = Math.random();
      if (r < 0.33) {
        const amount = randInt(100, 300) * Math.max(1, this.player.realmIndex);
        this.player.inventory.lingshi += amount;
        this.trackStat('lingshiEarned', amount);
        this.log(`你踏入秘境裂缝，发现一座灵石矿脉！获得 ${amount} 灵石！`, 'loot');
      } else if (r < 0.66) {
        const maxR = Math.min(this.player.realmIndex + 2, 7);
        const avail = PILLS.filter(pp => pp.forRealm <= maxR);
        const dp = avail.length ? randPick(avail) : null;
        if (dp) {
          this.player.inventory.pills[dp.id] = (this.player.inventory.pills[dp.id] || 0) + 1;
          this.log(`秘境中藏有一颗<span class="npc-name">${dp.name}</span>！`, 'loot');
        }
      } else {
        const tier = Math.min(this.player.realmIndex + 2, TREASURES.length - 1);
        const t = { ...TREASURES[randInt(Math.max(0, tier - 1), tier)] };
        this.player.inventory.items.push(t);
        this.log(`秘境深处发现宝物——<span class="npc-name">${t.name}</span>（战力+${t.power}）！`, 'loot');
      }
      this.mapSystem.save();
      this.updateHeader(); this.save();
      return;
    }
    if (cell && cell.herb) {
      delete cell.herb;
      const r = Math.random();
      if (r < 0.5) {
        const amount = randInt(20, 80) * Math.max(1, qi);
        this.player.inventory.lingshi += amount;
        this.trackStat('lingshiEarned', amount);
        this.log(`你采集到天材地宝，价值 ${amount} 灵石！`, 'loot');
      } else {
        const maxR = Math.min(this.player.realmIndex + 1, 7);
        const avail = PILLS.filter(pp => pp.forRealm <= maxR);
        if (avail.length) {
          const dp = randPick(avail);
          this.player.inventory.pills[dp.id] = (this.player.inventory.pills[dp.id] || 0) + 1;
          this.log(`你采集到珍稀药材，炼制出一颗<span class="npc-name">${dp.name}</span>！`, 'loot');
        }
      }
      this.mapSystem.save();
      this.updateHeader(); this.save();
      return;
    }
    if (cell && cell.loot && cell.loot.length) {
      const t = cell.loot.shift();
      this.player.inventory.items.push(t);
      this.log(`你发现了秘境中的宝物——<span class="npc-name">${t.name}</span>（战力+${t.power}）！`, 'loot');
      if (!cell.loot.length) delete cell.loot;
      this.mapSystem.save();
      this.updateHeader();
      this.save();
      return;
    }

    const roll = Math.random();

    if (roll < 0.30) {
      const amount = randInt(10, 50) * qi;
      this.player.inventory.lingshi += amount;
      showScenePopup('loot', '发 现 灵 石', 1200);
      this.log(`你仔细搜索四周，发现了 ${amount} 灵石！`, 'loot');
    } else if (roll < 0.45) {
      const maxRarity = Math.min(qi + this.player.realmIndex, 9);
      const availPills = PILLS.filter(p => p.rarity <= maxRarity);
      if (availPills.length > 0) {
        const pill = qi >= 3 ? randPick(availPills) : availPills[randInt(0, Math.min(2, availPills.length - 1))];
        this.player.inventory.pills[pill.id] = (this.player.inventory.pills[pill.id] || 0) + 1;
        showScenePopup('loot', '获 得 丹 药', 1200);
        this.log(`你在一处隐秘洞府中发现了一颗<span class="npc-name">${pill.name}</span>！`, 'loot');
      } else {
        const amount = randInt(5, 30);
        this.player.inventory.lingshi += amount;
        this.log(`探索一番，找到了 ${amount} 灵石。`, 'loot');
      }
    } else if (roll < 0.52) {
      const tier = Math.min(Math.floor(qi + this.player.realmIndex * 1.5), TREASURES.length - 1);
      const idx = randInt(Math.max(0, tier - 2), tier);
      const t = { ...TREASURES[idx] };
      this.player.inventory.items.push(t);
      showScenePopup('loot', '获 得 宝 物', 1200);
      this.log(`你发现了一件宝物——<span class="npc-name">${t.name}</span>（战力+${t.power}）！`, 'loot');
    } else if (roll < 0.65) {
      this.encounterMonster();
      return;
    } else if (roll < 0.73) {
      this.triggerRandomEvent();
      return;
    } else if (roll < 0.81) {
      this.encounterCultivator();
      return;
    } else if (roll < 0.89) {
      this.triggerSpecialEvent();
      return;
    } else {
      if (Math.random() < 0.1) {
        this.player.inventory.xunzongfu = (this.player.inventory.xunzongfu || 0) + 1;
        this.log('你在一棵古树下找到一张寻踪符。', 'loot');
      } else {
        this.log('你四处搜寻，但一无所获。', '');
      }
    }

    this.mapSystem.shuffleQiLocal(this.mapSystem.playerX, this.mapSystem.playerY);
    this.mapSystem.save();
    this.updateHeader();
    this.save();
  }

  encounterMonster() {
    const mName = randMonsterName();
    const off = randInt(-1, 1);
    const mRI = Math.max(0, Math.min(REALMS.length - 1, this.player.realmIndex + off));
    const mSI = randInt(0, REALMS[mRI].stages.length - 1);

    showScenePopup('monster', '妖 兽 来 袭', 1200);
    this.log(`一头<span class="npc-name">${mName}</span>（<span class="realm-text">${getRealmFullName(mRI, mSI)}</span>）向你扑来！`, 'combat');

    this.startCombat(mName, mRI, mSI, randInt(0, 10),
      () => {
        this.trackStat('kills');
        const loot = randInt(15, 60) * (mRI + 1);
        this.player.inventory.lingshi += loot;
        this.trackStat('lingshiEarned', loot);
        this.log(`获得 ${loot} 灵石。`, 'loot');
        if (Math.random() < 0.25) {
          const pillPool = PILLS.filter(p => p.forRealm <= mRI + 1);
          if (pillPool.length) {
            const dp = randPick(pillPool);
            this.player.inventory.pills[dp.id] = (this.player.inventory.pills[dp.id] || 0) + 1;
            this.log(`从${mName}身上取得了<span class="npc-name">${dp.name}</span>！`, 'loot');
          }
        }
        if (Math.random() < 0.15) {
          const tier = Math.min(mRI, TREASURES.length - 1);
          const t = { ...TREASURES[randInt(Math.max(0, tier - 1), tier)] };
          this.player.inventory.items.push(t);
          this.log(`获得宝物<span class="npc-name">${t.name}</span>（战力+${t.power}）！`, 'loot');
        }
        this.updateHeader(); this.save();
        this.showMainActions();
      },
      (dmg) => {
        this.log(`你不敌${mName}，受伤逃遁！`, 'danger');
        if (this.player.hp <= 0) {
          this.die('你身受重伤，气血耗尽，道消身陨……游戏结束。');
        } else {
          this.updateHeader(); this.save();
          this.showMainActions();
        }
      }
    );
  }

  triggerRandomEvent() {
    this.trackStat('npcMet');
    const alive = this.memoryStore.getAlive();
    let npc, isOld = false;
    if (alive.length > 0 && Math.random() < 0.4) {
      npc = randPick(alive); isOld = true;
    } else {
      npc = this.generator.createRandomNPC(this.player.realmIndex);
      this.applyOriginRelation(npc);
    }

    const scene = randPick(SCENES);
    const appear = randPick(NPC_APPEARS);
    this.log(`${scene}${appear}`, '');
    const evPower = getTotalPower(npc.realmIndex, npc.stageIndex) * 8 + randInt(0, 15);
    this.log(`来者是<span class="npc-name">${npc.name}</span>（${npc.gender}）「${npc.sect}」<span class="realm-text">${npc.getRealmName()}</span> · <span style="color:var(--blue)">战力${evPower}</span>`, '');

    const rel = npc.getRelation(this.player.id);
    const p = PERSONALITIES[npc.personality];
    const isEnemy = getRelationCategory(rel, npc.isChild, npc.id) === 'enemy';
    const isFriend = rel >= 30;
    const diff = getRealmDiff(npc.realmIndex, npc.stageIndex, this.player.realmIndex, this.player.stageIndex);

    const realmGap = npc.realmIndex - this.player.realmIndex;
    const npcFarStronger = realmGap >= 2;

    let eventType;
    if (isEnemy || p.aggroChance > 0.2) eventType = Math.random() < 0.7 ? 'bad' : 'neutral';
    else if (isFriend) eventType = Math.random() < 0.7 ? 'good' : 'neutral';
    else { const r = Math.random(); eventType = r < 0.35 ? 'good' : r < 0.65 ? 'neutral' : 'bad'; }
    if (diff === 'higher' && !isFriend && !npcFarStronger && Math.random() < 0.4) eventType = 'bad';
    if (diff === 'lower' && !isEnemy && Math.random() < 0.3) eventType = 'good';
    if (npcFarStronger && !isEnemy && eventType === 'bad') {
      eventType = Math.random() < 0.5 ? 'neutral' : 'good';
    }

    const outcome = randPick(eventType === 'good' ? GOOD_OUTCOMES : eventType === 'bad' ? BAD_OUTCOMES : NEUTRAL_OUTCOMES);
    const desc = outcome.text.replace(/\{NPC\}/g, npc.name).replace(/\{v\}/g, '');

    if (eventType === 'bad') {
      this.log(`${desc}`, 'danger');
    } else if (eventType === 'good') {
      this.log(`${desc}`, 'success');
    } else {
      this.log(`${desc}`, '');
    }

    this.pendingEvent = { npc, isOld, eventType, outcome, desc };
    this.showEventChoices();
  }

  showEventChoices() {
    this.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    container.innerHTML = '';
    const ev = this.pendingEvent;
    const row = document.createElement('div');
    row.className = 'btn-row three';

    if (ev.eventType === 'bad') {
      row.innerHTML = `
        <button class="btn btn-reply" onclick="game.resolveEvent('fight')">还击</button>
        <button class="btn btn-reply" onclick="game.resolveEvent('flee')">逃跑</button>
        <button class="btn btn-reply" onclick="game.resolveEvent('submit')">服软</button>
      `;
    } else if (ev.eventType === 'good') {
      row.innerHTML = `
        <button class="btn btn-reply" onclick="game.resolveEvent('accept')">欣然接受</button>
        <button class="btn btn-reply" onclick="game.resolveEvent('decline')">婉言谢绝</button>
        <button class="btn btn-reply" onclick="game.resolveEvent('gift')">回赠灵石</button>
      `;
    } else {
      row.innerHTML = `
        <button class="btn btn-reply" onclick="game.resolveEvent('chat')">攀谈交友</button>
        <button class="btn btn-reply" onclick="game.resolveEvent('ignore')">沉默离去</button>
        <button class="btn btn-reply" onclick="game.resolveEvent('probe')">出言试探</button>
      `;
    }
    container.appendChild(row);
    this.inEncounter = true;
  }

  resolveEvent(choice) {
    const ev = this.pendingEvent;
    if (!ev) return;
    const npc = ev.npc;
    this.pendingEvent = null;

    if (ev.eventType === 'bad') {
      if (choice === 'fight') {
        this.startCombat(npc.name, npc.realmIndex, npc.stageIndex, randInt(0, 10),
          () => {
            this.trackStat('kills');
            npc.changeRelation(this.player.id, -20);
            this.pendingVictim = { npc, isOld: ev.isOld };
            this.showVictoryChoices(npc);
          },
          () => {
            npc.changeRelation(this.player.id, -10);
            if (this.player.hp <= 0) {
              this.player.hp = 1;
              this.showDefeatChoices(npc, ev.isOld, () => {
                this.finishRandomEvent(npc, ev.isOld);
                this.showMainActions();
              });
            } else { this.finishRandomEvent(npc, ev.isOld); }
          }
        );
        return;
      } else if (choice === 'flee') {
        if (Math.random() < 0.5) {
          const lost = Math.floor(this.player.inventory.lingshi * 0.05);
          this.player.inventory.lingshi = Math.max(0, this.player.inventory.lingshi - lost);
          this.log(`你拔腿就跑，成功脱身！${lost > 0 ? `慌忙中丢失了${lost}灵石。` : ''}`, 'system');
        } else {
          const dmg = Math.floor(this.player.hpMax * (randInt(15, 30) / 100));
          this.player.hp = Math.max(1, this.player.hp - dmg);
          const lost = Math.floor(this.player.inventory.lingshi * (randInt(10, 25) / 100));
          this.player.inventory.lingshi = Math.max(0, this.player.inventory.lingshi - lost);
          this.log(`你试图逃跑但被追上！气血-${dmg}${lost > 0 ? `，灵石-${lost}` : ''}`, 'danger');
        }
      } else {
        const lost = Math.floor(this.player.inventory.lingshi * (randInt(5, 15) / 100));
        this.player.inventory.lingshi = Math.max(0, this.player.inventory.lingshi - lost);
        npc.changeRelation(this.player.id, -8);
        this.log(`你低头认怂，${npc.name}冷哼一声，${lost > 0 ? `取走了${lost}灵石后` : ''}扬长而去。`, '');
      }
    } else if (ev.eventType === 'good') {
      if (choice === 'accept') {
        this.applyGoodOutcome(ev.outcome, npc);
        npc.changeRelation(this.player.id, randInt(5, 10));
      } else if (choice === 'decline') {
        npc.changeRelation(this.player.id, randInt(8, 15));
        this.log(`你婉言谢绝了${npc.name}的好意。对方赞许地点头：「有骨气。」`, '');
        this.log(`好感度 +${8}~15`, 'success');
      } else {
        const cost = randInt(10, 30) * Math.max(1, this.player.realmIndex);
        if (this.player.inventory.lingshi >= cost) {
          this.player.inventory.lingshi -= cost;
          npc.changeRelation(this.player.id, randInt(15, 25));
          this.log(`你回赠${cost}灵石，${npc.name}大喜：「道友豪爽！」好感大增。`, 'success');
        } else {
          npc.changeRelation(this.player.id, randInt(3, 8));
          this.log(`你灵石不足无法回赠，只能道谢。`, '');
        }
        this.applyGoodOutcome(ev.outcome, npc);
      }
    } else {
      if (choice === 'chat') {
        npc.changeRelation(this.player.id, randInt(5, 10));
        this.log(`你与${npc.name}攀谈片刻，相谈甚欢。好感+`, 'success');
      } else if (choice === 'ignore') {
        this.log(`你点头示意后默默离去。`, '');
      } else {
        const p = PERSONALITIES[npc.personality];
        if (p.aggroChance > 0.2) {
          npc.changeRelation(this.player.id, randInt(-10, -5));
          this.log(`你出言试探，${npc.name}面色不悦：「多管闲事。」`, 'danger');
        } else {
          npc.changeRelation(this.player.id, randInt(2, 8));
          this.log(`你出言试探，${npc.name}坦然以对，你们交换了一些情报。`, '');
        }
      }
    }

    this.finishRandomEvent(npc, ev.isOld);
  }

  applyGoodOutcome(outcome, npc) {
    if (outcome.effect === 'lingshi') {
      const v = randInt(outcome.range[0], outcome.range[1]) * Math.max(1, this.player.realmIndex);
      this.player.inventory.lingshi += v;
      this.trackStat('lingshiEarned', v);
      this.log(`${npc.name}赠你 ${v} 灵石。`, 'success');
    } else if (outcome.effect === 'exp') {
      const v = randInt(outcome.range[0], outcome.range[1]);
      this.player.exp = Math.min(this.player.exp + v, REALMS[this.player.realmIndex].expPerStage);
      this.log(`${npc.name}指点你修炼，修为+${v}。`, 'success');
    } else if (outcome.effect === 'hp') {
      const v = randInt(outcome.range[0], outcome.range[1]);
      this.player.hp = Math.min(this.player.hpMax, this.player.hp + v);
      this.log(`${npc.name}为你疗伤，气血+${v}。`, 'success');
    } else if (outcome.effect === 'pill') {
      const maxR = Math.min(this.player.realmIndex + 1, 7);
      const availPills = PILLS.filter(pp => pp.forRealm <= maxR);
      if (availPills.length) {
        const dp = randPick(availPills);
        this.player.inventory.pills[dp.id] = (this.player.inventory.pills[dp.id] || 0) + 1;
        this.log(`${npc.name}赠你一颗<span class="npc-name">${dp.name}</span>！`, 'loot');
      } else {
        const v = randInt(20, 50);
        this.player.inventory.lingshi += v;
        this.log(`${npc.name}赠你 ${v} 灵石。`, 'success');
      }
    }
  }

  checkBondAid(originalDmg) {
    if (!this.player.bonds || !this.player.bonds.length) return;
    for (const bondId of this.player.bonds) {
      const ally = this.memoryStore.getById(bondId);
      if (ally && ally.isAlive && Math.random() < 0.3) {
        const healed = Math.floor(originalDmg * 0.5);
        this.player.hp = Math.min(this.player.hpMax, this.player.hp + healed);
        this.log(`<span class="npc-name">${ally.name}</span>及时赶到，为你挡下致命一击！气血恢复+${healed}`, 'success');
        return;
      }
    }
  }

  finishRandomEvent(npc, isOld) {
    if (!isOld && !npc.isPermanent) {
      const finalRel = npc.getRelation(this.player.id);
      if (finalRel >= 30 || finalRel <= -30) {
        npc.isPermanent = true;
        this.memoryStore.add(npc);
        const label = getRelationLabel(finalRel, npc.gender !== this.player.gender, npc.isChild, npc.id);
        this.log(`【${npc.name}已被记入记忆录】（${label}）`, 'system');
      }
    }
    if (!isOld && !this.memoryStore.getById(npc.id)) {
      npc.tempTurns = 3;
      this.memoryStore.add(npc);
    }
    npc.tempTurns = 3;
    this.placeNpcAtPlayer(npc);
    this.memoryStore.save();
    this.mapSystem.save();
    this.updateHeader();
    this.save();
    this.showMainActions();
  }

  triggerSpecialEvent() {
    const roll = Math.random();
    const ri = this.player.realmIndex;

    if (roll < 0.18) {
      const nx = randInt(0, MAP_SIZE - 1), ny = randInt(0, MAP_SIZE - 1);
      showScenePopup('explore', '传 送 阵', 1500);
      this.log('你脚下突然亮起古老的符文——一个远古传送阵！', 'system');
      this.log('还没来得及反应，一股吸力将你卷入虚空……', '');
      this.mapSystem.playerX = nx;
      this.mapSystem.playerY = ny;
      const destCell = this.mapSystem.getCell(nx, ny);
      const locDesc = destCell.type === 'market' ? '一处坊市' : destCell.type === 'sect' ? '一处宗门驻地' : `灵气${QI_NAMES[destCell.qi]}之地`;
      this.log(`你被传送到了（${nx+1},${ny+1}），${locDesc}。`, 'success');
      this.moveFollowers();
    } else if (roll < 0.30) {
      showScenePopup('loot', '仙 人 遗 藏', 2000);
      const expGain = randInt(80, 200) * Math.max(1, ri);
      const lingshi = randInt(100, 300) * Math.max(1, ri);
      this.player.exp += expGain;
      this.player.inventory.lingshi += lingshi;
      this.trackStat('lingshiEarned', lingshi);
      this.log('你误入一处隐藏的仙人洞府，府内灵光流转，玉简丹炉俱全。', '');
      this.log(`你潜心参悟，修为大进！获得 ${expGain} 经验，${lingshi} 灵石！`, 'loot');
    } else if (roll < 0.40) {
      showScenePopup('loot', '垂 死 高 人', 2000);
      const expGain = randInt(120, 300) * Math.max(1, ri);
      this.player.exp += expGain;
      this.log('一位垂死的老者靠在石壁上，见到你后微微一笑。', '');
      this.log(`"有缘人……老夫修行一世，今日将毕生修为传与你……"`, '');
      this.log(`你获得了高人传功！经验 +${expGain}！`, 'success');
    } else if (roll < 0.50) {
      showScenePopup('loot', '天 降 灵 宝', 2000);
      const tier = Math.min(ri + 2, TREASURES.length - 1);
      const t = { ...TREASURES[randInt(Math.max(0, tier - 1), tier)] };
      t.power = Math.floor(t.power * 1.5);
      this.player.inventory.items.push(t);
      this.log('天空突然裂开一道缝隙，一道灵光从裂缝中坠落！', '');
      this.log(`你得到了一件品质卓绝的灵宝——<span class="npc-name">${t.name}</span>（战力+${t.power}）！`, 'loot');
    } else if (roll < 0.58) {
      showScenePopup('success', '灵 泉 沐 浴', 1500);
      this.player.hp = this.player.hpMax;
      const expGain = randInt(30, 80) * Math.max(1, ri);
      this.player.exp += expGain;
      this.log('你发现了一处隐秘的天然灵泉，泉水温润如玉，灵气充盈。', '');
      this.log(`你在灵泉中沐浴修炼，气血恢复满值，获得 ${expGain} 经验！`, 'success');
    } else if (roll < 0.66) {
      showScenePopup('danger', '深 坑 陷 阱', 1500);
      const dmg = randInt(10, 30);
      this.player.hp = Math.max(1, this.player.hp - dmg);
      const lingshi = randInt(50, 150) * Math.max(1, ri);
      this.player.inventory.lingshi += lingshi;
      this.trackStat('lingshiEarned', lingshi);
      this.log('地面突然塌陷，你跌入一个深坑！', 'danger');
      this.log(`你受到 ${dmg} 点伤害，但在坑底发现了一只储物袋，获得 ${lingshi} 灵石！`, 'loot');
    } else if (roll < 0.74) {
      showScenePopup('explore', '游 方 商 人', 1500);
      const maxR = Math.min(ri + 2, 7);
      const avail = PILLS.filter(pp => pp.forRealm <= maxR);
      if (avail.length) {
        const dp = randPick(avail);
        this.player.inventory.pills[dp.id] = (this.player.inventory.pills[dp.id] || 0) + 1;
        this.log('一个神秘的游方商人出现在你面前，背着一个巨大的药箱。', '');
        this.log(`"有缘人，这颗丹药送你了！"你获得了一颗<span class="npc-name">${dp.name}</span>！`, 'loot');
      } else {
        const amount = randInt(30, 80);
        this.player.inventory.lingshi += amount;
        this.log('一个神秘商人路过，见你有修仙者气息，赠你灵石表示好感。', 'loot');
      }
    } else if (roll < 0.82) {
      showScenePopup('danger', '雷 劫 降 临', 2000);
      if (Math.random() < 0.45) {
        const expGain = randInt(100, 250) * Math.max(1, ri);
        this.player.exp += expGain;
        this.log('天空骤然雷云密布，一道天雷劈落！', 'danger');
        this.log(`你咬牙硬抗天雷，全身经脉被雷电淬炼，大彻大悟！经验 +${expGain}！`, 'success');
      } else {
        const dmg = randInt(20, 50);
        this.player.hp = Math.max(1, this.player.hp - dmg);
        this.log('天空骤然雷云密布，一道天雷劈落！', 'danger');
        this.log(`你被天雷击中，浑身焦黑，损失 ${dmg} 点气血。`, 'danger');
      }
    } else if (roll < 0.90) {
      showScenePopup('explore', '废 弃 炼 丹 炉', 1500);
      const maxR = Math.min(ri + 1, 7);
      const avail = PILLS.filter(pp => pp.forRealm <= maxR);
      const count = randInt(1, 3);
      this.log('你发现一座废弃的炼丹炉，炉内残留着几颗尚未完全冷却的丹药。', '');
      for (let i = 0; i < count && avail.length; i++) {
        const dp = randPick(avail);
        this.player.inventory.pills[dp.id] = (this.player.inventory.pills[dp.id] || 0) + 1;
        this.log(`获得<span class="npc-name">${dp.name}</span>！`, 'loot');
      }
    } else {
      showScenePopup('explore', '藏 宝 图', 1500);
      const tx = randInt(0, MAP_SIZE - 1), ty = randInt(0, MAP_SIZE - 1);
      const cell = this.mapSystem.getCell(tx, ty);
      if (cell) {
        const tier = Math.min(ri + 1, TREASURES.length - 1);
        const t = { ...TREASURES[randInt(Math.max(0, tier - 1), tier)] };
        if (!cell.loot) cell.loot = [];
        cell.loot.push(t);
      }
      this.log('你在一个石缝中发现了一张泛黄的藏宝图！', '');
      this.log(`图上标注的位置在（${tx+1},${ty+1}），似乎埋藏着什么宝物……`, 'success');
    }

    this.mapSystem.save();
    this.updateHeader();
    this.save();
    this.showMainActions();
  }

  encounterCultivator() {
    this.trackStat('npcMet');
    const alive = this.memoryStore.getAlive();
    let npc, isOld = false;

    if (alive.length > 0 && Math.random() < 0.4) {
      npc = randPick(alive);
      isOld = true;
    } else {
      npc = this.generator.createRandomNPC(this.player.realmIndex);
      this.applyOriginRelation(npc);
    }

    this.currentNPC = npc;
    const pName = PERSONALITIES[npc.personality].name;
    const rel = npc.getRelation(this.player.id);
    const isOpp = npc.gender !== this.player.gender;
    const relLabel = getRelationLabel(rel, isOpp, npc.isChild, npc.id);

    const npcPower = getTotalPower(npc.realmIndex, npc.stageIndex) * 8 + randInt(0, 15);
    let intro = `你遇到了<span class="npc-name">${npc.name}</span> (${npc.gender})`;
    intro += `<br>「${npc.sect}」· <span class="realm-text">${npc.getRealmName()}</span> · 性情${pName} · <span style="color:var(--blue)">战力${npcPower}</span>`;
    if (isOld) {
      intro += `<br>（旧识 · ${relLabel}）`;
      const memory = npc.getRecentMemory();
      if (memory) intro += `<br><span style="color:var(--text-dim);font-size:12px">旧事：${memory}</span>`;
    }
    this.log(intro);

    const p = PERSONALITIES[npc.personality];
    const isEnemy = getRelationCategory(rel, npc.isChild, npc.id) === 'enemy';

    const realmGap2 = npc.realmIndex - this.player.realmIndex;
    const tooWeakToRob = realmGap2 >= 2 && !isEnemy;
    if (!tooWeakToRob && ((isEnemy && Math.random() < 0.7) || (!isEnemy && Math.random() < p.aggroChance))) {
      this.log(`<span class="npc-name">${npc.name}</span>：<span class="dialogue">"${isEnemy ? '仇人见面，纳命来！' : '识趣的把身上值钱的都交出来！'}"</span>`, 'combat');
      this.log(`${npc.name}对你发起了攻击！`, 'danger');
      this.resolveCombatWithNPC(npc, isOld);
      return;
    }

    const dialogue = this.dialogueEngine.getDialogue(npc, this.player);
    this.log(`<span class="npc-name">${npc.name}</span>：<span class="dialogue">"${dialogue}"</span>`);
    _aiChatHistory = [];
    _aiChatNpcId = npc.id;
    _aiChatHistory.push({ role: 'assistant', content: dialogue });
    this.showDialogueOptions(npc);
  }

  resolveCombatWithNPC(npc, isOld) {
    this.startCombat(npc.name, npc.realmIndex, npc.stageIndex, randInt(0, 15),
      () => {
        this.trackStat('kills');
        npc.changeRelation(this.player.id, -30);
        this.rememberNpc(npc, '你曾在交锋中将我击败');
        this.pendingVictim = { npc, isOld };
        this.showVictoryChoices(npc);
      },
      (dmg) => {
        const lostLingshi = Math.floor(this.player.inventory.lingshi * (0.1 + Math.random() * 0.2));
        this.player.inventory.lingshi = Math.max(0, this.player.inventory.lingshi - lostLingshi);
        if (lostLingshi > 0) this.log(`丢失 ${lostLingshi} 灵石。`, 'danger');
        npc.changeRelation(this.player.id, -15);
        this.rememberNpc(npc, '你曾败在我手下，狼狈而退');
        if (this.player.hp <= 0) {
          this.player.hp = 1;
          this.showDefeatChoices(npc, isOld, () => {
            this.finishCombatNPC(npc, isOld);
            this.showMainActions();
          });
        } else {
          this.finishCombatNPC(npc, isOld);
        }
      }
    );
  }

  showVictoryChoices(npc) {
    this.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    const isOpp = npc.gender !== this.player.gender;
    let html = '';
    if (isOpp && !npc.isChild) {
      const label = this.player.gender === '男' ? '收为侍妾' : '收为男宠';
      html = `<div class="btn-row three">
        <button class="btn btn-reply" style="color:#e74c3c" onclick="game.resolveVictory('furnace')">炼成炉鼎</button>
        <button class="btn btn-reply" style="color:var(--pink)" onclick="game.resolveVictory('concubine')">${label}</button>
        <button class="btn btn-reply" style="color:var(--red)" onclick="game.resolveVictory('kill')">杀掉</button>
      </div>
      <div class="btn-row three">
        <button class="btn btn-reply" onclick="game.resolveVictory('release')">放走</button>
        <button class="btn btn-reply" onclick="game.resolveVictory('loot')">搜刮</button>
        <button class="btn btn-reply" onclick="game.resolveVictory('interrogate')">逼问</button>
      </div>`;
    } else {
      html = `<div class="btn-row three">
        ${!npc.isChild ? '<button class="btn btn-reply" style="color:#9b59b6" onclick="game.resolveVictory(\'puppet\')">炼成傀儡</button>' : ''}
        <button class="btn btn-reply" style="color:var(--red)" onclick="game.resolveVictory('kill')">杀掉</button>
        <button class="btn btn-reply" onclick="game.resolveVictory('release')">放走</button>
      </div>
      <div class="btn-row" style="grid-template-columns:1fr 1fr">
        <button class="btn btn-reply" onclick="game.resolveVictory('loot')">搜刮</button>
        <button class="btn btn-reply" onclick="game.resolveVictory('interrogate')">逼问</button>
      </div>`;
    }
    container.innerHTML = html;
    this.inEncounter = true;
  }

  showRejectedChoices(npc) {
    this.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    container.innerHTML = `
      <div style="color:var(--text-dim);font-size:13px;margin-bottom:6px">${npc.name}拒绝了你，如何处置？</div>
      <div class="btn-row three">
        <button class="btn btn-reply" style="color:#e74c3c" onclick="game.resolveVictory('furnace')">炼成炉鼎</button>
        <button class="btn btn-reply" style="color:var(--red)" onclick="game.resolveVictory('kill')">杀掉</button>
        <button class="btn btn-reply" onclick="game.resolveVictory('release')">放走</button>
      </div>
      <div class="btn-row" style="grid-template-columns:1fr 1fr">
        <button class="btn btn-reply" onclick="game.resolveVictory('loot')">搜刮</button>
        <button class="btn btn-reply" onclick="game.resolveVictory('interrogate')">逼问</button>
      </div>`;
    this.inEncounter = true;
  }

  showDefeatChoices(npc, isOld, afterSurvive) {
    this.pendingDefeat = { npc, isOld, afterSurvive };
    this.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    const hasLingshi = this.player.inventory.lingshi > 0;
    const hasTreasure = (this.player.inventory.items || []).length > 0;
    const lingshiAmt = Math.floor(this.player.inventory.lingshi * 0.5);
    let html = `<div style="color:var(--red);font-size:13px;margin-bottom:6px;text-align:center">你败了！${npc.name}手持兵刃指着你……</div>`;
    html += `<div class="btn-row three">
      <button class="btn btn-reply" onclick="game.resolveDefeat('beg')">跪地求饶</button>`;
    if (hasLingshi) {
      html += `<button class="btn btn-reply" style="color:var(--gold)" onclick="game.resolveDefeat('lingshi')">献上灵石(${fmtPrice(lingshiAmt)})</button>`;
    }
    if (hasTreasure) {
      html += `<button class="btn btn-reply" style="color:var(--blue)" onclick="game.resolveDefeat('treasure')">献上宝物</button>`;
    }
    html += `</div>`;
    container.innerHTML = html;
    this.inEncounter = true;
  }

  resolveDefeat(choice) {
    const d = this.pendingDefeat;
    if (!d) { this.showMainActions(); return; }
    const npc = d.npc;
    this.pendingDefeat = null;

    const p = PERSONALITIES[npc.personality];
    const rel = npc.getRelation(this.player.id);
    const cat = getRelationCategory(rel, npc.isChild, npc.id);
    const realmGap = npc.realmIndex - this.player.realmIndex;

    let mercyChance = 0.35;
    if (npc.personality === 'kind') mercyChance = 0.7;
    else if (npc.personality === 'righteous') mercyChance = 0.55;
    else if (npc.personality === 'greedy') mercyChance = 0.25;
    else if (npc.personality === 'arrogant') mercyChance = 0.3;
    else if (npc.personality === 'sinister') mercyChance = 0.12;

    if (cat === 'enemy') mercyChance -= 0.3;
    if (cat === 'soulmate' || cat === 'blood') mercyChance += 0.4;
    if (cat === 'friend') mercyChance += 0.2;
    if (realmGap >= 2) mercyChance += 0.1;
    if (npc.role === 'concubine') mercyChance += 0.3;

    let costText = '';
    if (choice === 'beg') {
      this.log(`你跪倒在地：「前辈饶命！小的有眼无珠，再也不敢了！」`, '');
    } else if (choice === 'lingshi') {
      const amt = Math.floor(this.player.inventory.lingshi * 0.5);
      this.player.inventory.lingshi -= amt;
      mercyChance += 0.25;
      if (npc.personality === 'greedy') mercyChance += 0.2;
      costText = `${fmtPrice(amt)}灵石`;
      this.log(`你颤抖着双手捧上 ${fmtPrice(amt)} 灵石：「全都给你，只求留我一命！」`, '');
    } else if (choice === 'treasure') {
      const items = this.player.inventory.items || [];
      if (items.length > 0) {
        const best = items.reduce((a, b) => b.power > a.power ? b : a);
        this.player.inventory.items = items.filter(t => t !== best);
        mercyChance += 0.35;
        if (npc.personality === 'greedy') mercyChance += 0.15;
        costText = best.name;
        this.log(`你取出<span class="npc-name">${best.name}</span>恭敬呈上：「此宝献予前辈，但求活命！」`, '');
      }
    }

    mercyChance = Math.max(0.05, Math.min(0.95, mercyChance));

    if (Math.random() < mercyChance) {
      const pn = p.name;
      let dialogue = '算了，今日便饶你一命，滚吧。';
      if (npc.personality === 'kind') dialogue = '罢了，冤冤相报何时了，你走吧。';
      else if (npc.personality === 'righteous') dialogue = '本座不屑杀手无寸铁之人，走吧。';
      else if (npc.personality === 'greedy') dialogue = costText ? '哼，看在这些东西的份上，饶你一命。' : '穷鬼，没什么油水，走吧。';
      else if (npc.personality === 'arrogant') dialogue = '你这种蝼蚁，杀了也脏了本座的手。';
      else if (npc.personality === 'sinister') dialogue = '呵……今日暂且记下，下次可没这么好运。';

      this.log(`<span class="npc-name">${npc.name}</span>：<span class="dialogue">"${dialogue}"</span>`, 'system');
      this.log(`${npc.name}收起了杀意，放你离去。`, 'success');

      this.player.hp = Math.max(1, Math.floor(this.player.hpMax * 0.1));
      npc.changeRelation(this.player.id, -10);

      if (d.afterSurvive) d.afterSurvive();
      else { this.finishCombatNPC(npc, d.isOld); this.showMainActions(); }
    } else {
      let dialogue = '求饶？哈哈哈……晚了！';
      if (npc.personality === 'sinister') dialogue = '呵呵呵……我最喜欢看猎物求饶的样子了。';
      else if (npc.personality === 'arrogant') dialogue = '蝼蚁就该有蝼蚁的觉悟，去死吧！';
      else if (cat === 'enemy') dialogue = '你我之间的仇，只有血才能洗清！';

      this.log(`<span class="npc-name">${npc.name}</span>：<span class="dialogue">"${dialogue}"</span>`, 'danger');
      this.die('你身受重伤，气血耗尽，道消身陨……游戏结束。');
    }
    this.updateHeader();
    this.save();
  }

  maybeSendDistress(npc) {
    if (Math.random() < 0.7) {
      this.log(`${npc.name}在临死前发出了求救信号！`, 'danger');
      this.spawnAvenger(npc);
      return true;
    }
    this.log(`${npc.name}来不及发出求救……`, '');
    return false;
  }

  resolveVictory(choice) {
    const v = this.pendingVictim;
    if (!v) return;
    const npc = v.npc;

    if (choice === 'release') {
      this.pendingVictim = null;
      npc.changeRelation(this.player.id, 15);
      this.rememberNpc(npc, '你曾在胜负已分时放我离去');
      this.log(`你放${npc.name}离去。对方抱拳：「多谢不杀之恩。」好感+15`, '');
      this.finishCombatNPC(npc, v.isOld);
      return;
    }

    if (choice === 'kill') {
      this.pendingVictim = null;
      const loot = randInt(10, 40) * (npc.realmIndex + 1);
      this.player.inventory.lingshi += loot;
      this.trackStat('lingshiEarned', loot);
      npc.isAlive = false;
      this.player.infamy = (this.player.infamy || 0) + 15;
      this.trackStat('kills');
      showScenePopup('danger', '击 杀', 1500);
      this.log(`你一掌拍出，${npc.name}当场殒命。获得 ${loot} 灵石。`, 'danger');
      this.maybeSendDistress(npc);
      npc.changeRelation(this.player.id, -100);
      this.finishCombatNPC(npc, v.isOld);
      return;
    }

    if (choice === 'furnace') {
      this.pendingVictim = null;
      const label = this.player.gender === '男' ? '采阴补阳' : '采阳补阴';
      const expGain = Math.floor(REALMS[npc.realmIndex].expPerStage * (0.5 + Math.random() * 0.5));
      const lifeGain = randInt(5, 15) * (npc.realmIndex + 1);
      const curRealm = REALMS[this.player.realmIndex];
      this.player.exp = Math.min(this.player.exp + expGain, curRealm.expPerStage);
      this.player.lifeCurrent += lifeGain;
      npc.isAlive = false;
      this.player.infamy = (this.player.infamy || 0) + 20;
      this.trackStat('kills');
      showScenePopup('danger', '炼 化 炉 鼎', 2000);
      this.log(`你将${npc.name}炼成炉鼎，${label}，吸干其全部修为！`, 'danger');
      this.log(`修为+${expGain}，寿元+${lifeGain}。`, 'success');
      this.maybeSendDistress(npc);
      npc.changeRelation(this.player.id, -100);
      this.finishCombatNPC(npc, v.isOld);
      return;
    }

    if (choice === 'concubine') {
      const rel = npc.getRelation(this.player.id);
      const pPower = getTotalPower(this.player.realmIndex, this.player.stageIndex);
      const nPower = getTotalPower(npc.realmIndex, npc.stageIndex);
      let acceptChance = 0.2 + (pPower - nPower) * 0.05 + Math.max(0, rel) * 0.005;
      acceptChance = Math.max(0.1, Math.min(0.8, acceptChance));
      const label = this.player.gender === '男' ? '侍妾' : '男宠';

      if (Math.random() < acceptChance) {
        this.pendingVictim = null;
        npc.role = 'concubine';
        npc.isPermanent = true;
        npc.changeRelation(this.player.id, 50 - rel);
        if (!this.player.concubines) this.player.concubines = [];
        this.player.concubines.push(npc.id);
        if (!this.memoryStore.getById(npc.id)) this.memoryStore.add(npc);
        this.placeNpcAtPlayer(npc);
        showScenePopup('dual', '收 为 ' + label, 2000);
        this.log(`${npc.name}低下头：「妾身……愿随主人左右。」`, 'pink');
        this.log(`【${npc.name}】成为你的${label}，将始终跟随你。`, 'system');
        this.finishCombatNPC(npc, v.isOld);
      } else {
        this.log(`${npc.name}怒目而视：「呸！宁死不从！」`, 'danger');
        this.showRejectedChoices(npc);
      }
      return;
    }

    if (choice === 'puppet') {
      this.pendingVictim = null;
      npc.role = 'puppet';
      npc.isPermanent = true;
      if (!this.player.puppets) this.player.puppets = [];
      this.player.puppets.push(npc.id);
      if (!this.memoryStore.getById(npc.id)) this.memoryStore.add(npc);
      this.placeNpcAtPlayer(npc);
      this.player.infamy = (this.player.infamy || 0) + 15;
      showScenePopup('danger', '炼 成 傀 儡', 2000);
      this.log(`你施展秘法，将${npc.name}炼成傀儡！其意志被彻底抹除，成为你的忠实保镖。`, 'danger');
      this.log(`【${npc.name}】成为你的傀儡，将始终跟随你。`, 'system');
      this.maybeSendDistress(npc);
      npc.changeRelation(this.player.id, -100);
      this.finishCombatNPC(npc, v.isOld);
      return;
    }

    if (choice === 'loot') {
      this.pendingVictim = null;
      const loot = randInt(30, 100) * (npc.realmIndex + 1);
      this.player.inventory.lingshi += loot;
      this.trackStat('lingshiEarned', loot);
      this.log(`你搜刮了${npc.name}的储物袋，获得 ${loot} 灵石。`, 'loot');
      if (Math.random() < 0.3) {
        const pillPool = PILLS.filter(p => p.forRealm <= npc.realmIndex + 1);
        if (pillPool.length) {
          const dp = randPick(pillPool);
          this.player.inventory.pills[dp.id] = (this.player.inventory.pills[dp.id] || 0) + 1;
          this.log(`还搜到一颗<span class="npc-name">${dp.name}</span>！`, 'loot');
        }
      }
      if (Math.random() < 0.2) {
        const tier = Math.min(npc.realmIndex, TREASURES.length - 1);
        const t = { ...TREASURES[randInt(Math.max(0, tier - 1), tier)] };
        this.player.inventory.items.push(t);
        this.log(`缴获宝物<span class="npc-name">${t.name}</span>（战力+${t.power}）！`, 'loot');
      }
      if (Math.random() < 0.15) {
        const maxGrade = Math.min(this.player.realmIndex + 2, 5);
        const avail = SKILLS.filter(s => SKILL_GRADES[s.grade] <= maxGrade && !(this.player.skills||[]).includes(s.id));
        if (avail.length) {
          const sk = randPick(avail);
          if (!this.player.skills) this.player.skills = [];
          this.player.skills.push(sk.id);
          if (!this.player.activeSkill) this.player.activeSkill = sk.id;
          this.log(`搜到功法秘籍<span class="npc-name">「${sk.name}」</span>！`, 'loot');
        }
      }
      npc.changeRelation(this.player.id, -15);
      this.rememberNpc(npc, '你曾夺走我的储物袋');
      this.player.infamy = (this.player.infamy || 0) + 10;
      this.finishCombatNPC(npc, v.isOld);
      return;
    }

    if (choice === 'interrogate') {
      this.pendingVictim = null;
      const intelRoll = Math.random();
      if (intelRoll < 0.4) {
        const tx = randInt(0, MAP_SIZE - 1), ty = randInt(0, MAP_SIZE - 1);
        const cell = this.mapSystem.getCell(tx, ty);
        if (cell && cell.type === 'normal') {
          cell.qi = 4;
          if (!cell.loot) cell.loot = [];
          const tier = Math.min(this.player.realmIndex + 1, TREASURES.length - 1);
          const t = { ...TREASURES[randInt(Math.max(0, tier - 1), tier)] };
          cell.loot.push(t);
        }
        this.log(`${npc.name}颤声道：「（${tx+1},${ty+1}）附近有一处秘境，里面藏有宝物……」`, 'loot');
        this.mapSystem.save();
      } else if (intelRoll < 0.7) {
        const aliveNpcs = this.memoryStore.getAlive().filter(n => n.id !== npc.id);
        if (aliveNpcs.length) {
          const target = randPick(aliveNpcs);
          this.log(`${npc.name}招供：「${target.name}身上有好东西，上次见到他在四处游荡……」`, 'loot');
        } else {
          this.log(`${npc.name}：「我什么都不知道！」看起来确实问不出什么。`, '');
        }
      } else {
        const pillPool = PILLS.filter(p => p.forRealm <= npc.realmIndex + 2);
        if (pillPool.length) {
          const dp = randPick(pillPool);
          this.log(`${npc.name}：「饶命！我知道哪里能找到${dp.name}，就在附近的山洞里……」`, 'loot');
          this.player.inventory.pills[dp.id] = (this.player.inventory.pills[dp.id] || 0) + 1;
          this.log(`你按其所说找到了一颗<span class="npc-name">${dp.name}</span>！`, 'loot');
        } else {
          this.log(`${npc.name}颤抖着说不出什么有用的情报。`, '');
        }
      }
      npc.changeRelation(this.player.id, -10);
      this.finishCombatNPC(npc, v.isOld);
      return;
    }
  }

  finishCombatNPC(npc, isOld) {
    this.removeNpcFromCell(npc);
    this.placeNpcOnMap(npc);
    if (!isOld && !npc.isPermanent) {
      const rel = npc.getRelation(this.player.id);
      if (rel >= 30 || rel <= -30) {
        npc.isPermanent = true;
        if (!this.memoryStore.getById(npc.id)) this.memoryStore.add(npc);
        const label = getRelationLabel(rel, npc.gender !== this.player.gender, npc.isChild);
        this.log(`【${npc.name}已被记入记忆录】（${label}）`, 'system');
      } else if (!this.memoryStore.getById(npc.id)) {
        npc.tempTurns = 3;
        this.memoryStore.add(npc);
      }
    }
    npc.tempTurns = 3;
    this.memoryStore.save();
    this.mapSystem.save();
    this.updateHeader();
    this.save();
    this.showMainActions();
  }

  interactPropose(npcId, type) {
    const npc = this.currentNPC;
    if (!npc || npc.id !== npcId) return;
    const rel = npc.getRelation(this.player.id);

    if (type === 'apprentice') {
      const acceptChance = Math.min(0.8, (rel - 20) / 60 + 0.3);
      if (Math.random() < acceptChance) {
        this.player.master = npc.id;
        npc.masterNpcId = '__isMaster__';
        npc.changeRelation(this.player.id, 30);
        this.log(`你向${npc.name}行拜师大礼。${npc.name}扶起你：「好，从今日起你便是我的弟子。」`, 'success');
        this.log(`【拜${npc.name}为师】`, 'system');
      } else {
        npc.changeRelation(this.player.id, -3);
        this.log(`${npc.name}摆了摆手：「你还需历练，时机未到。」`, '');
      }
