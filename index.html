      this.memoryStore.save(); this.save();
      this.showEncounterActions(npc);
      return;
    }
    if (type === 'recruit') {
      const acceptChance = Math.min(0.85, (rel - 10) / 50 + 0.4);
      if (Math.random() < acceptChance) {
        if (!this.player.disciples) this.player.disciples = [];
        this.player.disciples.push(npc.id);
        npc.masterNpcId = '__player__';
        npc.changeRelation(this.player.id, 30);
        this.log(`${npc.name}纳头便拜：「多谢师父收留！」`, 'success');
        this.log(`【收${npc.name}为徒】`, 'system');
      } else {
        this.log(`${npc.name}婉拒了你的好意。`, '');
      }
      this.memoryStore.save(); this.save();
      this.showEncounterActions(npc);
      return;
    }

    const acceptChance = type === 'couple' ? Math.min(0.85, (rel - 40) / 50 + 0.2) : Math.min(0.9, (rel - 30) / 60 + 0.3);

    if (Math.random() < acceptChance) {
      if (!this.player.bonds) this.player.bonds = [];
      if (!this.player.bonds.includes(npc.id)) this.player.bonds.push(npc.id);
      npc.changeRelation(this.player.id, type === 'couple' ? 30 : 20);
      if (type === 'couple') {
        npc.spouse = '__player__';
        this.log(`${npc.name}双颊绯红：「我……我愿意与你结为道侣。」`, 'pink');
        this.log(`【${npc.name}成为你的道侣】`, 'pink');
      } else {
        this.log(`${npc.name}大笑：「好！从此你我便是${this.player.gender === '男' ? '兄弟' : '姐妹'}！」`, 'success');
        this.log(`【与${npc.name}结拜】`, 'success');
      }
    } else {
      npc.changeRelation(this.player.id, -3);
      if (type === 'couple') {
        this.log(`${npc.name}低头轻声道：「我……还没准备好。」`, '');
      } else {
        this.log(`${npc.name}摇摇头：「此事不急，日后再说吧。」`, '');
      }
    }
    this.memoryStore.save(); this.save();
    this.showEncounterActions(npc);
  }

  interact(action) {
    if (!this.currentNPC) return;
    const npc = this.currentNPC;
    const p = PERSONALITIES[npc.personality];

    if (action === 'leave') {
      this.log('你转身离去。', 'system');
      this.finishEncounter(npc);
      return;
    }

    if (action === 'dual') {
      showScenePopup('dual', '双 修', 2000);
      this.worldTick(1);
      if (this.isDead) return;
      let delta = randInt(10, 20);
      const lifeGain = randInt(3, 8);
      this.player.lifeCurrent += lifeGain;
      const baseExp = randInt(40, 100);
      const curRealm = REALMS[this.player.realmIndex];
      const qiCell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
      const qiMult = qiCell ? QI_MULT[qiCell.qi] : 1;
      const expGain = Math.floor(baseExp * (1 + this.player.realmIndex * 0.3) * qiMult);
      this.player.exp = Math.min(this.player.exp + expGain, curRealm.expPerStage);
      const hpGain = Math.floor(this.player.hpMax * 0.2);
      this.player.hp = Math.min(this.player.hpMax, this.player.hp + hpGain);

      const DUAL_SCENES = [
        `你与${npc.name}相对盘坐，四手相握，灵力在二人经脉间缓缓流转。${npc.name}微微颤抖，面颊泛起红霞，轻声呢喃："好温暖……"阴阳二气交融，你们的修为同时精进。`,
        `${npc.name}依偎在你身旁，你引导灵力注入对方体内。${npc.name}轻哼一声，双眸微闭，睫毛轻颤。灵力共鸣愈发强烈，你感到前所未有的默契与亲密。`,
        `月光如水，你与${npc.name}以心印心，灵魂交融。${npc.name}紧握你的手，眼中波光流转："和你在一起，修炼都变得甜蜜了。"一股暖流遍布全身。`,
        `你将${npc.name}轻轻拥入怀中，灵力自然而然地交汇。${npc.name}靠在你肩头，呼吸渐渐急促，喃喃道："别停……灵力还在流转……"二人的境界在这份亲密中悄然提升。`,
        `${npc.name}捧着你的脸，目光温柔："准备好了。"灵力在你们之间编织成一张光网，阴阳相济，天地灵气涌入。${npc.name}面色潮红，嘴角含笑，你们都感受到了突飞猛进的修为增长。`,
      ];
      this.log(randPick(DUAL_SCENES), 'pink');
      this.log(`修为+${expGain}，气血+${hpGain}，寿元+${lifeGain}。`, 'pink');
      if (!isMaxRealm(npc.realmIndex, npc.stageIndex)) {
        const npcExpGain = Math.floor(expGain * 0.6);
        npc.exp = Math.min((npc.exp || 0) + npcExpGain, REALMS[npc.realmIndex].expPerStage);
        if (canBreakthrough(npc) && Math.random() < REALMS[npc.realmIndex].breakChance) {
          npc.stageIndex++; npc.exp = 0;
          if (npc.stageIndex >= REALMS[npc.realmIndex].stages.length) {
            npc.stageIndex = 0; npc.realmIndex++;
            npc.lifeMax = REALMS[npc.realmIndex].lifeMax;
            npc.lifeCurrent += Math.floor(REALMS[npc.realmIndex].lifeMax * 0.4);
            npc.hpMax = REALMS[npc.realmIndex].hpMax;
          }
          this.log(`${npc.name}修为精进，突破至<span class="realm-text">${npc.getRealmName()}</span>！`, 'pink');
        }
      }

      const nP = getTotalPower(npc.realmIndex, npc.stageIndex);
      const pP = getTotalPower(this.player.realmIndex, this.player.stageIndex);
      const childChance = Math.max(0.08, 0.25 / Math.max(1, (pP + nP) * 0.05));

      if (Math.random() < childChance && !npc.pregnant) {
        this.log(`【天赐良缘】双修结出硕果！${npc.name}有孕在身！`, 'pink');
        const surname = this.player.gender === '男' ? this.player.name[0] : npc.name[0];
        const childGender = randPick(['男', '女']);
        this.pendingBirth = { npc, surname, childGender };
        npc.changeRelation(this.player.id, delta);
        this.showNamingUI(surname, childGender, npc);
        return;
      }

      npc.changeRelation(this.player.id, delta);
      this.finishEncounter(npc);
      return;
    }

    let delta = 0, resultText = '';

    if (action === 'spar') {
      this.log(`你与${npc.name}切磋！`, 'combat');
      this.startCombat(npc.name, npc.realmIndex, npc.stageIndex, randInt(0, 10),
        () => {
          npc.changeRelation(this.player.id, randInt(5, 15) + p.sparMod);
          this.rememberNpc(npc, '你我曾有一场酣畅淋漓的切磋');
          this.log(`切磋结束，你略胜一筹。好感度提升。`, 'success');
          this.finishEncounter(npc);
        },
        () => {
          npc.changeRelation(this.player.id, randInt(3, 8));
          this.rememberNpc(npc, '你我曾在切磋中分出高下');
          this.log(`切磋结束，对方更胜一筹，但你受益匪浅。`, '');
          this.player.hp = Math.max(1, this.player.hp);
          this.finishEncounter(npc);
        }
      );
      return;
    } else if (action === 'gift') {
      delta = randInt(10, 25) + p.giftMod;
      resultText = `你向${npc.name}赠送了一份薄礼。`;
      this.rememberNpc(npc, '你曾赠我一份薄礼');
      if (p.name === '唯利') resultText += '对方两眼放光。';
    } else if (action === 'rob') {
      this.log(`你试图抢夺${npc.name}的资源！`, 'combat');
      const robDelta = randInt(-30, -15) + p.robMod;
      this.startCombat(npc.name, npc.realmIndex, npc.stageIndex, randInt(0, 15),
        () => {
          this.trackStat('kills');
          npc.changeRelation(this.player.id, robDelta);
          this.rememberNpc(npc, '你曾试图抢夺我的资源，并将我击败');
          this.pendingVictim = { npc, isOld: npc.isPermanent };
          this.showVictoryChoices(npc);
        },
        () => {
          npc.changeRelation(this.player.id, robDelta);
          this.rememberNpc(npc, '你曾试图抢夺我的资源，却败在我手下');
          if (this.player.hp <= 0) {
            this.player.hp = 1;
            this.showDefeatChoices(npc, npc.isPermanent, () => {
              this.log('抢夺失败！', 'danger');
              this.finishEncounter(npc);
              this.showMainActions();
            });
          } else {
            this.log('抢夺失败！', 'danger');
            this.finishEncounter(npc);
          }
        }
      );
      return;
    }

    npc.changeRelation(this.player.id, delta);
    const newRel = npc.getRelation(this.player.id);
    const label = getRelationLabel(newRel, npc.gender !== this.player.gender, npc.isChild, npc.id);
    const cls = delta > 0 ? 'success' : (delta < 0 ? 'danger' : '');
    const sign = delta > 0 ? '+' : '';
    this.log(`${resultText}<br>好感度 ${sign}${delta}（当前：${newRel}，${label}）`, cls);

    this.finishEncounter(npc);
  }

  showNamingUI(surname, childGender, motherNpc) {
    this.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    const names = [];
    const used = new Set();
    while (names.length < 3) {
      const n = surname + randPick(NAME_CHAR1) + randPick(NAME_CHAR2);
      if (!used.has(n)) { used.add(n); names.push(n); }
    }
    let html = `<div style="text-align:center;color:var(--pink);font-size:14px;margin-bottom:8px">为${childGender === '男' ? '儿子' : '女儿'}取名</div>`;
    html += '<div class="btn-row three">';
    for (const n of names) {
      html += `<button class="btn btn-reply" onclick="game.confirmChildName('${n}')">${n}</button>`;
    }
    html += '</div>';
    html += `<div style="display:flex;gap:8px;margin-top:8px"><input id="customChildName" placeholder="自定义名字" style="flex:1;background:var(--bg);color:var(--text);border:1px solid var(--gold-dim);border-radius:6px;padding:8px;font-family:inherit;font-size:14px"><button class="btn btn-sm" onclick="game.confirmChildName(document.getElementById('customChildName').value)" style="white-space:nowrap">确定</button></div>`;
    container.innerHTML = html;
    this.inEncounter = true;
  }

  confirmChildName(name) {
    if (!name || !name.trim()) return;
    const b = this.pendingBirth;
    if (!b) return;
    this.pendingBirth = null;
    const npc = b.npc;
    npc.pregnant = { name: name.trim(), gender: b.childGender, turnsLeft: 2 };
    if (this.player.sect && npc.sect !== (getSectById(this.player.sect)||{}).name) {
      const s = getSectById(this.player.sect);
      if (s) {
        npc.sect = s.name;
        this.log(`${npc.name}加入了${s.name}，与你同门。`, 'system');
      }
    }
    this.log(`孩子取名<span class="npc-name">${name.trim()}</span>（${b.childGender}），预计两次推进时间后出生。`, 'pink');
    this.memoryStore.save();
    this.save();
    this.finishEncounter(npc);
  }

  finishEncounter(npc) {
    if (!npc.isPermanent) {
      const rel = npc.getRelation(this.player.id);
      if (rel >= 30 || rel <= -30) {
        npc.isPermanent = true;
        if (!this.memoryStore.getById(npc.id)) this.memoryStore.add(npc);
        const label = getRelationLabel(rel, npc.gender !== this.player.gender, npc.isChild);
        this.log(`【${npc.name}已被记入记忆录】（${label}）`, 'system');
      } else if (!this.memoryStore.getById(npc.id)) {
        this.memoryStore.add(npc);
      }
    }
    npc.tempTurns = 3;
    this.placeNpcAtPlayer(npc);
    this.memoryStore.save();
    this.mapSystem.save();
    this.save();
    this.updateHeader();
    this.showMainActions();
  }

  // ===== 修整 =====
  rest() {
    if (this.isDead || this.inEncounter) return;
    if (this.player.hp >= this.player.hpMax) {
      this.log('你气血充沛，无需修整。', 'system');
      return;
    }

    this.setActivity('rest');
    showScenePopup('meditate', '修 整 疗 伤', 1500);
    this.worldTick(1);
    if (this.isDead) return;

    const heal = Math.floor(this.player.hpMax * (0.3 + Math.random() * 0.3));
    this.player.hp = Math.min(this.player.hpMax, this.player.hp + heal);
    this.setActivity('rest', { gain: `气血 +${heal}` });
    this.log(`你原地修整一年，恢复气血 +${heal}。（${this.player.hp}/${this.player.hpMax}）`, 'success');

    if (Math.random() < 0.3) {
      this.updateHeader(); this.save();
      this.triggerRandomEvent();
      return;
    }

    this.updateHeader();
    this.save();
  }

  // ===== 修炼 =====
  meditate() {
    if (this.isDead || this.inEncounter) return;

    this.setActivity('meditate');
    showScenePopup('meditate', '闭 关 修 炼');
    const mYears = REALMS[this.player.realmIndex].meditateYears;
    const yearsSpent = randInt(mYears[0], mYears[1]);
    this.worldTick(yearsSpent);
    this.trackStat('meditateYears', yearsSpent);
    if (this.isDead) return;

    if (isMaxRealm(this.player.realmIndex, this.player.stageIndex)) {
      this.log(`闭关${yearsSpent}年，你已是渡劫大圆满，天地之下少有敌手。`, '');
      this.updateHeader(); this.save();
      return;
    }

    const curRealm = REALMS[this.player.realmIndex];

    if (this.player.exp >= curRealm.expPerStage) {
      this.log(`闭关${yearsSpent}年，修为已满，无法继续积累。需尝试突破方可精进。`, 'system');
      this.updateHeader(); this.save();
      return;
    }

    const cell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
    const qiLevel = cell ? cell.qi : 2;
    const qiMult = QI_MULT[qiLevel];
    const sectObj = this.player.sect ? getSectById(this.player.sect) : null;
    const sectMult = sectObj ? sectObj.expBonus : 1;
    const masterMult = this.player.master ? 1.2 : 1;
    const baseExp = randInt(5, 60);
    const bonus = (1 + this.player.realmIndex * 0.3) * qiMult * sectMult * masterMult;
    const expGain = Math.floor(baseExp * bonus);
    this.player.exp = Math.min(this.player.exp + expGain, curRealm.expPerStage);
    this.setActivity('meditate', { gain: `修为 +${expGain}`, time: `闭关 ${yearsSpent} 年`, period: `第 ${yearsSpent} / ${yearsSpent} 年` });

    const sectText = sectObj ? ` [${sectObj.name}+${Math.round((sectMult-1)*100)}%]` : '';
    const masterText = this.player.master ? ' [师父指点+20%]' : '';
    const qiText = `[${QI_NAMES[qiLevel]}之地 x${qiMult}]${sectText}${masterText}`;
    if (this.player.exp >= curRealm.expPerStage) {
      this.log(`闭关${yearsSpent}年，修为+${expGain}${qiText}。修为已满！可以尝试突破了。`, 'success');
    } else {
      this.log(`闭关${yearsSpent}年，修为+${expGain}${qiText}。（${getRealmFullName(this.player.realmIndex, this.player.stageIndex)} ${this.player.exp}/${curRealm.expPerStage}）`, '');
    }

    if (cell && cell.type === 'normal') {
      cell.cultivateCount = (cell.cultivateCount || 0) + 1;
      if (cell.cultivateCount >= 3 && cell.qi > 1) {
        cell.qi--;
        this.log('此地灵脉因过度汲取而衰减……灵气下降。', 'danger');
      }
    }

    this.mapSystem.shuffleQiLocal(this.mapSystem.playerX, this.mapSystem.playerY);
    this.mapSystem.save();

    const interruptChance = qiLevel >= 3 ? 0.4 : 0.2;
    if (Math.random() < interruptChance) {
      this.updateHeader(); this.save();
      this.triggerRandomEvent();
      return;
    }

    this.updateHeader(); this.save();
  }

  // ===== 突破 =====
  tryBreakthrough() {
    if (this.isDead || this.inEncounter) return;
    if (!canBreakthrough(this.player)) return;

    this.setActivity('breakthrough');
    const curRealm = REALMS[this.player.realmIndex];
    const isMajor = this.player.stageIndex >= curRealm.stages.length - 1;
    const pill = getPillForBreakthrough(this.player.realmIndex, this.player.stageIndex);

    if (pill) {
      const count = this.player.inventory.pills[pill.id] || 0;
      if (count <= 0) {
        this.log(`突破需要<span class="npc-name">${pill.name}</span>，你尚未拥有。可通过探索、战斗或坊市获取。`, 'system');
        return;
      }
      this.player.inventory.pills[pill.id]--;
      this.trackStat('pillsUsed');
      this.log(`消耗一颗<span class="npc-name">${pill.name}</span>，开始突破……`, 'system');
    }

    let chance = curRealm.breakChance;
    if (isMajor) chance -= 0.1;

    const targetName = isMajor
      ? getRealmFullName(this.player.realmIndex + 1, 0)
      : getRealmFullName(this.player.realmIndex, this.player.stageIndex + 1);

    this.log(`你盘膝而坐，尝试突破至<span class="realm-text">${targetName}</span>……（成功率 ${Math.round(chance * 100)}%）`, 'system');

    if (Math.random() < chance) {
      showScenePopup('breakthrough', '突 破 成 功', 2000);
      this.player.exp = 0;
      this.player.stageIndex++;
      if (this.player.stageIndex >= curRealm.stages.length) {
        this.player.stageIndex = 0;
        this.player.realmIndex++;
        const newRealm = REALMS[this.player.realmIndex];
        this.player.lifeMax = newRealm.lifeMax;
        this.player.lifeCurrent += Math.floor(newRealm.lifeMax * 0.4);
        this.player.hpMax = newRealm.hpMax;
        this.player.hp = newRealm.hpMax;
        this.log(`大境界突破成功！晋升<span class="realm-text">${getRealmFullName(this.player.realmIndex, 0)}</span>！寿元大增，气血全满！`, 'success');
      } else {
        this.log(`突破成功！晋升<span class="realm-text">${getRealmFullName(this.player.realmIndex, this.player.stageIndex)}</span>！`, 'success');
      }
      this.updatePeakRealm();
    } else {
      const lostExp = Math.floor(curRealm.expPerStage * (0.3 + Math.random() * 0.2));
      const lostLife = randInt(5, 15);
      this.player.exp = Math.max(0, this.player.exp - lostExp);
      this.player.lifeCurrent -= lostLife;

      if (this.player.lifeCurrent <= 0) {
        this.die('突破失败！灵力反噬过于猛烈，你的寿元已尽，道消身陨……游戏结束。');
        return;
      }

      this.log(`突破失败！灵力反噬，修为跌落-${lostExp}，寿元-${lostLife}。`, 'danger');
    }

    this.updateHeader(); this.save();
  }

  // ===== 推进时间 =====
  advanceTime() {
    if (this.isDead || this.inEncounter) return;
    const baseYears = Math.max(2, this.player.realmIndex * 3 + 2);
    const years = randInt(baseYears, baseYears * 3);
    this.setActivity('time', { gain: `岁月 +${years} 年`, time: `推演 ${years} 年` });
    this.worldTick(years);
    if (this.isDead) return;

    this.log(`时光荏苒，${years}年过去了……（修仙历${this.player.worldYear}年）`, 'system');
    const events = this.evolutionEngine.advanceTime(this.memoryStore, years);
    if (!events.length) {
      this.log('江湖平静，未有大事发生。', '');
    } else {
      for (const e of events) {
        if (e.type === 'death' && e.npcId) {
          const npc = this.memoryStore.getById(e.npcId);
          if (npc) {
            const bonds = this.player.bonds || [];
            if (npc.spouse === '__player__') { this.log(`噩耗——你的道侣<span class="npc-name">${npc.name}</span>寿元已尽！`, 'danger'); continue; }
            if (npc.isChild || npc.motherNpcId) { this.log(`噩耗——你的${npc.gender==='男'?'儿子':'女儿'}<span class="npc-name">${npc.name}</span>陨落了！`, 'danger'); continue; }
            if (this.player.master === npc.id) { this.log(`悲痛——你的师父<span class="npc-name">${npc.name}</span>仙逝了……`, 'danger'); continue; }
            if ((this.player.disciples||[]).includes(npc.id)) { this.log(`你的徒弟<span class="npc-name">${npc.name}</span>不幸身陨！`, 'danger'); continue; }
            if (bonds.includes(npc.id)) { this.log(`至交<span class="npc-name">${npc.name}</span>已经陨落……`, 'danger'); continue; }
          }
        }
        this.log(e.text, e.type === 'death' ? 'danger' : 'success');
      }
    }
    this.mapSystem.moveNPCs(this.memoryStore);
    for (const npc of this.memoryStore.getAlive()) {
      npc.lastHelped = false;
      if (npc.tempTurns > 0) {
        npc.tempTurns--;
        if (npc.tempTurns <= 0) {
          for (let y = 0; y < MAP_SIZE; y++)
            for (let x = 0; x < MAP_SIZE; x++) {
              const ids = this.mapSystem.grid[y][x].npcIds || [];
              const idx = ids.indexOf(npc.id);
              if (idx !== -1) ids.splice(idx, 1);
            }
          if (!npc.isPermanent) npc.isAlive = false;
        }
      }
    }
    this.memoryStore.npcs = this.memoryStore.npcs.filter(n => n.isPermanent || n.isAlive);
    if (this.player.bonds && this.player.bonds.length) {
      for (const bondId of this.player.bonds) {
        const ally = this.memoryStore.getById(bondId);
        if (ally && ally.isAlive) {
          const rel = ally.getRelation(this.player.id);
          const isOpp = ally.gender !== this.player.gender;
          if (rel >= 60 && isOpp) {
            const gift = randInt(10, 40) * Math.max(1, ally.realmIndex);
            this.player.inventory.lingshi += gift;
            this.trackStat('lingshiEarned', gift);
            this.log(`道侣${ally.name}托人送来 ${gift} 灵石。`, 'pink');
          }
        }
      }
    }
    this.npcSocialTick(years);
    this.hunterTick();
    this.npcVisitTick();
    this.spawnWorldEvents();
    this.mapSystem.shuffleQi();
    if (!this.player.bountyTask) refreshBountyBoard();
    this.log('天地灵气流转，各处灵脉发生了变化……', 'system');
    this.mapSystem.save();
    this.updateHeader(); this.save();
  }

  // ===== 使用回血丹 =====
  npcSocialTick(years) {
    const alive = this.memoryStore.getAlive().filter(n => !n.isMinor);
    for (const npc of alive) {
      if (npc.spouse || npc.isChild) continue;
      if (Math.random() > 0.15) continue;
      const candidates = alive.filter(c =>
        c.id !== npc.id && !c.spouse && c.gender !== npc.gender &&
        !c.isChild && c.sect === npc.sect && c.sect !== '散修'
      );
      if (!candidates.length) continue;
      const partner = randPick(candidates);
      npc.spouse = partner.id;
      partner.spouse = npc.id;
      this.log(`传闻${npc.name}与${partner.name}结为道侣。`, 'pink');
    }
    for (const npc of alive) {
      if (!npc.spouse || npc.gender === '男') continue;
      if (npc.pregnant) continue;
      const partner = this.memoryStore.getById(npc.spouse);
      if (!partner || !partner.isAlive) continue;
      const existingKids = alive.filter(c => c.motherNpcId === npc.id).length;
      if (existingKids >= 2) continue;
      if (Math.random() > 0.1) continue;
      const surname = partner.name[0];
      const childName = surname + randPick(NAME_CHAR1) + randPick(NAME_CHAR2);
      const childGender = randPick(['男', '女']);
      const baby = this.generator.createRandomNPC(0, {
        name: childName, gender: childGender,
        sect: npc.sect, realmIndex: 0, stageIndex: 0, exp: 0,
      });
      baby.isChild = true;
      baby.age = 0;
      baby.motherNpcId = npc.id;
      baby.isPermanent = true;
      baby.changeRelation(this.player.id, 0);
      this.memoryStore.add(baby);
      this.log(`传闻${npc.name}与${partner.name}诞下一${childGender === '男' ? '子' : '女'}，取名${childName}。`, 'pink');
    }
  }

  enterRuin() {
    if (this.isDead || this.inEncounter) return;
    const cell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
    if (!cell || !cell.ruin) return;
    const ruin = RUINS[cell.ruin.id];
    if (!ruin) return;
    const step = ruin.steps[cell.ruin.step];
    if (!step) { delete cell.ruin; this.mapSystem.save(); this.updateMarketBtn(); return; }

    this.log(`【${ruin.name}】${step.desc}`, 'loot');
    this.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    let html = '<div class="btn-row" style="grid-template-columns:' + `repeat(${step.choices.length},1fr)` + '">';
    for (let i = 0; i < step.choices.length; i++) {
      html += `<button class="btn btn-reply" onclick="game.resolveRuinChoice(${i})">${step.choices[i].text}</button>`;
    }
    html += '</div>';
    container.innerHTML = html;
    this.inEncounter = true;
  }

  resolveRuinChoice(idx) {
    const cell = this.mapSystem.getCell(this.mapSystem.playerX, this.mapSystem.playerY);
    if (!cell || !cell.ruin) { this.showMainActions(); return; }
    const ruin = RUINS[cell.ruin.id];
    const step = ruin.steps[cell.ruin.step];
    const choice = step.choices[idx];

    this.log(choice.msg, '');

    if (choice.result === 'quit') {
      delete cell.ruin;
    } else if (choice.result === 'fight' || choice.result === 'fight_boss') {
      const bossRI = choice.result === 'fight_boss'
        ? Math.min(this.player.realmIndex + 1, REALMS.length - 1)
        : this.player.realmIndex;
      const bossName = choice.result === 'fight_boss' ? '妖王' : '守护者';
      const bossSI = randInt(0, 2);
      this.startCombat(bossName, bossRI, bossSI, randInt(10, 30),
        () => {
          this.trackStat('kills');
          cell.ruin.step++;
          this.mapSystem.save(); this.updateHeader(); this.save();
          if (cell.ruin && cell.ruin.step < ruin.steps.length) this.enterRuin();
          else { delete cell.ruin; this.mapSystem.save(); this.showMainActions(); }
        },
        () => {
          delete cell.ruin;
          this.mapSystem.save(); this.updateHeader(); this.save();
          if (this.player.hp <= 0) this.die('你身受重伤，气血耗尽，道消身陨……游戏结束。');
          else this.showMainActions();
        }
      );
      return;
    } else if (choice.result === 'damage') {
      const dmg = Math.floor(this.player.hpMax * (randInt(5, 15) / 100));
      this.player.hp = Math.max(1, this.player.hp - dmg);
      this.log(`气血-${dmg}`, 'danger');
      cell.ruin.step++;
    } else if (choice.result === 'greedy') {
      const lost = Math.floor(this.player.inventory.lingshi * 0.1);
      this.player.inventory.lingshi = Math.max(0, this.player.inventory.lingshi - lost);
      if (lost > 0) this.log(`灵石幻象消散，你丢失了 ${lost} 灵石。`, 'danger');
      cell.ruin.step++;
    } else if (choice.result === 'brave') {
      cell.ruin.step++;
    } else if (choice.result === 'loot_small') {
      const amount = randInt(30, 80) * Math.max(1, this.player.realmIndex);
      this.player.inventory.lingshi += amount;
      this.trackStat('lingshiEarned', amount);
      this.log(`获得 ${amount} 灵石。`, 'loot');
      cell.ruin.step++;
    } else if (choice.result === 'loot_big') {
      const expGain = randInt(50, 150);
      this.player.exp = Math.min(this.player.exp + expGain, REALMS[this.player.realmIndex].expPerStage);
      const amount = randInt(80, 200) * Math.max(1, this.player.realmIndex);
      this.player.inventory.lingshi += amount;
      this.trackStat('lingshiEarned', amount);
      this.log(`获得传承！修为+${expGain}，灵石+${amount}！`, 'loot');
      const maxG = Math.min(this.player.realmIndex + 3, 5);
      const avSkills = SKILLS.filter(s => SKILL_GRADES[s.grade] <= maxG && !(this.player.skills||[]).includes(s.id));
      if (avSkills.length && Math.random() < 0.5) {
        const sk = randPick(avSkills);
        if (!this.player.skills) this.player.skills = [];
        this.player.skills.push(sk.id);
        if (!this.player.activeSkill) this.player.activeSkill = sk.id;
        this.log(`传承中蕴含功法<span class="npc-name">「${sk.name}」</span>！`, 'loot');
      }
      delete cell.ruin;
    } else if (choice.result === 'loot_treasure') {
      const tier = Math.min(this.player.realmIndex + 2, TREASURES.length - 1);
      const t = { ...TREASURES[randInt(Math.max(0, tier - 1), tier)] };
      this.player.inventory.items.push(t);
      this.log(`获得宝物<span class="npc-name">${t.name}</span>（战力+${t.power}）！`, 'loot');
      delete cell.ruin;
    } else {
      cell.ruin.step++;
    }

    if (cell.ruin && cell.ruin.step >= ruin.steps.length) delete cell.ruin;

    this.mapSystem.save();
    this.updateHeader();
    this.save();

    if (cell.ruin) {
      this.enterRuin();
    } else {
      this.showMainActions();
    }
  }

  startCombat(enemyName, enemyRI, enemySI, enemyTreasure, onWin, onLose) {
    showScenePopup('combat', '战 斗', 1200);
    const activeSkill = this.player.activeSkill ? getSkillById(this.player.activeSkill) : null;
    const skillPower = activeSkill ? activeSkill.power : 0;
    const followerAtk = this.getFollowerAtk();
    const pAtk = getTotalPower(this.player.realmIndex, this.player.stageIndex) * 8 + this.getPlayerTreasurePower() + skillPower;
    const eAtk = getTotalPower(enemyRI, enemySI) * 8 + (enemyTreasure || 0);
    const eHpMax = REALMS[enemyRI].hpMax;
    this.combatState = {
      enemyName, enemyRI, enemySI,
      pAtk, eAtk, followerAtk,
      eHp: eHpMax, eHpMax,
      pHpStart: this.player.hp,
      onWin, onLose,
      log: [],
      round: 0,
    };
    this.showCombatUI();
  }

  showCombatUI() {
    const cs = this.combatState;
    if (!cs) return;
    this.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    const pHpPct = Math.max(0, Math.floor(this.player.hp / this.player.hpMax * 100));
    const eHpPct = Math.max(0, Math.floor(cs.eHp / cs.eHpMax * 100));

    const curSkill = this.player.activeSkill ? getSkillById(this.player.activeSkill) : null;
    let logHtml = '';
    for (const l of cs.log.slice(-4)) logHtml += `<div>${l}</div>`;

    container.innerHTML = `
      <div class="combat-panel">
        <div class="combat-bar">
          <span class="combat-name" style="color:var(--gold)">${this.player.name}</span>
          <div class="combat-hp-wrap"><div class="combat-hp-fill player-bar" style="width:${pHpPct}%"></div><div class="combat-hp-text">${this.player.hp}/${this.player.hpMax}</div></div>
          <span style="font-size:10px;color:var(--text-dim)">攻${cs.pAtk}</span>
        </div>
        <div class="combat-bar">
          <span class="combat-name" style="color:var(--red)">${cs.enemyName}</span>
          <div class="combat-hp-wrap"><div class="combat-hp-fill enemy-bar" style="width:${eHpPct}%"></div><div class="combat-hp-text">${cs.eHp}/${cs.eHpMax}</div></div>
          <span style="font-size:10px;color:var(--text-dim)">攻${cs.eAtk}</span>
        </div>
        <div class="combat-info">第 ${cs.round} 回合${curSkill ? ` · 功法：${curSkill.name}(+${curSkill.power})` : ''}${cs.followerAtk ? ` · <span style="color:#9b59b6">随从待命</span>` : ''}</div>
        <div class="combat-log">${logHtml}</div>
      </div>
      <div class="btn-row" style="grid-template-columns:repeat(${cs.followerAtk ? 4 : 3},1fr)">
        <button class="btn" onclick="game.combatAction('strike')">全力一击</button>
        <button class="btn" onclick="game.combatAction('defend')">防御反击</button>
        <button class="btn" style="color:var(--blue);border-color:var(--blue)" onclick="game.combatAction('skill')">${curSkill ? curSkill.name : '基础攻击'}</button>
        ${cs.followerAtk ? `<button class="btn" style="color:#9b59b6;border-color:#9b59b6" onclick="game.combatAction('follower')">随从出击(${cs.followerAtk})</button>` : ''}
      </div>
      <div class="btn-row">
        <button class="btn" onclick="game.combatAction('flee')" style="grid-column:1/-1">尝试逃跑</button>
      </div>
    `;
    this.inEncounter = true;
  }

  combatAction(action) {
    const cs = this.combatState;
    if (!cs) return;
    cs.round++;

    let pDmg = 0, eDmg = 0, pText = '', eText = '';

    if (action === 'flee') {
      if (Math.random() < 0.4) {
        cs.log.push('<span style="color:var(--blue)">你抓住空隙，成功逃脱！</span>');
        this.log('你从战斗中逃脱了。', 'system');
        this.combatState = null;
        this.showMainActions();
        return;
      } else {
        cs.log.push('<span style="color:var(--red)">逃跑失败！对方拦住了你的去路。</span>');
        eDmg = Math.floor(cs.eAtk * (0.6 + Math.random() * 0.4));
      }
    } else if (action === 'strike') {
      pDmg = Math.floor(cs.pAtk * (0.8 + Math.random() * 0.6));
      eDmg = Math.floor(cs.eAtk * (0.5 + Math.random() * 0.5));
      pText = `你全力出手，造成 ${pDmg} 伤害！`;
    } else if (action === 'defend') {
      pDmg = Math.floor(cs.pAtk * (0.3 + Math.random() * 0.3));
      eDmg = Math.floor(cs.eAtk * (0.2 + Math.random() * 0.3));
      pText = `你以守代攻，伺机反击，造成 ${pDmg} 伤害。`;
    } else if (action === 'skill') {
      const sk = this.player.activeSkill ? getSkillById(this.player.activeSkill) : null;
      if (sk && sk.type === '辅') {
        const heal = Math.floor(this.player.hpMax * (0.15 + Math.random() * 0.15));
        this.player.hp = Math.min(this.player.hpMax, this.player.hp + heal);
        pText = `<span style="color:var(--green)">施展「${sk.name}」，恢复气血 ${heal}！</span>`;
        eDmg = Math.floor(cs.eAtk * (0.4 + Math.random() * 0.3));
      } else if (sk && sk.type === '防') {
        pDmg = Math.floor(cs.pAtk * (0.5 + Math.random() * 0.3));
        eDmg = Math.floor(cs.eAtk * (0.1 + Math.random() * 0.2));
        pText = `<span style="color:var(--blue)">施展「${sk.name}」，攻防兼备！造成 ${pDmg} 伤害。</span>`;
      } else {
        const skName = sk ? sk.name : '基础攻击';
        const hitRate = sk ? 0.85 : 0.7;
        if (Math.random() < hitRate) {
          pDmg = Math.floor(cs.pAtk * (1.0 + Math.random() * 0.8));
          pText = `<span style="color:var(--blue)">「${skName}」命中！造成 ${pDmg} 伤害！</span>`;
          eDmg = Math.floor(cs.eAtk * (0.3 + Math.random() * 0.3));
        } else {
          pDmg = Math.floor(cs.pAtk * 0.1);
          pText = `<span style="color:var(--text-dim)">「${skName}」未能命中……</span>`;
          eDmg = Math.floor(cs.eAtk * (0.6 + Math.random() * 0.5));
        }
      }
    } else if (action === 'follower') {
      const fNames = this.getFollowerNames();
      pDmg = Math.floor(cs.followerAtk * (0.8 + Math.random() * 0.6));
      eDmg = Math.floor(cs.eAtk * (0.3 + Math.random() * 0.3));
      pText = `<span style="color:#9b59b6">你命令${fNames.join('、')}出击，造成 ${pDmg} 伤害！</span>`;
    }

    cs.eHp -= pDmg;
    if (pText) cs.log.push(pText);

    if (cs.eHp <= 0) {
      cs.eHp = 0;
      cs.log.push(`<span style="color:var(--green)">${cs.enemyName}被击败了！</span>`);
      this.log(`经过${cs.round}回合激战，你击败了${cs.enemyName}！`, 'success');
      const cb = cs.onWin;
      this.combatState = null;
      if (cb) cb();
      else this.showMainActions();
      return;
    }

    this.player.hp -= eDmg;
    if (eDmg > 0) {
      eText = `${cs.enemyName}反击，对你造成 ${eDmg} 伤害。`;
      cs.log.push(eText);
    }

    if (this.player.hp <= 0) {
      this.player.hp = 0;
      const hpBefore = this.player.hp;
      this.checkBondAid(eDmg);
      if (this.player.hp > hpBefore) {
        cs.log.push(`<span style="color:var(--pink)">援军到来！你恢复了气血，继续战斗！</span>`);
        this.showCombatUI();
        return;
      }
      if (this.player.hp <= 0) {
        cs.log.push(`<span style="color:var(--red)">你倒下了……</span>`);
        this.log(`经过${cs.round}回合战斗，你不敌${cs.enemyName}。`, 'danger');
        const cb = cs.onLose;
        this.combatState = null;
        if (cb) cb(eDmg);
        else this.die('你身受重伤，气血耗尽，道消身陨……游戏结束。');
        return;
      }
    }

    this.showCombatUI();
  }

  showProposalChoices(npc, type) {
    this.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    const label = type === 'couple' ? '结为道侣' : '义结金兰';
    container.innerHTML = `
      <div class="btn-row">
        <button class="btn btn-reply" onclick="game.resolveProposal(true)">答应${label}</button>
        <button class="btn btn-reply" onclick="game.resolveProposal(false)">婉言拒绝</button>
      </div>
    `;
    this.inEncounter = true;
  }

  resolveProposal(accept) {
    const pp = this.pendingProposal;
    if (!pp) { this.showMainActions(); return; }
    const npc = pp.npc;
    this.pendingProposal = null;

    if (accept) {
      if (!this.player.bonds) this.player.bonds = [];
      if (!this.player.bonds.includes(npc.id)) this.player.bonds.push(npc.id);
      npc.changeRelation(this.player.id, 25);
      if (pp.type === 'couple') {
        npc.spouse = '__player__';
        showScenePopup('dual', '结 为 道 侣', 2000);
        this.log(`你点头应允。${npc.name}喜极而泣：「此生有你，无憾矣。」`, 'pink');
        this.log(`【${npc.name}成为你的道侣】`, 'pink');
      } else {
        showScenePopup('bond', '义 结 金 兰', 2000);
        this.log(`你抱拳回礼：「好！从此你我便是${this.player.gender === '男' ? '兄弟' : '姐妹'}！」`, 'success');
        this.log(`【与${npc.name}结拜】`, 'success');
      }
    } else {
      npc.changeRelation(this.player.id, -5);
      if (pp.type === 'couple') {
        this.log(`你委婉拒绝了。${npc.name}黯然低头：「是我唐突了……」`, '');
      } else {
        this.log(`你婉拒了结拜之请。${npc.name}略显失落但表示理解。`, '');
      }
    }
    this.memoryStore.save();
    this.save();
    this.showMainActions();
  }

  spawnWorldEvents() {
    const ms = this.mapSystem;
    for (const row of ms.grid) for (const c of row) {
      if (c.rift) { c.rift.ttl--; if (c.rift.ttl <= 0) delete c.rift; }
      if (c.herb) { c.herb.ttl--; if (c.herb.ttl <= 0) delete c.herb; }
      if (c.ruin) { c.ruin.ttl--; if (c.ruin.ttl <= 0) delete c.ruin; }
    }
    if (Math.random() < 0.2) {
      const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
      const c = ms.grid[y][x];
      if (c.type === 'normal' && !c.rift) {
        c.rift = { ttl: 3 };
        this.log(`传闻（${x+1},${y+1}）附近出现了一处<span style="color:#e67e22">秘境裂缝</span>！机不可失！`, 'loot');
      }
    }
    for (let i = 0; i < randInt(1, 3); i++) {
      const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
      const c = ms.grid[y][x];
      if (c.type === 'normal' && !c.herb) {
        c.herb = { ttl: 2 };
      }
    }
    if (Math.random() < 0.15) {
      const x = randInt(0, MAP_SIZE - 1), y = randInt(0, MAP_SIZE - 1);
      const c = ms.grid[y][x];
      if (c.type === 'normal' && !c.ruin) {
        c.ruin = { id: randInt(0, 4), step: 0, ttl: 5 };
        this.log(`传闻（${x+1},${y+1}）附近发现了一处<span style="color:#e67e22">上古遗迹</span>！`, 'loot');
      }
    }
  }

  spawnAvenger(victim) {
    const sectObj = getSectByName(victim.sect);
    if (!sectObj || victim.sect === '散修') return;
    if (!this.player.hunters) this.player.hunters = [];
    if (this.player.hunters.filter(h => h.sectId === sectObj.id).length >= 3) return;
    const ri = Math.min(victim.realmIndex + 1, REALMS.length - 1);
    const si = Math.min(victim.stageIndex + 1, REALMS[ri].stages.length - 1);
    this.player.hunters.push({ sectId: sectObj.id, sectName: sectObj.name, ri, si, turnsLeft: randInt(1, 2), wave: 1 });
    this.log(`${sectObj.name}已知悉此事，不日将有人前来报仇……`, 'danger');
  }

  hunterTick() {
    if (!this.player.hunters) this.player.hunters = [];
    const arrived = [];
    this.player.hunters = this.player.hunters.filter(h => {
      h.turnsLeft--;
      if (h.turnsLeft <= 0) { arrived.push(h); return false; }
      return true;
    });
    for (const h of arrived) {
      const avenger = this.generator.createRandomNPC(h.ri, {
        sect: h.sectName,
        realmIndex: h.ri, stageIndex: h.si,
        personality: randPick(['arrogant', 'righteous', 'sinister']),
      });
      avenger.changeRelation(this.player.id, -60);
      avenger.isPermanent = true;
      avenger.tempTurns = 3;
      this.memoryStore.add(avenger);
      this.placeNpcAtPlayer(avenger);
      this.log(`<span class="npc-name">${avenger.name}</span>（${h.sectName}·<span class="realm-text">${avenger.getRealmName()}</span>）前来为同门报仇！`, 'danger');
      if (h.wave < 3) {
        this.player.hunters.push({
          sectId: h.sectId, sectName: h.sectName,
          ri: Math.min(h.ri + 1, REALMS.length - 1),
          si: Math.min(h.si + 1, REALMS[Math.min(h.ri + 1, REALMS.length - 1)].stages.length - 1),
          turnsLeft: randInt(1, 3), wave: h.wave + 1
        });
      }
    }

    const infamy = this.player.infamy || 0;
    if (infamy >= 100 && Math.random() < 0.3) {
      const hunterRI = Math.min(this.player.realmIndex + 1, REALMS.length - 1);
      const hunter = this.generator.createRandomNPC(hunterRI, {
        sect: randPick(SECT_NAMES),
        realmIndex: hunterRI, stageIndex: randInt(0, REALMS[hunterRI].stages.length - 1),
        personality: 'righteous',
      });
      hunter.changeRelation(this.player.id, -50);
      hunter.isPermanent = true;
      hunter.tempTurns = 3;
      this.memoryStore.add(hunter);
      this.placeNpcAtPlayer(hunter);
      this.log(`赏金猎人<span class="npc-name">${hunter.name}</span>（<span class="realm-text">${hunter.getRealmName()}</span>）循你恶名而来！`, 'danger');
    }

    if (infamy > 0) this.player.infamy = Math.max(0, infamy - 3);
  }

  npcVisitTick() {
    const alive = this.memoryStore.getAlive().filter(n => !n.isMinor);
    for (const npc of alive) {
      const rel = npc.getRelation(this.player.id);
      const isOpp = npc.gender !== this.player.gender;
      const isBond = (this.player.bonds || []).includes(npc.id);
      const cat = getRelationCategory(rel, npc.isChild, npc.id);

      if (cat === 'enemy' && Math.random() < 0.15) {
        this.placeNpcAtPlayer(npc);
        npc.tempTurns = 3;
        this.log(`<span class="npc-name">${npc.name}</span>找上门来寻仇！「${this.player.name}，今日便是你的死期！」`, 'danger');
        continue;
      }

      if (rel < 30) continue;
      if (Math.random() > 0.2) continue;

      this.placeNpcAtPlayer(npc);
      npc.tempTurns = 3;

      if (rel >= 60 && isOpp && !npc.isChild && !npc.spouse && !isBond && Math.random() < 0.4) {
        this.log(`<span class="npc-name">${npc.name}</span>前来找你，深情款款：「你我相识已久……愿与你结为道侣，共证大道。你……意下如何？」`, 'pink');
        this.pendingProposal = { npc, type: 'couple' };
        this.showProposalChoices(npc, 'couple');
      } else if (rel >= 60 && !isOpp && !npc.isChild && !isBond && Math.random() < 0.3) {
        this.log(`<span class="npc-name">${npc.name}</span>前来拜访：「你我意气相投，不如义结金兰，如何？」`, 'success');
        this.pendingProposal = { npc, type: 'bond' };
        this.showProposalChoices(npc, 'bond');
      } else if (isBond && Math.random() < 0.5) {
        const gift = randInt(15, 50) * Math.max(1, npc.realmIndex);
        this.player.inventory.lingshi += gift;
        this.trackStat('lingshiEarned', gift);
        this.log(`<span class="npc-name">${npc.name}</span>前来探望你，带来了 ${gift} 灵石作为礼物。`, 'success');
      } else if (rel >= 30) {
        const r = Math.random();
        if (r < 0.3) {
          const expGain = randInt(5, 20);
          this.player.exp = Math.min(this.player.exp + expGain, REALMS[this.player.realmIndex].expPerStage);
          this.log(`<span class="npc-name">${npc.name}</span>来找你切磋论道，你受益匪浅。修为+${expGain}`, 'success');
        } else if (r < 0.6) {
          const heal = randInt(10, 30);
          this.player.hp = Math.min(this.player.hpMax, this.player.hp + heal);
          this.log(`<span class="npc-name">${npc.name}</span>来看望你：「最近可好？我带了些药材。」气血+${heal}`, 'success');
        } else {
          npc.changeRelation(this.player.id, randInt(3, 8));
          this.log(`<span class="npc-name">${npc.name}</span>路过此地，特来问候：「好久不见，别来无恙。」`, '');
        }
      }
    }
    for (const npc of alive) {
      const bonds = this.player.bonds || [];
      const isClose = bonds.includes(npc.id) || this.player.master === npc.id ||
        (this.player.disciples||[]).includes(npc.id) || npc.isChild || npc.motherNpcId;
      if (!isClose) continue;
      if (npc.lifeCurrent < npc.lifeMax * 0.2 && Math.random() < 0.3) {
        this.log(`<span class="npc-name">${npc.name}</span>传来消息：「我寿元将尽，恐时日无多……望你珍重。」`, 'danger');
      }
    }

    this.memoryStore.save();
    this.mapSystem.save();
  }

  doRescue(npc) {
    if (!npc || !npc.rescueTask) return;
    const rt = npc.rescueTask;
    this.log(`你赶到${npc.name}身边，准备${rt.desc}！`, 'system');

    if (rt.type === 'fight') {
      const enemyRI = Math.min(npc.realmIndex + 1, REALMS.length - 1);
      showScenePopup('combat', '援 救 ' + npc.name, 1500);
      this.startCombat('歹人', enemyRI, randInt(0, 2), randInt(5, 20),
        () => {
          npc.rescueTask = null;
          npc.changeRelation(this.player.id, 25);
          this.log(`你成功击退歹人！${npc.name}感激不尽：「多谢救命之恩！」好感+25`, 'success');
          this.updateHeader(); this.save(); this.showMainActions();
        },
        () => {
          npc.rescueTask = null;
          this.log(`你没能击退歹人，但${npc.name}趁机逃走了。`, '');
          npc.changeRelation(this.player.id, 10);
          if (this.player.hp > 0) { this.updateHeader(); this.save(); this.showMainActions(); }
        }
      );
    } else if (rt.type === 'pill') {
      const needed = getPillForBreakthrough(npc.realmIndex, npc.stageIndex);
      if (needed && (this.player.inventory.pills[needed.id] || 0) > 0) {
        this.player.inventory.pills[needed.id]--;
        npc.rescueTask = null;
        npc.changeRelation(this.player.id, 30);
        this.log(`你将${needed.name}交给${npc.name}。${npc.name}：「大恩不言谢！」好感+30`, 'success');
      } else {
        this.log(`${npc.name}需要${needed ? needed.name : '突破丹药'}，但你没有。`, 'system');
      }
      this.updateHeader(); this.save();
    } else if (rt.type === 'lingshi') {
      const cost = randInt(30, 100) * Math.max(1, npc.realmIndex);
      if (this.player.inventory.lingshi >= cost) {
        this.player.inventory.lingshi -= cost;
        npc.rescueTask = null;
        npc.changeRelation(this.player.id, 20);
        this.log(`你赠送${cost}灵石给${npc.name}。${npc.name}：「雪中送炭，此恩铭记！」好感+20`, 'success');
      } else {
        this.log(`${npc.name}需要约${cost}灵石，但你灵石不足。`, 'system');
      }
      this.updateHeader(); this.save();
    }
  }

  doTeachSkill(npcId, skillId) {
    const npc = this.memoryStore.getById(npcId);
    const sk = getSkillById(skillId);
    if (!npc || !sk) { this.showMainActions(); return; }
    npc.changeRelation(this.player.id, 20);
    this.log(`你将「${sk.name}」传授给${npc.name}。${npc.name}感激不尽：「多谢指点！」好感+20`, 'success');
    this.memoryStore.save(); this.save();
    this.showMainActions();
  }

  useHuixueDan() {
    if (this.player.inventory.huixuedan <= 0) return;
    if (this.player.hp >= this.player.hpMax) {
      this.log('气血已满，无需服用回血丹。', 'system');
      return;
    }
    this.player.inventory.huixuedan--;
    const heal = Math.floor(this.player.hpMax * 0.5);
    this.player.hp = Math.min(this.player.hpMax, this.player.hp + heal);
    this.log(`服用回血丹，恢复气血 +${heal}。（${this.player.hp}/${this.player.hpMax}）`, 'success');
    this.updateHeader(); this.save();
  }
}

// ========== UI ==========

let game = new Game();

function generateNameOptions() {
  const names = [], used = new Set();
  while (names.length < 4) { const n = randName(); if (!used.has(n)) { used.add(n); names.push(n); } }
  return names;
}

function renderNameOptions(names) {
  const c = document.getElementById('nameOptions');
  c.innerHTML = '';
  for (const name of names) {
    const btn = document.createElement('button');
    btn.className = 'name-btn';
    btn.textContent = name;
    btn.onclick = () => startGame(name);
    c.appendChild(btn);
  }
}

function refreshNames() { renderNameOptions(generateNameOptions()); }

let pendingName = '', pendingGender = '', pendingOrigin = null;

function startGame(name, gender) {
  if (!gender) {
    const r = document.querySelector('input[name="playerGender"]:checked');
    gender = r ? r.value : '男';
  }
  const saved = localStorage.getItem('xiuxian_player');
  if (saved) {
    document.getElementById('createScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    game.init(name, gender);
    return;
  }
  pendingName = name;
  pendingGender = gender;
  const choices = [];
  const used = new Set();
  while (choices.length < 3) {
    const o = randPick(ORIGINS);
    if (!used.has(o.id)) { used.add(o.id); choices.push(o); }
  }
  pendingOrigin = randPick(choices);
  document.getElementById('createScreen').classList.add('hidden');
  document.getElementById('originScreen').classList.remove('hidden');
  document.getElementById('originName').textContent = pendingOrigin.name;
  document.getElementById('originDesc').textContent = pendingOrigin.desc;
  document.getElementById('originEffects').textContent = pendingOrigin.effectDesc;
}

function confirmOrigin() {
  document.getElementById('originScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  game.init(pendingName, pendingGender, pendingOrigin.id);
}

// ===== 地图 =====
function showMap() {
  document.getElementById('mapModal').classList.add('show');
  renderMap();
}
function closeMap() { document.getElementById('mapModal').classList.remove('show'); }

function renderMap() {
  const grid = document.getElementById('mapGrid');
  grid.innerHTML = '';
  const ms = game.mapSystem;
  const moveRange = getMaxMoveRange(game.player.realmIndex);
  const reachable = ms.getReachable(ms.playerX, ms.playerY, moveRange);
  const reachSet = new Set(reachable.map(c => `${c.x},${c.y}`));

  const corner = document.createElement('div');
  corner.className = 'map-label';
  grid.appendChild(corner);
  for (let x = 0; x < MAP_SIZE; x++) {
    const lbl = document.createElement('div');
    lbl.className = 'map-label';
    lbl.textContent = x + 1;
    grid.appendChild(lbl);
  }

  for (let y = 0; y < MAP_SIZE; y++) {
    const rowLbl = document.createElement('div');
    rowLbl.className = 'map-label';
    rowLbl.textContent = y + 1;
    grid.appendChild(rowLbl);
    for (let x = 0; x < MAP_SIZE; x++) {
      const cell = ms.grid[y][x];
      const div = document.createElement('div');
      div.className = `map-cell qi-${cell.qi}`;
      if (cell.type === 'market') div.classList.add('market');
      if (cell.type === 'sect' && cell.sectId) {
        const s = getSectById(cell.sectId);
        if (s) {
          div.classList.add(s.type === '正' ? 'sect-good' : s.type === '邪' ? 'sect-evil' : 'sect-neutral');
          div.setAttribute('data-label', s.name[0]);
        }
      }
      if (cell.rift) div.classList.add('has-rift');
      if (cell.herb) div.classList.add('has-herb');
      if (cell.ruin) div.classList.add('has-ruin');
      if (x === ms.playerX && y === ms.playerY) div.classList.add('has-player');
      if (cell.npcIds && cell.npcIds.length) {
        const hasAlive = cell.npcIds.some(id => { const n = game.memoryStore.getById(id); return n && n.isAlive; });
        if (hasAlive) div.classList.add('has-npc');
      }
      if (reachSet.has(`${x},${y}`)) {
        div.classList.add('reachable');
        div.onclick = () => game.movePlayer(x, y);
      }
      grid.appendChild(div);
    }
  }

  const curCell = ms.getCell(ms.playerX, ms.playerY);
  const locDesc = curCell.type === 'market' ? '坊市' : `灵气：${QI_NAMES[curCell.qi]}（x${QI_MULT[curCell.qi]}）`;
  document.getElementById('mapInfo').innerHTML = `<strong>当前位置（${ms.playerX+1},${ms.playerY+1}）</strong>　<em>${locDesc}</em>　可行 ${moveRange} 格`;
}

// ===== 记忆录 =====
function showMemory() {
  setQuickNavActive('memory');
  document.getElementById('menuDropdown').classList.remove('show');
  const body = document.getElementById('memoryBody');
  const all = game.memoryStore.getAll();
  if (!all.length) {
    body.innerHTML = '<p class="empty-text">尚无记录。<br>与人交往，结下羁绊后将会留下印记。</p>';
  } else {
    body.innerHTML = '';
    const sorted = [...all].sort((a, b) => b.getRelation(game.player.id) - a.getRelation(game.player.id));
    for (const npc of sorted) {
      const rel = npc.getRelation(game.player.id);
      const isOpp = npc.gender !== game.player.gender;
      const label = getRelationLabel(rel, isOpp, npc.isChild, npc.id);
      const cat = getRelationCategory(rel, npc.isChild, npc.id);
      let rc = '';
      if (cat === 'enemy') rc = 'relation-enemy';
      else if (cat === 'friend') rc = 'relation-friend';
      else if (cat === 'soulmate') rc = 'relation-soulmate';
      else if (cat === 'blood') rc = 'relation-blood';
      const isBond = (game.player.bonds || []).includes(npc.id);
      const isMinor = npc.age !== null && npc.age < 20;
      let statusTag = '';
      if (!npc.isAlive) statusTag = '（已陨落）';
      else if (npc.role === 'concubine') statusTag = game.player.gender === '男' ? '【侍妾·跟随中】' : '【男宠·跟随中】';
      else if (npc.role === 'puppet') statusTag = '【傀儡·跟随中】';
      else if (isMinor) statusTag = `（幼年·${Math.floor(npc.age)}岁·跟随母亲）`;
      else if (npc.pregnant) statusTag = `（有孕在身·还有${npc.pregnant.turnsLeft}回合）`;
      else if (game.player.master === npc.id) statusTag = '【师父】';
      else if ((game.player.disciples||[]).includes(npc.id)) statusTag = '【徒弟】';
      else if (isBond && npc.spouse === '__player__') statusTag = '【道侣】';
      else if (isBond && !npc.isChild) statusTag = isOpp ? '【义兄妹】' : `【结拜${game.player.gender === '男' ? '兄弟' : '姐妹'}】`;
      else if (npc.spouse) { const sp = game.memoryStore.getById(npc.spouse); statusTag = sp ? `（道侣：${sp.name}）` : ''; }

      const card = document.createElement('div');
      card.className = 'npc-card' + (npc.isAlive ? '' : ' dead');
      card.style.cursor = (npc.isAlive && !isMinor) ? 'pointer' : 'default';
      card.innerHTML = `
        <div class="npc-card-main">
          <div class="npc-card-avatar">${renderNpcPaperDoll(npc)}</div>
          <div class="npc-card-copy">
            <div class="name">${npc.name} (${npc.gender}) ${statusTag}</div>
            <div class="info">${npc.sect} · ${isMinor ? '尚未修炼' : npc.getRealmName()} · ${PERSONALITIES[npc.personality].name}</div>
            <div class="relation ${rc}">${label}（好感度：${rel}）</div>
          </div>
        </div>
        ${isMinor ? '' : `<div class="npc-actions hidden" id="npcAct_${npc.id}"></div>`}
      `;
      if (npc.isAlive && !isMinor) {
        card.onclick = (e) => { if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return; toggleNpcActions(npc.id); };
      }
      body.appendChild(card);
    }
  }
  document.getElementById('memoryModal').classList.add('show');
}

function toggleNpcActions(npcId) {
  const el = document.getElementById('npcAct_' + npcId);
  if (!el) return;
  if (!el.classList.contains('hidden')) { el.classList.add('hidden'); return; }
  document.querySelectorAll('.npc-actions').forEach(e => e.classList.add('hidden'));
  el.classList.remove('hidden');
  const npc = game.memoryStore.getById(npcId);
  if (!npc) return;
  const rel = npc.getRelation(game.player.id);
  const isOpp = npc.gender !== game.player.gender;
  const isBond = (game.player.bonds || []).includes(npc.id);
  let btns = '';
  const xzCount = game.player.inventory.xunzongfu || 0;
  btns += `<button class="btn btn-sm" onclick="npcAction('${npcId}','locate')"${xzCount <= 0 ? ' disabled' : ''}>寻踪(${xzCount})</button>`;
  if (rel >= 30) btns += `<button class="btn btn-sm" onclick="npcAction('${npcId}','askHelp')">求助</button>`;
  if (rel >= 60 && !isBond && !isOpp && !npc.isChild) btns += `<button class="btn btn-sm" onclick="npcAction('${npcId}','bond')">请求结拜</button>`;
  if (rel >= 60 && !isBond && isOpp && !npc.isChild) btns += `<button class="btn btn-sm btn-pink" onclick="npcAction('${npcId}','propose')">请求结为道侣</button>`;
  const sameCell = npc.mapX === game.mapSystem.playerX && npc.mapY === game.mapSystem.playerY;
  if (npc.spouse === '__player__' && !npc.isChild && sameCell) btns += `<button class="btn btn-sm btn-pink" onclick="npcAction('${npcId}','dual')">双修</button>`;
  if (rel >= 30) btns += `<button class="btn btn-sm" onclick="npcAction('${npcId}','sendGift')">赠礼</button>`;
  if (rel >= 30 && (game.player.skills||[]).length) btns += `<button class="btn btn-sm" style="border-color:var(--blue);color:var(--blue)" onclick="npcAction('${npcId}','teachSkill')">传授功法</button>`;
  const isMaster = game.player.master === npcId;
  const isDisciple = (game.player.disciples||[]).includes(npcId);
  const npcHigher = getRealmDiff(npc.realmIndex, npc.stageIndex, game.player.realmIndex, game.player.stageIndex) === 'higher';
  const npcLower = getRealmDiff(npc.realmIndex, npc.stageIndex, game.player.realmIndex, game.player.stageIndex) === 'lower';
  if (!isMaster && !isDisciple && !game.player.master && npcHigher && rel >= 30 && !npc.isChild) btns += `<button class="btn btn-sm" style="border-color:var(--gold);color:var(--gold)" onclick="npcAction('${npcId}','apprentice')">拜师</button>`;
  if (!isMaster && !isDisciple && npcLower && rel >= 30 && !npc.isChild) btns += `<button class="btn btn-sm" style="border-color:var(--gold);color:var(--gold)" onclick="npcAction('${npcId}','recruit')">收徒</button>`;
  if (rel <= -30) btns += `<button class="btn btn-sm" style="border-color:var(--red);color:var(--red)" onclick="npcAction('${npcId}','hunt')">追杀</button>`;
  el.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${btns}</div>`;
}

function npcAction(npcId, action) {
  const npc = game.memoryStore.getById(npcId);
  if (!npc || !npc.isAlive) return;
  const p = game.player;

  if (action === 'locate') {
    if ((p.inventory.xunzongfu || 0) <= 0) {
      game.log('你没有寻踪符，无法定位。可在坊市购买或探索获得。', 'system');
      closeMemory(); return;
    }
    p.inventory.xunzongfu--;
    game.placeNpcOnMap(npc);
    npc.tempTurns = 3;
    let found = false;
    for (let y = 0; y < MAP_SIZE; y++)
      for (let x = 0; x < MAP_SIZE; x++)
        if ((game.mapSystem.grid[y][x].npcIds||[]).includes(npcId)) {
          game.log(`寻踪符燃起，你感应到${npc.name}在（${x+1},${y+1}）！（地图上停留3回合）`, 'system');
          found = true;
        }
    if (!found) game.log(`寻踪符失效，定位失败。`, 'system');
    game.mapSystem.save(); game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'askHelp') {
    if (npc.lastHelped) { game.log(`${npc.name}：「最近已经帮过你了，过段时间再来吧。」`, ''); closeMemory(); return; }
    const gift = Math.random() < 0.5;
    if (gift) {
      const amount = randInt(20, 60) * Math.max(1, npc.realmIndex);
      p.inventory.lingshi += amount;
      game.trackStat('lingshiEarned', amount);
      game.log(`${npc.name}慷慨赠你 ${amount} 灵石：「拿去用吧。」`, 'success');
    } else {
      const maxR = Math.min(npc.realmIndex + 1, 7);
      const avail = PILLS.filter(pp => pp.forRealm <= maxR);
      if (avail.length) {
        const dp = randPick(avail);
        p.inventory.pills[dp.id] = (p.inventory.pills[dp.id] || 0) + 1;
        game.log(`${npc.name}递给你一颗<span class="npc-name">${dp.name}</span>：「或许对你有用。」`, 'loot');
      } else {
        const amount = randInt(30, 80);
        p.inventory.lingshi += amount;
        game.log(`${npc.name}赠你 ${amount} 灵石。`, 'success');
      }
    }
    npc.lastHelped = true;
    game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'bond') {
    const rel = npc.getRelation(p.id);
    const acceptChance = Math.min(0.9, (rel - 30) / 60 + 0.3);
    if (Math.random() < acceptChance) {
      if (!p.bonds) p.bonds = [];
      p.bonds.push(npc.id);
      npc.changeRelation(p.id, 20);
      game.log(`${npc.name}欣然应允：「好！你我义结金兰，从此有福同享有难同当！」`, 'pink');
    } else {
      npc.changeRelation(p.id, -5);
      game.log(`${npc.name}婉拒了你：「承蒙厚爱，但在下觉得时机尚未成熟……」`, '');
    }
    game.memoryStore.save(); game.save();
    closeMemory();
  } else if (action === 'propose') {
    const rel = npc.getRelation(p.id);
    const acceptChance = Math.min(0.85, (rel - 40) / 50 + 0.2);
    if (Math.random() < acceptChance) {
      if (!p.bonds) p.bonds = [];
      p.bonds.push(npc.id);
      npc.spouse = '__player__';
      npc.changeRelation(p.id, 30);
      game.log(`${npc.name}双颊绯红：「你……你说的是真的吗？我……我愿意。」`, 'pink');
      game.log(`【${npc.name}成为你的道侣】`, 'pink');
    } else {
      npc.changeRelation(p.id, -3);
      game.log(`${npc.name}低头不语：「抱歉……我还没有做好准备。」`, '');
    }
    game.memoryStore.save(); game.save();
    closeMemory();
  } else if (action === 'dual') {
    showScenePopup('dual', '双 修', 2000);
    game.worldTick(1);
    if (game.isDead) { closeMemory(); return; }
    const baseExp = randInt(40, 100);
    const expGain = Math.floor(baseExp * (1 + p.realmIndex * 0.3));
    const hpGain = Math.floor(p.hpMax * 0.2);
    const lifeGain = randInt(2, 5);
    p.exp = Math.min(p.exp + expGain, REALMS[p.realmIndex].expPerStage);
    p.hp = Math.min(p.hpMax, p.hp + hpGain);
    p.lifeCurrent += lifeGain;
    npc.changeRelation(p.id, 15);
    const REMOTE_DUAL = [
      `你遥感${npc.name}的气息，二人虽相隔甚远，灵力却跨越空间交融。你仿佛听到${npc.name}在耳畔低语："想你了……"一股温暖涌遍全身。`,
      `你闭目凝神，与${npc.name}心意相通。对方的灵力如潮水般涌来，温柔而绵密。你感到${npc.name}的思念与爱意化作修为，令你境界大进。`,
      `冥冥之中，你与${npc.name}的神识交汇。${npc.name}的声音在脑海中响起："我在修炼时也总想着你……"阴阳灵力共振，你们的修为同时突破了一个小瓶颈。`,
    ];
    game.log(randPick(REMOTE_DUAL), 'pink');
    game.log(`修为+${expGain}，气血+${hpGain}，寿元+${lifeGain}。`, 'pink');
    if (!isMaxRealm(npc.realmIndex, npc.stageIndex)) {
      const npcExp = Math.floor(expGain * 0.6);
      npc.exp = Math.min((npc.exp || 0) + npcExp, REALMS[npc.realmIndex].expPerStage);
      if (canBreakthrough(npc) && Math.random() < REALMS[npc.realmIndex].breakChance) {
        npc.stageIndex++; npc.exp = 0;
        if (npc.stageIndex >= REALMS[npc.realmIndex].stages.length) {
          npc.stageIndex = 0; npc.realmIndex++;
          npc.lifeMax = REALMS[npc.realmIndex].lifeMax;
          npc.lifeCurrent += Math.floor(REALMS[npc.realmIndex].lifeMax * 0.4);
          npc.hpMax = REALMS[npc.realmIndex].hpMax;
        }
        game.log(`${npc.name}修为精进，突破至<span class="realm-text">${npc.getRealmName()}</span>！`, 'pink');
      }
    }
    game.memoryStore.save(); game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'sendGift') {
    const cost = randInt(30, 80) * Math.max(1, game.player.realmIndex);
    if (p.inventory.lingshi < cost) { game.log(`灵石不足（需${cost}）。`, 'system'); closeMemory(); return; }
    p.inventory.lingshi -= cost;
    npc.changeRelation(p.id, randInt(15, 25));
    game.log(`你向${npc.name}赠送了价值${cost}灵石的礼物，好感大增。`, 'success');
    game.memoryStore.save(); game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'teachSkill') {
    const pSkills = p.skills || [];
    if (!pSkills.length) { game.log('你尚未习得功法。', 'system'); closeMemory(); return; }
    closeMemory();
    game.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    let html = '<div style="color:var(--blue);font-size:13px;margin-bottom:6px">选择要传授的功法：</div>';
    for (const sid of pSkills) {
      const sk = getSkillById(sid);
      if (!sk) continue;
      html += `<button class="btn btn-reply" style="margin-bottom:4px;display:block;width:100%" onclick="game.doTeachSkill('${npcId}','${sid}')">${sk.name}（${sk.grade}阶·威力${sk.power}）</button>`;
    }
    html += `<button class="btn btn-reply" style="margin-top:4px;display:block;width:100%" onclick="game.showMainActions()">取消</button>`;
    container.innerHTML = html;
    game.inEncounter = true;
    return;
  } else if (action === 'apprentice') {
    const rel = npc.getRelation(p.id);
    const acceptChance = Math.min(0.8, (rel - 20) / 60 + 0.3);
    if (Math.random() < acceptChance) {
      p.master = npc.id;
      npc.changeRelation(p.id, 30);
      npc.masterNpcId = '__isMaster__';
      game.log(`你向${npc.name}行三跪九叩之礼。${npc.name}微笑颔首：「起来吧，从今往后你便是我的弟子。」`, 'success');
      game.log(`【拜${npc.name}为师】修炼时获得师父指点加成`, 'system');
      if (npc.sect && npc.sect !== '散修' && !p.sect) {
        const sectObj = getSectByName(npc.sect);
        if (sectObj) { p.sect = sectObj.id; game.log(`师父将你引入${npc.sect}门下。`, 'system'); }
      }
    } else {
      npc.changeRelation(p.id, -3);
      game.log(`${npc.name}摇了摇头：「你资质尚可，但缘分未到。日后再说吧。」`, '');
    }
    game.memoryStore.save(); game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'recruit') {
    const rel = npc.getRelation(p.id);
    const acceptChance = Math.min(0.85, (rel - 10) / 50 + 0.4);
    if (Math.random() < acceptChance) {
      if (!p.disciples) p.disciples = [];
      p.disciples.push(npc.id);
      npc.masterNpcId = '__player__';
      npc.changeRelation(p.id, 30);
      game.log(`${npc.name}恭敬地行了大礼：「多谢师父收留！弟子定当勤勉修行！」`, 'success');
      game.log(`【收${npc.name}为徒】`, 'system');
    } else {
      game.log(`${npc.name}犹豫了一下：「多谢前辈好意，但在下暂时不想拜师。」`, '');
    }
    game.memoryStore.save(); game.updateHeader(); game.save();
    closeMemory();
  } else if (action === 'hunt') {
    if ((p.inventory.xunzongfu || 0) <= 0) {
      game.log('你没有寻踪符，无法追踪仇人。可在坊市购买或探索获得。', 'system');
      closeMemory(); return;
    }
    p.inventory.xunzongfu--;
    game.placeNpcOnMap(npc);
    npc.tempTurns = 3;
    let found = false;
    for (let y = 0; y < MAP_SIZE; y++)
      for (let x = 0; x < MAP_SIZE; x++)
        if ((game.mapSystem.grid[y][x].npcIds||[]).includes(npcId)) {
          game.log(`寻踪符锁定仇人！${npc.name}在（${x+1},${y+1}）！前去了结恩怨吧！（3回合内有效）`, 'danger');
          found = true;
        }
    if (!found) game.log('寻踪符失效，定位失败。', 'system');
    game.mapSystem.save(); game.updateHeader(); game.save();
    closeMemory();
  }
}

function closeMemory() { document.getElementById('memoryModal').classList.remove('show'); setQuickNavActive(); }

function switchMemTab(tab) {
  document.getElementById('memoryBody').classList.toggle('hidden', tab !== 'list');
  document.getElementById('memoryGraph').classList.toggle('hidden', tab !== 'graph');
  document.getElementById('memTabList').style.borderColor = tab === 'list' ? 'var(--gold)' : '';
  document.getElementById('memTabGraph').style.borderColor = tab === 'graph' ? 'var(--gold)' : '';
  const modal = document.getElementById('memoryModal').querySelector('.modal');
  if (tab === 'graph') {
    modal.classList.add('graph-mode');
    requestAnimationFrame(() => { drawRelationGraph(); initGraphInteraction(); });
  } else {
    modal.classList.remove('graph-mode');
  }
}

const _graphState = { panX: 0, panY: 0, scale: 1, dragging: false, lastX: 0, lastY: 0, pinchDist: 0 };

function initGraphInteraction() {
  const vp = document.getElementById('memoryGraph');
  const canvas = document.getElementById('relationCanvas');
  const gs = _graphState;
  gs.scale = 0.6;
  gs.panX = (vp.clientWidth - canvas.width * gs.scale) / 2;
  gs.panY = (vp.clientHeight - canvas.height * gs.scale) / 2;
  applyGraphTransform();

  vp.onmousedown = (e) => { gs.dragging = true; gs.lastX = e.clientX; gs.lastY = e.clientY; };
  vp.onmousemove = (e) => { if (!gs.dragging) return; gs.panX += e.clientX - gs.lastX; gs.panY += e.clientY - gs.lastY; gs.lastX = e.clientX; gs.lastY = e.clientY; applyGraphTransform(); };
  vp.onmouseup = vp.onmouseleave = () => { gs.dragging = false; };

  vp.onwheel = (e) => { e.preventDefault(); const d = e.deltaY > 0 ? 0.9 : 1.1; gs.scale = Math.max(0.2, Math.min(3, gs.scale * d)); applyGraphTransform(); };

  vp.ontouchstart = (e) => {
    if (e.touches.length === 1) { gs.dragging = true; gs.lastX = e.touches[0].clientX; gs.lastY = e.touches[0].clientY; }
    else if (e.touches.length === 2) { gs.dragging = false; gs.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
  };
  vp.ontouchmove = (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && gs.dragging) { gs.panX += e.touches[0].clientX - gs.lastX; gs.panY += e.touches[0].clientY - gs.lastY; gs.lastX = e.touches[0].clientX; gs.lastY = e.touches[0].clientY; applyGraphTransform(); }
    else if (e.touches.length === 2) {
      const nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (gs.pinchDist > 0) { gs.scale = Math.max(0.2, Math.min(3, gs.scale * (nd / gs.pinchDist))); applyGraphTransform(); }
      gs.pinchDist = nd;
    }
  };
  vp.ontouchend = () => { gs.dragging = false; gs.pinchDist = 0; };
}

function applyGraphTransform() {
  const canvas = document.getElementById('relationCanvas');
  const gs = _graphState;
  canvas.style.transform = `translate(${gs.panX}px,${gs.panY}px) scale(${gs.scale})`;
}

function drawRelationGraph() {
  const canvas = document.getElementById('relationCanvas');
  const ctx = canvas.getContext('2d');
  const all = game.memoryStore.getAll().filter(n => n.isAlive || n.isPermanent);

  const p = game.player;
  const bonds = p.bonds || [], concubines = p.concubines || [], puppets = p.puppets || [];
  const usedIds = new Set();

  const masterNpc = p.master ? all.find(n => n.id === p.master) : null;
  const spouses = all.filter(n => n.spouse === '__player__');
  const concNpcs = all.filter(n => concubines.includes(n.id) && !spouses.find(s => s.id === n.id));
  const discipleNpcs = all.filter(n => (p.disciples || []).includes(n.id));
  const puppetNpcs = all.filter(n => puppets.includes(n.id));
  const bondNpcs = all.filter(n => bonds.includes(n.id) && !spouses.find(s => s.id === n.id)
    && !concubines.includes(n.id) && n.id !== p.master && !(p.disciples||[]).includes(n.id));

  if (masterNpc) usedIds.add(masterNpc.id);
  for (const s of spouses) usedIds.add(s.id);
  for (const c of concNpcs) usedIds.add(c.id);
  for (const d of discipleNpcs) usedIds.add(d.id);
  for (const pp of puppetNpcs) usedIds.add(pp.id);
  for (const b of bondNpcs) usedIds.add(b.id);

  const childrenOf = {};
  for (const n of all) {
    if (n.isChild || n.motherNpcId) {
      const parentId = n.motherNpcId || '__player__';
      if (!childrenOf[parentId]) childrenOf[parentId] = [];
      childrenOf[parentId].push(n);
      usedIds.add(n.id);
    }
  }

  const others = all.filter(n => !usedIds.has(n.id));
  const friends = others.filter(n => n.getRelation(p.id) >= 30);
  const enemies = others.filter(n => n.getRelation(p.id) <= -30);
  const neutrals = others.filter(n => { const r = n.getRelation(p.id); return r > -30 && r < 30; });

  const NR = 20, COLS = 4, CELL = 80;
  const nodes = [], edges = [], groupLabels = [];

  function mkNode(id, name, x, y, color, label, alive) {
    const n = { id, name, x, y, color: alive === false ? '#555' : color, r: id === 'player' ? 26 : NR, label: label || '', dead: alive === false };
    nodes.push(n); return n;
  }
  function mkEdge(a, b, color, label) { edges.push({ a, b, color, label: label || '' }); }

  const cx = 600, cy = 500;
  const pn = mkNode('player', p.name, cx, cy, '#d4a853', p.sect ? (getSectById(p.sect)||{}).name||'' : '', true);

  // === UPPER: master ===
  if (masterNpc) {
    const mn = mkNode(masterNpc.id, masterNpc.name, cx, cy - 130, '#d4a853', '师父', masterNpc.isAlive);
    mkEdge(pn, mn, '#d4a853', '师父');
  }

  // === RIGHT: spouses + concubines ===
  const familyList = [...spouses.map(s => ({ npc: s, type: 'spouse' })), ...concNpcs.map(c => ({ npc: c, type: 'conc' }))];
  for (let i = 0; i < familyList.length; i++) {
    const f = familyList[i];
    const fx = cx + 140 + i * 110;
    const fy = cy - 20 + i * 40;
    const label = f.type === 'spouse' ? '道侣' : (p.gender === '男' ? '侍妾' : '男宠');
    const color = f.type === 'spouse' ? '#e91e63' : '#e67e22';
    const fn = mkNode(f.npc.id, f.npc.name, fx, fy, color, label, f.npc.isAlive);
    mkEdge(pn, fn, color, label);
    const kids = childrenOf[f.npc.id] || [];
    for (let ki = 0; ki < kids.length; ki++) {
      const k = kids[ki];
      const kn = mkNode(k.id, k.name, fx + (ki - (kids.length - 1) / 2) * 70, fy + 80, '#e91e63', k.gender === '男' ? '子' : '女', k.isAlive);
      mkEdge(fn, kn, '#e91e63');
    }
  }
  const orphans = (childrenOf['__player__'] || []).filter(k => !nodes.find(n => n.id === k.id));
  for (let i = 0; i < orphans.length; i++) {
    const k = orphans[i];
    const kn = mkNode(k.id, k.name, cx + 140 + familyList.length * 110 + i * 70, cy + 60, '#e91e63', k.gender === '男' ? '子' : '女', k.isAlive);
    mkEdge(pn, kn, '#e91e63');
  }

  // === LEFT: bonds ===
  for (let i = 0; i < bondNpcs.length; i++) {
    const b = bondNpcs[i];
    const bn = mkNode(b.id, b.name, cx - 140 - i * 110, cy - 20 + i * 40, '#27ae60', '结拜', b.isAlive);
    mkEdge(pn, bn, '#27ae60', '结拜');
  }

  // === LOWER-LEFT: disciples ===
  for (let i = 0; i < discipleNpcs.length; i++) {
    const d = discipleNpcs[i];
    const dn = mkNode(d.id, d.name, cx - 100 - i * 90, cy + 130, '#d4a853', '徒弟', d.isAlive);
    mkEdge(pn, dn, '#d4a853', '徒弟');
  }

  // === LOWER-RIGHT: puppets ===
  for (let i = 0; i < puppetNpcs.length; i++) {
    const pp = puppetNpcs[i];
    const ppn = mkNode(pp.id, pp.name, cx + 100 + i * 90, cy + 130, '#9b59b6', '傀儡', pp.isAlive);
    mkEdge(pn, ppn, '#9b59b6', '傀儡');
  }

  // === OUTER: grid clusters for friends / enemies / neutrals ===
  function placeCluster(npcs, startX, startY, color, title, relFn) {
    if (!npcs.length) return;
    groupLabels.push({ text: title, x: startX, y: startY - 20, color: color });
    for (let i = 0; i < npcs.length; i++) {
      const col = i % COLS, row = Math.floor(i / COLS);
      const nx = startX + col * CELL;
      const ny = startY + row * CELL;
      const rel = relFn ? relFn(npcs[i]) : 0;
      const relStr = rel !== 0 ? `${rel >= 0 ? '+' : ''}${rel}` : '';
      const nn = mkNode(npcs[i].id, npcs[i].name, nx, ny, color, relStr, npcs[i].isAlive);
      mkEdge(pn, nn, color + '44');
    }
  }

  const innerBottom = cy + 130 + (discipleNpcs.length || puppetNpcs.length ? 80 : 0);
  const innerRight = cx + 140 + Math.max(familyList.length, 1) * 110 + 60;
  const innerLeft = cx - 140 - Math.max(bondNpcs.length, 0) * 110 - 60;
  const relFn = (n) => n.getRelation(p.id);

  placeCluster(friends, innerLeft - (friends.length > COLS ? COLS : friends.length) * CELL / 2, cy - 250, '#27ae60', '— 好友 —', relFn);
  placeCluster(enemies, innerRight, cy - 250, '#c0392b', '— 仇敌 —', relFn);
  placeCluster(neutrals, cx - (Math.min(neutrals.length, COLS)) * CELL / 2, innerBottom + 40, '#777', '— 泛泛之交 —', relFn);

  // === Compute canvas size ===
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of nodes) {
    minX = Math.min(minX, n.x - 60); maxX = Math.max(maxX, n.x + 60);
    minY = Math.min(minY, n.y - 60); maxY = Math.max(maxY, n.y + 60);
  }
  for (const gl of groupLabels) { minX = Math.min(minX, gl.x - 20); minY = Math.min(minY, gl.y - 10); }
  const pad = 40;
  const W = Math.max(800, maxX - minX + pad * 2);
  const H = Math.max(600, maxY - minY + pad * 2);
  const offX = -minX + pad, offY = -minY + pad;
  for (const n of nodes) { n.x += offX; n.y += offY; }
  for (const gl of groupLabels) { gl.x += offX; gl.y += offY; }
  canvas.width = W; canvas.height = H;
  ctx.clearRect(0, 0, W, H);

  // === Draw edges ===
  for (const e of edges) {
    ctx.beginPath();
    ctx.strokeStyle = e.color; ctx.lineWidth = 1.2;
    ctx.setLineDash([]);
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    ctx.moveTo(e.a.x + dx / dist * e.a.r, e.a.y + dy / dist * e.a.r);
    ctx.lineTo(e.b.x - dx / dist * e.b.r, e.b.y - dy / dist * e.b.r);
    ctx.stroke();
    if (e.label) {
      const mx = (e.a.x + e.b.x) / 2, my = (e.a.y + e.b.y) / 2;
      ctx.fillStyle = e.color; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(e.label, mx, my - 10);
    }
  }

  // === Draw group labels ===
  for (const gl of groupLabels) {
    ctx.fillStyle = gl.color; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(gl.text, gl.x + COLS * CELL / 2 - CELL / 2, gl.y);
  }

  // === Draw nodes ===
  for (const n of nodes) {
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = n.id === 'player' ? '#1a1510' : '#12121e';
    ctx.fill();
    ctx.strokeStyle = n.color; ctx.lineWidth = n.id === 'player' ? 3 : 2;
    ctx.stroke();

    if (n.id === 'player') {
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = '#d4a85344'; ctx.lineWidth = 1; ctx.stroke();
    }

    ctx.fillStyle = n.dead ? '#666' : n.color;
    ctx.font = `bold ${n.id === 'player' ? 14 : 11}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.name.length > 3 ? n.name.slice(0, 3) : n.name, n.x, n.y);

    if (n.label) {
      ctx.fillStyle = n.dead ? '#555' : '#9a8e7a';
      ctx.font = '10px sans-serif';
      ctx.fillText(n.label, n.x, n.y + n.r + 12);
    }

    if (n.dead) {
      ctx.strokeStyle = '#c0392b55'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(n.x - n.r, n.y); ctx.lineTo(n.x + n.r, n.y); ctx.stroke();
    }
  }

  const gs = _graphState;
  const vp = document.getElementById('memoryGraph');
  gs.panX = (vp.clientWidth - W * gs.scale) / 2;
  gs.panY = (vp.clientHeight - H * gs.scale) / 2;
  applyGraphTransform();
}

function showNpcHere() {
  const cell = game.mapSystem.getCell(game.mapSystem.playerX, game.mapSystem.playerY);
  if (!cell || !cell.npcIds || !cell.npcIds.length) return;
  const npcs = cell.npcIds.map(id => game.memoryStore.getById(id)).filter(n => n && n.isAlive);
  if (!npcs.length) return;
  if (npcs.length === 1) {
    talkToNpc(npcs[0]);
  } else {
    game.hideAllActions();
    const container = document.getElementById('dialogueActions');
    container.classList.remove('hidden');
    let html = '<div style="color:var(--text-dim);font-size:13px;margin-bottom:6px">此处有多人，选择交流对象：</div>';
    for (const npc of npcs) {
      html += `<button class="btn btn-reply" style="margin-bottom:6px;display:block;width:100%" onclick="talkToNpc(game.memoryStore.getById('${npc.id}'))">${npc.name}（${npc.sect}·${npc.getRealmName()}）</button>`;
    }
    container.innerHTML = html;
    game.inEncounter = true;
  }
}

function talkToNpc(npc) {
  if (!npc || !npc.isAlive) return;
  game.currentNPC = npc;
  const pName = PERSONALITIES[npc.personality].name;
  const rel = npc.getRelation(game.player.id);
  const relLabel = getRelationLabel(rel, npc.gender !== game.player.gender, npc.isChild, npc.id);
  game.log(`你上前与<span class="npc-name">${npc.name}</span>（${npc.gender}）搭话。`, '');
  game.log(`「${npc.sect}」· <span class="realm-text">${npc.getRealmName()}</span> · ${pName}（${relLabel}）`, '');
  const dialogue = game.dialogueEngine.getDialogue(npc, game.player);
  game.log(`<span class="npc-name">${npc.name}</span>：<span class="dialogue">"${dialogue}"</span>`);
  _aiChatHistory = [];
  _aiChatNpcId = npc.id;
  _aiChatHistory.push({ role: 'assistant', content: dialogue });
  game.showDialogueOptions(npc);
}

// ===== 坊市 =====
let _marketTab = 'pill';

function fmtPrice(v) { return v >= 10000 ? (v/10000).toFixed(v%10000?1:0)+'万' : String(v); }

function showMarket(tab) {
  if (tab) _marketTab = tab;
  const body = document.getElementById('marketBody');
  body.innerHTML = '';
  const p = game.player;

  document.getElementById('marketLingshi').textContent = `灵石 ${p.inventory.lingshi}`;
  document.querySelectorAll('.market-tab').forEach(b => {
    b.style.borderColor = b.dataset.tab === _marketTab ? 'var(--gold)' : '';
  });

  if (_marketTab === 'pill') renderMarketPill(body, p);
  else if (_marketTab === 'skill') renderMarketSkill(body, p);
  else if (_marketTab === 'sell') renderMarketSell(body, p);
  else if (_marketTab === 'bounty') renderMarketBounty(body, p);

  document.getElementById('marketModal').classList.add('show');
}

function renderMarketPill(body, p) {
  const shopPills = PILLS.filter(pill => pill.forRealm <= p.realmIndex + 1);
  for (const pill of shopPills) {
    const div = document.createElement('div');
    div.className = 'shop-item';
    const owned = p.inventory.pills[pill.id] || 0;
    div.innerHTML = `<div class="item-info"><div class="item-name">${pill.name}${owned > 0 ? ` (已有${owned})` : ''}</div><div class="item-desc">${pill.desc}${pill.rarity >= 5 ? ' · 稀有' : ''}${pill.rarity >= 7 ? '!' : ''}</div></div>`;
    const btn = document.createElement('button');
    btn.className = 'btn btn-sm';
    btn.textContent = `${fmtPrice(pill.price)}石`;
    btn.disabled = p.inventory.lingshi < pill.price;
    btn.onclick = () => {
      p.inventory.lingshi -= pill.price;
      p.inventory.pills[pill.id] = (p.inventory.pills[pill.id] || 0) + 1;
      game.log(`购买了<span class="npc-name">${pill.name}</span>，花费 ${pill.price} 灵石。`, 'loot');
      game.updateHeader(); game.save(); showMarket();
    };
    div.appendChild(btn);
    body.appendChild(div);
  }
  if (PILLS.length > shopPills.length) {
    const hint = document.createElement('div');
    hint.style.cssText = 'color:var(--text-dim);font-size:11px;text-align:center;padding:6px 0';
    hint.textContent = '更高阶丹药需提升境界后解锁';
    body.appendChild(hint);
  }

  const hxDiv = document.createElement('div');
  hxDiv.className = 'shop-item';
  const hxOwned = p.inventory.huixuedan || 0;
  hxDiv.innerHTML = `<div class="item-info"><div class="item-name">${HUIXUE_PILL.name}${hxOwned > 0 ? ` (已有${hxOwned})` : ''}</div><div class="item-desc">${HUIXUE_PILL.desc}</div></div>`;
  const hxBtn = document.createElement('button');
  hxBtn.className = 'btn btn-sm';
  hxBtn.textContent = `${HUIXUE_PILL.price}石`;
  hxBtn.disabled = p.inventory.lingshi < HUIXUE_PILL.price;
  hxBtn.onclick = () => {
    p.inventory.lingshi -= HUIXUE_PILL.price;
    const heal = Math.floor(p.hpMax * 0.5);
    p.hp = Math.min(p.hpMax, p.hp + heal);
    game.log(`购买并服用<span class="npc-name">${HUIXUE_PILL.name}</span>，恢复气血 +${heal}。（${p.hp}/${p.hpMax}）`, 'success');
    game.updateHeader(); game.save(); showMarket();
  };
  hxDiv.appendChild(hxBtn);
  body.appendChild(hxDiv);

  const xzDiv = document.createElement('div');
  xzDiv.className = 'shop-item';
  const xzOwned = p.inventory.xunzongfu || 0;
  xzDiv.innerHTML = `<div class="item-info"><div class="item-name">${XUNZONG_FU.name}${xzOwned > 0 ? ` (已有${xzOwned})` : ''}</div><div class="item-desc">${XUNZONG_FU.desc}</div></div>`;
  const xzBtn = document.createElement('button');
  xzBtn.className = 'btn btn-sm';
  xzBtn.textContent = `${XUNZONG_FU.price}石`;
  xzBtn.disabled = p.inventory.lingshi < XUNZONG_FU.price;
  xzBtn.onclick = () => {
    p.inventory.lingshi -= XUNZONG_FU.price;
    p.inventory.xunzongfu = (p.inventory.xunzongfu || 0) + 1;
    game.log(`购买了<span class="npc-name">${XUNZONG_FU.name}</span>，花费 ${XUNZONG_FU.price} 灵石。`, 'loot');
    game.updateHeader(); game.save(); showMarket();
  };
  xzDiv.appendChild(xzBtn);
  body.appendChild(xzDiv);
}

function renderMarketSkill(body, p) {
  const shopSkills = SKILLS.filter(s => s.price > 0 && s.minRealm <= p.realmIndex);
  const ownedSkills = p.skills || [];
  let hasAny = false;
